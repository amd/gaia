# FIXTURE-SYNC: tests/fixtures/gaia/web/headlines.html (3 headlines) and
# tests/fixtures/gaia/rss/feed.xml (3 entries, newest v2.4.0 2026-08-18) —
# see GAIA_FIXTURE_VALUES.md.
id: task_dailybrief_digest
name: "Skill Task — daily-brief Composes One Digest From Fixture Sources"
category: gaia_skills_tasks
agent_type: gaia
severity: high
description: |
  The daily-brief skill composes a single digest from two fixture sources.
  Everything in the digest must trace to those sources.

persona: casual_user

setup:
  index_documents: []
  notes: "daily-brief installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the daily-brief skill"
    user_message: "Load the daily-brief skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask for a morning brief from these two sources: http://127.0.0.1:8765/headlines.html and the feed http://127.0.0.1:8765/rss/feed.xml"
    ground_truth:
      expected_answer: "One digest containing the 3 fixture headlines (riverfront park, chip fab 300 jobs, transit line M) and the latest release (v2.4.0 offline mode, Aug 18)"
    success_criteria: |
      agent_tools[] shows both sources actually fetched. The digest is ONE
      composed briefing (not two disconnected dumps) containing the three
      planted headlines and the newest feed entry. Any item not present in
      the fixtures is fabrication and a FAIL.

expected_outcome: |
  A single coherent digest, every item traceable to a fixture source.
