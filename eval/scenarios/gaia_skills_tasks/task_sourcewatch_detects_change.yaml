# FIXTURE-SYNC: tests/fixtures/gaia/web/observatory_v1.html (3 notices) and
# observatory_v2.html (same + 'Aurora watch alert issued for Friday night,
# Aug 28') — see GAIA_FIXTURE_VALUES.md.
id: task_sourcewatch_detects_change
name: "Skill Task — source-watch Detects the Planted Diff"
category: gaia_skills_tasks
agent_type: gaia
severity: high
tags: [local_blocked_no_embedder]
description: |
  Baseline the v1 page, then check the v2 page (same content plus one new
  notice). The skill must report exactly the new item — not re-report the
  old ones, not miss the addition.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  notes: "source-watch installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765. v1/v2 are two URLs standing in for the same page at two points in time."

turns:
  - turn: 1
    objective: "Load the source-watch skill"
    user_message: "Load the source-watch skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Start watching the observatory notices page (v1) for anything new"
    user_message: "watch this page for new notices: http://127.0.0.1:8765/observatory_v1.html"
    ground_truth:
      expected_behavior: "Fetches v1, records the 3 current notices as the baseline (memory writes in agent_tools[])"
    success_criteria: "Agent fetches the page and records the baseline (3 notices: mirror maintenance Aug 12, stargazing night Aug 22, parking repaving Aug 25). No notice may be reported as 'new' on the first check."

  - turn: 3
    objective: "Later check against the updated page (v2)"
    user_message: "the page updated — it's at http://127.0.0.1:8765/observatory_v2.html now. anything new for me?"
    ground_truth:
      expected_answer: "One new item: Aurora watch alert issued for Friday night, Aug 28"
    success_criteria: |
      CRITICAL: Agent fetches v2, diffs against its remembered baseline, and
      reports EXACTLY the aurora alert as new. Re-reporting the three old
      notices as new, missing the aurora item, or inventing changes is a
      FAIL.

expected_outcome: |
  The baseline is remembered and the second check surfaces only the one
  genuinely new notice.
