id: task_docbrief_report
name: "Skill Task — document-brief on the Q3 Report"
category: gaia_skills_tasks
agent_type: gaia
severity: high
tags: [local_blocked_no_embedder]
description: |
  The document-brief skill briefs the Acme Q3 report. The brief must
  include the planted facts and quote/ground itself in the source.

persona: small_business_owner

setup:
  index_documents:
    - corpus_doc: acme_q3_report
      path: "eval/corpus/documents/acme_q3_report.md"
  notes: "document-brief installed at ~/.gaia/skills/."

turns:
  - turn: 1
    objective: "Load the document-brief skill"
    user_message: "Load the document-brief skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask for a brief of the indexed Q3 report — what it says and what to worry about"
    ground_truth:
      expected_answer: "Must include: revenue $14.2M; 23% YoY growth (from $11.5M); Q4 outlook 15-18% growth via enterprise expansion"
    success_criteria: |
      Brief contains all three planted facts ($14.2M, 23%/$11.5M, 15-18%
      outlook), is grounded in retrieval (real query calls in agent_tools[]),
      and includes no financial claims absent from the document.

  - turn: 3
    objective: "Ask what the report does NOT cover that a reader might expect"
    ground_truth:
      expected_behavior: "Honest gaps — e.g. no headcount, no CFO/executive roster, no expense detail — without inventing content"
    success_criteria: "Agent names genuine absences (headcount and CFO are known-absent facts) rather than fabricating sections. Claiming the report covers something it doesn't is a FAIL."

expected_outcome: |
  A grounded brief carrying the planted facts, plus an honest account of
  what the document omits.
