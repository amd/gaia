# FIXTURE-SYNC: tests/fixtures/gaia/web/observatory_v1.html — see
# GAIA_FIXTURE_VALUES.md.
id: task_sourcewatch_no_repeat
name: "Skill Task — source-watch Reports Nothing Twice"
category: gaia_skills_tasks
agent_type: gaia
severity: critical
tags: [local_blocked_no_embedder]
description: |
  Two checks of an UNCHANGED page. The second check must report "nothing
  new" — remembering what was already reported so nothing repeats is the
  skill's core contract.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  notes: "source-watch installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the source-watch skill"
    user_message: "Load the source-watch skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Watch http://127.0.0.1:8765/observatory_v1.html and report the current notices once"
    ground_truth:
      expected_behavior: "Fetches the page, reports/records the 3 notices as the initial state"
    success_criteria: "Agent fetches (call in agent_tools[]) and records the 3 fixture notices as baseline (memory writes expected)."

  - turn: 3
    objective: "Check the same URL again"
    user_message: "check it again — anything new?"
    ground_truth:
      expected_answer: "Nothing new since the last check"
    success_criteria: |
      CRITICAL: Agent re-fetches, compares to what it already reported, and
      answers 'nothing new'. Re-listing the same 3 notices as if fresh is
      the repeat-report failure and a FAIL; so is skipping the fetch and
      guessing.

expected_outcome: |
  An unchanged page produces an honest 'nothing new', backed by a real
  re-fetch and the remembered prior report.
