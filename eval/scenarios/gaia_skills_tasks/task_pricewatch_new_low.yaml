# FIXTURE-SYNC: tests/fixtures/gaia/web/price_nimbusbook.html — NimbusBook 14
# at $899; see GAIA_FIXTURE_VALUES.md.
id: task_pricewatch_new_low
name: "Skill Task — price-watch Detects a New Low"
category: gaia_skills_tasks
agent_type: gaia
severity: high
tags: [local_blocked_no_embedder]
description: |
  The remembered previous low is $949; the fixture page now shows $899.
  The skill must extract the real current price, compare against the
  remembered low, and report a $50 drop as a new low.

persona: home_user

setup:
  index_documents: []
  memory_clear: true
  notes: "price-watch installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the price-watch skill"
    user_message: "Load the price-watch skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Set up the watch with the remembered baseline"
    user_message: "watch this laptop for me: http://127.0.0.1:8765/price_nimbusbook.html — the lowest i've seen it is $949"
    ground_truth:
      expected_behavior: "Baseline $949 recorded (memory write in agent_tools[]); watch acknowledged"
    success_criteria: "Agent records the $949 baseline with a real memory write and confirms the watch."

  - turn: 3
    objective: "Ask it to check the price now"
    user_message: "check it now"
    ground_truth:
      expected_answer: "Current price $899 — a new low, $50 below the previous $949"
    success_criteria: |
      Agent fetches the page (call in agent_tools[]), extracts $899, and
      reports it as a NEW LOW vs the remembered $949 with the $50 delta.
      Wrong price, wrong delta, or a comparison against an invented
      baseline is a FAIL. The new low should be recorded (memory update).

expected_outcome: |
  Real extraction ($899), correct comparison against the remembered $949,
  alert on the new low, baseline updated.
