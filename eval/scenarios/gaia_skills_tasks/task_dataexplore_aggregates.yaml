# FIXTURE-SYNC: ~/gaia-eval/csv/sales.csv — see GAIA_FIXTURE_VALUES.md.
id: task_dataexplore_aggregates
name: "Skill Task — data-explore Answers With Real Queries"
category: gaia_skills_tasks
agent_type: gaia
severity: high
description: |
  The data-explore skill loads the fixture CSV into scratchpad tables and
  answers aggregate questions with exact numbers from real SQL.

persona: data_analyst

setup:
  index_documents: []
  notes: "data-explore installed at ~/.gaia/skills/; staged fixture CSV at ~/gaia-eval/csv/sales.csv."

turns:
  - turn: 1
    objective: "Load the data-explore skill"
    user_message: "Load the data-explore skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask it to explore ~/gaia-eval/csv/sales.csv and report total revenue and the top product"
    ground_truth:
      expected_answer: "Total $18,600; top product Gadget Pro at $7,200"
    success_criteria: |
      agent_tools[] must show real data tooling (analyze_data_file or
      create_table/insert_data/query_data). Both numbers exact: $18,600
      total, Gadget Pro $7,200. Eyeballed or invented numbers are a FAIL.

  - turn: 3
    objective: "Ask a follow-up slice: revenue for the North region"
    ground_truth:
      expected_answer: "$6,150"
    success_criteria: "Agent answers $6,150 from a real query against the loaded table."

expected_outcome: |
  Every number comes from a real query and matches the fixture ground truth.
