# FIXTURE-SYNC: tests/fixtures/gaia/web/solarium_a.html + solarium_b.html —
# see GAIA_FIXTURE_VALUES.md.
id: task_research_solarium
name: "Skill Task — research-report Grounded in Fixture Pages"
category: gaia_skills_tasks
agent_type: gaia
severity: high
description: |
  The research-report skill writes a cited report on the Solarium Project
  from the two fixture pages. Every claim must trace to a fixture page;
  citations must point at the fixture URLs.

persona: student

setup:
  index_documents: []
  notes: "research-report installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765. The user supplies the two source URLs — no open-web search needed."

turns:
  - turn: 1
    objective: "Load the research-report skill"
    user_message: "Load the research-report skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask for a short cited report on the Solarium Project using exactly these sources: http://127.0.0.1:8765/solarium_a.html and http://127.0.0.1:8765/solarium_b.html"
    ground_truth:
      expected_answer: "Report contains: founded 2019, Nevada, 42 MWh current; 90 MWh by 2027, second site in Arizona — each fact cited to the fixture URLs"
    success_criteria: |
      agent_tools[] shows both pages fetched. The report includes the five
      planted facts (2019, Nevada, 42 MWh, 90 MWh/2027, Arizona) with
      citations to the two given URLs. CRITICAL FAIL if it adds outside
      'facts' about Solarium not present in the fixtures — the project is
      fictional, so any extra detail is fabrication.

expected_outcome: |
  A cited report whose every claim traces to the two fixture pages, with no
  imported outside knowledge about the fictional project.
