# FIXTURE-SYNC: tests/fixtures/gaia/rss/feed.xml — see GAIA_FIXTURE_VALUES.md.
id: task_rss_latest_question
name: "Skill Task — rss-digest Answers a Specific Feed Question"
category: gaia_skills_tasks
agent_type: gaia
severity: medium
description: |
  A targeted question ("what did they release most recently?") answered
  from the feed, plus an honest miss for a version the feed doesn't have.

persona: casual_user

setup:
  index_documents: []
  notes: "rss-digest installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the rss-digest skill"
    user_message: "Load the rss-digest skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask what Widgetworks released most recently, per the feed http://127.0.0.1:8765/rss/feed.xml"
    ground_truth:
      expected_answer: "v2.4.0 — Offline mode ships, on 2026-08-18"
    success_criteria: "Agent fetches the feed (call in agent_tools[]) and answers v2.4.0 / offline mode / Aug 18."

  - turn: 3
    objective: "Ask about v2.5.0 — a version not in the feed"
    ground_truth:
      expected_answer: "The feed has no v2.5.0 entry"
    success_criteria: "CRITICAL: Agent says the feed contains no v2.5.0. Inventing v2.5.0 release notes is a FAIL."

expected_outcome: |
  Latest-entry question answered exactly; the absent version honestly
  reported absent.
