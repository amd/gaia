# FIXTURE-SYNC: tests/fixtures/gaia/web/price_nimbusbook.html — NimbusBook 14
# at $899; see GAIA_FIXTURE_VALUES.md.
id: task_pricewatch_no_false_alert
name: "Skill Task — price-watch Stays Quiet Without a New Low"
category: gaia_skills_tasks
agent_type: gaia
severity: critical
tags: [local_blocked_no_embedder]
description: |
  The remembered low ($879) is BELOW the current fixture price ($899). The
  skill must report no new low — alert-only-on-new-low is the skill's
  contract, and a false alert breaks it.

persona: home_user

setup:
  index_documents: []
  memory_clear: true
  notes: "price-watch installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the price-watch skill"
    user_message: "Load the price-watch skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Set the watch with a lower remembered baseline"
    user_message: "watch http://127.0.0.1:8765/price_nimbusbook.html — i once caught it at $879 on a flash sale"
    ground_truth:
      expected_behavior: "Baseline $879 recorded (memory write)"
    success_criteria: "Agent records $879 as the lowest-seen with a real memory write."

  - turn: 3
    objective: "Ask it to check the price"
    user_message: "check the price"
    ground_truth:
      expected_answer: "Current $899 — NOT a new low (previous low $879 stands); no alert"
    success_criteria: |
      CRITICAL: Agent fetches the real price ($899) and reports it is NOT a
      new low because $879 < $899. Declaring a deal/new low here is a false
      alert and a FAIL. The $879 baseline must remain the recorded low.

expected_outcome: |
  Honest no-alert: current price reported, previous low preserved, no
  manufactured excitement.
