# FIXTURE-SYNC: tests/fixtures/gaia/rss/feed.xml — 3 entries: v2.4.0 (08-18),
# v2.3.1 (08-10), v2.3.0 (08-01); see GAIA_FIXTURE_VALUES.md.
id: task_rss_digest
name: "Skill Task — rss-digest Lists the Planted Entries"
category: gaia_skills_tasks
agent_type: gaia
severity: high
description: |
  Digest of the fixture feed: exactly the three planted entries, newest
  first, no invented ones.

persona: power_user

setup:
  index_documents: []
  notes: "rss-digest installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765."

turns:
  - turn: 1
    objective: "Load the rss-digest skill"
    user_message: "Load the rss-digest skill."
    ground_truth:
      expected_behavior: "Skill loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[])."

  - turn: 2
    objective: "Ask for a digest of http://127.0.0.1:8765/rss/feed.xml"
    ground_truth:
      expected_answer: "Widgetworks Release Notes: v2.4.0 — Offline mode ships (Aug 18); v2.3.1 — Hotfix for sync loop (Aug 10); v2.3.0 — New importer for legacy projects (Aug 01)"
    success_criteria: |
      agent_tools[] shows the feed actually fetched. The digest lists
      EXACTLY the three fixture entries, newest first. A fourth invented
      entry, a missing entry, or scrambled recency ordering is a FAIL.

  - turn: 3
    objective: "Ask what changed in the newest release"
    ground_truth:
      expected_answer: "v2.4.0 shipped offline mode"
    success_criteria: "Agent answers offline mode (from the v2.4.0 entry) without inventing further release details the feed doesn't carry."

expected_outcome: |
  Exactly the planted entries in recency order; the follow-up stays inside
  the feed's actual content.
