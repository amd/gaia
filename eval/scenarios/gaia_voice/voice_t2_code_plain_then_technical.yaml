id: voice_t2_code_plain_then_technical
name: "Voice — Code Question: Plain Answer, Then Paths and Names on Request"
category: gaia_voice
severity: high
tags: [t2_compound]
description: |
  A casual question about the fixture mini-repo. The first answer says what
  exists in plain words; file paths and function names come only once the
  user asks for the technical details.
  Counting rule: a sentence ends in . ! or ?; each bullet or numbered line
  counts as one sentence; one closing offer of more detail does not count.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true

# FIXTURE-SYNC: mini_repo (GAIA_FIXTURE_VALUES.md "Mini repo") — tempkeeper/convert.py
# defines celsius_to_fahrenheit(c) and fahrenheit_to_celsius(f).
turns:
  - turn: 1
    objective: "SETUP FIRST (simulator action, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all) — the runner convention, so no style preference stored by an earlier scenario shapes this one; requires GAIA_MEMORY_ADMIN=1 on the backend. Then send this turn: Ask casually whether the project can convert Fahrenheit to Celsius"
    user_message: "quick question about the little project in ~/gaia-eval/mini_repo — can it turn fahrenheit into celsius?"
    ground_truth:
      expected_answer: "Yes — it converts both ways, Fahrenheit to Celsius and back"
    success_criteria: |
      Says yes (ideally: it converts both ways). Reading the code with a tool
      is expected. FAIL if it says no or doesn't know. FAIL if the reply
      exceeds 3 sentences or 60 words, or contains a file path, a function or
      module name (e.g. fahrenheit_to_celsius, convert.py, tempkeeper.convert),
      a code block, or an internal tool name (read_file, search_code,
      search_file, run_shell_command), or contains "Verification:",
      "Worth noting", "In summary" or a status label such as "Status:".

  - turn: 2
    objective: "Ask for the technical details"
    user_message: "cool, show me the technical details — where is it and what's it called?"
    ground_truth:
      expected_answer: "tempkeeper/convert.py — fahrenheit_to_celsius(f) returns (f - 32) * 5 / 9; celsius_to_fahrenheit(c) goes the other way"
    success_criteria: |
      Must give the path tempkeeper/convert.py AND the function name
      fahrenheit_to_celsius. The formula (f - 32) * 5/9 or the reverse
      function celsius_to_fahrenheit is a plus. FAIL if either the path or
      the function name is missing or wrong (e.g. an invented f_to_c, or a
      file that doesn't exist).

expected_outcome: |
  A plain answer to the casual question; paths and symbol names only once
  the user asks for them.
