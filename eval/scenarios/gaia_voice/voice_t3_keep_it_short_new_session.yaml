id: voice_t3_keep_it_short_new_session
name: "Voice — \"Keep It Short\" Holds on Later Turns and in a New Session"
category: gaia_voice
severity: critical
tags: [t3_stress, local_blocked_no_embedder]
description: |
  The user states a length preference once. It must be stored in persistent
  memory, applied to later questions that tempt a long answer, and applied
  again in a NEW session with no shared history — without the user
  repeating it.
  Counting rule: a sentence ends in . ! or ?; each bullet or numbered line
  counts as one sentence; a closing offer of more detail COUNTS here, since
  the user capped the whole reply.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator action, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all) — the runner convention and the only cross-scenario isolation; requires GAIA_MEMORY_ADMIN=1 on the backend. Then send this turn: State a standing preference for short answers"
    user_message: "heads up: I like really short answers. two sentences max from now on, including in future chats. please remember that."
    ground_truth:
      expected_answer: "Acknowledged and stored as a preference"
    success_criteria: |
      Agent acknowledges briefly (≤2 sentences) and agent_tools[] includes a
      remember call storing the short-answer preference. FAIL if there is no
      memory tool call, or if the acknowledgement itself exceeds 2
      sentences.

  - turn: 2
    objective: "Ask a question that normally gets a long answer"
    user_message: "what's the difference between a virus and bacteria?"
    ground_truth:
      expected_behavior: "Two sentences at most: bacteria are living single cells that can reproduce on their own; viruses are much smaller and need a host cell to copy themselves"
    success_criteria: |
      Correct core distinction (bacteria are living cells that reproduce on
      their own; viruses need a host cell). FAIL if the reply exceeds 2
      sentences, uses bullets or headers, or is factually wrong.

  - turn: 3
    objective: "Another question that tempts a long answer"
    user_message: "how do vaccines work?"
    ground_truth:
      expected_behavior: "Two sentences at most: a vaccine shows the immune system a harmless version or piece of a germ so it learns to recognise and fight the real one"
    success_criteria: |
      Correct gist (trains the immune system with a harmless version or piece
      of the germ). FAIL if the reply exceeds 2 sentences or uses bullets or
      headers.

  - turn: 4
    objective: "SIMULATOR ACTION BEFORE THIS TURN: create a NEW session with create_session (pass the same agent_type as the Phase 1 session if one was set) and send this turn and turn 5 to the NEW session id. Keep reporting the Phase 1 session_id as the scenario's session_id. Then ask how a fridge keeps food cold — do NOT restate the preference"
    user_message: "how does a fridge keep food cold?"
    ground_truth:
      expected_behavior: "Two sentences at most: a refrigerant absorbs heat inside and a pump pushes it out the back"
    success_criteria: |
      This session has no history, so the preference must come from
      persistent memory. Correct gist (a fluid carries heat from inside to
      the coils outside). FAIL if the reply exceeds 2 sentences or uses
      bullets or headers.

  - turn: 5
    objective: "Ask what the agent knows about how the user likes answers. AFTER scoring this turn (simulator action): call memory_clear(scope=all) so this scenario's stored preference cannot shape a later scenario."
    user_message: "what do you know about how I like my answers?"
    ground_truth:
      expected_answer: "Short answers, two sentences max"
    success_criteria: |
      States the short-answer / two-sentence preference. FAIL if it says it
      knows nothing about the user's preferences, or names a different
      preference.

expected_outcome: |
  A stated length preference is stored once and honoured on every later
  turn, including in a fresh session.
