# FIXTURE-SYNC: tests/fixtures/gaia/tiers_files_shell/projects/ — exactly
# atlas_notes.md, team_roster.txt and the folder archive/ (holding
# old_plan.txt). See GAIA_FIXTURE_VALUES.md, "Files and shell".
id: files_browse_tree_basic
name: "Files — List a Folder and Show Its Tree"
category: gaia_files
severity: high
tags: [t1_basic]
description: |
  The directory-navigation tools on a small known folder: a flat listing,
  then a tree that reaches one level down. Both must match what is on disk.

persona: home_user

setup:
  index_documents: []
  notes: "projects/ staged at ~/gaia-eval/tiers_files_shell/projects/."

turns:
  - turn: 1
    objective: "Ask what is in the projects folder"
    user_message: "What's in ~/gaia-eval/tiers_files_shell/projects? Just the names."
    ground_truth:
      expected_answer: "atlas_notes.md, team_roster.txt, and a folder named archive"
    success_criteria: |
      agent_tools[] shows a real listing call (browse_directory, tree,
      list_files, or run_shell_command). The reply names exactly
      atlas_notes.md, team_roster.txt and the archive folder — no more, no
      fewer. An invented file name is a FAIL.

  - turn: 2
    objective: "Ask for a tree view that includes what is inside the subfolder"
    user_message: "show it as a tree so I can see what's inside archive too"
    ground_truth:
      expected_answer: "projects/ -> atlas_notes.md, team_roster.txt, archive/ -> old_plan.txt"
    success_criteria: "Agent shows a tree (tree tool preferred; any real listing call passes) that includes old_plan.txt under archive. Listing a file that does not exist, or omitting old_plan.txt, is a FAIL."

expected_outcome: |
  A flat listing and a one-level-deeper tree, both matching the fixture.
