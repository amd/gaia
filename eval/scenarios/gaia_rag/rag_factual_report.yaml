id: rag_factual_report
name: "RAG — Factual Extraction From a Financial Report"
category: gaia_rag
agent_type: gaia
severity: critical
tags: [local_blocked_no_embedder]
description: |
  Direct fact lookup from the Acme Q3 report through the flagship agent.
  Answers must be grounded in retrieval, not general knowledge.

persona: power_user

setup:
  index_documents:
    - corpus_doc: acme_q3_report
      path: "eval/corpus/documents/acme_q3_report.md"

turns:
  - turn: 1
    objective: "Ask about Q3 revenue"
    ground_truth:
      doc_id: acme_q3_report
      fact_id: q3_revenue
      expected_answer: "$14.2 million"
    success_criteria: "Agent states Q3 revenue was $14.2 million. agent_tools[] must show a real retrieval call (query_documents or similar) — FAIL if the number appears with no retrieval."

  - turn: 2
    objective: "Ask about year-over-year growth"
    ground_truth:
      doc_id: acme_q3_report
      fact_id: yoy_growth
      expected_answer: "23% increase from Q3 2024's $11.5 million"
    success_criteria: "Agent mentions 23% growth and/or the $11.5M baseline."

  - turn: 3
    objective: "Ask about the CEO's Q4 outlook"
    ground_truth:
      doc_id: acme_q3_report
      fact_id: ceo_outlook
      expected_answer: "Projected 15-18% growth driven by enterprise segment expansion"
    success_criteria: "Agent mentions 15-18% projected growth."

expected_outcome: |
  All three facts retrieved and reported correctly from the indexed report.
