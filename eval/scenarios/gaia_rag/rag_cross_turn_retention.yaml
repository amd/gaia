id: rag_cross_turn_retention
name: "RAG — Indexed Document Retained Across Turns"
category: gaia_rag
agent_type: gaia
severity: high
tags: [local_blocked_no_embedder]
description: |
  A document is queried in turn 1, the conversation moves elsewhere, then a
  later question returns to the document WITHOUT naming it. The agent must
  still query the indexed document rather than claiming there is nothing to
  search.

persona: casual_user

setup:
  index_documents:
    - corpus_doc: meeting_notes
      path: "eval/corpus/documents/meeting_notes_q3.txt"

turns:
  - turn: 1
    objective: "Ask when the next meeting is"
    ground_truth:
      doc_id: meeting_notes
      fact_id: next_meeting
      expected_answer: "October 15, 2025 at 2:00 PM"
    success_criteria: "Agent retrieves October 15, 2025 at 2:00 PM from the notes."

  - turn: 2
    objective: "Unrelated interlude"
    user_message: "unrelated — what's a good rule of thumb for how long meetings should be?"
    ground_truth:
      expected_behavior: "General answer, no document needed"
    success_criteria: "Agent answers generally without dragging the notes in."

  - turn: 3
    objective: "Return to the document without naming it"
    user_message: "so how many days away is that meeting from today?"
    ground_truth:
      expected_behavior: "Resolves 'that meeting' to Oct 15, 2025 from turn 1 and computes/attempts a day count"
    success_criteria: |
      Agent understands 'that meeting' means the Oct 15, 2025 one from the
      notes and gives a day count (or asks for/states today's date and then
      computes). CRITICAL FAIL if it asks which meeting or claims no meeting
      has been discussed.

expected_outcome: |
  The indexed document and its retrieved fact remain available for indirect
  follow-ups later in the session.
