# FIXTURE-SYNC: tests/fixtures/gaia/csv/sales.csv — see GAIA_FIXTURE_VALUES.md.
id: data_top_product
name: "Data — Top Product by Revenue"
category: gaia_data
agent_type: gaia
severity: high
description: |
  Group-by aggregate: which product earned the most, and how much.

persona: data_analyst

setup:
  index_documents: []
  notes: "Fixture CSV at tests/fixtures/gaia/csv/sales.csv (repo-relative)."

turns:
  - turn: 1
    objective: "Ask which product in tests/fixtures/gaia/csv/sales.csv has the highest total revenue and how much"
    ground_truth:
      expected_answer: "Gadget Pro with $7,200"
    success_criteria: "Agent answers Gadget Pro, $7,200, via real data tooling in agent_tools[] (analyze_data_file or scratchpad SQL). Either wrong name or wrong number is a FAIL."

  - turn: 2
    objective: "Ask how many distinct products the file contains"
    ground_truth:
      expected_answer: "3"
    success_criteria: "Agent answers 3 (Gadget Pro, Gadget Lite, Gadget Max), from a real query."

expected_outcome: |
  Correct group-by result: Gadget Pro at $7,200, out of 3 distinct products.
