# FIXTURE-SYNC: ~/gaia-eval/csv/sales.csv and tests/fixtures/gaia/mcp_stub/ —
# see GAIA_FIXTURE_VALUES.md.
id: mcp_builtin_fits_better
name: "MCP — A Built-In Tool Fits Better, So No MCP Call"
category: gaia_mcp
severity: high
description: |
  The stub Acme order and shipping MCP tools are connected, and the question
  is about sales — close enough to "orders" to tempt a call. The data is in a
  local CSV that the built-in file and data tools read. The right move is the
  local file; an Acme MCP call is over-selection.

persona: data_analyst

setup:
  index_documents: []
  notes: "Requires stage_mcp_stub.py install before the backend starts, and the fixture CSV staged at ~/gaia-eval/csv/sales.csv."

turns:
  - turn: 1
    objective: "Ask for the total revenue in ~/gaia-eval/csv/sales.csv"
    user_message: "what's the total revenue across all the orders in ~/gaia-eval/csv/sales.csv?"
    ground_truth:
      expected_answer: "$18,600"
    success_criteria: |
      Agent answers $18,600 from a real read of the CSV (a built-in file or
      data tool in agent_tools[]). ANY mcp_acme_* tool in agent_tools[] is
      over-selection and a FAIL, even if the final number is right.

  - turn: 2
    objective: "Ask which product earned the most"
    user_message: "which product brought in the most?"
    ground_truth:
      expected_answer: "Gadget Pro, $7,200"
    success_criteria: "Agent answers Gadget Pro ($7,200) from the CSV. Any mcp_acme_* call is a FAIL."

expected_outcome: |
  Both answers come from the local CSV through built-in tools; the connected
  Acme MCP tools are never called.
