# FIXTURE-SYNC: tests/fixtures/gaia/mini_repo/ (tempkeeper) — see
# GAIA_FIXTURE_VALUES.md.
id: code_index_and_find
name: "Code — Index the Mini Repo, Find the Right Function"
category: gaia_code
agent_type: gaia
severity: high
tags: [local_blocked_no_embedder]
description: |
  Index the fixture repo, then answer "where does X happen" with the real
  symbol and file.

persona: power_user

setup:
  index_documents: []
  notes: "Fixture repo at tests/fixtures/gaia/mini_repo/."

turns:
  - turn: 1
    objective: "Ask the agent to index the codebase at tests/fixtures/gaia/mini_repo"
    ground_truth:
      expected_behavior: "Real indexing run"
    success_criteria: "agent_tools[] must include index_codebase (or an equivalent real indexing call) and the agent reports the index built. Claiming an index with no call is a FAIL."

  - turn: 2
    objective: "Ask which function converts temperatures from Celsius to Fahrenheit"
    ground_truth:
      expected_answer: "celsius_to_fahrenheit in tempkeeper/convert.py"
    success_criteria: "CRITICAL: Agent names celsius_to_fahrenheit and tempkeeper/convert.py, found via a real search (search_code_index or file search in agent_tools[]). Invented symbol or path is an automatic FAIL."

  - turn: 3
    objective: "Follow-up: does the repo also convert the other direction?"
    ground_truth:
      expected_answer: "Yes — fahrenheit_to_celsius in the same file"
    success_criteria: "Agent confirms fahrenheit_to_celsius exists in tempkeeper/convert.py (grounded in the index/read, not assumption)."

expected_outcome: |
  Real indexing, then symbol-accurate answers matching the fixture repo.
