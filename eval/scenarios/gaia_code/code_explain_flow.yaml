# FIXTURE-SYNC: ~/gaia-eval/mini_repo/ (tempkeeper) — see
# GAIA_FIXTURE_VALUES.md.
id: code_explain_flow
name: "Code — Explain a Cross-File Flow With Real Symbols"
category: gaia_code
agent_type: gaia
severity: medium
tags: [local_blocked_no_embedder]
description: |
  An end-to-end "how does data flow" explanation spanning three files. The
  narrative must be assembled from real reads and cite only real symbols.

persona: student

setup:
  index_documents: []
  notes: "Staged fixture repo at ~/gaia-eval/mini_repo/ (staged by eval setup)."

turns:
  - turn: 1
    objective: "Ask how a temperature reading travels from a CSV file to a median statistic in ~/gaia-eval/mini_repo — step by step with the function names"
    ground_truth:
      expected_answer: "load_readings (tempkeeper/io.py) parses the CSV → readings added via ReadingStore.add (tempkeeper/store.py) → ReadingStore.median computes the statistic; conversion helpers live in tempkeeper/convert.py"
    success_criteria: |
      Agent explores the repo for real (search/read calls in agent_tools[])
      and narrates the chain using only real symbols: load_readings,
      ReadingStore.add, ReadingStore.median. Each named symbol must exist;
      one invented step poisons the answer — FAIL.

  - turn: 2
    objective: "Ask whether unit conversion is part of that flow"
    ground_truth:
      expected_behavior: "An answer grounded in the actual code: conversion helpers exist in convert.py; whether the flow calls them must match the real code, not assumption"
    success_criteria: "Agent answers from what the code actually does (reading the call sites), naming celsius_to_fahrenheit/fahrenheit_to_celsius only in their real role. Asserting an integration it didn't verify is a FAIL."

expected_outcome: |
  A cross-file explanation whose every named symbol and claimed call is
  real and was actually read.
