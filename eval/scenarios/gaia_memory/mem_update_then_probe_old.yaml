id: mem_update_then_probe_old
name: "Memory — Superseded Value Must Not Resurface"
category: gaia_memory
agent_type: gaia
severity: high
tags: [t2_compound, local_blocked_no_embedder]
description: |
  After an update, the user probes in ways that might surface the OLD value
  — including asking about it directly. The agent may acknowledge the value
  changed, but current-state questions must always return the new value.

persona: power_user

setup:
  index_documents: []
  memory_clear: true

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator action, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all) — the runner convention and the only cross-scenario isolation; requires GAIA_MEMORY_ADMIN=1 on the backend. Then send this turn: Store a default editor preference"
    user_message: "Remember: my default editor is Vim."
    ground_truth:
      expected_answer: "Stored: Vim"
    success_criteria: "Agent stores it (agent_tools[] shows a remember call)."

  - turn: 2
    objective: "Update the preference"
    user_message: "I've switched — my default editor is VS Code now. Update your memory."
    ground_truth:
      expected_answer: "Updated: VS Code"
    success_criteria: "Agent updates (agent_tools[] shows update_memory or equivalent) and confirms VS Code."

  - turn: 3
    objective: "Probe current state indirectly"
    user_message: "If you were writing setup instructions for my machine, which editor would you configure as default?"
    ground_truth:
      expected_answer: "VS Code"
    success_criteria: "Agent uses VS Code. FAIL if it configures Vim."

  - turn: 4
    objective: "Probe the old value directly"
    user_message: "Didn't I use Vim at some point?"
    ground_truth:
      expected_behavior: "Yes, previously — but VS Code is current"
    success_criteria: "Agent may confirm Vim was the earlier preference, but must make clear VS Code is the current one. FAIL if it now reports Vim as the standing default."

  - turn: 5
    objective: "Final current-state check"
    user_message: "One word: what's my default editor?"
    ground_truth:
      expected_answer: "VS Code"
    success_criteria: "Agent answers VS Code."

expected_outcome: |
  The superseded value is acknowledged as history when asked, but every
  current-state answer returns the updated value.
