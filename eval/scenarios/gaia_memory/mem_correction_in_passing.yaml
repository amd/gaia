id: mem_correction_in_passing
name: "Memory — Casual Correction of a Stored Fact"
category: gaia_memory
severity: high
tags: [t2_compound, local_blocked_no_embedder]
description: |
  A stored fact from an earlier session is used, then the user corrects it
  casually mid-conversation ("oh, we moved"). The agent must update memory
  — not just the conversation — so the old value stops resurfacing, while
  an unrelated stored fact is untouched.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  # FIXTURE-SYNC: planted values recorded in GAIA_FIXTURE_VALUES.md (Conversation, memory and honesty)
  memory_seed:
    - content: "The user lives in Lisbon, Portugal"
      category: fact
    - content: "The user's standing Monday team meeting is at 09:30"
      category: fact

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator action, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), THEN call memory_seed(items=<setup.memory_seed>) — the seed must come after the clear, so re-seed if you already seeded during Phase 1; requires GAIA_MEMORY_ADMIN=1 on the backend. Then send this turn: Ask the time difference to New York without saying where the user lives"
    user_message: "what's the time difference between me and New York?"
    ground_truth:
      expected_answer: "Lisbon is 5 hours ahead of New York"
    success_criteria: "Agent uses the stored location (Lisbon) and answers 5 hours ahead. FAIL if it asks where the user is, or uses a different city."

  - turn: 2
    objective: "Casually correct the location"
    user_message: "oh I should mention, we moved to Porto last month. same timezone so that answer's still fine"
    ground_truth:
      expected_behavior: "Acknowledges and updates the stored location to Porto"
    success_criteria: |
      agent_tools[] must include update_memory on the Lisbon entry (or
      remember of the Porto fact plus forget of the Lisbon entry). FAIL if
      it only acknowledges in prose.
      VERIFY VIA MCP: memory_recall(query="where does the user live")
      returns an active item mentioning Porto, and no active item still
      saying the user lives in Lisbon.

  - turn: 3
    objective: "Ask where the user lives"
    user_message: "remind me, where do I live?"
    ground_truth:
      expected_answer: "Porto"
    success_criteria: "Agent answers Porto. FAIL if it says Lisbon or presents both as current."

  - turn: 4
    objective: "Ask about the untouched fact"
    user_message: "and what time is my monday meeting?"
    ground_truth:
      expected_answer: "09:30"
    success_criteria: "Agent answers 09:30. FAIL if the correction damaged or dropped the meeting fact."

expected_outcome: |
  A casual correction updates persistent memory (Porto replaces Lisbon)
  and leaves unrelated memories intact.
