# FIXTURE-SYNC: tests/fixtures/gaia/email/eval_inbox.mbox (build_mailbox.py) —
# Inkwell Print Co. <billing@inkwellprint.example>: "Invoice INV-7730 - event
# banners" (2026-09-17): $912.75 due October 10, 2026; pay by bank transfer
# (details on the PDF) or check to 88 Foundry Lane. Decoy from the same sender:
# "Quote Q-7702 - trade show backdrop" (2026-09-03): $1,340.00, a quote, not a
# bill. The user never says "Inkwell".
id: email_t2_recollection_invoice
name: "Email — Find by Recollection, Then Follow Up"
category: gaia_email
severity: high
tags: [t2_compound]
description: |
  #3814's Find gate: the user half-remembers a bill ("some print shop",
  "around nine hundred") without the sender's name. The agent has to search,
  pick the invoice over a same-sender quote, and carry the thread through
  follow-ups (#4156 — non-empty-but-wrong results must not be settled for).

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: attached
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: vaguely describe the print-shop bill"
    user_message: "I got a bill from some print shop a couple of weeks ago, around nine hundred bucks. Can you find it?"
    ground_truth:
      expected_answer: "Inkwell Print Co. invoice INV-7730, $912.75"
    success_criteria: |
      Identifies the Inkwell Print Co. invoice INV-7730 for $912.75.
      Presenting the $1,340 quote Q-7702 as the bill is a FAIL. agent_tools
      must show search_email or list_inbox.

  - turn: 2
    objective: "Follow-up on the found message"
    user_message: "When's it due and how do I pay it?"
    ground_truth:
      expected_answer: "Due October 10, 2026; pay by bank transfer using the details on the attached PDF, or by check to Inkwell Print Co., 88 Foundry Lane"
    success_criteria: "States October 10 AND at least one payment method from the email (bank transfer per the PDF, or check to 88 Foundry Lane). Inventing a payment link or portal is a FAIL."

  - turn: 3
    objective: "Anything else from the same sender"
    user_message: "Did they send me anything else?"
    ground_truth:
      expected_answer: "Yes — quote Q-7702 for a trade show backdrop, $1,340.00 (Sep 3), a quote rather than a bill"
    success_criteria: "Names the Q-7702 quote ($1,340) and makes clear it is a quote, not something owed. Saying there is nothing else is a FAIL."

expected_outcome: |
  A recollection query resolves to the right invoice despite a same-sender
  decoy, and the follow-ups stay on that sender.
