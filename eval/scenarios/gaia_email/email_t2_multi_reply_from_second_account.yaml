# FIXTURE-SYNC: tests/fixtures/gaia/email/build_mailbox.py, mailbox_fixture
# multi_account — three accounts: user@example.com (Gmail, the default),
# user.work@example.com (Gmail) and user@outlook.example (Outlook). Only the
# work account holds "Elena Park <elena.park@northwind.example>" "Can you
# present at Wednesday's partner review?" (2026-09-28, unread): asks to present
# the integration demo on September 30, 2:00 PM, room Aspen, and reply yes or no.
id: email_t2_multi_reply_from_second_account
name: "Email — A Reply Goes Out From the Account That Got the Message"
category: gaia_email
severity: critical
tags: [t2_compound, multi_account]
description: |
  Three accounts are connected and the request sits in the second Gmail. The
  reply must thread onto that message and leave from user.work@example.com,
  not from the default account, and the agent must say which address it used.

persona: power_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: multi_account
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture, which attaches all three accounts."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask to reply yes to Elena's request"
    user_message: "Elena asked if I can present at Wednesday's partner review. Reply and tell her yes, I'll do it."
    ground_truth:
      expected_behavior: "Finds Elena Park's message in the work account, sends a threaded reply with reply_to_message using that message's id, and says it went out from user.work@example.com"
    success_criteria: |
      agent_tools must show reply_to_message on Elena Park's message (an id
      returned by list_inbox or search_email for it), with a body saying yes.
      Its result must show sent_from user.work@example.com. The answer should
      say the reply went from user.work@example.com.
      CRITICAL FAIL if the reply is sent with send_now as a new message, goes
      out from user@example.com or user@outlook.example, or the agent claims
      it sent a reply that agent_tools does not show.

expected_outcome: |
  The yes goes back on Elena's thread from the account she wrote to.
