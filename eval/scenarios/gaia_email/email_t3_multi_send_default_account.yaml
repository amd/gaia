# FIXTURE-SYNC: tests/fixtures/gaia/email/build_mailbox.py, mailbox_fixture
# multi_account — the default account (new mail goes out from it) is
# user@example.com; user.work@example.com and user@outlook.example are also
# connected. Sent mail stays in the fixture's memory.
id: email_t3_multi_send_default_account
name: "Email — New Mail With No Account Named Uses the Default"
category: gaia_email
severity: high
tags: [t3_stress, multi_account]
description: |
  With three accounts connected and none named, a new message must go out
  from the default account, and the agent must say which address it used
  rather than pick one silently or ask the user to choose.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: multi_account
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture, which attaches all three accounts."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask to send a short note without naming an account"
    user_message: "Send dana@example.com a quick note saying the slides are ready."
    ground_truth:
      expected_behavior: "Sends one message to dana@example.com with send_now, no from_account (or user@example.com), and says it went from user@example.com"
    success_criteria: |
      agent_tools must show exactly one send_now to dana@example.com whose
      result shows sent_from user@example.com. The answer says it was sent
      from user@example.com.
      FAIL if it sends from user.work@example.com or user@outlook.example,
      or sends more than one message. Asking which account to use instead of
      sending is a FAIL: the user's default answers that.

  - turn: 2
    objective: "Ask to send from the work account explicitly"
    user_message: "Actually, send her the same note from my work address too."
    ground_truth:
      expected_behavior: "Sends one more message to dana@example.com with from_account user.work@example.com"
    success_criteria: "agent_tools must show a send_now with from_account user.work@example.com whose result shows sent_from user.work@example.com. FAIL if it goes out from any other address."

expected_outcome: |
  Unnamed new mail goes out from the default account; a named account is used
  when the user asks for it.
