# FIXTURE-SYNC: tests/fixtures/gaia/email/eval_inbox.mbox (build_mailbox.py) —
# Marcus Chen sent exactly 3: "Kestrel Logistics contract - first draft"
# (2026-09-14, $48,000, renewal November 30), "Kestrel Logistics contract -
# updated terms, needs your counter-signature" (2026-09-21, $52,500,
# counter-signature by Thursday, October 1), "Lunch Thursday?" (2026-09-24,
# Nori House 12:30). Increase 48,000 -> 52,500 = $4,500.
id: email_t2_sender_filter_followups
name: "Email — Filter by Sender, Then Multi-Turn Follow-ups"
category: gaia_email
severity: high
tags: [t2_compound]
description: |
  Find every message from one sender, then answer follow-ups that need the
  right message out of that set — the newer contract supersedes the draft —
  and a small computation across both.

persona: power_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: attached
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask for everything Marcus Chen sent"
    user_message: "Show me everything Marcus Chen has emailed me."
    ground_truth:
      expected_answer: "3 emails: Kestrel contract first draft (Sep 14), Kestrel contract updated terms needing counter-signature (Sep 21), Lunch Thursday? (Sep 24)"
    success_criteria: |
      Lists exactly the three Marcus Chen messages (subjects recognisable,
      dates optional). Missing one, or including a message from another
      sender (e.g. the Kestrel portal email), is a FAIL. agent_tools must
      show search_email or list_inbox.

  - turn: 2
    objective: "Follow-up that needs the NEWER contract email"
    user_message: "What's the current contract value, and what does he need from me by when?"
    ground_truth:
      expected_answer: "$52,500 per year; he needs your counter-signature by Thursday, October 1"
    success_criteria: "States $52,500 AND counter-signature by Thursday, October 1. Answering $48,000 as the current value is a FAIL (that is the superseded draft)."

  - turn: 3
    objective: "Cross-message computation"
    user_message: "How much did it go up from the first draft?"
    ground_truth:
      expected_answer: "$4,500 (from $48,000 to $52,500), due to an added fuel surcharge"
    success_criteria: "States $4,500 (48,000 -> 52,500). The fuel-surcharge reason is a bonus. Any other difference is a FAIL."

expected_outcome: |
  A sender-filtered find returns the exact set, and follow-ups pick the right
  message from it and combine two of them correctly.
