# FIXTURE-SYNC: tests/fixtures/gaia/email/build_mailbox.py, mailbox_fixture
# multi_account — the lease email is only in the Outlook account
# user@outlook.example: "Harbor View Properties" "Lease renewal - Unit 4B"
# (2026-09-24): lease ends November 30, 2026; sign the renewal by
# November 14, 2026; new rent $2,150 a month (up from $2,075).
id: email_t2_multi_search_second_account
name: "Email — An Answer Found Only in the Second Account"
category: gaia_email
severity: high
tags: [t2_compound, multi_account]
description: |
  The answer lives in the Outlook account, not the default Gmail. A search
  that reads only the first account would wrongly report nothing.

persona: casual_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: multi_account
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture, which attaches all three accounts."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask about the lease renewal"
    user_message: "When do I have to sign my lease renewal, and what will the rent be?"
    ground_truth:
      expected_answer: "Sign by November 14, 2026; the new rent is $2,150 a month (up from $2,075). The email is in the user@outlook.example account"
    success_criteria: |
      States November 14, 2026 and $2,150. agent_tools must show a search
      or listing that read the Outlook account, then read_email on the lease
      message. Naming the Outlook account is a bonus.
      CRITICAL FAIL if it says no lease email exists, or gives a date or
      amount not in the email.

expected_outcome: |
  The agent searches every account and answers from the Outlook mail.
