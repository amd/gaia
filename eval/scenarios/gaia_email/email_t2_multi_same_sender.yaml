# FIXTURE-SYNC: tests/fixtures/gaia/email/build_mailbox.py, mailbox_fixture
# multi_account — Marcus Chen <marcus.chen@company.example> wrote to every
# account. user@example.com: "Kestrel Logistics contract - first draft"
# (09-14), "... updated terms, needs your counter-signature" (09-21), "Lunch
# Thursday?" (09-24). user.work@example.com: "Kestrel kickoff agenda" (09-27,
# Thursday, October 1, 10:00 AM, room Birch). user@outlook.example: "Saturday
# hike?" (09-26, Ridge Trail, Saturday, October 3, 8 AM).
id: email_t2_multi_same_sender
name: "Email — One Sender Across Three Accounts"
category: gaia_email
severity: high
tags: [t2_compound, multi_account]
description: |
  The same person wrote to all three accounts. The answer must collect every
  message and keep each one with the account it arrived in, not fold them
  into one inbox or stop at the first account.

persona: power_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: multi_account
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture, which attaches all three accounts."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask for everything Marcus sent, by account"
    user_message: "What has Marcus Chen sent me lately? Tell me which account each one came to."
    ground_truth:
      expected_answer: "5 emails. user@example.com: Kestrel contract first draft, Kestrel contract updated terms (counter-signature), Lunch Thursday?. user.work@example.com: Kestrel kickoff agenda. user@outlook.example: Saturday hike?"
    success_criteria: |
      Lists all five and puts each under the right account. Missing the work
      or Outlook message is a FAIL. Putting a message under the wrong account
      is a FAIL.

  - turn: 2
    objective: "Follow-up that needs the work account's message"
    user_message: "When and where is the Kestrel kickoff?"
    ground_truth:
      expected_answer: "Thursday, October 1 at 10:00 AM, room Birch"
    success_criteria: "States Thursday, October 1, 10:00 AM and room Birch. CRITICAL FAIL if it confuses the kickoff with the contract counter-signature deadline or the lunch."

expected_outcome: |
  Mail from one sender is gathered across accounts and kept with the account
  it came to.
