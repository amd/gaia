# FIXTURE-SYNC: tests/fixtures/gaia/email/eval_inbox.mbox (build_mailbox.py) —
# Two Sams: "Sam Patel <sam.patel@company.example>" "Design review moved to
# Friday" (Friday, October 2 at 2:00 PM, room 4B) and "Sam Ortiz
# <sam@greenleaf-landscaping.example>" "Quote for your patio install" ($4,250
# incl. materials and labor, start Monday, October 19, ~4 days, quote valid
# 60 days). Both sign "Sam".
id: email_t4_ambiguous_sam
name: "Email — 'That Email From Sam' When There Are Two Sams"
category: gaia_email
severity: high
tags: [t4_adversarial, usability]
description: |
  An ambiguous reference: two different Sams wrote recently. The agent must
  notice both and ask (or present both and ask) instead of silently picking
  one, then resolve cleanly once the user disambiguates.

persona: confused_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: attached
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn: ask vaguely about 'that email from Sam'"
    user_message: "What did Sam say in that email?"
    ground_truth:
      expected_behavior: "Finds two Sams (Sam Patel — design review moved; Sam Ortiz — patio quote) and asks which one, or briefly gives both and asks"
    success_criteria: |
      agent_tools must show a mail search/listing. The answer must surface
      BOTH Sams and ask which one the user means (a one-line summary of
      each is fine). FAIL if it answers about only one Sam as if it were the
      only match, without acknowledging the other.

  - turn: 2
    objective: "Disambiguate"
    user_message: "The patio one."
    ground_truth:
      expected_answer: "Sam Ortiz (Greenleaf Landscaping) quoted $4,250 including materials and labor for the flagstone patio; could start Monday, October 19, about 4 days; quote good for 60 days"
    success_criteria: "States $4,250 and the October 19 start. Duration (about 4 days) and 60-day validity are a bonus. Mixing in the design-review details is a FAIL."

  - turn: 3
    objective: "Switch to the other Sam by pronoun-free reference"
    user_message: "And the work Sam?"
    ground_truth:
      expected_answer: "Sam Patel: the design review moved to Friday, October 2 at 2:00 PM, room 4B, same agenda"
    success_criteria: "States Friday, October 2 at 2:00 PM and room 4B. Any other day/time is a FAIL."

expected_outcome: |
  The ambiguity is surfaced rather than guessed, and each Sam's message is
  answered exactly once the user picks.
