# FIXTURE-SYNC: tests/fixtures/gaia/email/eval_inbox.mbox (build_mailbox.py) —
# Marcus Chen "Kestrel Logistics contract - updated terms, needs your
# counter-signature" (2026-09-21): $52,500, counter-signature by Thursday,
# October 1. Draft (2026-09-14): $48,000. The user misspells both names;
# search_email for the misspelling matches nothing exactly.
id: email_t4_typos_recollection
name: "Email — Misspelled Names Still Find the Right Thread"
category: gaia_email
severity: high
tags: [t4_adversarial, usability]
description: |
  A hurried, typo-ridden question ("marcs", "kestral"). Exact search misses,
  so the agent must correct the spelling or use the broadened candidates
  without presenting an unverified hit as the answer — and must not settle
  for the Kestrel portal email, which also says "Kestrel".

persona: confused_user

setup:
  index_documents: []
  memory_clear: true
  mailbox_fixture: attached
  notes: "Backend runs with GAIA_EVAL_MAILBOX (the fixture mailbox) and GAIA_MEMORY_ADMIN=1; the runner applies mailbox_fixture."

turns:
  - turn: 1
    objective: "SETUP FIRST (simulator actions, not a user message): reset persistent memory by calling the eval MCP admin tool memory_clear(scope=all), so no earlier scenario's memory leaks in (the runner has already set the fixture mailbox from setup.mailbox_fixture). Then send this turn exactly as written, typos included"
    user_message: "wat did marcs say abuot the kestral contrct deadlne"
    ground_truth:
      expected_answer: "Marcus Chen needs your counter-signature on the Kestrel Logistics contract by Thursday, October 1 (annual value now $52,500)"
    success_criteria: |
      States the Thursday, October 1 counter-signature deadline from Marcus
      Chen's updated-terms email. The $52,500 value is a bonus. agent_tools
      must show a mail search/listing.
      FAIL if it answers from the Kestrel portal email, gives the November
      30 renewal date as "the deadline" without the October 1 signature
      date, or says nothing was found without retrying the corrected
      spelling.

  - turn: 2
    objective: "Typo'd follow-up"
    user_message: "an how much is it wroth now"
    ground_truth:
      expected_answer: "$52,500 per year (up from $48,000 in the first draft)"
    success_criteria: "States $52,500. Giving $48,000 as the current value is a FAIL."

expected_outcome: |
  Typos do not derail the search; the right message answers both turns.
