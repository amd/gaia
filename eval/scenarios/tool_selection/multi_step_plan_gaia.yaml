id: multi_step_plan_gaia
name: "Multi-Step Plan -- Complex Request (flagship)"
category: tool_selection
agent_type: gaia
severity: medium
description: |
  Flagship counterpart to multi_step_plan. A compound request needs several
  facts from one document, then a fact from a second. The flagship re-runs
  semantic tool selection every turn over ~80 registered tools, exposing ~26,
  so this tests whether document retrieval stays surfaced *across* turns as the
  conversation shifts topic -- a tool that drops out mid-plan breaks the second
  half of the request even when the first half succeeded.

persona: power_user

setup:
  index_documents:
    - corpus_doc: employee_handbook
      path: "eval/corpus/documents/employee_handbook.md"
    - corpus_doc: acme_q3_report
      path: "eval/corpus/documents/acme_q3_report.md"

turns:
  - turn: 1
    objective: "Ask 'Can you give me a quick HR briefing -- PTO policy, remote work rules, and whether contractors get benefits?'"
    ground_truth:
      doc_id: employee_handbook
      fact_ids: [pto_days, remote_work, contractor_benefits]
      expected_answer: "15 days PTO for first-year employees; up to 3 days/week remote with manager approval (fully remote needs VP); contractors NOT eligible for benefits"
    success_criteria: |
      Agent retrieves all three core facts from the employee handbook:
        (1) 15 days PTO for first-year employees
        (2) Up to 3 days/week remote work with manager approval
        (3) Contractors NOT eligible for benefits
      FAIL if any of these three facts is missing or wrong.
      BONUS (not required for PASS): also mentions VP approval for fully-remote arrangements.

  - turn: 2
    objective: "Ask 'Now add the Q3 financial highlight to that briefing.'"
    ground_truth:
      doc_id: acme_q3_report
      fact_id: q3_revenue
      expected_answer: "$14.2 million Q3 revenue"
    success_criteria: "Agent queries acme_q3_report and adds Q3 revenue ($14.2M) to the briefing context"

expected_outcome: |
  Document retrieval stays surfaced across both turns as the topic shifts from
  HR policy to financials, and the agent executes the multi-step plan: three
  facts from one document, then a fact from a second, in one coherent briefing.
