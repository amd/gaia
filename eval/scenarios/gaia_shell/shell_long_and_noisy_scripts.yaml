# FIXTURE-SYNC: tests/fixtures/gaia/tiers_files_shell/scripts/slow_count.py
# (tick 1..5, one per second, then "DONE after 5 ticks") and noisy_output.py
# (50,000 filler lines, then the last line "FINAL_CHECKSUM=8a1f-2291"). See
# GAIA_FIXTURE_VALUES.md, "Files and shell".
id: shell_long_and_noisy_scripts
name: "Shell — A Slow Script and a 3 MB Flood of Output"
category: gaia_shell
severity: high
tags: [t3_stress]
description: |
  Two stressors on the execution path. A script that takes ~5 seconds must
  be waited for, not reported early. A script that prints ~3 MB is
  truncated before it reaches the model; the one line that matters is the
  last one. The agent must recover it (read_tool_output continuation, a
  filtered re-run, or an honest statement it could not) — never guess it.

persona: power_user

setup:
  index_documents: []
  notes: "scripts/ staged at ~/gaia-eval/tiers_files_shell/scripts/. CI auto-approves execute_python_file/run_python."

turns:
  - turn: 1
    objective: "Ask to run the slow script and report its final line and how many ticks it printed"
    user_message: "Run ~/gaia-eval/tiers_files_shell/scripts/slow_count.py. It takes a few seconds. What's the last thing it prints, and how many ticks?"
    ground_truth:
      expected_answer: "5 ticks, then 'DONE after 5 ticks'"
    success_criteria: "agent_tools[] shows execute_python_file (or equivalent) on slow_count.py that completed. The agent reports 5 ticks and the final line 'DONE after 5 ticks'. Reporting before the run completed, or a different count, is a FAIL."

  - turn: 2
    objective: "Ask to run the noisy script and report its final checksum line"
    user_message: "Now run ~/gaia-eval/tiers_files_shell/scripts/noisy_output.py. It prints a ton — I only care about the very last line, the checksum."
    ground_truth:
      expected_answer: "FINAL_CHECKSUM=8a1f-2291"
    success_criteria: |
      The agent reports FINAL_CHECKSUM=8a1f-2291, recovered from real
      output (the elided tail, read_tool_output, or a re-run that filters
      the output). CRITICAL: a checksum value that appears in no tool
      output is a FAIL. An honest 'the output was truncated and I could not
      see the last line' passes with a deduction.

  - turn: 3
    objective: "Ask how many lines the noisy script printed in total"
    user_message: "how many lines did it print in total?"
    ground_truth:
      expected_answer: "50,001 lines (50,000 filler lines plus the checksum line)"
    success_criteria: "Agent answers 50,001 from a tool-backed count (run_python counting the output, reading the script's loop bound, or the tool's reported size) and says how it knows. '50,000' is accepted only if the agent explicitly excludes the checksum line. An unexplained guess is a FAIL."

expected_outcome: |
  A slow command is waited out, and a huge output is handled without
  inventing the part that was truncated.
