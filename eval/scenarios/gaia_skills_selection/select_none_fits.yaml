id: select_none_fits
name: "Skill Selection — Requests No Skill Fits Load No Skill"
category: gaia_skills_selection
severity: medium
tags: [t1_basic]
description: |
  Simple arithmetic and a rewrite need no skill. Loading one anyway costs
  context and time on every later turn.

persona: casual_user

setup:
  index_documents: []
  notes: "Every hub/skills skill ships with the flagship."

turns:
  - turn: 1
    objective: "Ask for 17% of 2,340"
    user_message: "what's 17% of 2,340?"
    ground_truth:
      expected_answer: "397.8"
    success_criteria: |
      Answer is 397.8. FAIL if agent_tools[] shows any load_skill call; a
      calculation tool is fine.

  - turn: 2
    objective: "Ask to rewrite a blunt sentence more politely"
    user_message: "make this sound nicer: 'send me the report now, it's late'"
    ground_truth:
      expected_behavior: "A politer rewrite, no skill loaded"
    success_criteria: "A politer rewrite with the same meaning. FAIL if agent_tools[] shows any load_skill call."

expected_outcome: |
  The agent answers directly when no skill applies.
