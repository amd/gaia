# FIXTURE-SYNC: tests/fixtures/home_assistant/eval_house.json — see
# GAIA_FIXTURE_VALUES.md.
id: skill_home_assistant_read_state
name: "Home — Reading State Answers From Home Assistant, With No Change Made"
category: gaia_home
severity: high
description: |
  The fake Home Assistant shares five devices. Lights on: Kitchen Lights
  (80%), Porch Light (100%) and the Hallway Light; Bed Light is off; the
  Ceiling Fan is off. A question about what is on must be answered from Home
  Assistant's live context, never guessed, and must not change anything.

persona: casual_user

setup:
  index_documents: []
  notes: "Requires stage_fake_ha.py install before this category runs."

turns:
  - turn: 1
    objective: "Ask which lights are on"
    user_message: "which lights are on at home right now?"
    ground_truth:
      expected_answer: "Kitchen Lights, Porch Light and the Hallway Light are on; Bed Light is off"
    success_criteria: |
      agent_tools[] includes load_skill for home-assistant (or the skill was
      already active) before any Home Assistant tool call.
      agent_tools[] includes the Home Assistant live-context tool
      (mcp_home_assistant_homeassistant__GetLiveContext). The answer names
      Kitchen Lights, Porch Light and the hallway light as on and does not say
      Bed Light is on. ANY Home Assistant control tool (HassTurnOn,
      HassTurnOff, HassLightSet) in agent_tools[] is a FAIL.

  - turn: 2
    objective: "Ask about the fan"
    user_message: "and is the ceiling fan running?"
    ground_truth:
      expected_answer: "No, the Ceiling Fan is off"
    success_criteria: "Agent says the Ceiling Fan is off, from Home Assistant's state. A control call is a FAIL."

expected_outcome: |
  Both answers match the fake house exactly, come from the live context, and
  nothing in the house changes.
