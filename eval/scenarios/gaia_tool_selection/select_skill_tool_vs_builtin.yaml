# FIXTURE-SYNC: tests/fixtures/gaia/rss/feed.xml, web/price_nimbusbook.html
# ($899), csv/sales.csv ($18,600) — see GAIA_FIXTURE_VALUES.md.
id: select_skill_tool_vs_builtin
name: "Tool Selection — Skill-Provided Tool vs Built-Ins, Skills Loaded"
category: gaia_tool_selection
severity: high
tags: [t3_stress, local_blocked_no_embedder]
description: |
  With two skills loaded, the tool list grows past the built-ins with
  rss-digest/fetch_rss. A feed question should use the skill's tool; a
  product-page question should use fetch_page (not the feed parser); a CSV
  question should use data tools even though skills are active.

persona: data_analyst

setup:
  index_documents: []
  notes: "rss-digest and price-watch installed at ~/.gaia/skills/; fixture server on 127.0.0.1:8765; GAIA_WEB_ALLOWED_HOSTS=127.0.0.1; staged ~/gaia-eval/csv/sales.csv; dynamic tool selection enabled."

turns:
  - turn: 1
    objective: "Load two skills"
    user_message: "Load rss-digest and price-watch."
    ground_truth:
      expected_behavior: "Two load_skill calls"
    success_criteria: "agent_tools[] shows load_skill for rss-digest and price-watch."

  - turn: 2
    objective: "Feed question"
    user_message: "What's the newest entry in http://127.0.0.1:8765/rss/feed.xml?"
    ground_truth:
      expected_answer: "v2.4.0 — Offline mode ships (2026-08-18)"
    success_criteria: "rss-digest/fetch_rss in agent_tools[] (the loaded skill's tool) and the answer v2.4.0 Offline mode ships. fetch_page instead scores tool_selection down; no fetch at all is a FAIL."

  - turn: 3
    objective: "Product page question"
    user_message: "And what's the current price on http://127.0.0.1:8765/price_nimbusbook.html?"
    ground_truth:
      expected_answer: "$899"
    success_criteria: "fetch_page (or fetch_webpage) and $899. Calling rss-digest/fetch_rss on an HTML product page is misrouting — FAIL."

  - turn: 4
    objective: "CSV question"
    user_message: "Last one: total revenue in ~/gaia-eval/csv/sales.csv?"
    ground_truth:
      expected_answer: "$18,600"
    success_criteria: "Data tools (analyze_data_file or create_table/insert_data/query_data) and exactly $18,600. Web or skill tools for a local CSV are misrouting — FAIL."

expected_outcome: |
  Loaded skills widen the tool list without confusing it: each question
  lands on the tool built for its source.
