id: skills_list_before_refusing
name: "Skills — Check the List Before Claiming Unavailable"
category: gaia_skills_lifecycle
agent_type: gaia
severity: high
description: |
  The user asks for a capability by rough description, not by skill name.
  The agent must check list_skills (and optionally the hub) before claiming
  anything is unavailable — 'never call a skill unavailable without
  list_skills first'.

persona: confused_user

setup:
  index_documents: []
  notes: "github-triage installed at ~/.gaia/skills/; fixture hub available via GAIA_HUB_URL."

turns:
  - turn: 1
    objective: "Ask vaguely for a capability an installed skill covers"
    user_message: "do you have something for going through github issues? like sorting out what needs attention?"
    ground_truth:
      expected_answer: "Yes — the installed github-triage skill"
    success_criteria: |
      Agent checks its skills (list_skills in agent_tools[]) and identifies
      github-triage as matching. CRITICAL FAIL if it says it has nothing
      for this WITHOUT a list_skills call — that is the
      claimed-unavailable-without-checking bug.

  - turn: 2
    objective: "Ask for a capability nothing installed covers"
    user_message: "and anything for editing photos?"
    ground_truth:
      expected_answer: "No installed skill for photo editing (after actually checking; may offer a hub search)"
    success_criteria: "Agent checks (list_skills and/or search_skill_hub in agent_tools[]) and honestly reports nothing covers photo editing. A refusal without any check, or an invented photo skill, is a FAIL."

expected_outcome: |
  Availability claims — positive and negative — are made only after a real
  list/search call.
