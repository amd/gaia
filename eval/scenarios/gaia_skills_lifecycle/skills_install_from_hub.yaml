# FIXTURE-SYNC: tests/fixtures/gaia/fixture_hub/ (rss-digest 1.0.0, community,
# signed) — see GAIA_FIXTURE_VALUES.md.
id: skills_install_from_hub
name: "Skills — Full Install Loop From the Hub"
category: gaia_skills_lifecycle
agent_type: gaia
severity: critical
description: |
  The real search → install → load loop against the fixture hub: find
  rss-digest, install it, load it, and confirm it shows as loaded. Every
  step must be a real tool call.

persona: power_user

setup:
  index_documents: []
  notes: "Fixture server running; GAIA_HUB_URL points at the fixture hub; rss-digest NOT pre-installed."

turns:
  - turn: 1
    objective: "Ask the agent to find and install the rss-digest skill from the hub"
    ground_truth:
      expected_behavior: "Real search + install of rss-digest v1.0.0 (community, signed — signature verification passes deterministically against the fixture hub); the install gate auto-approves on the eval transport (GAIA_AUTO_APPROVE_TOOLS=1)"
    success_criteria: |
      agent_tools[] must show search_skill_hub and install_skill actually
      running. The agent reports rss-digest v1.0.0 installed. Claiming an
      install with no install_skill call is a CRITICAL FAIL.

  - turn: 2
    objective: "Load the newly installed skill"
    user_message: "Great — load it."
    ground_truth:
      expected_behavior: "rss-digest loads"
    success_criteria: "Agent loads it (load_skill in agent_tools[]) and confirms."

  - turn: 3
    objective: "Verify it is loaded"
    user_message: "Confirm what's loaded now."
    ground_truth:
      expected_answer: "rss-digest is loaded"
    success_criteria: "Agent reports rss-digest as loaded, from a real check (list_skills or skill_status in agent_tools[])."

expected_outcome: |
  The end-to-end hub loop works: search finds it, install downloads it,
  load activates it, and the final state check reflects all of it.
