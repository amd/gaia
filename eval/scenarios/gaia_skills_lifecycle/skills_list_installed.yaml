id: skills_list_installed
name: "Skills — List What Is Actually Installed"
category: gaia_skills_lifecycle
severity: high
tags: [t1_basic]
description: |
  Asking what skills are available must trigger a real list_skills call and
  report only what the tool returned.

persona: casual_user

setup:
  index_documents: []
  notes: "github-triage installed (the hub skills ship with the flagship); experimental-notes, a fixture-hub-only skill no scenario can install (the hub refuses it unsigned), NOT installed."

turns:
  - turn: 1
    objective: "Ask what skills the agent has installed"
    user_message: "What skills do you have installed right now?"
    ground_truth:
      expected_behavior: "Real list from list_skills; includes github-triage"
    success_criteria: "agent_tools[] must include list_skills, and the answer must name github-triage among the installed skills. Naming skills without the call, or inventing skills the tool didn't return, is a FAIL."

  - turn: 2
    objective: "Ask specifically whether experimental-notes is installed"
    user_message: "is experimental-notes one of them?"
    ground_truth:
      expected_answer: "No — experimental-notes is not installed (the hub refuses to install it: it is unsigned)"
    success_criteria: "Agent correctly says experimental-notes is NOT currently installed, based on the real list. Offering to search the hub for it is a plus."

expected_outcome: |
  Installed-skill answers come from real list_skills output, including an
  accurate negative.
