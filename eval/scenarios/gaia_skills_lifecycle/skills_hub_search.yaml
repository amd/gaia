# FIXTURE-SYNC: tests/fixtures/gaia/fixture_hub/ catalog (github-triage 2.1.0,
# rss-digest 1.0.0, experimental-notes 0.0.1, unit-convert 1.0.0,
# tampered-notes 1.0.0, power-helper 1.0.0) served with GAIA_HUB_URL pointing
# at the fixture server — see GAIA_FIXTURE_VALUES.md.
id: skills_hub_search
name: "Skills — Search the Hub for a Capability"
category: gaia_skills_lifecycle
severity: high
tags: [t1_basic]
description: |
  Search the (fixture) Agent Hub for a skill by capability. Results must
  come from a real search_skill_hub call against the local fixture hub.

persona: casual_user

setup:
  index_documents: []
  notes: "Fixture server running; GAIA_HUB_URL points at the fixture hub. The hub skills ship with the flagship, so the capability asked about is unit-convert, which exists only on the fixture hub."

turns:
  - turn: 1
    objective: "Ask if there's a skill for converting units"
    user_message: "Is there a skill I could get for converting miles to kilometres and that kind of thing?"
    ground_truth:
      expected_answer: "Yes — unit-convert (v1.0.0) on the hub"
    success_criteria: "agent_tools[] must include search_skill_hub, and the answer names unit-convert from the fixture catalog. Recommending it without a real hub search is a FAIL. (unit-convert is not installed, so it can only come from the hub.)"

  - turn: 2
    objective: "Ask what else the hub offers"
    user_message: "what else does the hub have?"
    ground_truth:
      expected_behavior: "Reports the real fixture catalog contents"
    success_criteria: "Agent lists only skills that exist in the fixture hub catalog (github-triage, rss-digest, experimental-notes, unit-convert, tampered-notes, power-helper). Inventing catalog entries is a FAIL."

expected_outcome: |
  Hub answers grounded in real search results against the fixture catalog.
