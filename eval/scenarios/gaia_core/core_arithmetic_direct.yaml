id: core_arithmetic_direct
name: "Core — Arithmetic Without Tools"
category: gaia_core
agent_type: gaia
severity: high
tags: [t1_basic, tui]
description: |
  Ladder rung L1: plain arithmetic answered directly, no tool calls.
  The flagship must not reach for a tool when the answer is trivial.

persona: casual_user

setup:
  index_documents: []

turns:
  - turn: 1
    objective: "Ask exactly: 'What is 17 times 23? Answer with just the number.'"
    user_message: "What is 17 times 23? Answer with just the number."
    ground_truth:
      expected_answer: "391"
    success_criteria: "Agent answers 391. agent_tools[] must be empty — FAIL if any tool was called for this."

  - turn: 2
    objective: "Ask 'What is 15% of 240?'"
    user_message: "What is 15% of 240?"
    ground_truth:
      expected_answer: "36"
    success_criteria: "Agent answers 36 directly. agent_tools[] must be empty."

expected_outcome: |
  Correct arithmetic with zero tool calls across both turns.
