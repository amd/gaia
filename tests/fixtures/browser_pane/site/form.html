<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pane fixture form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Sign up</h1>
  <form>
    <p><label for="name">Full name</label> <input id="name" name="name"></p>
    <p><label for="email">Email</label> <input id="email" type="email" name="email"></p>
    <p><label for="plan">Plan</label>
      <select id="plan" name="plan"><option>Basic</option><option>Pro</option></select></p>
    <p><label><input type="checkbox" name="news"> Send me news</label></p>
    <p><button type="submit">Create account</button></p>
  </form>
  <p id="status"></p>
  <script>
    document.querySelector("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      document.getElementById("status").textContent = `Account created for ${data.get("name")} (${data.get("email")}), ${data.get("plan")} plan.`;
    });
  </script>
</body>
</html>
