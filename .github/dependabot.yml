# Dependabot configuration for automated dependency updates
# This file configures Dependabot to check for updates to Python, JavaScript, Go, and GitHub Actions dependencies
#
# For detailed documentation on adding/modifying entries, see: docs/reference/dependency-management.mdx
# Official Dependabot docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (setup.py, requirements files)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    # Group all Python dependency updates together to reduce PR noise
    groups:
      python-dependencies:
        patterns:
          - "*"
    # setup.py keeps Intel Macs on cryptography <49 on purpose: 49+ ships no
    # x86_64 macOS wheel (test_dependency_major_caps.py guards it).
    ignore:
      - dependency-name: "cryptography"
        versions: [">=49"]

  # JavaScript dependencies - main package.json (if exists)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    # Group all root-workspace dependency updates into one PR per cycle to reduce noise.
    # Without this stanza, removing the prior `ignore:` block would open one PR per outdated
    # dependency and hit `open-pull-requests-limit` immediately. See #1157.
    groups:
      root-npm-dependencies:
        patterns:
          - "*"

  # JavaScript - Agent UI (flagship Electron + React + Vite app, published as @amd-gaia/agent-ui).
  - package-ecosystem: "npm"
    directory: "/src/gaia/apps/webui"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
      - "electron"
    open-pull-requests-limit: 5
    groups:
      agent-ui-dependencies:
        patterns:
          - "*"

  # JavaScript - standalone npm packages outside the root workspace: the two
  # published hub sidecars, the website, the docs proxy, the Cloudflare workers
  # and the VS Code extension. util/check_dependabot.py fails lint if a tracked
  # lockfile is missing here (#3525). One grouped PR per directory.
  - package-ecosystem: "npm"
    directories:
      - "/hub/agents/email/npm"
      - "/hub/agents/gaia/npm"
      - "/website"
      - "/docs"
      - "/workers/agent-hub"
      - "/workers/admin"
      - "/workers/website-router"
      - "/src/vscode/gaia"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    groups:
      standalone-npm-dependencies:
        patterns:
          - "*"

  # Go - the TUI module behind the published gaia-* binaries. Its
  # tui/third_party/* forks are wired in by `replace` and stay unwatched.
  - package-ecosystem: "gomod"
    directory: "/tui"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "tui"
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions dependencies
  # "/" covers .github/workflows only; composite actions need their own glob.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
