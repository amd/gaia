name: 'Setup FFmpeg'
description: 'Put a pinned, SHA-256-verified FFmpeg (gyan.dev full static build) on PATH. Windows only.'

# A release-asset URL is not a REST API call, so a rate-limited repo token
# cannot fail this. The archive is re-hashed on every run, cache hit included.

inputs:
  version:
    description: 'gyan.dev release (a GyanD/codexffmpeg tag). Bump together with sha256.'
    default: '8.1.2'
  sha256:
    description: 'SHA-256 of ffmpeg-<version>-full_build.zip.'
    default: 'b8cdefab5f50590a076c27c2b56b0294a0e6154faded28ba1ba05ebc4f801f57'

runs:
  using: 'composite'
  steps:
    - name: Refuse a non-Windows runner
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "::error::setup-ffmpeg pins a Windows build only; runner is ${RUNNER_OS}. Add a pinned build for this OS to .github/actions/setup-ffmpeg/action.yml."
        exit 1

    - name: Restore the FFmpeg archive
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-${{ inputs.version }}-full_build.zip
        key: ffmpeg-${{ inputs.version }}-full_build-${{ inputs.sha256 }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download the FFmpeg archive
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        FFMPEG_VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'
        $name = "ffmpeg-$env:FFMPEG_VERSION-full_build.zip"
        $url = "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/$name"
        Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$name" -MaximumRetryCount 3 -RetryIntervalSec 10

    - name: Verify and install FFmpeg
      shell: pwsh
      env:
        FFMPEG_VERSION: ${{ inputs.version }}
        FFMPEG_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $v = $env:FFMPEG_VERSION
        $zip = "$env:RUNNER_TEMP\ffmpeg-$v-full_build.zip"
        $expected = $env:FFMPEG_SHA256.ToLower()
        $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
        if ($actual -ne $expected) {
          Remove-Item $zip
          throw "FFmpeg $v archive SHA-256 is $actual, expected $expected. Re-run the job; if it repeats, the release asset changed -- re-pin sha256 in .github/actions/setup-ffmpeg/action.yml."
        }
        $dest = "$env:RUNNER_TEMP\ffmpeg-$v"
        if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
        New-Item -ItemType Directory -Path $dest | Out-Null
        # System32 tar reads zip; Git's GNU tar, often first on PATH, does not.
        & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $dest `
          "ffmpeg-$v-full_build/bin/ffmpeg.exe" "ffmpeg-$v-full_build/bin/ffprobe.exe"
        if ($LASTEXITCODE -ne 0) { throw "Extracting $zip failed (tar exit $LASTEXITCODE)" }
        $bin = "$dest\ffmpeg-$v-full_build\bin"
        $line = (& "$bin\ffmpeg.exe" -version | Select-Object -First 1)
        Write-Host $line
        if ($line -notmatch "^ffmpeg version $([regex]::Escape($v))-full_build-www\.gyan\.dev ") {
          throw "Installed ffmpeg reports '$line', not $v-full_build"
        }
        Add-Content -Path $env:GITHUB_PATH -Value $bin

    - name: Save the FFmpeg archive
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-${{ inputs.version }}-full_build.zip
        key: ${{ steps.cache.outputs.cache-primary-key }}
