#
# Weekly eval sweep (#1964). Runs the email eval suite (triage + drafting +
# action-item) AND the full judged gaia-agent suite once a week on the
# self-hosted Lemonade runner and OPENS A GITHUB ISSUE per suite if it does
# not pass, so a regression that the report-mode runs only log is escalated
# into the tracker once a week instead of scrolling past.
#
# This calls the SAME reusable workflows the PR and release gates use
# (test_email_agent_eval.yml, test_gaia_agent_eval.yml), so there is one eval
# definition per suite, not a fork. The callees own the `lemonade-eval`
# concurrency group, which is what keeps every eval serial on the single
# Lemonade slot — this caller MUST NOT also claim it (see the concurrency
# block below); the two suites here queue behind each other FIFO on that slot.
#
# A non-pass here is always a real signal, never a silent skip: the action-item
# eval REQUIRES the Claude judge (no fuzzy fallback), so a missing/broken judge, a
# Lemonade/infra error, or an enforced (enforce:true) gate breach all fail the job.
# A CANCELLED callee counts too — see the `if:` on the notify job.

name: Weekly Eval

on:
  # Sundays 08:17 UTC — off the nightly's 07:00 slot; the callee's concurrency
  # group serializes them if they ever overlap.
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

concurrency:
  # MUST NOT be `lemonade-eval`. A called reusable workflow's concurrency is
  # evaluated in the caller's context, so if this caller held the same group the
  # callee could never acquire it — it would die before a job record was ever
  # created, and `needs.email-eval.result` would report 'failure' for an eval
  # that never ran (the phantom-job bug: every Weekly Eval run 2026-07-09..19
  # ended in <60s with only the notify job, filing issue #2026 on a no-op).
  # Serialization on the Lemonade slot belongs to the callee, which owns it.
  group: weekly-eval
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reuse the one eval definition. secrets: inherit passes ANTHROPIC_API_KEY
  # (REQUIRED by the action-item judge — the suite fails loudly without it).
  email-eval:
    name: Weekly email eval suite
    uses: ./.github/workflows/test_email_agent_eval.yml
    secrets: inherit

  # The FULL judged gaia suite (all 13 categories — the workflow_call default).
  # Queues behind the email suite on the callee-owned `lemonade-eval` slot;
  # the callee's own timeout budget covers the multi-hour run.
  gaia-eval:
    name: Weekly gaia eval suite
    uses: ./.github/workflows/test_gaia_agent_eval.yml
    secrets: inherit

  open-issue-on-failure:
    name: Open an issue if the weekly eval did not pass
    needs: email-eval
    # always() so this runs even though the needed job failed; then gate on the
    # result being anything other than a clean pass.
    #
    # `!= 'success'` rather than `== 'failure'`: a callee that never ran reports
    # 'cancelled' or 'skipped', not 'failure', so `== 'failure'` would file nothing
    # and the week's eval would vanish with zero signal. The callee shares the
    # `lemonade-eval` slot with PR-triggered runs (test_email_agent_eval.yml gained
    # a `pull_request` trigger); that slot now queues FIFO (`queue: max`) instead
    # of evicting the pending run, but a manual cancel or GitHub's 24h job-queue
    # limit still produces 'cancelled'. A week with no eval is a week with no
    # evidence; say so out loud.
    if: ${{ always() && needs.email-eval.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: File (or update) the rolling eval-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVAL_RESULT: ${{ needs.email-eval.result }}
        run: |
          set -euo pipefail
          # STABLE DEDUP KEY — do not reword. The rolling-issue lookup below
          # searches on this exact title; changing it orphans the open issue and
          # files a duplicate. The body, not the title, says what actually happened.
          TITLE="Weekly eval failure: email eval suite"
          # Idempotent label so --label never errors (create-or-update).
          gh label create eval-failure --color B60205 \
            --description "Automated weekly eval failure" --force
          BODY="$(cat <<EOF
          The weekly email eval suite (\`test_email_agent_eval.yml\`, called by \`weekly_eval.yml\`) did not pass.

          - Run: ${RUN_URL}
          - Trigger: ${EVENT_NAME}
          - Result: \`${EVAL_RESULT}\`

          If the result is \`failure\`: the email eval REQUIRES the Claude equivalence judge (there is no fuzzy fallback),
          so it is one of a Lemonade / infra error, the Claude judge being unavailable or broken, or an enforced
          (\`enforce: true\`) gate breach. Open the run log above to see which stage failed (triage / drafting /
          action-item) and why.

          If the result is \`cancelled\`: check for a manual cancel, or a run that waited out GitHub's 24h job-queue
          limit behind a long occupant of the shared \`lemonade-eval\` slot. That slot now queues pending runs FIFO
          (\`queue: max\`) instead of evicting them, so slot eviction is no longer the routine cause it once was.
          No eval ran this week; re-dispatch \`weekly_eval.yml\`.
          EOF
          )"
          # One rolling issue: comment on the open one if it exists, else open it.
          EXISTING="$(gh issue list --state open --label eval-failure \
            --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label eval-failure
          fi

  open-issue-on-gaia-failure:
    name: Open an issue if the weekly gaia eval did not pass
    needs: gaia-eval
    # Same `!= 'success'` reasoning as the email notifier above: 'cancelled'
    # and 'skipped' are weeks with no evidence and must be said out loud.
    if: ${{ always() && needs.gaia-eval.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: File (or update) the rolling gaia eval-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVAL_RESULT: ${{ needs.gaia-eval.result }}
        run: |
          set -euo pipefail
          # STABLE DEDUP KEY — do not reword (same contract as the email
          # notifier: the lookup searches this exact title).
          TITLE="Weekly eval failure: gaia eval suite"
          gh label create eval-failure --color B60205 \
            --description "Automated weekly eval failure" --force
          BODY="$(cat <<EOF
          The weekly gaia agent eval suite (\`test_gaia_agent_eval.yml\`, called by \`weekly_eval.yml\`) did not pass.

          - Run: ${RUN_URL}
          - Trigger: ${EVENT_NAME}
          - Result: \`${EVAL_RESULT}\`

          If the result is \`failure\`: it is one of a Lemonade / embedder / backend infra error, the Claude
          judge being unavailable, an integrity failure (zero judged or unmeasured scenarios), or an enforced
          (\`enforce: true\`) gate breach from a manifest under \`tests/fixtures/gaia/\`. Open the run log above
          to see which category/stage failed.

          If the result is \`cancelled\`: check for a manual cancel, or a run that waited out GitHub's 24h
          job-queue limit behind a long occupant of the shared \`lemonade-eval\` slot. No gaia eval ran this
          week; re-dispatch \`weekly_eval.yml\`.
          EOF
          )"
          EXISTING="$(gh issue list --state open --label eval-failure \
            --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}" --label eval-failure
          fi
