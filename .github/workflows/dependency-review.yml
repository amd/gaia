# Dependency review (SCA) — flags known-vulnerable or restrictively-licensed
# dependencies introduced by a PR.  SAST is already handled by GitHub's
# default CodeQL setup (enabled at the repo level).

name: Dependency Review

on:
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/dependency-review.yml'
      # Only dependency manifests and Actions references change what this reviews.
      - '**/package.json'
      - '**/package-lock.json'
      - 'setup.py'
      - '**/pyproject.toml'
      - '**/requirements*.txt'
      - '**/uv.lock'
      - '**/go.mod'
      - '**/go.sum'
      - '.github/workflows/**'
      - '.github/actions/**'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # GAIA ships no AGPL/GPL/LGPL code; license-check.yml enforces the same on every
          # shipped package, including free-text licence metadata this action cannot read.
          deny-licenses: >-
            AGPL-1.0, AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-1.0, GPL-1.0-only, GPL-1.0-or-later, GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0, LGPL-2.0-only, LGPL-2.0-or-later, LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later, SSPL-1.0
          # Intel Macs only: cryptography <49 is the last with an x86_64 wheel (#5529).
          allow-ghsas: GHSA-jwv3-5hgf-82ww
          comment-summary-in-pr: on-failure
