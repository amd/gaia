#
# PR + main CI for the admin dashboard Worker (workers/admin/). The suite
# checks the numbers the dashboard reports: download classification, daily
# deltas, CI and eval aggregation, the pytest-summary parser, the zip reader,
# and the Cloudflare Access token check that keeps the dashboard private.

name: Admin Dashboard Worker CI

on:
  pull_request:
    paths:
      - 'workers/admin/**'
      - '.github/workflows/admin_worker_ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/admin/**'
      - '.github/workflows/admin_worker_ci.yml'

permissions:
  contents: read

concurrency:
  group: admin-worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test
