name: TMP mac reader probe
on:
  push:
    branches: [fix/stall-reader-exits-macos]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: |
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout psutil httpx respx
          uv pip install --system -e ".[api]"
      - name: old code with stack dumps
        run: |
          git fetch -q --depth 1 origin main
          git show FETCH_HEAD:src/gaia/llm/stream_watchdog.py > src/gaia/llm/stream_watchdog.py
          cat > /tmp/dumpstacks.py <<'PY'
          import sys, threading, traceback, time
          def _dump(label):
              frames = sys._current_frames()
              for th in threading.enumerate():
                  if th.name == "gaia-model-stream":
                      print(f"--- {label}: reader alive (ident {th.ident})")
                      traceback.print_stack(frames[th.ident], file=sys.stdout)
          def pytest_runtest_setup(item):
              _dump(f"before {item.name}")
          def pytest_runtest_teardown(item):
              _dump(f"after {item.name}")
          PY
          PYTHONPATH=/tmp pytest -p dumpstacks tests/unit/test_stream_stall_watchdog.py --timeout=120 -v -s --tb=line -k "stall or stop" 2>&1 | grep -v "^\s*$" | head -300 || true
          git checkout src/gaia/llm/stream_watchdog.py
