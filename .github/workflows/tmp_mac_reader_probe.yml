name: TMP mac reader probe
on:
  push:
    branches: [fix/stall-reader-exits-macos]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: |
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout psutil httpx respx
          uv pip install --system -e ".[api]"
      - name: probe
        run: |
          cat > /tmp/probe.py <<'PY'
          import sys, threading, time, traceback, socket
          sys.path.insert(0, "tests/unit")
          import pytest
          import test_stream_stall_watchdog as t
          from contextlib import nullcontext
          from gaia.llm.lemonade_client import LemonadeClient
          import os
          os.environ["GAIA_LLM_STREAM_IDLE_TIMEOUT"] = "2"
          def mk(server):
              c = LemonadeClient(host="127.0.0.1", port=server.port, verbose=False)
              c._ensure_model_loaded = lambda *a, **k: None
              c._model_slot_lease = lambda *a, **k: nullcontext()
              c.cloud_model_provider = lambda *a, **k: "amd"
              c._retry_sleep = lambda s: None
              return c
          def dump(label):
              frames = sys._current_frames()
              for th in threading.enumerate():
                  if th.name == "gaia-model-stream":
                      print(f"--- {label}: alive {th.name}", flush=True)
                      traceback.print_stack(frames[th.ident], file=sys.stdout)
          print("threads before:", [x.name for x in threading.enumerate()])
          with t.StallServer([t.stall_mid_stream, t.good]) as server:
              c = mk(server)
              try:
                  print(t._run(c))
              except Exception as e:
                  print("raised", type(e).__name__)
              for i in range(6):
                  time.sleep(0.5)
                  dump(f"inside server +{(i+1)*0.5}s")
          for i in range(10):
              time.sleep(0.5)
              dump(f"after server close +{(i+1)*0.5}s")
          print("done", [x.name for x in threading.enumerate()])
          PY
          echo "=== NEW CODE ==="
          python /tmp/probe.py 2>&1 | tail -60
          git show origin/main:src/gaia/llm/stream_watchdog.py > /tmp/old_wd.py || git fetch origin main && git show FETCH_HEAD:src/gaia/llm/stream_watchdog.py > /tmp/old_wd.py
          cp src/gaia/llm/stream_watchdog.py /tmp/new_wd.py
          cp /tmp/old_wd.py src/gaia/llm/stream_watchdog.py
          echo "=== OLD CODE ==="
          python /tmp/probe.py 2>&1 | tail -80
          cp /tmp/new_wd.py src/gaia/llm/stream_watchdog.py
      - name: test file alone
        run: pytest tests/unit/test_stream_stall_watchdog.py tests/unit/test_stream_reader_abandon.py --timeout=120 -v --tb=short
