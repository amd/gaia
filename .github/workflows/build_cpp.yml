# This workflow builds and tests the C++ library in cpp/
# Tests include: CMake build, GoogleTest mock tests (cloud), integration tests (STX)
# Integration tests: LLM chat/tool-calling, MCP connection, WiFi diagnostics, Health monitoring
# Platform: Cross-platform (Linux and Windows cloud), Windows STX (self-hosted AMD hardware)

name: C++ Build & Test

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - '.github/scripts/**'
      - 'cpp/**'
      # test_skill.cpp discovers these corpora from disk, so adding a fixture
      # can break the C++ build. Without them here the breaking PR never runs
      # this workflow and main goes red on the next unrelated push (#2693).
      - 'tests/fixtures/skills/**'
      - 'tests/fixtures/*_skills/**'
      - '.github/workflows/build_cpp.yml'
      - '.github/workflows/benchmark_cpp.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - '.github/scripts/**'
      - 'cpp/**'
      - 'tests/fixtures/skills/**'
      - 'tests/fixtures/*_skills/**'
      - '.github/workflows/build_cpp.yml'
      - '.github/workflows/benchmark_cpp.yml'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Guards the toolchain-setup logic used by the STX job below. It cannot run on
  # the self-hosted runner (that is the thing it protects), so the cache-validity
  # decision is unit tested here with fake install trees.
  toolchain-script-tests:
    name: C++ toolchain script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Ensure-CppBuildTools.ps1 only ever executes on the self-hosted runner, so
      # a syntax error there would otherwise be found there. Parsing is free.
      - name: Parse-check toolchain scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem .github/scripts -Recurse -Filter *.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                  $failed = $true
                  $errors | ForEach-Object { Write-Host "$($file.Name):$($_.Extent.StartLineNumber): $($_.Message)" }
              }
          }
          if ($failed) { throw "PowerShell parse errors under .github/scripts" }
          Write-Host "All .github/scripts/*.ps1 parsed cleanly"

      - name: Run CppBuildTools unit tests
        shell: pwsh
        run: |
          ./.github/scripts/tests/CppBuildTools.Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "CppBuildTools unit tests failed" }

  build-and-test:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress -y

      - name: Restore FetchContent cache
        id: cache-deps
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps
          key: fetchcontent-${{ matrix.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ matrix.os }}-

      - name: Configure CMake
        run: cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release -DGAIA_BUILD_INTEGRATION_TESTS=OFF

      - name: Build
        run: cmake --build cpp/build --config Release --parallel

      - name: Test
        run: ctest --test-dir cpp/build -C Release --output-on-failure

  # Verify cmake --install + find_package round-trip works
  install-test:
    name: C++ Install Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: cpp/build/_deps
          key: fetchcontent-install-${{ matrix.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: fetchcontent-install-${{ matrix.os }}-

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install openssl --no-progress -y

      - name: Build and install gaia_core
        shell: bash
        run: |
          cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release \
                -DGAIA_BUILD_TESTS=OFF -DGAIA_BUILD_EXAMPLES=OFF \
                -DGAIA_BUILD_INTEGRATION_TESTS=OFF \
                -DGAIA_BUILD_TUI=OFF \
                -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/gaia_install"
          cmake --build cpp/build --config Release --parallel
          cmake --install cpp/build --config Release

      - name: Build consumer via find_package
        shell: bash
        run: |
          cmake -B consumer/build -S cpp/examples/fetch_content_consumer \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="${{ runner.temp }}/gaia_install" \
                -DUSE_FIND_PACKAGE=ON
          cmake --build consumer/build --config Release --parallel

  # Verify BUILD_SHARED_LIBS=ON (shared library / DLL) compiles cleanly
  shared-lib-test:
    name: C++ Shared Library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libssl-dev

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        run: choco install openssl --no-progress -y

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: cpp/build-shared/_deps
          key: fetchcontent-shared-${{ matrix.os }}-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: fetchcontent-shared-${{ matrix.os }}-

      - name: Build shared library
        shell: bash
        run: |
          cmake -B cpp/build-shared -S cpp -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_SHARED_LIBS=ON \
                -DGAIA_BUILD_TESTS=OFF -DGAIA_BUILD_EXAMPLES=OFF \
                -DGAIA_BUILD_INTEGRATION_TESTS=OFF
          cmake --build cpp/build-shared --config Release --parallel

  # Integration tests on STX hardware: LLM + MCP + WiFi + Health
  integration-test:
    name: C++ Integration Tests (STX)
    runs-on:
      - self-hosted
      - Windows
      - ${{ (contains(github.event.pull_request.labels.*.name, 'stx-test') && 'stx-test') || 'stx' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python environment
        uses: ./.github/actions/setup-venv
        with:
          python-version: '3.12'
          install-package: '.[lemonade]'

      - name: Install Lemonade Server
        uses: ./.github/actions/install-lemonade

      # Every candidate CMake is functionally probed before it is trusted -- a
      # cached install with bin/cmake.exe but no share/cmake-*/Modules passes a
      # Test-Path check and then fails configure with "Could not find CMAKE_ROOT"
      # (issue #2817). Tools live in the runner tool cache, not TEMP, which
      # Windows sweeps. See .github/scripts/CppBuildTools.ps1.
      - name: Ensure C++ build tools are available
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .github\scripts\Ensure-CppBuildTools.ps1 -CMakeVersion 3.31.4 -W64DevkitVersion 2.5.0
          if ($LASTEXITCODE -ne 0) { throw "C++ build tools setup failed" }

      - name: Restore FetchContent cache
        uses: actions/cache@v6
        with:
          path: cpp/build-integration/_deps
          key: fetchcontent-integration-windows-${{ hashFiles('cpp/CMakeLists.txt') }}
          restore-keys: fetchcontent-integration-windows-

      - name: Configure and build integration tests
        shell: powershell
        run: |
          # Auto-detect generator: MinGW Makefiles when using w64devkit
          $gen = @()
          if (Get-Command g++ -ErrorAction SilentlyContinue) {
              if (-not (Get-Command cl -ErrorAction SilentlyContinue)) {
                  $gen = @("-G", "MinGW Makefiles")
              }
          }
          cmake -B cpp/build-integration -S cpp @gen `
                -DCMAKE_BUILD_TYPE=Release `
                -DGAIA_BUILD_INTEGRATION_TESTS=ON `
                -DGAIA_BUILD_TESTS=OFF `
                -DGAIA_BUILD_EXAMPLES=OFF `
                -DGAIA_ENABLE_SSL=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build cpp/build-integration --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed" }

      - name: Probe windows-mcp availability
        id: uvx_check
        shell: powershell
        run: |
          # The Health and MCP integration tests connect to a `uvx windows-mcp`
          # server. That requires BOTH uvx on PATH AND a working windows-mcp
          # package that can actually launch. When either is missing, those
          # tests are excluded so the bash/LLM/VLM/WiFi suites (which don't need
          # windows-mcp) still gate the build. A simple Get-Command check isn't
          # enough — uvx can be present while windows-mcp fails to launch — so we
          # do a real functional probe.
          $uvx = Get-Command uvx -ErrorAction SilentlyContinue
          if (-not $uvx) {
              Write-Host "[WARN] uvx not found -- Health and MCP integration tests will be skipped"
              "windows_mcp_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
              exit 0
          }
          Write-Host "[OK] uvx found at: $($uvx.Source)"

          # Remove any broken persistent install that may interfere with uvx.
          cmd /c "uv tool uninstall windows-mcp 2>NUL" 2>$null
          $global:LASTEXITCODE = 0

          # Functional probe: launch `uvx windows-mcp@0.8.2 serve` (the exact
          # invocation the tests use) and confirm it stays up. Pinning + the
          # `serve` subcommand matters: current windows-mcp requires a subcommand
          # and exits with "Missing command." when called bare, which the tests'
          # MCP client sees as a failed connection. Warm the cache first so the
          # probe times package launch, not the one-time uvx download.
          Write-Host "Warming uvx cache for windows-mcp@0.8.2..."
          cmd /c "uvx windows-mcp@0.8.2 --help >NUL 2>&1"
          $global:LASTEXITCODE = 0
          Write-Host "Probing 'uvx windows-mcp@0.8.2 serve' launch capability..."
          $probeOk = $false
          try {
              $psi = New-Object System.Diagnostics.ProcessStartInfo
              $psi.FileName = $uvx.Source
              $psi.Arguments = "windows-mcp@0.8.2 serve"
              $psi.RedirectStandardInput = $true
              $psi.RedirectStandardError = $true
              $psi.UseShellExecute = $false
              $proc = [System.Diagnostics.Process]::Start($psi)
              Start-Sleep -Seconds 20
              if (-not $proc.HasExited) {
                  $probeOk = $true
                  $proc.Kill()
              } else {
                  Write-Host "windows-mcp exited early (code $($proc.ExitCode))"
              }
          } catch {
              Write-Host "windows-mcp probe threw: $($_.Exception.Message)"
          }
          $global:LASTEXITCODE = 0

          if ($probeOk) {
              Write-Host "[OK] windows-mcp launches -- Health and MCP tests will run"
              "windows_mcp_available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              Write-Host "[WARN] windows-mcp not launchable -- Health and MCP tests will be skipped"
              "windows_mcp_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Start Lemonade Server and run integration tests
        shell: powershell
        timeout-minutes: 30
        env:
          GAIA_CPP_TEST_MODEL: Qwen3-4B-Instruct-2507-GGUF
          GAIA_CPP_BASE_URL: http://localhost:13305/api/v1
        run: |
          try {
              # Start Lemonade with Qwen3-4B-GGUF
              .\installer\scripts\start-lemonade.ps1 -ModelName "Qwen3-4B-Instruct-2507-GGUF" -Port 13305 -CtxSize 16384 -InitWaitTime 15
              # Stop here on setup failure: the script exits non-zero without
              # loading the model, so the suite would run at Lemonade's own ctx.
              if ($LASTEXITCODE -ne 0) { throw "Lemonade setup failed (exit $LASTEXITCODE)" }

              # Verify health
              $health = Invoke-RestMethod -Uri "http://localhost:13305/api/v1/health" -Method GET -TimeoutSec 10
              if ($health.status -ne "ok") { throw "Lemonade health check failed" }
              Write-Host "[OK] Lemonade Server ready with Qwen3-4B-Instruct-2507-GGUF"

              $env:GAIA_CPP_TEST_MODEL = "Qwen3-4B-Instruct-2507-GGUF"
              $env:GAIA_CPP_BASE_URL   = "http://localhost:13305/api/v1"

              # Health and MCP integration tests require a working `uvx windows-mcp`.
              # Exclude them when the functional probe failed so the LLM/VLM/WiFi
              # suites (which don't need windows-mcp) still gate the build.
              $excludeArg = @()
              if ("${{ steps.uvx_check.outputs.windows_mcp_available }}" -ne "true") {
                  Write-Host "=== Running C++ Integration Tests (LLM + VLM + WiFi; Health + MCP excluded - windows-mcp unavailable) ==="
                  $excludeArg = @("-E", "IntegrationHealthTest|IntegrationMCP")
              } else {
                  Write-Host "=== Running C++ Integration Tests (LLM + MCP + WiFi + Health + VLM) ==="
              }

              # -j 1: run tests sequentially so they don't compete for the single LLM server
              ctest --test-dir cpp/build-integration -C Release --output-on-failure -j 1 @excludeArg
              if ($LASTEXITCODE -ne 0) { throw "C++ integration tests failed" }
              Write-Host "[SUCCESS] All C++ integration tests passed!"

          } catch {
              Write-Host "[ERROR] $($_.Exception.Message)"
              throw
          } finally {
              if ($env:LEMONADE_PROCESS_ID) {
                  Write-Host "Stopping Lemonade Server (PID $env:LEMONADE_PROCESS_ID)..."
                  Stop-Process -Id $env:LEMONADE_PROCESS_ID -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-integration-lemonade-logs
          path: |
            lemonade-server-stdout.log
            lemonade-server-stderr.log
            lemonade-server.log

  # Performance benchmarks (runs after build passes)
  benchmark:
    name: C++ Benchmarks
    needs: [build-and-test]
    if: needs.build-and-test.result == 'success'
    uses: ./.github/workflows/benchmark_cpp.yml

  # Summary job
  cpp-build-summary:
    name: C++ Build Summary
    runs-on: ubuntu-latest
    needs: [toolchain-script-tests, build-and-test, install-test, shared-lib-test, integration-test, benchmark]
    if: >-
      ${{ always() && !cancelled() &&
          needs.build-and-test.result != 'cancelled' }}
    steps:
      - name: Check build results
        run: |
          echo "=== C++ Build & Test Summary ==="
          echo "Toolchain Scripts: ${{ needs.toolchain-script-tests.result }}"
          echo "Build & Test:      ${{ needs.build-and-test.result }}"
          echo "Install Test:      ${{ needs.install-test.result }}"
          echo "Shared Lib Test:   ${{ needs.shared-lib-test.result }}"
          echo "Integration Tests: ${{ needs.integration-test.result }}"
          echo "Benchmarks:        ${{ needs.benchmark.result }}"
          echo ""

          # Checked before the draft-skip exit: the toolchain script tests gate the
          # STX setup logic and run on every event, draft or not.
          if [[ "${{ needs.toolchain-script-tests.result }}" != "success" ]]; then
            echo "C++ toolchain script tests failed"
            exit 1
          fi

          if [[ "${{ needs.build-and-test.result }}" == "skipped" ]]; then
            echo "All C++ jobs skipped (draft PR - add 'ready_for_ci' label to run)"
            exit 0
          fi

          FAILED=0
          [[ "${{ needs.build-and-test.result }}"  != "success" ]] && FAILED=1
          [[ "${{ needs.install-test.result }}"    != "success" ]] && FAILED=1
          [[ "${{ needs.shared-lib-test.result }}" != "success" ]] && FAILED=1
          # Integration test runs on self-hosted STX hardware; treat
          # 'skipped' and 'failure' as non-blocking (warn only) since the
          # runner can be offline, busy, or missing hardware prerequisites.
          # Toolchain setup itself is no longer a warn-only case -- it either
          # provides a validated CMake or fails the job loudly (issue #2817).
          if [[ "${{ needs.integration-test.result }}" == "failure" ]]; then
            echo "::warning::Integration tests failed (STX runner infrastructure issue)"
          fi
          # Benchmarks are non-blocking (regression alerts are warnings only)
          if [[ "${{ needs.benchmark.result }}" == "failure" ]]; then
            echo "::warning::Benchmark regression detected — review cpp-benchmark-* artifacts"
          fi

          if [[ "$FAILED" == "0" ]]; then
            echo "All required C++ jobs passed (unit tests, install round-trip, shared library)!"
          else
            echo "One or more required C++ jobs failed"
            exit 1
          fi
