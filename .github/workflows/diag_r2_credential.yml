#
# THROWAWAY DIAGNOSTIC — delete once the R2 `Unauthorized` is understood.
#
# The hub publish has failed for days on `PutObject -> Unauthorized`, while the
# same credential, run from a maintainer's laptop, writes to the same bucket and
# is served back by the Worker. Two explanations survive, and they need
# different fixes:
#
#   A. the values stored in GitHub differ from the working ones (stale secret,
#      or an environment-scoped copy silently overriding the repository one)
#   B. the values are identical, and the token refuses GitHub's runners --
#      an R2 API token with Client IP Address Filtering behaves exactly this way
#
# Re-pasting the secret fixes A and does nothing for B, which is why this has
# gone in circles. This tells them apart in one run by printing a SHA-256
# FINGERPRINT of each credential. A hash is safe to log and is directly
# comparable to the same hash computed locally:
#
#   python - <<'PY'
#   import hashlib, pathlib
#   env = dict(
#       l.strip().split("=", 1)
#       for l in pathlib.Path(".env").read_text().splitlines()
#       if "=" in l and not l.strip().startswith("#")
#   )
#   for k in ("R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "CLOUDFLARE_ACCOUNT_ID"):
#       v = env.get(k, "").strip()
#       print(k, hashlib.sha256(v.encode()).hexdigest()[:16], f"len={len(v)}")
#   PY
#
# Fingerprints match + upload fails  -> B, the token is IP-filtered.
# Fingerprints differ                -> A, and the scope lines below say which.
#
# It writes one 1 KB object under agents/_diag/ and deletes it. It never
# publishes, never touches the catalog, and prints no secret.

name: Diagnose R2 credential

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which secret scope to read'
        type: choice
        options: [repository, agent-publish]
        default: agent-publish

permissions:
  contents: read

jobs:
  probe:
    name: Probe R2 from a GitHub runner
    runs-on: ubuntu-latest
    # Reading the environment scope is the whole point of the choice: an
    # environment secret overrides the repository one, so a stale copy here is
    # explanation A and is invisible from the repository scope.
    environment: ${{ github.event.inputs.scope == 'agent-publish' && 'agent-publish' || '' }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade boto3

      - name: Fingerprint the credential and attempt one PutObject
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCOPE: ${{ github.event.inputs.scope }}
        run: |
          python - <<'PY'
          import hashlib, os, sys

          print(f"secret scope read: {os.environ.get('SCOPE')}\n")

          def fp(name):
              raw = os.environ.get(name, "")
              v = raw.strip()
              if not v:
                  print(f"{name:22s} NOT SET")
                  return ""
              # The hash is of the TRIMMED value, so it matches a local hash even
              # if a stray newline was stored; the length gap reports that
              # separately, because a trailing newline alone breaks SigV4.
              print(
                  f"{name:22s} sha256={hashlib.sha256(v.encode()).hexdigest()[:16]} "
                  f"len={len(v)}"
                  + ("  [HAS SURROUNDING WHITESPACE]" if raw != v else "")
              )
              return v

          key = fp("R2_ACCESS_KEY_ID")
          secret = fp("R2_SECRET_ACCESS_KEY")
          account = fp("CLOUDFLARE_ACCOUNT_ID")
          if not (key and secret and account):
              sys.exit("\nnot all three are set in this scope — that alone is the bug.")

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{account}.r2.cloudflarestorage.com",
              aws_access_key_id=key,
              aws_secret_access_key=secret,
              region_name="auto",
              config=Config(
                  request_checksum_calculation="when_required",
                  response_checksum_validation="when_required",
              ),
          )

          bucket = os.environ.get("R2_BUCKET", "gaia-hub")
          probe_key = "agents/_diag/runner-probe.bin"
          body = b"x" * 1024

          print(f"\nPutObject -> r2://{bucket}/{probe_key}")
          try:
              client.put_object(
                  Bucket=bucket,
                  Key=probe_key,
                  Body=body,
                  ContentType="application/octet-stream",
                  ChecksumSHA256=__import__("base64")
                  .b64encode(hashlib.sha256(body).digest())
                  .decode(),
              )
          except ClientError as e:
              code = e.response.get("Error", {}).get("Code", "?")
              print(f"  FAILED ({code})\n")
              print(
                  "If the fingerprints above match your local ones, the values are\n"
                  "correct and the token is refusing this runner -- check the R2 API\n"
                  "token for Client IP Address Filtering, and for an expired TTL.\n"
                  "If they differ, this scope holds a stale secret; re-set it here."
              )
              sys.exit(1)

          print("  OK — this credential can write to R2 from a GitHub runner.")
          client.delete_object(Bucket=bucket, Key=probe_key)
          print("  probe object deleted")
          print(
              "\nThe credential is NOT the blocker. Re-run the publish workflow."
          )
          PY
