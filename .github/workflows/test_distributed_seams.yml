# Distributed-seams suite (V2-19 / #2180): the consolidated, deterministic
# contract guard for the daemon<->sidecar boundaries the Agent UI v2 introduces
# (relay vocabulary/crash coherence, the daemon->sidecar auth leg). Seams still
# in flight (broker #2151, custody #2153, secret-file #2149, migration #2155)
# self-skip with a named reason and flip to real assertions the moment their
# source lands — no edit to this job needed.
#
# Runs on Ubuntu: every assertion here is deterministic (no Lemonade, no
# hardware). The on-hardware golden path (UI -> daemon -> sidecar -> Lemonade)
# lives in tests/integration/eval/test_sidecar_eval_gaia.py and runs on the
# self-hosted strix-halo runner (see Agent Behavior E2E), not here.

name: Distributed Seams

on:
  push:
    branches: [ main ]
    paths:
      - 'src/gaia/daemon/**'
      - 'src/gaia/eval/sidecar_harness.py'
      - 'tests/integration/test_distributed_seams.py'
      - 'tests/unit/test_sidecar_harness.py'
      - '.github/workflows/test_distributed_seams.yml'
      - 'conftest.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'pyproject.toml'
      - 'src/gaia/agents/base/memory_store.py'
      - 'src/gaia/ui/__init__.py'
      - 'src/gaia/ui/database.py'
      - 'src/gaia/ui/sse_translation.py'
      - 'tests/integration/conftest.py'
      - 'tests/unit/conftest.py'
      # The harness contract suite: both agents behind the real daemon.
      - 'tests/integration/test_harness_surface_contract.py'
      - 'tests/integration/harness_contract/**'
      - 'installer/headless/fake_model_server.py'
      - 'util/fetch_ci_gaiacpp.py'
      - 'hub/agents/gaia/python/gaiapy/**'
      - 'src/gaia/print_mode.py'
      - 'src/gaia/llm/lemonade_*.py'
      - 'src/gaia/ui/sidecar/**'
      - 'src/gaia/ui/_chat_helpers.py'
      - 'src/gaia/ui/sse_handler.py'
      - 'src/gaia/ui/routers/chat.py'
      - 'src/gaia/ui/routers/system.py'
      - 'src/gaia/ui/routers/agent_programs.py'
      - 'src/gaia/ui/local_models.py'
      - 'src/gaia/version.py'
      - 'docs/cpp/gaia-agent.mdx'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/gaia/daemon/**'
      - 'src/gaia/eval/sidecar_harness.py'
      - 'tests/integration/test_distributed_seams.py'
      - 'tests/unit/test_sidecar_harness.py'
      - '.github/workflows/test_distributed_seams.yml'
      - 'conftest.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'pyproject.toml'
      - 'src/gaia/agents/base/memory_store.py'
      - 'src/gaia/ui/__init__.py'
      - 'src/gaia/ui/database.py'
      - 'src/gaia/ui/sse_translation.py'
      - 'tests/integration/conftest.py'
      - 'tests/unit/conftest.py'
      # The harness contract suite: both agents behind the real daemon.
      - 'tests/integration/test_harness_surface_contract.py'
      - 'tests/integration/harness_contract/**'
      - 'installer/headless/fake_model_server.py'
      - 'util/fetch_ci_gaiacpp.py'
      - 'hub/agents/gaia/python/gaiapy/**'
      - 'src/gaia/print_mode.py'
      - 'src/gaia/llm/lemonade_*.py'
      - 'src/gaia/ui/sidecar/**'
      - 'src/gaia/ui/_chat_helpers.py'
      - 'src/gaia/ui/sse_handler.py'
      - 'src/gaia/ui/routers/chat.py'
      - 'src/gaia/ui/routers/system.py'
      - 'src/gaia/ui/routers/agent_programs.py'
      - 'src/gaia/ui/local_models.py'
      - 'src/gaia/version.py'
      - 'docs/cpp/gaia-agent.mdx'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The contract suite fetches main's gaiacpp from build_agents.yml's artifacts.
  actions: read

jobs:
  distributed-seams:
    name: Distributed Seams (py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          # Core [api] carries fastapi/httpx (relay + harness).
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout \
                                  pyfakefs keyring httpx respx
          uv pip install --system -e ".[api]"

      - name: Run harness core unit tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Sidecar eval harness core (pure, no Lemonade) ==="
          python -m pytest tests/unit/test_sidecar_harness.py -v --tb=short

      - name: Run distributed-seams suite
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Distributed-seams contract suite (V2-19 / #2180) ==="
          echo "Covered now: relay vocabulary + synthetic-error coherence, auth leg 2."
          echo "Skipped-pending-merge: broker #2151, custody #2153, secret-file #2149, migration #2155."
          echo ""
          # -rs prints the skip reasons so the covered-vs-pending split is visible
          # in the job log. Target the file directly (all its tests carry the
          # distributed_seams marker) so the job never scans the whole tree.
          python -m pytest tests/integration/test_distributed_seams.py \
            -m distributed_seams -v -rs --tb=short

      # The seam itself, with nothing faked on GAIA's side: the real daemon
      # starts the real agents, which find GAIA's own model server from ~/.gaia.
      # gaiacpp is the one main's last green build_agents.yml run produced; a
      # pull request that changes cpp/ is judged on its own gaiacpp there, so
      # here it runs the Python agent alone.
      - name: Fetch main's gaiacpp
        id: gaiacpp
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=""
          if [ -n "${PR_NUMBER}" ]; then
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            # A push that changes cpp/ has no green gaiacpp of its own yet.
            changed="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq '.files[].filename')"
          fi
          if grep -q '^cpp/' <<< "${changed}"; then
            echo "This change touches cpp/: build_agents.yml runs the suite on the gaiacpp it builds."
            echo "harnesses=gaiapy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          binary="$(python util/fetch_ci_gaiacpp.py --out "$RUNNER_TEMP/gaiacpp")"
          echo "binary=${binary}" >> "$GITHUB_OUTPUT"
          echo "harnesses=gaiapy,gaiacpp" >> "$GITHUB_OUTPUT"

      - name: Run harness contract suite
        timeout-minutes: 12
        env:
          GAIA_MEMORY_DISABLED: "1"
          GAIA_TEST_GAIACPP: ${{ steps.gaiacpp.outputs.binary }}
          GAIA_TEST_HARNESSES: ${{ steps.gaiacpp.outputs.harnesses }}
        run: |
          uv pip install --system --quiet -e ".[ui]"
          python -m pytest tests/integration/test_harness_surface_contract.py -q --timeout=300
