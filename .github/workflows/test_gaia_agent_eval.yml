# Judged eval for the FLAGSHIP gaia agent — on demand (full), and as a
# report-only run via workflow_call from the gaia agent release (agent-pkg-gaia-*
# tags), whose publish job does not wait on it.
# Not on PRs: evals run only on releases. Every core release and RC tag runs
# these categories in eval_flagship.yml's gaia-* lanes, in parallel; that is why
# this serial run is not also triggered on v* tags.
#
# Drives `gaia eval agent --agent-type gaia` over the committed scenario corpus
# (eval/scenarios/gaia_*, 16 categories, ~240 scenarios) against the Agent UI
# backend + a real Lemonade Server, scored by the Claude judge on planted-fact
# ground truth (fixtures under tests/fixtures/gaia/ — every external surface is
# canned: fake gh shim, local web/RSS pages, fixture skill hub; nothing live).
#
# SINGLE SOURCE. The gate bars + the single on/off switch live in the committed
# manifests, read here only through the gate-reader scripts (no thresholds in
# this YAML):
#   - tests/fixtures/gaia/quality_gate_thresholds.json  (judged_pass_rate / avg_score)
#   - tests/fixtures/gaia/perf_gate_thresholds.json     (tokens / cache / latency / calls)
# QUALITY SHIPS `enforce: true` on deliberately loose absolute floors, so a
# breached quality bar fails the build. PERF SHIPS `enforce: false` until the
# first committed runner baseline gives its bars a measured basis. Read each
# manifest rather than assuming a shared mode — they differ on purpose.
# What still fails the build on every trigger, whatever the mode, is
# the class of things that mean the eval could not prove anything: a missing
# ANTHROPIC_API_KEY, zero judged scenarios, a scenario with no measurement
# (infra_error / timeout / budget_exceeded / errored / skipped), or a harness
# crash (CLAUDE.md fail-loudly — report mode softens "measured and worse",
# never "didn't measure").
#
# REGRESSION GATE. Committed per-category baselines are expected under
# $BASELINE_DIR (tests/fixtures/eval_baselines/gaia-gemma-4-e4b). NONE EXIST
# YET — they are captured by the first full `workflow_dispatch` on this runner
# (the dev boxes must never start Lemonade). Until then the compare step prints
# a loud "first adoption — no baseline" notice per category and skips the diff;
# once a baseline is committed, `gaia eval agent --compare` exit 2 surfaces as
# a ::warning:: in report mode and fails the build under `enforce: true` (the
# dispatch input).
#
# MEMORY IS ON — a deliberate deviation from every other eval workflow (they
# set GAIA_MEMORY_DISABLED=1). Persistent memory is core to the flagship
# (gaia_memory is a whole category), and the switch is backend-global, so the
# whole run keeps it on; per-scenario isolation comes from the corpus'
# memory_clear(scope=all) convention via the admin tools (GAIA_MEMORY_ADMIN=1).
# Consequence: the RAG/memory embedder must actually serve on this runner —
# the embeddings preflight below fails in seconds when it cannot (the email
# refresh disabled memory for exactly that failure; here it would silently
# hollow out gaia_memory instead, which is worse).
#
# TWO TAGS ARE ALWAYS EXCLUDED on this runner:
#   - `live`: real-service canaries stay off CI until the starter skills are
#     published to the real hub (eval plan phase 5) — a red weekly caused by
#     unpublished skills would be harness noise, not signal.
#   - `local_blocked_win_shim`: the fake-gh fixture is a .cmd shim, and the
#     hardened argv path (shell=False) cannot resolve .cmd on Windows
#     (CreateProcess ignores PATHEXT). This pool is Windows, so those
#     scenarios cannot produce a measurement here; they need a Linux eval
#     runner (tracked in the validation report, finding #4). Excluding them
#     is what keeps the unconditional integrity gate meaningful for the rest.
#
# Self-hosted: needs a running Lemonade Server on AMD hardware + the Agent UI
# backend, so it runs on the ephemeral devlab-dispatch Strix Halo pool. THIS
# POOL IS WINDOWS: every inline `run:` is PowerShell 5.1 (see the shell
# default) — do not reintroduce bash (test_eval_agent_gemma_consolidation.yml
# documents the scar). Each job gets a fresh machine with its own Lemonade, so
# it must NOT join the `lemonade-eval` slot: that group serialises by name
# across machines and belongs to the persistent pool (see eval_flagship.yml).

name: GAIA Agent Eval (judged scenarios, report mode)

on:
  # Manual trigger — the FULL run (all 16 categories, all tiers). This is also
  # how the first Gemma baselines get captured on the runner.
  workflow_dispatch:
    inputs:
      categories:
        description: 'Comma-separated gaia_* categories to run (default: all 16)'
        required: false
        default: ''
      enforce:
        description: 'Fail the build on a baseline regression (false = ::warning:: only)'
        required: false
        type: boolean
        default: false
      eval_model:
        description: 'Driver + judge model for the eval harness. Blank = the model the flagship baseline was captured under (tests/fixtures/eval_baselines/gaia-flagship/meta.json)'
        required: false
        default: ''
      iterations:
        description: 'Runs per scenario. >1 exposes flaky vs stable-fail, which n=1 cannot. Cost and wall clock scale linearly with N.'
        required: false
        default: '3'
  # Reusable: called by release_agent_gaia.yml so the release runs the same
  # eval definition.
  workflow_call:
    inputs:
      categories:
        description: 'Comma-separated gaia_* categories to run (default: all 16)'
        required: false
        type: string
        default: ''
      iterations:
        description: 'Runs per scenario (cost and wall clock scale linearly with N)'
        required: false
        type: string
        default: '1'
      eval_model:
        description: 'Driver + judge model for the eval harness. Blank = the model the flagship baseline was captured under (tests/fixtures/eval_baselines/gaia-flagship/meta.json)'
        required: false
        type: string
        default: ''
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'Claude Code subscription token (primary account); preferred over ANTHROPIC_API_KEY, as in eval_flagship.yml.'
        required: false
      CLAUDE_CODE_OAUTH_TOKEN_SECONDARY:
        description: 'Secondary account token, used when vars.CLAUDE_ACCOUNT is secondary.'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Judge/driver credential — REQUIRED; absent → the preflight fails the run before any eval spend, never a skip. (Declared optional only so `secrets: inherit` call sites need not name it.)'
        required: false

concurrency:
  # PER-INVOCATION SUPERSEDING — NOT a serial slot (see the header).
  #
  # Non-PR key is `github.run_id` on purpose, NOT `github.ref`: a called
  # reusable workflow's `concurrency` is evaluated in the CALLER's context
  # (the weekly_eval.yml phantom-job scar), so run_id makes each
  # release/dispatch run the sole member of its own group. The PR key
  # is the PR number so successive pushes to the SAME PR supersede each other.
  group: gaia-agent-eval-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `inputs.*` (not github.event.inputs.*) so values propagate for BOTH
  # workflow_dispatch AND workflow_call.
  # gaia_email is not in this serial default (its budget is unsized here);
  # eval_flagship.yml's gaia-email lane measures it. Name it to include it.
  EVAL_CATEGORIES: ${{ inputs.categories || 'gaia_core,gaia_shell,gaia_tool_selection,gaia_honesty,gaia_web,gaia_files,gaia_data,gaia_code,gaia_rag,gaia_memory,gaia_skills_lifecycle,gaia_skills_tasks,gaia_skills_capture,gaia_mcp,gaia_git,gaia_resilience' }}
  # PINNED TO THE BASELINE'S JUDGE — `--model` drives every scenario as well
  # as scoring it (runner.py passes it to `claude -p`), so changing it
  # compares two different eval agents. Override per-run via the input.
  # The model itself is resolved per job from the baseline's meta.json.
  EVAL_MODEL_OVERRIDE: ${{ inputs.eval_model }}
  # Runs per scenario. A PR keeps 1 (cost); dispatch defaults to 3 so
  # `flaky` is distinguishable from `stable-fail` — n=1 cannot express it.
  # Cost and wall clock scale linearly with this number.
  EVAL_ITERATIONS: ${{ inputs.iterations || '1' }}
  # Only a dispatch can enforce; every other run reports.
  ENFORCE: ${{ github.event.inputs.enforce || 'false' }}
  BACKEND_URL: http://127.0.0.1:4200
  # The checkout is outside this runner's home, so without this every
  # `setup.index_documents` scenario 403s (#3585). Declares the corpus only.
  GAIA_DOCUMENT_ROOTS: ${{ github.workspace }}\eval\corpus
  BASELINE_DIR: tests/fixtures/eval_baselines/gaia-gemma-4-e4b
  # Fixture server port — the corpus hardcodes http://127.0.0.1:8765
  # (tests/fixtures/gaia/README.md; never 4001/4200/8141/13305).
  FIXTURE_PORT: '8765'
  # The fixture-hub lane of the same server (skill search/install scenarios).
  GAIA_HUB_URL: http://127.0.0.1:8765/fixture_hub
  # The SSRF guard correctly refuses loopback; this opt-in allowlists exactly
  # the fixture host so web scenarios can reach the canned pages. Production
  # posture unchanged — other private IPs stay blocked.
  GAIA_WEB_ALLOWED_HOSTS: '127.0.0.1'
  # gaia_email reads this offline fixture mailbox instead of a connected
  # account (src/gaia/agents/tools/_email/fixture.py); set for every run so a
  # dispatch that names the category finds it.
  GAIA_EVAL_MAILBOX: ${{ github.workspace }}/tests/fixtures/gaia/email/eval_inbox.mbox
  # MEMORY ON (deviation, see header): GAIA_MEMORY_DISABLED is deliberately
  # NOT set; the admin seed/clear tools are exposed for scenario isolation.
  GAIA_MEMORY_ADMIN: '1'
  # Unattended approval of confirmation-gated tools (file writes,
  # install_skill, CONFIRM-tier shell) — the designed switch for trusted
  # automated runs. Must be process env, not .env (#2210), which a job-level
  # env satisfies.
  GAIA_AUTO_APPROVE_TOOLS: '1'
  # Lets a scenario's setup.decline_commands script a user who says no
  # (gaia_resilience); inert for every scenario that does not set it.
  GAIA_EVAL_SCRIPTED_USER: '1'
  # Loopback services — bypass any runner proxy (Python side; PowerShell's
  # Invoke-RestMethod ignores NO_PROXY).
  NO_PROXY: 'localhost,127.0.0.1'
  # Bare host (no /api/v1): LemonadeClient normalizes the suffix itself.
  LEMONADE_BASE_URL: 'http://127.0.0.1:13305'
  # The eval prints box-drawing characters; the runner console is cp1252.
  PYTHONIOENCODING: 'utf-8'
  # Connector resolution blocks on the OS keyring in a headless runner.
  PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
  # The venv's interpreter and CLI by full path. A bare `python` resolves
  # through PATH, which a runner's own setup can put ahead of the venv.
  VENV_PY: ${{ github.workspace }}\.venv\Scripts\python.exe
  VENV_GAIA: ${{ github.workspace }}\.venv\Scripts\gaia.exe

jobs:
  gaia-eval:
    name: gaia_* judged categories vs committed baselines
    # Fork PRs and drafts never reach the lab pool; `ready_for_ci` is the
    # repo-wide escape hatch for a draft that does want CI; `skip-gaia-eval`
    # is the opt-OUT for a provably behavior-neutral gaia PR. Kept
    # flat-indented: an `if:` folded scalar must fold to a single line.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.draft == false ||
      contains(github.event.pull_request.labels.*.name, 'ready_for_ci')) &&
      !contains(github.event.pull_request.labels.*.name, 'skip-gaia-eval'))
    # `Windows` is load-bearing: every step is PowerShell + LemonadeServer.exe.
    runs-on: [self-hosted, Windows, devlab-dispatch, strix-halo]
    defaults:
      run:
        # Pinned to Windows PowerShell 5.1 — everything below is written to
        # its rules (no `&&`, $LASTEXITCODE care, Out-File encodings).
        shell: powershell
    # BUDGET DERIVATION — from the only measured numbers this pool has, not
    # guesses (the #2094 lesson: a hand-typed ceiling burned 100 dispatches).
    # No gaia category has run on this runner yet, so the basis is (a) the
    # consolidation run 30869194618 on this box: worst measured 15.5-23.1
    # min/scenario for judged multi-turn chat scenarios at Gemma-4-E4B, and
    # (b) the local Haiku validation: gaia scenarios average FEWER doc-indexing
    # turns than rag_quality but go up to 20 turns. Ceiling basis: 20
    # min/scenario.
    #   PR subset: ~14 scenarios (gaia_core t1_basic+t2_compound = 5,
    #     gaia_shell 4 of 6 after the win-shim exclusion, gaia_tool_selection
    #     5) x 20 -> 280 -> eval step 300
    #   FULL: ~95 scenarios (99 - 2 win_shim - 2 live) x 20 -> 1900 -> eval
    #     step 1980 (33h — self-hosted jobs may run up to 5 days; the serial
    #     slot cost is real and is why the full serial run is dispatch only)
    #   setup (venv + node + lemonade start with its own 15-min cap +
    #     embeddings preflight + fixture staging)                    -> 40
    #   collect + integrity + gates + compare + summary + upload     -> 20
    #   job: PR 300+40+20 = 360; full 1980+40+20 = 2040
    # These are CEILINGS, not expectations. The eval step carries its OWN
    # timeout so an overrun fails at a NAMED step with the collect/gate steps
    # still running on the partial results (a job-level timeout CANCELS and
    # skips every `!cancelled()` step — how run 30869194618 lost 124 min of
    # data). Re-tighten from the per-category [TIMING] lines once the first
    # full run lands; if the full run approaches the ceiling, shard categories
    # across two sequential jobs rather than raising it further.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 360 || 2040 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Claude model drives every scenario as well as judging it, so it must
      # be the one the committed flagship baseline was captured under: its
      # meta.json is the single source. A dispatch input overrides it.
      - name: Resolve the eval driver model
        run: |
          $model = $env:EVAL_MODEL_OVERRIDE
          if (-not $model) {
            $meta = 'tests/fixtures/eval_baselines/gaia-flagship/meta.json'
            $model = (Get-Content -Raw $meta | ConvertFrom-Json).eval_model
            if (-not $model) {
              Write-Host "::error title=No eval model::$meta has no eval_model, so this run cannot know which Claude model the baseline was captured under. | WHAT TO DO: restore eval_model in $meta, or dispatch with the eval_model input."
              exit 1
            }
          }
          "EVAL_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Eval driver and judge model: $model"

      # Fail-fast: without the judge/driver credential every scenario scores
      # as an infra error after hours on the runner. Die in 10 seconds
      # instead, on EVERY trigger (a run that cannot judge proves nothing).
      - name: Preflight — judge credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          ANTHROPIC_API_KEY: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLAUDE_CODE_OAUTH_TOKEN) -and [string]::IsNullOrWhiteSpace($env:ANTHROPIC_API_KEY)) {
            Write-Host '::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set. gaia eval agent drives + judges every scenario via claude -p, which needs the credential on this runner; without it the run could only produce an un-judged result. Add the ANTHROPIC_API_KEY repository secret, or pass secrets: inherit from the calling workflow.'
            exit 1
          }
          Write-Host "Judge credential present."

      - name: Setup Python Environment
        id: venv
        uses: ./.github/actions/setup-venv
        with:
          python-version: '3.12'
          # [dev]+[eval] for the harness + judge deps; [ui] for the Agent UI
          # backend the scenarios run against; [api] for the connectors layer.
          # The chat + gaia agents ship as standalone hub wheels and are NOT
          # pulled by the extras — install the LOCAL editable packages (this
          # branch's code) or session creation dies with ModuleNotFoundError.
          # Core gaia stays editable (-e .) so eval fixtures + thresholds
          # resolve in-repo.
          install-package: '-e .[dev,eval,ui,api,mcp] -e hub/agents/chat/python -e hub/agents/gaia/python'

      - name: Check the venv interpreter
        env:
          SETUP_VENV_PY: ${{ steps.venv.outputs.python-path }}
        run: |
          if ($env:SETUP_VENV_PY -ne $env:VENV_PY) {
            Write-Host "::error::setup-venv built '$env:SETUP_VENV_PY' but this workflow runs '$env:VENV_PY'. Point VENV_PY/VENV_GAIA in the workflow env at setup-venv's venv-name."
            exit 1
          }
          foreach ($exe in @($env:VENV_PY, $env:VENV_GAIA)) {
            if (-not (Test-Path $exe)) {
              Write-Host "::error::$exe is missing - the venv install did not complete. See the Setup Python Environment step."
              exit 1
            }
          }
          & $env:VENV_PY -c "import gaia, gaia_agent, gaia_agent_chat"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$env:VENV_PY cannot import gaia / gaia_agent / gaia_agent_chat - the editable installs in the Setup Python Environment step are broken."
            exit 1
          }
          $bare = (Get-Command python -ErrorAction SilentlyContinue).Source
          Write-Host "Venv interpreter: $env:VENV_PY"
          Write-Host "Bare 'python' on this runner: $(if ($bare) { $bare } else { 'none' })"

      # `gaia eval agent` shells out to `claude -p` to DRIVE each scenario;
      # its preflight hard-fails without the CLI on PATH.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code CLI (the eval's scenario driver)
        run: |
          npm install -g @anthropic-ai/claude-code
          if ($LASTEXITCODE -ne 0) { throw "Claude Code CLI install failed" }
          claude --version
          if ($LASTEXITCODE -ne 0) { throw "claude installed but not runnable on PATH" }

      - name: Install Lemonade Server
        uses: ./.github/actions/install-lemonade

      - name: Start Lemonade Server (version-matched, warmed)
        timeout-minutes: 15
        env:
          HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        run: |
          # Persistent Scheduled Task, reused if healthy; default -WarmModel is
          # Gemma-4-E4B-it-GGUF — the flagship's model under test.
          powershell -ExecutionPolicy Bypass -File installer\scripts\ensure-lemonade-running.ps1
          if ($LASTEXITCODE -ne 0) { throw "Lemonade server not ready" }

      # MEMORY IS ON, so the embedder is load-bearing for gaia_memory AND
      # gaia_rag/gaia_code — an embedder that cannot start turns those
      # categories into non-answers that read as a model regression (the
      # consolidation workflow's run 31051933420 spent 3.5h proving it).
      # tests/ci_lemonade_check.py is the shared probe: --register-embedding
      # repairs the one failure CI can repair (a stale registration), and the
      # --llamacpp-args flag loads it exactly the way gaia.rag.sdk does. On
      # failure, fail in seconds with a pointer — the deeper backend-cache
      # recovery lives in test_eval_agent_gemma_consolidation.yml; run it (or
      # its documented wipe) on the box rather than duplicating it here.
      - name: Preflight — embedder serves embeddings (memory-on run)
        run: |
          $ErrorActionPreference = "Continue"
          $global:LASTEXITCODE = 0
          $probe = @(& $env:VENV_PY -c "from gaia.llm.lemonade_client import DEFAULT_EMBEDDING_MODEL, MODELS; m = next(x for x in MODELS.values() if x.model_id == DEFAULT_EMBEDDING_MODEL); print(DEFAULT_EMBEDDING_MODEL); print(m.checkpoint); print(m.recipe)")
          if ($LASTEXITCODE -ne 0 -or $probe.Count -lt 3) {
            Write-Host "::error::Could not resolve the embedding model from the venv - the install is broken."
            exit 1
          }
          $embedOut = & $env:VENV_PY tests/ci_lemonade_check.py `
            --model $probe[-3] --checkpoint $probe[-2] --recipe $probe[-1] `
            --register-embedding --embeddings `
            --llamacpp-args "--ubatch-size 2048" 2>&1
          $embedCode = $LASTEXITCODE
          $embedOut | ForEach-Object { Write-Host "$_" }
          if ($embedCode -ne 0 -or -not ($embedOut -match '\[ci\] embeddings OK \(dim=')) {
            Write-Host "::error::The embedder $($probe[-3]) cannot serve embeddings on this runner. This eval runs MEMORY-ON, so gaia_memory / gaia_rag / gaia_code would silently collapse into non-answers - refusing to spend the slot measuring nothing. Recovery: the backend-cache wipe documented in test_eval_agent_gemma_consolidation.yml (its embeddings preflight); run it on the box, then re-run this workflow."
            exit 1
          }

      # Path-staging contract (tests/fixtures/gaia/README.md): scenario user
      # messages reference ~/gaia-eval/..., and the backend runs from there, so
      # that folder is a session's file scope. Skills: pre-seed the starter pack
      # into the agent's skills root (scenarios that USE skills), then build
      # + sign + trust the fixture hub with a per-run ephemeral key
      # (scenarios ABOUT the install loop).
      # Shared with eval_flagship.yml's gaia_* lanes, so both stage the same way.
      - name: Stage fixtures + skills + fixture hub
        run: |
          & $env:VENV_PY tests/fixtures/gaia/stage_eval_env.py --home "$env:USERPROFILE"
          if ($LASTEXITCODE -ne 0) { throw "Staging the gaia_* fixtures failed; the output above says which part." }

      - name: Run the gaia eval categories serially
        # Own timeout so an overrun fails HERE, by name, with the collect /
        # gate steps still running on the partial results. See the budget
        # derivation on the job.
        timeout-minutes: ${{ github.event_name == 'pull_request' && 300 || 1980 }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          # Blank when the OAuth token is set: the judge adds --bare only with a key.
          ANTHROPIC_API_KEY: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          # Deliberately NOT "Stop": the eval's stderr is piped through 2>&1
          # and under Stop the first stderr line becomes a terminating
          # NativeCommandError. Every failure is checked explicitly.
          $ErrorActionPreference = "Continue"
          $ProgressPreference = "SilentlyContinue"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force -Path eval-out | Out-Null

          function Test-Backend {
            try { Invoke-RestMethod -Uri "$env:BACKEND_URL/api/health" -TimeoutSec 5 | Out-Null; return $true }
            catch { return $false }
          }

          # A leftover backend from a cancelled run still holds :4200 on this
          # persistent runner; evaluating a stale checkout while reporting
          # green is worse than failing.
          if (Test-Backend) {
            Write-Host "::error::$env:BACKEND_URL is already serving - a stale GAIA backend is running on this runner. Kill it (gaia kill) and re-run; otherwise this eval measures the previous checkout."
            exit 1
          }

          # Children do not survive a step boundary, so the fixture server,
          # the backend, and every category run live in this ONE session.
          $fixtureLog = Join-Path $PWD "eval-out\fixtures.log"
          $fixture = Start-Process -FilePath $env:VENV_PY `
            -ArgumentList "tests/fixtures/gaia/serve_fixtures.py","--port","$env:FIXTURE_PORT" `
            -WorkingDirectory $PWD `
            -RedirectStandardOutput $fixtureLog `
            -RedirectStandardError (Join-Path $PWD "eval-out\fixtures.err.log") `
            -NoNewWindow -PassThru

          # The github-triage scenarios are written against the staged fake gh.
          # Without it first on PATH the agent runs the runner's real gh, and
          # auto-approved writes are aimed at real GitHub.
          $env:PATH = (Join-Path $env:USERPROFILE ".gaia-eval-bin") + ";" + $env:PATH

          $outLog = Join-Path $PWD "eval-out\backend.out.log"
          $errLog = Join-Path $PWD "eval-out\backend.err.log"
          $backend = Start-Process -FilePath $env:VENV_PY `
            -ArgumentList "-m","gaia.ui.server","--port","4200","--host","127.0.0.1" `
            -WorkingDirectory (Join-Path $env:USERPROFILE "gaia-eval") `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError $errLog `
            -NoNewWindow -PassThru
          if (-not $backend -or -not $fixture) {
            Write-Host "::error::Could not start gaia.ui.server / serve_fixtures.py - the venv install is broken."
            exit 1
          }

          try {
            Write-Host "Waiting ~10 min for the GAIA UI backend on $env:BACKEND_URL (pid $($backend.Id))..."
            $ready = $false
            foreach ($attempt in 1..120) {
              if ($backend.HasExited) {
                Write-Host "::error::gaia.ui.server exited during startup (exit $($backend.ExitCode)). Backend log follows."
                Get-Content $outLog, $errLog -ErrorAction SilentlyContinue
                exit 1
              }
              if (Test-Backend) { $ready = $true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $ready) {
              Write-Host "::error::GAIA UI backend did not become healthy at $env:BACKEND_URL/api/health in time. Backend log follows."
              Get-Content $outLog, $errLog -ErrorAction SilentlyContinue
              exit 1
            }
            try {
              Invoke-RestMethod -Uri "http://127.0.0.1:$env:FIXTURE_PORT/atlas.html" -TimeoutSec 10 | Out-Null
            } catch {
              Write-Host "::error::Fixture server not serving on port $env:FIXTURE_PORT - see eval-out\fixtures*.log. The web/skill scenarios depend on it."
              exit 1
            }
            Write-Host "Backend + fixture server healthy."

            # The Agent UI's own memory switch defaults OFF, and with it off every
            # `remember` returns "skipped". The runner's preflight refuses to start
            # a memory scenario while it is off.
            try {
              $memory = Invoke-RestMethod -Method Put -Uri "$env:BACKEND_URL/api/memory/settings" `
                -Headers @{ "X-Gaia-UI" = "1" } -ContentType "application/json" `
                -Body '{"memory_enabled": true}' -TimeoutSec 30 -ErrorAction Stop
            } catch {
              Write-Host "::error::PUT $env:BACKEND_URL/api/memory/settings failed: $($_.Exception.Message). Memory scenarios cannot run with memory off."
              exit 1
            }
            if ($memory.memory_enabled -ne $true) {
              Write-Host "::error::The backend did not switch memory on (settings: $($memory | ConvertTo-Json -Compress))."
              exit 1
            }

            # Per-category wall clock, appended to the step summary the moment
            # each category ends — this is what replaces the guessed ceiling
            # with a measurement (BOM-free: PS5.1 Out-File would prepend one).
            $summaryEnc = New-Object System.Text.UTF8Encoding($false)
            function Add-Summary($line) {
              if ($env:GITHUB_STEP_SUMMARY) {
                [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$line`r`n", $summaryEnc)
              }
            }
            $swTotal = [Diagnostics.Stopwatch]::StartNew()
            Add-Summary "## Gaia eval wall clock"
            Add-Summary ""
            Add-Summary "| category | minutes |"
            Add-Summary "| --- | ---: |"

            # PR subset: tier-filtered cheap categories. Everything else: the
            # category list from the dispatch/call input (default all 16).
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              $runs = @(
                @{ cat = 'gaia_core';           extra = @('--tag','t1_basic','--tag','t2_compound') },
                @{ cat = 'gaia_shell';          extra = @('--tag','t1_basic','--tag','t2_compound','--tag','security') },
                @{ cat = 'gaia_tool_selection'; extra = @('--tag','t1_basic','--tag','t2_compound') }
              )
            } else {
              $runs = @($env:EVAL_CATEGORIES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ } | ForEach-Object { @{ cat = $_; extra = @() } })
            }

            # Serial by construction (CLAUDE.md: at most one gaia eval agent).
            # `gaia eval agent --category X` exits 0 whatever the scenarios
            # score; non-zero here is a harness crash, never a regression.
            foreach ($run in $runs) {
              $category = $run.cat
              Write-Host "=================================================================="
              Write-Host "  gaia eval agent --agent-type gaia --category $category"
              Write-Host "=================================================================="
              $swCat = [Diagnostics.Stopwatch]::StartNew()
              # The acme MCP stub exists only for gaia_mcp; staged for any other
              # category it would widen that category's toolset. Each session
              # builds a fresh agent, so staging mid-run takes effect.
              $stub = 'tests/fixtures/gaia/mcp_stub/stage_mcp_stub.py'
              if ($category -eq 'gaia_mcp') {
                & $env:VENV_PY $stub install
                if ($LASTEXITCODE -ne 0) { Write-Host "::error::stage_mcp_stub install failed"; exit 1 }
              }
              $global:LASTEXITCODE = 0
              $evalArgs = @('eval','agent','--agent-type','gaia','--category',$category,
                            '--backend',"$env:BACKEND_URL",'--model',"$env:EVAL_MODEL",
                            '--budget','5.00','--iterations',"$env:EVAL_ITERATIONS",
                            '--exclude-tag','live','--exclude-tag','local_blocked_win_shim') + $run.extra
              & $env:VENV_GAIA @evalArgs 2>&1 |
                ForEach-Object { Write-Host "$_"; "$_" } |
                Out-File -FilePath "eval-out\$category.log" -Encoding utf8
              $code = $LASTEXITCODE
              $swCat.Stop()
              if ($category -eq 'gaia_mcp') {
                & $env:VENV_PY $stub remove
                if ($LASTEXITCODE -ne 0) { Write-Host "::error::stage_mcp_stub remove failed"; exit 1 }
              }

              $mins = [math]::Round($swCat.Elapsed.TotalMinutes, 1)
              Write-Host "[TIMING] ${category}: $mins min (running total $([math]::Round($swTotal.Elapsed.TotalMinutes, 1)) min)"
              Add-Summary "| ``$category`` | $mins |"

              if ($code -ne 0) {
                # Never `exit $LASTEXITCODE` - on a launch failure it can be
                # $null, which PowerShell turns into exit 0.
                Write-Host "::error::gaia eval agent --category $category crashed with exit $code (a harness failure, not a regression verdict)."
                exit 1
              }
            }

            $swTotal.Stop()
            Add-Summary "| **total** | **$([math]::Round($swTotal.Elapsed.TotalMinutes, 1))** |"
          }
          finally {
            # Persistent runner: never leave the stub registered for the next job.
            & $env:VENV_PY tests/fixtures/gaia/mcp_stub/stage_mcp_stub.py remove
            foreach ($proc in @($backend, $fixture)) {
              if ($proc -and -not $proc.HasExited) {
                Write-Host "Stopping pid $($proc.Id)..."
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }

      - name: Collect scorecards from the printed run directories
        # Not always(): on a concurrency cancel this would pile misleading
        # "missing scorecard" errors on the cancellation. An eval STEP timeout
        # fails rather than cancels, so this still names what went unmeasured.
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = "Stop"
          $missing = $false
          $cats = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            @('gaia_core','gaia_shell','gaia_tool_selection')
          } else {
            @($env:EVAL_CATEGORIES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          }
          foreach ($category in $cats) {
            $log = "eval-out\$category.log"
            if (-not (Test-Path $log)) {
              Write-Host "::error::No log for $category - the chain stopped before it ran."
              $missing = $true
              continue
            }
            # The runner prints an ABSOLUTE `Output: <run-dir>` line. Take the
            # last match; never glob by mtime (a fresh clone stamps every file
            # with checkout time).
            $hit = Select-String -Path $log -Encoding UTF8 -Pattern '^Output:\s*(.+?)\s*$' | Select-Object -Last 1
            $runDir = if ($hit) { $hit.Matches[0].Groups[1].Value } else { $null }
            $scorecard = if ($runDir) { Join-Path $runDir "scorecard.json" } else { $null }
            if (-not $runDir -or -not (Test-Path $scorecard)) {
              Write-Host "::error::Could not resolve a scorecard for $category - see eval-out\$category.log."
              $missing = $true
              continue
            }
            New-Item -ItemType Directory -Force -Path "eval-out\$category" | Out-Null
            Copy-Item $scorecard "eval-out\$category\scorecard.json"
            $traces = Join-Path $runDir "traces"
            if (Test-Path $traces) {
              try { Copy-Item $traces "eval-out\$category\traces" -Recurse }
              catch { Write-Host "::warning::${category}: could not copy traces ($($_.Exception.Message))." }
            }
            Write-Host "${category}: $runDir"
          }
          if ($missing) { exit 1 }

      - name: Integrity gate — did we actually measure? (ignores `enforce`)
        if: ${{ !cancelled() }}
        run: |
          $ErrorActionPreference = "Stop"
          # UNCONDITIONAL: `enforce` decides whether a WORSE result blocks; it
          # must never decide whether a NON-EXISTENT result blocks. Statuses
          # that mean "no measurement was produced" (FAIL is a legitimate,
          # comparable outcome; `skipped` = corpus file absent from disk).
          $noMeasurement = @("infra_error", "errored", "timeout", "blocked", "budget_exceeded", "skipped")
          $problems = @()
          $cards = @(Get-ChildItem -Path eval-out -Recurse -Filter scorecard.json)
          if ($cards.Count -eq 0) {
            Write-Host "::error::Integrity: no scorecards collected at all."
            exit 1
          }
          foreach ($file in $cards) {
            $category = $file.Directory.Name
            $card = Get-Content $file.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
            $judged = [int]$card.summary.passed + [int]$card.summary.failed + [int]$card.summary.blocked
            if ($judged -le 0) {
              $problems += "${category}: zero judged scenarios"
            }
            $unmeasured = @()
            foreach ($status in $noMeasurement) {
              $count = $card.summary.$status
              if ($count) { $unmeasured += "${status}=$count" }
            }
            if ($unmeasured.Count -gt 0) {
              $problems += "${category}: scenarios without a measurement: $($unmeasured -join ', ')"
            }
            Write-Host "${category}: judged=$judged unmeasured=$(if ($unmeasured) { $unmeasured -join ', ' } else { 'none' })"
          }
          if ($problems.Count -gt 0) {
            foreach ($p in $problems) { Write-Host "::error::Integrity: $p" }
            Write-Host "Report mode softens a WORSE score, never a MISSING one. Check the backend/fixture logs in the artifact, then re-run."
            exit 1
          }
          Write-Host "Integrity OK - every collected category was fully measured."

      # Gate-readers: read the bars ONLY through the committed manifests under
      # tests/fixtures/gaia/ (single source), write eval-out/*_gate_report.json,
      # exit non-zero ONLY on should_fail (enforce:true AND breached) or
      # nothing-measured.
      - name: Quality gate (report mode — reads the thresholds manifest)
        if: ${{ !cancelled() }}
        run: |
          & $env:VENV_PY hub/agents/gaia/python/packaging/eval_quality_report.py
          if ($LASTEXITCODE -ne 0) { throw "quality gate report failed" }

      - name: Perf gate (report mode — reads the thresholds manifest)
        if: ${{ !cancelled() }}
        run: |
          & $env:VENV_PY hub/agents/gaia/python/packaging/eval_perf_report.py
          if ($LASTEXITCODE -ne 0) { throw "perf gate report failed" }

      - name: Compare each category against its committed Gemma baseline
        if: ${{ !cancelled() }}
        run: |
          $regressed = @()
          $failedCompare = $false
          foreach ($file in @(Get-ChildItem -Path eval-out -Recurse -Filter scorecard.json)) {
            $category = $file.Directory.Name
            $baseline = Join-Path $env:BASELINE_DIR "scorecard_$category.json"
            if (-not (Test-Path $baseline)) {
              # No baselines exist until the first full workflow_dispatch on
              # this runner commits them (dev boxes must never start
              # Lemonade). Loud, per-category, never silent.
              Write-Host "::notice::${category}: no committed baseline at $baseline - first adoption, comparison skipped. Capture baselines via a full workflow_dispatch run (--save-baseline) and commit them."
              continue
            }
            Write-Host "=================================================================="
            Write-Host "  ${category}: $baseline  ->  $($file.FullName)"
            Write-Host "=================================================================="
            # `--compare` exits 2 on status/score/time regressions, 0 otherwise.
            $global:LASTEXITCODE = 0
            & $env:VENV_GAIA eval agent --compare "$baseline" "$($file.FullName)"
            switch ($LASTEXITCODE) {
              0 { Write-Host "${category}: no regression vs baseline." }
              2 {
                Write-Host "::warning::${category}: regression detected vs $baseline (see the diff above)."
                $regressed += $category
              }
              default {
                Write-Host "::error::${category}: compare failed with exit $LASTEXITCODE (a harness/IO error, not a regression verdict)."
                $failedCompare = $true
              }
            }
          }
          Write-Host ""
          Write-Host "SUMMARY - enforce=$env:ENFORCE; regressed: $(if ($regressed) { $regressed -join ' ' } else { 'none' })"
          if ($failedCompare) {
            Write-Host "::error::One or more comparisons could not be performed. Failing regardless of enforce."
            exit 1
          }
          if ($regressed.Count -gt 0 -and $env:ENFORCE -eq "true") {
            Write-Host "::error::Regressions in: $($regressed -join ' '). enforce=true - failing the build. Fix the prompt/tooling, or regenerate the baseline with --save-baseline and call it out in the PR."
            exit 1
          }
          # GitHub appends an exit-$LASTEXITCODE trailer to PowerShell steps;
          # without this a report-mode regression in the LAST category would
          # fail the build anyway.
          $global:LASTEXITCODE = 0

      # The reporting half: on a manifest that ships enforce:false a breached
      # bar is a GREEN step whose number lives only in the artifact, which
      # nobody opens. eval_summary.py republishes every verdict into
      # the job summary, one ::warning:: per breach. `if: always()` so "no
      # gate report was produced" is stated out loud even when an earlier
      # step died.
      # One tidy sheet per run: config repeated on every row so several runs
      # concatenate into one spreadsheet and pivot as a time series. Unmeasured
      # metrics write an empty cell, never 0.
      - name: Export results to CSV
        if: always()
        run: |
          Get-ChildItem -Path eval-out -Directory | ForEach-Object {
            if (Test-Path (Join-Path $_.FullName 'scorecard.json')) {
              & $env:VENV_PY hub/agents/gaia/python/packaging/eval_csv_export.py `
                --run-dir $_.FullName --output-dir eval-out
            }
          }

      - name: Gate verdicts (job summary)
        if: always()
        run: |
          & $env:VENV_PY hub/agents/gaia/python/packaging/eval_summary.py eval-out
          if ($LASTEXITCODE -ne 0) { throw "eval summary failed" }

      - name: Upload scorecards + eval logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gaia-agent-eval
          path: eval-out/
          if-no-files-found: warn
