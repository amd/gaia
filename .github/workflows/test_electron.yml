name: Test Electron Framework and Apps

on:
  workflow_call:
  push:
    branches: ["main"]
    paths:
      - 'src/gaia/apps/webui/**'
      - 'tests/electron/**'
      - '.github/workflows/test_electron.yml'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - 'src/gaia/apps/webui/**'
      - 'tests/electron/**'
      - '.github/workflows/test_electron.yml'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  test-electron-framework:
    name: Test Electron Framework
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/electron/package.json

      - name: Install test dependencies
        working-directory: tests/electron
        run: |
          npm ci

      - name: Run Electron framework unit tests
        working-directory: tests/electron
        run: |
          npm test

      # node:test files (`.mjs`) for modules that don't fit Jest's CJS
      # mocking model — port-manager and the index-query helper. Keep
      # them here so the `services/*.cjs` extraction pattern stays
      # CI-gated; without this step they would silently never run.
      - name: Run node:test suites (services helpers)
        run: |
          node --test \
            tests/electron/test_port_manager.mjs \
            tests/electron/test_loadapp_query.mjs

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: electron-framework-coverage
          path: tests/electron/coverage/
          retention-days: 7

  test-webui-vitest:
    name: Test Agent UI Components (Vitest)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      # Deliberately above the Agent UI's `engines.node` build floor: this job
      # runs the *test* toolchain, and jsdom 30 (#2750) pulls undici 8, which
      # needs Node >= 22.19 for worker_threads `markAsUncloneable`. On Node 20
      # every Vitest worker dies at import with "webidl.util.markAsUncloneable
      # is not a function" and the suite silently reports zero tests. Don't
      # lower this to match `engines.node` — that floor covers building the
      # app, which has no jsdom.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/gaia/apps/webui/package-lock.json

      - name: Install dependencies
        working-directory: src/gaia/apps/webui
        run: |
          npm ci

      # Also runs src/types/apiContract.ts, the hand-written vs generated API type drift guard.
      - name: Type-check
        working-directory: src/gaia/apps/webui
        run: |
          npx tsc --noEmit

      - name: Run Vitest component tests
        working-directory: src/gaia/apps/webui
        run: |
          npm test

      - name: Check right-to-left layout
        working-directory: src/gaia/apps/webui
        run: |
          npx playwright install --with-deps chromium
          npm run test:rtl

      - name: Check auto-scroll in a real browser
        working-directory: src/gaia/apps/webui
        run: |
          npm run test:scroll

  test-apps-integration:
    name: Test Apps Integration
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/electron/package.json

      - name: Install test dependencies
        working-directory: tests/electron
        run: |
          npm ci

      - name: Run Agent UI tests
        working-directory: tests/electron
        run: |
          # Agent UI service tests: process manager, notification service
          # --forceExit needed because AgentProcessManager health-check intervals
          # survive Jest teardown in mocked environments (tests pass correctly)
          npm test -- test_agent_process_manager.js test_notification_service.js --forceExit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apps-integration-test-results
          path: tests/electron/coverage/
          retention-days: 7

  # A mocked process cannot show Electron replacing Node's SIGTERM handler (#6579).
  test-sigterm-quit:
    name: SIGTERM quits the real Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/gaia/apps/webui/package-lock.json

      - name: Install the Agent UI's Electron
        working-directory: src/gaia/apps/webui
        run: npm ci

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: SIGTERM quits without the quit question
        run: |
          if [ "${RUNNER_OS}" = Linux ]; then
            xvfb-run -a node --test tests/electron/sigterm-electron.test.mjs
          else
            node --test tests/electron/sigterm-electron.test.mjs
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [test-electron-framework, test-webui-vitest, test-apps-integration, test-sigterm-quit]

    steps:
      - name: Check test results
        run: |
          echo "=========================================="
          echo "        ELECTRON TEST RESULTS            "
          echo "=========================================="
          echo ""
          echo "Test Electron Framework: ${{ needs.test-electron-framework.result }}"
          echo "Test Agent UI Vitest: ${{ needs.test-webui-vitest.result }}"
          echo "Test Apps Integration: ${{ needs.test-apps-integration.result }}"
          echo "SIGTERM quits the real Electron: ${{ needs.test-sigterm-quit.result }}"
          echo ""

          FAILED=false

          if [[ "${{ needs.test-electron-framework.result }}" == "failure" ]]; then
            echo "❌ FAILED: Electron Framework tests"
            FAILED=true
          fi

          if [[ "${{ needs.test-webui-vitest.result }}" == "failure" ]]; then
            echo "❌ FAILED: Agent UI Vitest component tests"
            FAILED=true
          fi

          if [[ "${{ needs.test-apps-integration.result }}" == "failure" ]]; then
            echo "❌ FAILED: Apps Integration tests"
            FAILED=true
          fi

          if [[ "${{ needs.test-sigterm-quit.result }}" == "failure" ]]; then
            echo "❌ FAILED: SIGTERM did not quit the Agent UI's Electron"
            FAILED=true
          fi

          echo ""
          if [[ "$FAILED" == "true" ]]; then
            echo "=========================================="
            echo "  ❌ SOME ELECTRON TESTS FAILED          "
            echo "=========================================="
            echo ""
            echo "If this is a Dependabot PR, the dependency update"
            echo "may have introduced breaking changes."
            exit 1
          else
            echo "=========================================="
            echo "  ✅ ALL ELECTRON TESTS PASSED           "
            echo "=========================================="
          fi
