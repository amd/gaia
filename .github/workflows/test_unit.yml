# Fast unit tests that don't require Lemonade server or external dependencies
# These tests run first to provide quick feedback on core SDK components
# Platform: Linux, macOS and Windows all run the full unit suite, and a
# failure on any of them fails the run.

name: Unit Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      # Tested here, but outside src/: the PE-resource gate and the installer
      # filename table.
      - 'util/check_pe_resources.py'
      # The wholesale-skip guard and the allowlist it reads.
      - 'util/check_module_skips.py'
      - 'util/check_test_lane_coverage.py'
      - 'util/test_lane_allowlist.yml'
      - 'installer/tui/**'
      # tests/integration/test_tui_control_e2e.py builds and drives the real Go
      # TUI, so a TUI-only change has to run the offline-integration job.
      - 'tui/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/test_unit.yml'
      # tests/unit/test_doc_examples_runnable.py execs this guide's own code
      # blocks, so a docs-only change can still break the guard.
      - 'docs/guides/custom-agent.mdx'
      # tests/unit/test_docs_json_release.py pins the navbar label and the
      # Releases nav to src/gaia/version.py, so a docs-only change can break
      # it too — and that is the exact drift that made v0.23.1 untaggable.
      - 'docs/docs.json'
      - 'docs/releases/**'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'tests/**'
      # Tested here, but outside src/: the PE-resource gate and the installer
      # filename table.
      - 'util/check_pe_resources.py'
      # The wholesale-skip guard and the allowlist it reads.
      - 'util/check_module_skips.py'
      - 'util/check_test_lane_coverage.py'
      - 'util/test_lane_allowlist.yml'
      - 'installer/tui/**'
      # tests/integration/test_tui_control_e2e.py builds and drives the real Go
      # TUI, so a TUI-only change has to run the offline-integration job.
      - 'tui/**'
      - 'setup.py'
      - 'pyproject.toml'
      - '.github/workflows/test_unit.yml'
      # tests/unit/test_doc_examples_runnable.py execs this guide's own code
      # blocks, so a docs-only change can still break the guard.
      - 'docs/guides/custom-agent.mdx'
      # tests/unit/test_docs_json_release.py pins the navbar label and the
      # Releases nav to src/gaia/version.py, so a docs-only change can break
      # it too — and that is the exact drift that made v0.23.1 untaggable.
      - 'docs/docs.json'
      - 'docs/releases/**'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (Linux, py3.12)
    runs-on: ubuntu-latest
    # Grown past the old 30-min budget from normal test-suite growth (was 26min
    # on 2026-09-26, timing out consistently by 2026-09-29) — not a hang.
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          # pyfakefs is required by tests/unit/installer/test_uninstall_command.py
          # which uses the `fs` fixture to build a fake filesystem for testing
          # tiered uninstall logic cross-platform without touching the real FS.
          # pytest-mock is required by the browser/filesystem tool tests.
          # keyring + httpx + respx are required by tests/unit/connections/
          # (issue #915). The in-memory keyring backend in tests/conftest.py
          # avoids the SecretService daemon prerequisite on Linux runners.
          # matplotlib is required by tests/unit/test_perf_analysis.py, which
          # exercises the perf-vis plotting functions headlessly (Agg backend).
          # It stays out of the runtime extras on purpose — gaia.perf_analysis
          # imports it lazily and errors loudly when it is missing.
          # pymupdf (fitz) is required by tests/unit/test_structured_vlm_extraction.py:
          # the PDF branch of StructuredExtractor.extract() does `import fitz`, and
          # mocker.patch("fitz.open") can only resolve that target if the module
          # exists. It ships in the [ui]/[rag] extras, which this job does not install.
          # cvss is required by tests/unit/test_cvss4.py and test_findings_to_sarif.py
          # (the security-audit scorer); it lives in the [dev] extra, not [api].
          # responses is required by tests/unit/test_lemonade_error_classification.py
          # — same story as cvss: declared in [dev], and this job installs [api].
          # faiss-cpu + pypdf are required by tests/unit/test_doc_examples_runnable.py:
          # it execs the custom-agent guide's own RAG example, which constructs a
          # real RAGSDK — RAGSDK._check_dependencies() raises ImportError without
          # them. They live only in the [rag]/[ui] extras, which this job (like the
          # RAG dependencies above) does not install.
          # playwright is required by tests/unit/agents/test_builder_template_host_wiring.py:
          # it walks KNOWN_TOOLS and asserts each one registers tools, and the
          # browser_use mixin registers nothing when Playwright is unimportable.
          # The wheel alone is enough — no `playwright install` browser download.
          # python-docx, python-pptx, reportlab and slack-sdk: tests/unit/rag/,
          # tests/unit/eval/test_pdf_document_generator.py and
          # tests/unit/messaging/test_slack_sdk_contract.py importorskip them at
          # module level, so without them those files skip wholesale (#4206).
          uv pip install --system pytest pytest-cov pytest-asyncio pytest-mock pytest-timeout \
                                  pyfakefs keyring httpx respx matplotlib pymupdf cvss responses \
                                  faiss-cpu pypdf playwright python-docx python-pptx reportlab slack-sdk
          uv pip install --system -e ".[api]"

      - name: Check no test file skips wholesale
        # A file that skips at collection runs none of its tests; each one must
        # be listed in util/test_lane_allowlist.yml with the lane that runs it.
        run: python util/check_module_skips.py --workflow test_unit.yml --job unit-tests

      - name: Validate packaging integrity
        run: |
          echo "=== Validating Packaging Integrity ==="
          echo "Checking setup.py packages, __init__.py files, and entry points"
          echo ""
          pytest tests/unit/test_packaging.py -v --tb=short
          echo "✅ Packaging integrity checks passed"

      - name: Test context override startup and reload contract
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          pytest tests/unit/test_context_size_resolution.py tests/unit/test_llamacpp_backend.py tests/unit/test_lemonade_client_ctx_override.py tests/unit/test_lemonade_model_loading.py tests/integration/test_context_override_reload.py -v --tb=short

      - name: Run unit tests
        env:
          # Skip memory init — Lemonade isn't available in this CI job; the
          # unit tests don't exercise memory functionality (memory has its
          # own dedicated tests with mocked embeddings).
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Running Unit Tests ==="
          echo "These are fast tests for core SDK components"
          echo ""
          pytest tests/unit/ -v --tb=short \
            --cov=src/gaia --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Run CLI tool-confirmation integration tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Running CLI Tool-Confirmation Integration Tests ==="
          echo "The subprocess probe exercises the real confirmation gate, including dynamic agents."
          echo ""
          pytest tests/integration/test_cli_tool_confirmation.py -v --tb=short --timeout=300

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Run DatabaseMixin integration tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Running DatabaseMixin Integration Tests ==="
          echo "Testing DatabaseMixin with Agent class"
          echo ""
          pytest tests/integration/test_database_mixin_integration.py -v --tb=short

      - name: Run DatabaseAgent integration tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Running DatabaseAgent Integration Tests ==="
          echo "Testing DatabaseAgent with auto-registered tools"
          echo ""
          pytest tests/integration/test_database_agent.py -v --tb=short

      - name: Run Lemonade release-asset resolution test
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Resolving Lemonade installer URLs against live upstream ==="
          echo "Catches an upstream asset rename before it 404s gaia init"
          echo ""
          pytest tests/integration/test_lemonade_release_assets.py -v --tb=short

      - name: Run live web-fetch TLS test
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Fetching CDN-fronted HTTPS hosts through WebClient ==="
          echo "The IP-pinning adapter can pass every unit test and still fail"
          echo "every real handshake; only a live TLS peer proves the SNI is"
          echo "acceptable. Skips itself when the runner has no network."
          echo ""
          pytest tests/integration/test_web_client_live_sni.py -v --tb=short --timeout=300

      - name: Run embedded Lemonade checksum pinning test
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Verifying embedded Lemonade SHA-256 pins against live upstream ==="
          echo "Catches a stale executable digest before embedded install reaches users"
          echo ""
          pytest tests/integration/test_lemonade_embeddable_assets.py -v --tb=short

      - name: Run daemon integration tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "=== Running Daemon Integration Tests ==="
          echo "Real python -m gaia.daemon lifecycle + sidecar supervision (#2142)"
          echo ""
          pytest tests/integration/test_daemon.py tests/integration/test_daemon_sidecars.py -v --tb=short

      - name: Unit test summary
        if: always()
        run: |
          echo ""
          echo "=== Test Coverage ==="
          echo "CLI Smoke Tests (pytest, auto-discovered):"
          echo "  - tests/unit/cli/test_cli_smoke.py: --help for every subcommand + console script"
          echo ""
          echo "Unit Tests:"
          echo "  - SDToolsMixin: Stable Diffusion image generation for agents"
          echo "  - DatabaseMixin: SQLite database access for agents"
          echo "  - FileWatcher: File system monitoring utilities"
          echo "  - Testing Utilities: MockLLMProvider, MockVLMClient, fixtures"
          echo "  - LLM Client: Language model client utilities"
          echo "  - ASR: Automatic speech recognition utilities"
          echo "  - TTS: Text-to-speech utilities"
          echo "  - InitCommand: gaia init profiles and installer logic"
          echo "  - FileSystemIndex: Persistent file index with FTS5 search"
          echo "  - FileSystemToolsMixin: browse_directory, tree, file_info, find_files, read_file, bookmark tools"
          echo "  - ScratchpadService: SQLite working memory for data analysis"
          echo "  - ScratchpadToolsMixin: create_table, insert_data, query_data, list_tables, drop_table tools"
          echo "  - BrowserTools: WebClient SSRF prevention, HTML extraction, downloads"
          echo "  - WebClient Edge Cases: parse_html fallback, extract_text, tables, links, download redirects"
          echo "  - Categorizer: auto_categorize, category map completeness, extension uniqueness"
          echo "  - ChatAgent Integration: filesystem, scratchpad, browser init/config/cleanup"
          echo "  - File Write Guardrails: blocked dirs, sensitive files, size limits, backup, audit"
          echo "  - Security Edge Cases: symlinks, audit logging, TOCTOU, prompt_overwrite"
          echo "  - Service Edge Cases: DB corruption rebuild, shared DB, row limits, transaction atomicity"
          echo ""
          echo "Integration Tests:"
          echo "  - DatabaseMixin + Agent: Full agent lifecycle with database"
          echo "  - DatabaseAgent: Auto-registered database tools"

  # setup.py declares python_requires>=3.10, but every other lane runs 3.12, so
  # 3.11-only syntax or stdlib imports (tomllib, except*, typing.Self) would
  # ship unnoticed. Importing every module is enough to catch that, in seconds.
  import-floor-py310:
    name: Import Every Module (Linux, py3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system pytest pytest-asyncio pytest-timeout
          uv pip install --system -e ".[api]"

      - name: Import every gaia module on Python 3.10
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: pytest tests/unit/test_import_all_modules.py -v --tb=short

  # Integration suites that need no Lemonade, no live account and no AMD
  # hardware. Files are named one by one so util/check_test_lane_coverage.py
  # can see them; a new offline integration file belongs in this list.
  offline-integration:
    name: Offline Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # tests/integration/test_tui_control_e2e.py builds and drives the real TUI.
      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          # The unit job's test deps, plus [mcp]: tests/test_sdk.py and the
          # tests/mcp/ files import the MCP server SDK.
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout \
                                  pyfakefs keyring httpx respx matplotlib pymupdf cvss responses \
                                  faiss-cpu pypdf
          uv pip install --system -e ".[api,mcp,browser]"

      # test_browser_use_live.py drives a real Chromium against a local HTML
      # file. The wheel alone is not enough here — this lane needs the browser
      # binary, which is what makes it the only lane that can run it.
      - name: Install Chromium for the browser-use tests
        run: playwright install --with-deps chromium

      - name: Check no test file skips wholesale
        run: python util/check_module_skips.py --workflow test_unit.yml --job offline-integration

      - name: Run offline integration tests
        # No GAIA_MEMORY_DISABLED: test_memory_eval.py exercises the memory mixin.
        run: |
          pytest \
            tests/test_sdk.py \
            tests/test_hardware_advisor_agent.py \
            tests/installer/test_installer_scenarios.py \
            tests/integration/test_browser_use_live.py \
            tests/integration/test_chat_hub_wheel_journey.py \
            tests/integration/test_chat_ui_integration.py \
            tests/integration/test_documents_router.py \
            tests/integration/test_email_thin_client.py \
            tests/integration/test_files_router.py \
            tests/integration/test_files_search_budget.py \
            tests/integration/test_folder_indexing.py \
            tests/integration/test_governed_agent_workflow.py \
            tests/integration/test_governed_canonical_name.py \
            tests/integration/test_governed_real_agent.py \
            tests/integration/test_governed_review_flow.py \
            tests/integration/test_governed_workflow_binding.py \
            tests/integration/test_lemonade_embedded_lifecycle.py \
            tests/integration/test_memory_api_integration.py \
            tests/integration/test_memory_eval.py \
            tests/integration/test_memory_integration.py \
            tests/integration/test_multi_caller_equivalence.py \
            tests/integration/test_scheduler_e2e.py \
            tests/integration/test_tui_control_e2e.py \
            tests/mcp/test_agent_mcp_server_stdio.py \
            tests/mcp/test_engineering_mcp.py \
            tests/mcp/test_mcp_cli_to_agent_workflow.py \
            tests/mcp/test_mcp_sdk_integration.py \
            tests/mcp/test_port_map.py \
            -v --tb=short --timeout=600

  unit-tests-macos:
    name: Unit Tests (macOS, py3.12)
    runs-on: macos-latest
    # The full unit suite takes ~33 min here; 30 cut it off at 92%.
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          # The Linux unit-tests job's set — see its install step for why each
          # one is needed. A missing one skips files that Linux runs.
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout \
                                  pyfakefs keyring httpx respx matplotlib pymupdf cvss responses \
                                  faiss-cpu pypdf playwright python-docx python-pptx reportlab slack-sdk
          uv pip install --system -e ".[api]"

      - name: Validate packaging integrity
        run: |
          echo "=== Validating Packaging Integrity ==="
          echo "Checking setup.py packages, __init__.py files, and entry points"
          echo ""
          pytest tests/unit/test_packaging.py -v --tb=short
          echo "Packaging integrity checks passed"

      - name: Run unit tests (macOS)
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: pytest tests/unit/ --timeout=60 -v --tb=short

  # GAIA is Windows/NPU-first; this is the only hosted Windows run of the suite.
  unit-tests-windows:
    name: Unit Tests (Windows, py3.12)
    runs-on: windows-latest
    # 15 min reached 6,873 of ~18,000 tests, so a full run is near 40 min.
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install dependencies
        shell: bash
        run: |
          # The Linux unit-tests job's set — see its install step for why each
          # one is needed.
          uv pip install --system pytest pytest-asyncio pytest-mock pytest-timeout \
                                  pyfakefs keyring httpx respx matplotlib pymupdf cvss responses \
                                  faiss-cpu pypdf playwright python-docx python-pptx reportlab slack-sdk
          uv pip install --system -e ".[api]"

      - name: Validate packaging integrity
        shell: bash
        run: |
          echo "=== Validating Packaging Integrity ==="
          echo "Checking setup.py packages, __init__.py files, and entry points"
          echo ""
          pytest tests/unit/test_packaging.py -v --tb=short
          echo "Packaging integrity checks passed"

      - name: Run unit tests (Windows)
        shell: bash
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: pytest tests/unit/ --timeout=60 -v --tb=short
