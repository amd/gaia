#
# Auth canary for the Claude AI Assistant (claude.yml). Those jobs authenticate with
# a CLAUDE_CODE_OAUTH_TOKEN that expires ~1 year after `claude setup-token`. When it
# lapses, every Claude job fails *internally* but reports green (they run with
# continue-on-error), so PRs silently stop being reviewed and nobody notices. This
# canary exercises auth on a schedule and opens a tracking issue if it breaks —
# turning a silent, weeks-long outage into a notification. It probes both
# accounts: CI fails over between them, so one could lapse while the other
# carries every job.
name: Claude Auth Canary

on:
  schedule:
    # 07:11 UTC on the 1st of each month (off the :00 mark to avoid the fleet-wide spike).
    - cron: "11 7 1 * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to exercise. Use this to prove a NEW model resolves on the pinned action BEFORE rolling it out to the other jobs."
        default: "claude-opus-5-5"

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    env:
      HAS_SECONDARY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' }}
    steps:
      # This job used to run with no checkout at all. It now needs
      # util/classify_claude_probe.py on disk to classify the probe response,
      # so check the repo out first. Still no untrusted input reaches any step.
      - name: Check out the repo for the probe classifier
        uses: actions/checkout@v7

      # CI fails over between two accounts, so a token can expire unnoticed while
      # the other carries every job. Both are probed, and judged together below.
      - name: Authenticate the primary account and run a trivial prompt
        id: primary
        continue-on-error: true
        # The failure is asserted by the step below instead of here, so a budget
        # rejection that makes the action itself fail still reaches the
        # assertion. That is what makes this canary mean "CI can call Claude",
        # not just "the action didn't error".
        #
        # The model is a dispatch input so this doubles as the MODEL-RESOLUTION canary.
        # The pinned action bundles the Claude Code CLI that resolves model names, so a
        # model newer than that build is unresolvable — and the failure surfaces as a
        # broken job rather than a clear error. Before pointing the other workflows at a
        # new model, dispatch this with `-f model=<new-id>` and confirm it goes green.
        # It defaults to the same model the real jobs use (claude-opus-5-5) so the
        # scheduled run exercises the actual path, not a cheaper proxy that could stay
        # green while every real job fails to resolve its model.
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13  # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # REQUIRED for the scheduled run to work at all. On a `schedule` event the
          # actor is whoever/whatever last touched the workflow — here that resolved to
          # `github-merge-queue`, and the action's actor gate rejected it outright:
          #   "Workflow initiated by non-human actor: github-merge-queue ...
          #    Add bot to allowed_bots list or use '*' to allow all bots."
          # So every scheduled canary since then failed on the GATE, never reaching auth
          # — the token was fine and the canary was reporting nothing. See run 30690604648
          # (2026-08-01). This is safe here where it would not be on the fork-facing jobs:
          # the prompt is a fixed literal in this file, there is no untrusted input, the
          # only checkout is this repo's own default branch, and --allowedTools is Read only.
          allowed_bots: "*"
          prompt: |
            Reply with exactly the word: ok
          claude_args: |
            --max-turns 1
            --model ${{ github.event.inputs.model || 'claude-opus-5-5' }}
            --allowedTools Read

      - name: Authenticate the secondary account and run a trivial prompt
        id: secondary
        if: env.HAS_SECONDARY == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13  # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"
          prompt: |
            Reply with exactly the word: ok
          claude_args: |
            --max-turns 1
            --model ${{ github.event.inputs.model || 'claude-opus-5-5' }}
            --allowedTools Read

      # The canary used to pass whenever the action did not error, which means
      # "the token parses", not "CI can call Claude": a budget rejection can
      # arrive as an ordinary completion. Assert on the response body instead -
      # scan it for a quota or credential signature even on success, and require
      # the model to have actually said "ok" (#4080).
      #
      # A rejected or unreadable token fails, whichever account it is: the
      # failover never covers for a credential. One account out of quota is a
      # warning, because jobs run on the other; both out is an outage.
      - name: Assert each account actually replied
        id: assert
        env:
          PRIMARY_CONCLUSION: ${{ steps.primary.outputs.conclusion }}
          PRIMARY_LOG: ${{ steps.primary.outputs.execution_file }}
          SECONDARY_CONCLUSION: ${{ steps.secondary.outputs.conclusion }}
          SECONDARY_LOG: ${{ steps.secondary.outputs.execution_file }}
        run: |
          set -uo pipefail
          verdict() {
            local name="$1" conclusion="$2" log="$3" exit_code
            if [ -z "$log" ] || [ ! -f "$log" ]; then
              echo "::error::The $name probe produced no execution log (conclusion='$conclusion'), so this canary cannot prove CI can call Claude on that account. | WHAT TO DO: read the $name probe step's log. | WHERE TO LOOK: .github/workflows/claude-auth-canary.yml"
              return 4
            fi
            if [ "$conclusion" = "success" ]; then exit_code=0; else exit_code=1; fi
            python3 util/classify_claude_probe.py --exit-code "$exit_code" \
              --text-file "$log" --format stream-json --always-scan --expect ok
          }
          # `|| x=$?` keeps Actions' `bash -e` from exiting on a non-zero verdict.
          primary=0
          verdict CLAUDE_CODE_OAUTH_TOKEN "${PRIMARY_CONCLUSION:-}" "${PRIMARY_LOG:-}" || primary=$?
          secondary=skipped
          if [ "$HAS_SECONDARY" = "true" ]; then
            secondary=0
            verdict CLAUDE_CODE_OAUTH_TOKEN_SECONDARY "${SECONDARY_CONCLUSION:-}" "${SECONDARY_LOG:-}" || secondary=$?
          fi
          echo "primary=$primary secondary=$secondary (0 ok, 2 quota, 3 credential, 4+ unreadable)"
          broken=""
          case "$primary" in 0|2) ;; *) broken="CLAUDE_CODE_OAUTH_TOKEN" ;; esac
          case "$secondary" in 0|2|skipped) ;; *) broken="${broken:+$broken and }CLAUDE_CODE_OAUTH_TOKEN_SECONDARY" ;; esac
          echo "broken=$broken" >> "$GITHUB_OUTPUT"
          if [ -n "$broken" ]; then
            echo "::error::$broken cannot be used (see the error above). Rotate it: claude setup-token signed in to that account, then gh secret set <name> --repo $GITHUB_REPOSITORY."
            exit 1
          fi
          if [ "$primary" = "2" ] && [ "$secondary" != "0" ]; then
            echo "::error::Claude CI is down: the primary account is out of quota and there is no answering secondary. The QUOTA EXHAUSTED lines above name the reset times."
            exit 1
          fi
          if [ "$secondary" = "skipped" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so Claude CI has no backup account when the primary runs out of quota."
          elif [ "$primary" = "2" ] || [ "$secondary" = "2" ]; then
            echo "::warning::One Claude account is out of quota; jobs run on the other until it resets."
          fi

      # Only the SCHEDULED canary files an issue. A manual dispatch is a probe — usually
      # someone checking whether a new model resolves on the pinned action — and a failed
      # probe is an expected answer, not an incident. Filing "your token expired" for it
      # would be both noisy and wrong; read the job log instead.
      - name: Open issue on auth failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/auto-issue
        with:
          mode: report
          key: claude-auth-canary
          legacy-title-prefix: "WARNING: Claude CI auth canary failed"
          title: "WARNING: Claude CI auth canary failed - CI cannot call Claude"
          labels: |
            bug
            devops
          assignees: kovtcharov-amd
          body: |
            The monthly Claude auth canary failed. **The failing step's error line names which of the two causes applies** - they need different people, so read it before acting.

            **Quota exhausted on both accounts (`QUOTA EXHAUSTED` in the log):** the credentials are fine and both accounts are out of budget. Read the error line for which limit was hit and when it resets - usage limits lapse on their own, spend caps do not. An Anthropic org admin can raise it at https://claude.ai/admin-settings/usage. Rotating the repo secrets will not help.

            **Credential invalid (`CREDENTIAL INVALID` in the log):** run `claude setup-token` locally, signed in to the account behind `${{ steps.assert.outputs.broken || 'the secret named in the log' }}`, then update that repo secret:
            ```
            gh secret set <CLAUDE_CODE_OAUTH_TOKEN or CLAUDE_CODE_OAUTH_TOKEN_SECONDARY> --repo ${{ github.repository }}
            ```

            Until fixed, the Claude AI Assistant jobs (PR review, @claude replies, auto-fix, release notes) authenticate-and-fail silently — they post nothing. This issue closes itself on the next green scheduled canary.

            - Failing run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            cc @kovtcharov-amd

      - name: Close the auth issue once the canary is green again
        if: success() && github.event_name == 'schedule'
        uses: ./.github/actions/auto-issue
        with:
          mode: resolve
          key: claude-auth-canary
          legacy-title-prefix: "WARNING: Claude CI auth canary failed"
