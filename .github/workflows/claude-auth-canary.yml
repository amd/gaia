#
# Auth canary for the Claude AI Assistant (claude.yml). Those jobs authenticate with
# a CLAUDE_CODE_OAUTH_TOKEN that expires ~1 year after `claude setup-token`. When it
# lapses, every Claude job fails *internally* but reports green (they run with
# continue-on-error), so PRs silently stop being reviewed and nobody notices. This
# canary exercises auth on a schedule and opens a tracking issue if it breaks —
# turning a silent, weeks-long outage into a notification.
name: Claude Auth Canary

on:
  schedule:
    # 07:11 UTC on the 1st of each month (off the :00 mark to avoid the fleet-wide spike).
    - cron: "11 7 1 * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to exercise. Use this to prove a NEW model resolves on the pinned action BEFORE rolling it out to the other jobs."
        default: "claude-opus-5"

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate and run a trivial prompt
        id: claude
        # NO continue-on-error: an auth failure MUST fail the job so the notify step
        # fires. Same OAuth-preferred / API-key-fallback wiring as claude.yml. One turn
        # keeps the monthly subscription-quota cost negligible.
        #
        # The model is a dispatch input so this doubles as the MODEL-RESOLUTION canary.
        # The pinned action bundles the Claude Code CLI that resolves model names, so a
        # model newer than that build is unresolvable — and the failure surfaces as a
        # broken job rather than a clear error. Before pointing the other workflows at a
        # new model, dispatch this with `-f model=<new-id>` and confirm it goes green.
        # It now defaults to the same model the real jobs use (claude-opus-5) so the
        # scheduled run exercises the actual path, not a cheaper proxy that could stay
        # green while every real job fails to resolve its model.
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7  # v1.0.206
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # REQUIRED for the scheduled run to work at all. On a `schedule` event the
          # actor is whoever/whatever last touched the workflow — here that resolved to
          # `github-merge-queue`, and the action's actor gate rejected it outright:
          #   "Workflow initiated by non-human actor: github-merge-queue ...
          #    Add bot to allowed_bots list or use '*' to allow all bots."
          # So every scheduled canary since then failed on the GATE, never reaching auth
          # — the token was fine and the canary was reporting nothing. See run 30690604648
          # (2026-08-01). This is safe here where it would not be on the fork-facing jobs:
          # the prompt is a fixed literal in this file, there is no untrusted input, no
          # checkout, and --allowedTools is Read only.
          allowed_bots: "*"
          prompt: |
            Reply with exactly the word: ok
          claude_args: |
            --max-turns 1
            --model ${{ github.event.inputs.model || 'claude-opus-5' }}
            --allowedTools Read

      # Only the SCHEDULED canary files an issue. A manual dispatch is a probe — usually
      # someone checking whether a new model resolves on the pinned action — and a failed
      # probe is an expected answer, not an incident. Filing "your token expired" for it
      # would be both noisy and wrong; read the job log instead.
      - name: Open issue on auth failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="⚠️ Claude CI auth canary failed — token may have expired"
          BODY="The monthly Claude auth canary failed. This usually means \`CLAUDE_CODE_OAUTH_TOKEN\` has expired (it is valid ~1 year) or both auth secrets are missing.

          **Fix:** run \`claude setup-token\` locally, then update the repo secret:
          \`\`\`
          gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo $GITHUB_REPOSITORY
          \`\`\`

          Until fixed, the Claude AI Assistant jobs (PR review, @claude replies, auto-fix, release notes) authenticate-and-fail silently — they post nothing.

          - Failing run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          cc @kovtcharov-amd"

          # EVERY gh call here needs an explicit --repo. This job does NOT check out the
          # repo, so gh has no git remote to infer from: `gh issue create` without --repo
          # died with "fatal: not a git repository" and the alert was never filed. The
          # canary failed, its own notification failed, and nobody was told — the exact
          # silent-safety-net shape this canary exists to prevent (run 30690604648).
          # Reuse an existing open canary issue instead of filing a new one each month.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title Claude CI auth canary failed' --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" \
              --assignee kovtcharov-amd --label bug --label devops
          fi
