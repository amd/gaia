# SD (Stable Diffusion) integration tests with Lemonade server
# Tests real image generation with SD-Turbo (fastest model)
# Platform: Windows (self-hosted runner with AMD hardware)

name: SD Integration Tests (Windows)

on:
  push:
    branches: ["main"]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - '.github/actions/setup-venv/**'
      - '.github/workflows/test_sd.yml'
      - "src/gaia/sd/**"  # SD mixin and tools
      - "src/gaia/llm/lemonade_client.py"
      - "src/gaia/cli.py"
      - "tests/integration/test_sd_integration.py"
      - "tests/unit/test_sd_mixin.py"
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - '.github/actions/setup-venv/**'
      - '.github/workflows/test_sd.yml'
      - "src/gaia/sd/**"  # SD mixin and tools
      - "src/gaia/llm/lemonade_client.py"
      - "src/gaia/cli.py"
      - "tests/integration/test_sd_integration.py"
      - "tests/unit/test_sd_mixin.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sd-windows:
    name: Test SD Image Generation (Lemonade Integration)
    # Runs on the AMD Ryzen DevLab Dispatch ephemeral pool via the devlab-dispatch label.
    runs-on: [self-hosted, Windows, devlab-dispatch, strix-halo]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    # 22 (checkout ceiling below) + 10 (Initialize SD Profile's own cap) + 2 (every
    # other step; worst measured 58s). The old 25 could not cover a slow fetch (#4135).
    timeout-minutes: 34
    steps:
      # Devlab wipes the workspace every job, so this is always a cold ~107MB fetch over
      # a link that stalls and restarts from zero; worst measured 19.9 min (#4135).
      - uses: actions/checkout@v7
        timeout-minutes: 22

      - name: Kill Stuck Processes (MSI and Lemonade Server)
        if: always()
        continue-on-error: true
        run: |
          Write-Host "Cleaning up any stuck processes that block MSI install..."

          # Kill stuck msiexec processes
          $msiProcesses = Get-Process msiexec -ErrorAction SilentlyContinue
          if ($msiProcesses) {
              $msiProcesses | Stop-Process -Force
              Write-Host "Killed $($msiProcesses.Count) stuck msiexec process(es)"
          }

          # Kill any running lemonade-server processes (prevents StopLegacyPythonServer hang)
          $lemonadeProcesses = Get-Process lemonade-server -ErrorAction SilentlyContinue
          if ($lemonadeProcesses) {
              $lemonadeProcesses | Stop-Process -Force
              Write-Host "Killed $($lemonadeProcesses.Count) lemonade-server process(es)"
          }

          # Wait for Windows Installer service to finish cleanup
          if ($msiProcesses -or $lemonadeProcesses) {
              Write-Host "Waiting 5 seconds for cleanup to complete..."
              Start-Sleep -Seconds 5
          }

          Write-Host "Cleanup complete - ready for fresh install"

      - name: Setup Python Environment
        uses: ./.github/actions/setup-venv
        with:
          python-version: '3.12'
          install-package: '.[dev]'

      # gaia init installs and starts GAIA's embedded Lemonade, so the version
      # it needs is pinned in src/gaia/version.py, not read off the runner. A
      # failed init fails this job: there is nothing to skip to.
      - name: Initialize SD Profile (Install/Upgrade Lemonade + Start Server + Download Models)
        id: init-sd
        timeout-minutes: 10
        env:
          HUGGINGFACE_ACCESS_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_ACCESS_TOKEN }}
        run: |
          Write-Host "================================================================"
          Write-Host "     Initializing GAIA SD Profile (gaia init --profile sd)"
          Write-Host "================================================================"

          & gaia init --profile sd --yes --verbose
          if ($LASTEXITCODE -ne 0) {
              throw "gaia init --profile sd exited $LASTEXITCODE - SD tests cannot run. The init output above names the failing stage; the embedded server log is lemonade/lemond.log under GAIA_HOME (default ~/.gaia)."
          }

      - name: Run SD Integration Tests (Fast - SD-Turbo only)
        shell: cmd
        env:
          # init succeeded, so an unreachable server or missing model must fail, not skip.
          GAIA_REQUIRE_SD: '1'
        run: |
          call "%GITHUB_WORKSPACE%\.venv\Scripts\activate.bat"

          echo ================================================================
          echo           SD INTEGRATION TESTS (SD-Turbo - Fast)
          echo ================================================================
          echo.

          REM Only the fast tests (SD-Turbo, 512x512); SDXL-Base takes 5+ min per image.
          REM --capture=sys avoids fd-level capture crash on Windows (ValueError: I/O on closed file)
          REM One invocation, exit code kept: cmd reports only its LAST command's status.
          pytest tests/integration/test_sd_integration.py::TestSDIntegration::test_generate_small_image tests/integration/test_sd_integration.py::TestSDIntegration::test_health_check_with_real_server tests/integration/test_sd_integration.py::TestLemonadeClientSDMethods::test_list_sd_models -v -rs --tb=short --capture=sys
          set sd_exit=%ERRORLEVEL%

          echo.
          echo SD integration tests exit code: %sd_exit%
          exit /b %sd_exit%

      - name: Cleanup
        if: always()
        run: |
          # gaia init starts GAIA's own Lemonade Server; stop it so this
          # self-hosted runner is left without a server or its record.
          Write-Host "Stopping GAIA's Lemonade Server..."
          & gaia lemonade embedded stop
          Write-Host "Stopping Lemonade Server..."
          try {
              Stop-Process -Name "lemonade-server" -Force -ErrorAction SilentlyContinue
              Write-Host "Server stopped"
          } catch {
              Write-Host "Server already stopped or not running"
          }
