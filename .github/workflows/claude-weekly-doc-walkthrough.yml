#
# Execution-based sibling to claude-nightly-audit.yml (see docs/plans/
# weekly-doc-walkthrough-audit.md and docs/plans/weekly-claude-audit.md's
# "Non-goals"). That workflow is deliberately static (read-only, never installs
# or runs repo code) -- this one exists because that non-goal has a real blind
# spot: #2260 (gaia chat ImportErrors on a plain PyPI install) and #2261 (seven
# hub agents silently fall back to an uninstalled 35B model) are both only
# observable by actually running GAIA from a real user's initial state, never
# by reading source. This workflow acts as that user: one matrix job per doc
# guide, each walking the guide's commands for real on the self-hosted
# Windows/STX runner, in a fresh venv + isolated config + a dedicated-port
# Lemonade instance -- never the runner's shared, CI-warmed install (see
# "Execution environment" in the design doc for why that distinction matters).
#
# STANDALONE from claude-nightly-audit.yml on purpose: different runner
# (self-hosted Windows vs. ubuntu-latest), different cost/runtime profile
# (hours, not minutes -- deliberate; see design doc "Cadence"), different
# failure modes (a live command can hang). Isolating them means a stuck
# walkthrough never delays the fast static audit. Shares vocabulary with it
# (severity scale, cluster/dedup keys, weekly-audit label, bug-label auto-fix
# promotion) and the same deterministic dedup pass,
# scripts/audit/prepare_synthesis.py.
#
# CROSS-GUIDE DEDUP IS LOAD-BEARING HERE. The per-guide judges below are blind to
# each other, so one broken thing arrives as N differently-worded findings. Only
# the synthesize job can see all of them, and it is where they merge into ONE
# issue -- five guides quoting a single dead Lemonade command previously became
# five issues in one night. Do not move filing back into the matrix jobs.
#
# NO RUN RECEIPTS. The per-run summary goes to $GITHUB_STEP_SUMMARY, never a new
# issue.
#
# EXECUTOR / JUDGE SPLIT: the executor walks each guide (high tool-call volume,
# grinding sequential work); a SEPARATE judge pass scores the transcript (low
# volume -- one pass per guide -- and never rubber-stamps the executor's own
# summary, same principle the gaia-testing skill states explicitly). See design
# doc "Job structure".
#
# Both now run claude-opus-5. This used to be a cost split (Sonnet executes,
# Opus judges); the repo standardised every Claude workflow on Opus 5. The split
# that matters is STRUCTURAL, not model-tier -- the judge must be a fresh context
# that never sees the executor's self-assessment. Keep the two roles separate even
# if the models are ever unified further; if you re-introduce a cheaper executor,
# change only WALKTHROUGH_EXECUTOR_MODEL and leave the judge on the stronger model.
#
# PORT ISOLATION: runs its own Lemonade Server on a dedicated, non-13305 port
# so it never collides with the six other workflows issue #2122 documents
# fighting over the shared runner's Lemonade instance -- sidesteps that
# contention by construction, not by coordination. NEEDS LIVE-RUNNER
# VERIFICATION (flagged in the design doc): whether a second Lemonade Server
# instance can run concurrently on this box and what it does for model-cache
# visibility. Model-*resolution* checks (the #2261 shape) do not depend on the
# answer -- they use a targeted Python snippet against AgentRegistry instead
# of a live model catalog; see the executor prompt below.
#
# VALIDATION HISTORY (real workflow_dispatch runs against docs/quickstart.mdx):
# - Run 29663253865 (2026-07-18): FAILED at Lemonade startup --
#   `LemonadeServer.exe serve --port N` never bound (v10.x removed the `serve`
#   subcommand). Fixed by reusing the already-proven
#   installer/scripts/start-lemonade.ps1 (bare `--port N`) instead of
#   hand-rolling the invocation. Same run also surfaced that
#   claude-code-action's own internal steps need `bash` on PATH, which this
#   self-hosted Windows runner doesn't provide by default even though Git for
#   Windows (and its bash.exe) is installed -- fixed with an explicit
#   "Ensure bash is on PATH" step before any claude-code-action use.
# - Run 32755389532 (2026-08-24): both fixes above held; the run died one step
#   later. claude-code-action installs the CLI with `curl claude.ai/install.sh
#   | bash`, which refuses Windows, so the executor and judge both failed after
#   3 attempts before any doc was walked -- and continue-on-error reported the
#   job green. Fixed by installing from npm and passing the binary through
#   `path_to_claude_code_executable`.
# - Run 32764106980: npm wasn't on PATH either (same story as bash and python);
#   fixed with actions/setup-node, matching what
#   test_eval_agent_gemma_consolidation.yml already does on this runner pool.
# - Run 32767640853: executor finished cleanly (is_error=false, 52 turns) and the
#   judge wrote findings, yet the status step called it a crash -- it parsed
#   execution_file line-by-line, but that file is a pretty-printed JSON array.
#   Fixed by scanning the whole text for the last is_error.
# - Run 32770642262: PASSED end to end -- every step green, findings artifact
#   uploaded, issue #3071 filed. First fully working run of this workflow.
# - Run 32994770487 (2026-08-26): regressed on the FIRST post-merge run, from a
#   runner change rather than a code change. The wheel builds, then installing it
#   dies -- "An Application Control policy has blocked this file" -- because the
#   policy now blocks the venv's unsigned pip.exe shim. Fixed by installing
#   through `python.exe -m pip`, the form the same step already used two lines up.
# - Run 33040830292: PASSED with that fix. Also settles the open question about
#   the OTHER launcher in that folder: `gaia.exe` runs in the same step and the
#   step passed, so the policy blocks that specific shim, not the class. Do NOT
#   pre-emptively rewrite `gaia.exe` as `python -m gaia` -- driving the real
#   console script is the property this workflow exists to prove. If the policy
#   ever does block it, the fix is a runner allowlist entry, not a call-shape
#   change here.
#   A `.cmd` shim via path_to_claude_code_executable does work on this runner.

name: Claude Weekly Doc Walkthrough

on:
  schedule:
    # 12:00 UTC every Monday. This one stays WEEKLY on purpose while its two static
    # siblings went nightly: it drives a real Lemonade instance on the self-hosted
    # Windows/STX box for hours, so it is hardware-bound rather than just token-bound
    # and a nightly cadence would monopolise that runner.
    # Ordering on a Monday: security audit 09:13 UTC -> static audit 10:37 UTC -> this
    # at 12:00 UTC, so the three never compete for runner time or review attention.
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      doc_filter:
        description: "Glob to scope this run to one or a few docs (e.g. docs/quickstart.mdx). Empty = all discovered docs."
        default: ""
      dry_run:
        # Files and comments NOTHING; writes what it WOULD have filed to the job summary.
        # This is how you validate a dedup change against the real backlog without adding
        # to it — see the same input on claude-nightly-audit.yml.
        description: "Report what would be filed, without touching the tracker"
        type: boolean
        default: false

permissions:
  contents: read

# Own group -- deliberately NOT the eval workflows' `lemonade-eval` group.
# This workflow runs its own Lemonade instance on a dedicated port (see
# header), so it does not need to serialize against workflows using the
# shared 13305 instance; it only needs to serialize against ITSELF across
# scheduled runs.
concurrency:
  group: claude-weekly-doc-walkthrough
  cancel-in-progress: false

env:
  WALKTHROUGH_EXECUTOR_MODEL: claude-opus-5
  WALKTHROUGH_JUDGE_MODEL: claude-opus-5
  # Dedicated port for this workflow's own Lemonade instance -- never touches
  # the shared 13305 port the other self-hosted-runner workflows use.
  WALKTHROUGH_LEMONADE_PORT: 13405

jobs:
  # Cheap, fast, ubuntu-hosted discovery so the expensive Windows matrix below
  # never spins up for a misconfigured or empty doc set.
  discover:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.discover.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover in-scope docs
        id: discover
        env:
          DOC_FILTER: ${{ github.event.inputs.doc_filter }}
        run: |
          set -euo pipefail
          all_docs=$(python3 scripts/audit/discover_walkthrough_docs.py)
          if [ -n "$DOC_FILTER" ]; then
            docs=$(ALL_DOCS="$all_docs" DOC_FILTER="$DOC_FILTER" python3 -c "
          import json, os, fnmatch
          docs = json.loads(os.environ['ALL_DOCS'])
          pattern = os.environ['DOC_FILTER']
          print(json.dumps([d for d in docs if fnmatch.fnmatch(d['path'], pattern)]))
          ")
          else
            docs="$all_docs"
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "Resolved docs: $docs"

          {
            echo "## 📋 Doc walkthrough — scope for this run"
            echo ""
            if [ -n "$DOC_FILTER" ]; then
              echo "Filter: \`$DOC_FILTER\`"
              echo ""
            fi
            count=$(echo "$docs" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            echo "**$count doc(s) in scope:**"
            echo "$docs" | python3 -c "
          import json, sys
          for d in json.load(sys.stdin):
              print(f\"- \`{d['path']}\`\")
          "
          } >> "$GITHUB_STEP_SUMMARY"

  # One matrix entry per doc, each acting as a real user/developer walking
  # that guide on real hardware. Serialized (max-parallel: 1) -- same
  # one-model-slot-at-a-time discipline the eval workflows already use
  # (CLAUDE.md "Run agent evals SERIALLY"), and it gives natural checkpointing
  # for a run that's allowed to take hours: one guide hanging doesn't lose the
  # findings already captured from guides that finished first.
  walkthrough:
    needs: discover
    if: github.repository == 'amd/gaia' && needs.discover.outputs.docs != '[]'
    # Expression-wrapped 'stx' (not a bare literal) to match the rest of the repo's
    # self-hosted-runner workflows and stay actionlint-clean (a literal label isn't
    # in actionlint's default known-labels list; an expression sidesteps that
    # static check the same way test_api.yml / test_lemonade_server.yml do).
    runs-on:
      - self-hosted
      - Windows
      - ${{ 'stx' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        doc: ${{ fromJson(needs.discover.outputs.docs) }}
    # Ceiling for ONE guide, not the whole matrix -- the workflow overall may
    # run for hours across many matrix entries, but a single stuck command
    # must not eat the entire run silently.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # FOUND ON A LIVE RUN (2026-07-18, run 29663253865): claude-code-action's
      # own internal composite-action steps (its bun install + post-processing
      # scripts) assume `bash` is on PATH and fail with "bash: command not
      # found" before Claude ever runs -- the judge session never actually
      # executed. Git for Windows IS installed on this runner (checkout uses
      # C:\Program Files\Git\cmd\git.exe successfully) and ships bash.exe in
      # the same install root; it's just never added to PATH. Fix at the
      # source rather than working around it per-step.
      - name: Ensure bash is on PATH (claude-code-action requires it)
        shell: powershell
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (Test-Path "$gitBash\bash.exe") {
            Write-Host "Found bash.exe at $gitBash -- adding to PATH for this job."
            Add-Content -Path $env:GITHUB_PATH -Value $gitBash
          } else {
            Write-Host "::error::No bash.exe at $gitBash -- claude-code-action's internal steps will fail. Runner may need Git for Windows (re)installed."
            exit 1
          }

      # FOUND ON A LIVE RUN (2026-08-24, run 32755389532): claude-code-action installs
      # the CLI with `curl https://claude.ai/install.sh | bash`, and that script refuses
      # Windows ("Windows is not supported by this script"). Both the executor and the
      # judge died there after 3 attempts, before any doc was walked -- and
      # continue-on-error reported the job green. Install from npm instead (which does
      # support Windows) and hand the action the binary via
      # `path_to_claude_code_executable`, its documented skip-the-install escape hatch.
      # npm is not on PATH on this runner either (same story as bash and python).
      # test_eval_agent_gemma_consolidation.yml sets Node up the same way on the
      # same runner pool before its own `npm install -g @anthropic-ai/claude-code`.
      - name: Set up Node (provides npm for the Claude Code install below)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Claude Code (npm — the action's own installer refuses Windows)
        id: claude_cli
        shell: powershell
        run: |
          if (-not (Get-Command npm -ErrorAction SilentlyContinue)) {
            Write-Host "::error::No npm on PATH -- the Set up Node step above should have provided it. claude-code-action's own installer refuses Windows, so npm is the only install path here."
            exit 1
          }
          # Major-pinned, not exact. The action bundles its own expected CLI version and
          # bumps it with the SHA, so pinning exactly here would drift against it; ^2
          # still tracks that while stopping a 3.x breaking release from landing
          # mid-scheduled-run. Revisit when the action's SHA moves to a 3.x CLI.
          npm install -g "@anthropic-ai/claude-code@^2"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::npm install of @anthropic-ai/claude-code failed -- the executor and judge cannot run."
            exit 1
          }
          $npmPrefix = (npm prefix -g).Trim()
          $claude = Join-Path $npmPrefix "claude.cmd"
          if (-not (Test-Path $claude)) {
            Write-Host "::error::Claude Code installed but no claude.cmd under $npmPrefix -- cannot point the action at it."
            exit 1
          }
          Write-Host "Claude Code CLI at $claude"
          & $claude --version
          # Add-Content, not `Out-File -Encoding utf8`: on Windows PowerShell 5.1 that
          # writes a BOM mid-file, and the runner then rejects the NEXT step's append
          # with "Unable to process file command 'output'".
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$claude"

      - name: Verify clean start state
        shell: powershell
        run: |
          $runDir = "$env:RUNNER_TEMP\walkthrough-${{ matrix.doc.slug }}"
          if (Test-Path $runDir) {
            Write-Host "Stale run dir from a previous failed run -- removing: $runDir"
            Remove-Item -Recurse -Force $runDir
          }
          New-Item -ItemType Directory -Path $runDir | Out-Null
          echo "RUN_DIR=$runDir" >> $env:GITHUB_ENV
          echo "GAIA_HOME=$runDir\gaia_home" >> $env:GITHUB_ENV
          Write-Host "RUN_DIR=$runDir"
          Write-Host "GAIA_HOME=$runDir\gaia_home"
          "### 🚶 ${{ matrix.doc.path }}" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "- **Start:** $(Get-Date -Format o), clean run dir: ``$runDir``" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # FOUND ON A LIVE RUN (2026-08-10, run 31387768076): this runner has no
      # `python` on PATH, so the venv step below died with CommandNotFound before
      # any doc was walked. Every other STX workflow gets its interpreter through
      # uv (see .github/actions/setup-venv), so do the same here rather than
      # depending on a system Python that isn't there.
      - name: Ensure uv is on PATH (provides the interpreter for the venv below)
        shell: powershell
        run: |
          $uvBin = "$env:USERPROFILE\.local\bin"
          if (-not (Test-Path "$uvBin\uv.exe")) {
            Write-Host "uv not present -- installing."
            irm https://astral.sh/uv/install.ps1 | iex
          }
          if (-not (Test-Path "$uvBin\uv.exe")) {
            Write-Host "::error::uv install did not produce $uvBin\uv.exe -- cannot create the walkthrough venv."
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $uvBin
          Write-Host "uv on PATH at $uvBin"

      - name: Fresh venv, real-user install (no -e install, no hub packages)
        shell: powershell
        run: |
          # Deliberately NOT `.github/actions/setup-venv` -- that composite
          # action installs `.[dev,...]` from the checkout (an editable dev
          # install). This step exists to reproduce what a real `pip install
          # amd-gaia` user gets: a built wheel, installed normally, with no
          # hub/agents/*/python package alongside it. This is the property
          # that would have caught #2260 -- do not "fix" a resulting
          # ImportError by installing a hub package here; that IS the bug.
          # uv only supplies the interpreter; --seed puts real pip in the venv so
          # the install below is still a plain `pip install <wheel>`.
          Write-Host "Creating venv at $env:RUN_DIR\venv ..."
          uv venv --seed --python 3.12 "$env:RUN_DIR\venv"
          & "$env:RUN_DIR\venv\Scripts\python.exe" -m pip install --upgrade pip build
          Write-Host "Building wheel from the checkout ..."
          & "$env:RUN_DIR\venv\Scripts\python.exe" -m build --wheel --outdir "$env:RUN_DIR\dist" .
          $wheel = Get-ChildItem "$env:RUN_DIR\dist\amd_gaia-*.whl" | Select-Object -First 1
          if (-not $wheel) {
            Write-Host "::error::No wheel built -- 'python -m build' did not produce amd_gaia-*.whl"
            "- **Environment:** ❌ wheel build failed" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 1
          }
          Write-Host "Built: $($wheel.Name)"
          Write-Host "Installing $($wheel.Name) into the fresh venv (no -e, no hub packages) ..."
          # `python.exe -m pip`, not the venv's pip.exe: this runner's Application Control
          # policy blocks the unsigned shim ("An Application Control policy has blocked
          # this file"). Same install either way -- still a real non-editable wheel install.
          & "$env:RUN_DIR\venv\Scripts\python.exe" -m pip install $wheel.FullName
          $gaiaVersion = & "$env:RUN_DIR\venv\Scripts\gaia.exe" --version
          Write-Host "Installed: $gaiaVersion"
          "- **Environment:** ✅ $($wheel.Name) installed, ``gaia --version`` -> $gaiaVersion" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Start an isolated Lemonade instance on the dedicated port
        shell: powershell
        run: |
          # Health-check first -- never assume the port is free, never
          # force-kill whatever might already be on it. This workflow owns
          # WALKTHROUGH_LEMONADE_PORT exclusively across its own runs; a
          # leftover process from a prior crashed run of THIS workflow is a
          # legitimate thing to clean up, but nothing else's.
          $healthUrl = "http://localhost:$env:WALKTHROUGH_LEMONADE_PORT/api/v1/health"
          $alreadyHealthy = $false
          try {
            $resp = Invoke-WebRequest -Uri $healthUrl -TimeoutSec 3 -ErrorAction Stop
            if ($resp.StatusCode -eq 200) { $alreadyHealthy = $true }
          } catch {}
          if ($alreadyHealthy) {
            Write-Host "Dedicated-port Lemonade already healthy (leftover from a prior run) -- reusing it."
            "- **Lemonade:** ✅ reused an already-healthy instance on port $env:WALKTHROUGH_LEMONADE_PORT" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "Dedicated port not yet serving -- starting a fresh instance."
            # FOUND ON A LIVE RUN (2026-07-18, run 29663253865): hand-rolling
            # `Start-Process LemonadeServer.exe -ArgumentList "serve --port N"`
            # never binds -- v10.x removed the `serve` subcommand entirely; the
            # real invocation is a bare `--port N`, and this exact gotcha is
            # already documented and fixed in installer/scripts/start-lemonade.ps1
            # ("Verified on the stx runner: `LemonadeServer.exe --port N` binds
            # N -- the legacy `serve --port` shape is what never bound."). Reuse
            # that proven script instead of re-deriving its exe-path resolution,
            # correct CLI shape, and stdout/stderr-capture-on-failure logic.
            Push-Location $env:RUN_DIR
            try {
              & "$env:GITHUB_WORKSPACE\installer\scripts\start-lemonade.ps1" -Port $env:WALKTHROUGH_LEMONADE_PORT -NoModel
              $startExit = $LASTEXITCODE
            } finally {
              Pop-Location
            }
            if ($startExit -ne 0 -or -not $env:LEMONADE_PROCESS_ID) {
              Write-Host "::error::start-lemonade.ps1 did not report a healthy server (exit $startExit)"
              "- **Lemonade:** ❌ start-lemonade.ps1 failed (exit $startExit) -- see its own stdout/stderr log dump above" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
              exit 1
            }
            $env:LEMONADE_PROCESS_ID | Out-File "$env:RUN_DIR\lemonade.pid"
            Write-Host "Lemonade healthy on port $env:WALKTHROUGH_LEMONADE_PORT, pid=$env:LEMONADE_PROCESS_ID"
            "- **Lemonade:** ✅ started fresh (pid=$env:LEMONADE_PROCESS_ID), healthy on port $env:WALKTHROUGH_LEMONADE_PORT" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: "Executor: walk ${{ matrix.doc.path }}"
        id: executor
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # On `schedule`, github.actor is whoever last touched the default branch — a bot
          # in this repo: github-merge-queue[bot] normally, github-actions[bot] after a
          # release workflow commits. Without this the human-actor gate rejects every
          # scheduled run before Claude starts. Safe: schedule/dispatch only, no fork input.
          allowed_bots: "github-merge-queue,github-actions"
          # Skip the action's Linux-only installer — see the npm install step above.
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          prompt: |
            You are the EXECUTOR half of GAIA's weekly doc walkthrough. Your only job is
            to run commands and capture their raw output -- judging correctness is a
            SEPARATE step that reads your transcript independently. Do not editorialize
            or decide what's a bug; just execute faithfully and record everything.

            DOC UNDER TEST: ${{ matrix.doc.path }}
            ENVIRONMENT: two OS-level environment variables are already set for you by an
            earlier PowerShell step in this job -- `RUN_DIR` (a per-run scratch directory)
            and `GAIA_HOME` (an isolated GAIA config dir under it). A fresh venv is already
            built at `<RUN_DIR>\venv` (GAIA installed from a built wheel, no -e install, no
            hub agent packages preinstalled -- this is deliberate, do not "fix" a missing
            hub package by installing it). A Lemonade instance is running at
            http://localhost:${{ env.WALKTHROUGH_LEMONADE_PORT }} -- point any
            Lemonade-aware command at that port, never the default 13305.
            **First, confirm which shell your Bash tool actually runs on this Windows
            runner** (e.g. `echo $SHELL` or check if `$env:RUN_DIR` resolves vs. `$RUN_DIR`)
            and use that shell's syntax consistently for every command below -- this
            workflow was authored without live-runner access, so the exact shell your tool
            uses was not confirmed at authoring time; do not assume PowerShell syntax works
            if your tool is actually a POSIX shell, or vice versa.

            ## What to do
            1. Read `${{ matrix.doc.path }}` in full.
            2. Extract every command a reader is expected to actually run, in the order
               the doc presents them (code fences, inline `gaia ...` examples).
            3. Run each command for real, using the `gaia` executable from
               `<RUN_DIR>\venv\Scripts\` explicitly (not a bare `gaia` that might resolve
               to something else on the runner). Capture stdout, stderr, exit code, and
               wall-clock time for each.
            4. **Stop the guide at its first failing step whose failure blocks later
               steps** (e.g. `gaia init` failing means don't attempt `gaia chat` after
               it) -- report the root step, don't manufacture cascading noise from steps
               whose precondition already failed. Steps that are independently runnable
               (separate subcommands not depending on the failed one) still get attempted.
            5. A step needing something this environment cannot provide (Jira/Atlassian
               credentials, a Google OAuth connector, a Blender install, a microphone, a
               non-Windows install path) is NOT attempted -- record it explicitly as
               `"requires <X> -- not verifiable in this environment"` and move to the next
               independently-runnable step.
            6. **Model-resolution checks are a special case -- do NOT drive them through
               a live end-to-end CLI run.** If the doc's guide involves an agent choosing
               a model when its preferred model isn't installed (this is exactly the
               #2261 bug shape), the runner's shared Lemonade cache may already have
               other models downloaded from unrelated CI and would silently defeat the
               check. Instead write and run a small, throwaway Python snippet using the
               `python` executable from `<RUN_DIR>\venv\Scripts\` that imports the
               relevant registry code and calls its model-resolution function with an EXPLICIT
               `available_models` list matching only what the doc's target `gaia init`
               profile installs (cross-reference `INIT_PROFILES` in
               `src/gaia/installer/init_command.py` for the real list) -- then assert the
               agent does not silently fall through to a different hardcoded model.
               Capture the snippet's full source and output as evidence.
            7. **A failing step must reproduce before you treat it as real.** Retry it
               once. If it passes the second time, note it as a flake (timing, network) in
               your transcript rather than a confirmed failure -- the judge decides what
               to do with that note, you do not decide it's a non-issue yourself.

            Write the full raw transcript (every command, its output, exit code, timing,
            and any retry) to `<RUN_DIR>\transcript.md` (substitute the real value of the
            `RUN_DIR` env var), structured with one section per step in doc order. This
            transcript is the ONLY thing the judge step reads -- anything not captured
            there does not exist for judging purposes. You have no Write tool: create it
            with Bash (a `cat > … <<'MD'` heredoc). A run that ends without this file is a
            FAILED run -- the job hard-fails on it, because a missing transcript is
            indistinguishable from the walk never having started.

            ## Budget
            You have --max-turns 60. Stop walking the guide at ~5 turns remaining and
            spend them writing the transcript. Reaching the ceiling mid-walk discards
            everything you captured; a partial transcript beats a perfect one never written.
          claude_args: |
            --max-turns 60
            --model ${{ env.WALKTHROUGH_EXECUTOR_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      # continue-on-error above means a crashed executor still lets cleanup
      # run -- which is correct -- but it also means the job can look green
      # in the Actions UI while the executor actually failed. Surface that
      # explicitly: check the action's own execution_file (same technique
      # claude-nightly-audit.yml's synthesis job uses), and independently
      # confirm the transcript the judge depends on actually exists.
      - name: Report executor status
        if: always()
        shell: powershell
        env:
          EXEC_FILE: ${{ steps.executor.outputs.execution_file }}
        run: |
          # PowerShell-native JSON parsing (ConvertFrom-Json), not jq -- jq's
          # presence on this self-hosted Windows runner is not a confirmed
          # dependency (the ubuntu-hosted synthesis job below uses jq safely,
          # since GH-hosted runners guarantee it; this job cannot assume that).
          # execution_file is a PRETTY-PRINTED JSON array, not JSONL, so parsing it
          # line by line makes every line invalid and silently reports a healthy run
          # as crashed. Scan the whole text and keep the LAST is_error, matching the
          # bash `jq -s '[.. | objects | select(has("is_error")) | .is_error] | .[-1]'`
          # claude-nightly-audit.yml uses on ubuntu.
          $ok = $false
          if ($env:EXEC_FILE -and (Test-Path $env:EXEC_FILE)) {
            $raw = Get-Content -Raw $env:EXEC_FILE
            $hits = [regex]::Matches($raw, '"is_error"\s*:\s*(true|false)')
            if ($hits.Count -gt 0) {
              $ok = $hits[$hits.Count - 1].Groups[1].Value -eq 'false'
            } else {
              Write-Host "::warning::No is_error in $env:EXEC_FILE -- treating as a crash."
            }
          }
          $transcriptExists = Test-Path "$env:RUN_DIR\transcript.md"
          if ($ok -and $transcriptExists) {
            Write-Host "✅ Executor completed and wrote a transcript."
            "- **Executor:** ✅ completed, transcript written" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } elseif ($ok -and -not $transcriptExists) {
            # No transcript means the judge would review nothing and write nothing, and the
            # job would still go green. Stop here so the cause is the reported failure.
            Write-Host "::error title=Executor wrote no transcript (${{ matrix.doc.path }})::The executor reported success but never wrote transcript.md, so there is nothing to judge. log: $env:EXEC_FILE"
            "- **Executor:** ❌ reported success but wrote no transcript" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 1
          } else {
            Write-Host "::error title=Executor did not complete cleanly (${{ matrix.doc.path }})::log: $env:EXEC_FILE"
            "- **Executor:** ❌ did not complete cleanly" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: "Judge (Opus): verify ${{ matrix.doc.path }} against its transcript"
        id: judge
        if: always()
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # See the executor step's note — scheduled runs are actored by a bot.
          allowed_bots: "github-merge-queue,github-actions"
          # Skip the action's Linux-only installer — see the npm install step above.
          path_to_claude_code_executable: ${{ steps.claude_cli.outputs.path }}
          prompt: |
            You are the JUDGE half of GAIA's weekly doc walkthrough. Do not trust the
            executor's framing -- read its raw transcript and the doc yourself, and reach
            your own conclusion. This split exists because a single self-judging session
            is a known false-negative risk (see docs/plans/weekly-doc-walkthrough-audit.md
            "Job structure").

            DOC UNDER TEST: ${{ matrix.doc.path }}
            TRANSCRIPT: `<RUN_DIR>\transcript.md`, where `RUN_DIR` is the OS-level env var
            set by an earlier step in this job (check your Bash tool's shell to read it --
            `$env:RUN_DIR` in PowerShell, `$RUN_DIR` in a POSIX shell; not confirmed which
            this runner's tool uses at authoring time). If the file is missing, the
            executor crashed before writing it -- file ONE 🟠 finding for that and stop.
            It needs EVERY field the schema at step 5 lists (a finding missing one is
            rejected): `severity` 🟠, `title`, `why`, `evidence` (say the file is absent),
            `path`, `symbol`, `auto_fixable` false, `dedup_key`
            `walkthrough:${{ matrix.doc.path }}:executor-crash`, and `cluster_key`
            `walkthrough:executor-crash` — that shared cluster key merges every guide whose
            executor died into one issue instead of one issue per guide.

            ## What to do
            1. Read `${{ matrix.doc.path }}` and the transcript file above, in full.
            2. For each step in the transcript, check: does the actual captured output
               match what the doc claims will happen? A step marked "not verifiable in
               this environment" is not a finding by itself -- it's expected coverage,
               unless the doc presents that exact step as something every reader can run
               (in which case the doc itself needs a caveat -- that IS a finding).
            3. **`docs/reference/cli.mdx` gets an extra deterministic pass:** enumerate
               every flag from the transcript's `gaia -h` / subcommand `-h` output and
               every flag documented in the doc's tables, and diff them explicitly,
               flag by flag -- don't rely on a narrative skim for this file, a single
               dropped row in a long table is easy to miss that way.
            4. A step the executor noted as "reproduced as a flake" is NOT a finding --
               skip it. A step that failed and did NOT reproduce cleanly on retry (i.e.
               failed twice) IS eligible.
            5. Write findings to `findings-walkthrough-${{ matrix.doc.slug }}.json`
               (repo root), same shape `claude-nightly-audit.yml` uses:
               ```json
               {"findings": [
                 {
                   "severity": "🔴" | "🟠" | "🟡",
                   "path": "${{ matrix.doc.path }}",
                   "symbol": "the doc heading or step name -- NOT a line number",
                   "title": "one-line statement of the problem",
                   "why": "one sentence: the concrete impact / what breaks",
                   "evidence": "the exact transcript excerpt (command + captured output) proving the claim",
                   "auto_fixable": true | false,
                   "cluster_key": "docs:<root-cause-slug>",
                   "dedup_key": "walkthrough:${{ matrix.doc.path }}:<step-heading>"
                 }
               ]}
               ```
               Write `{"findings": []}` if nothing is wrong. Severity: 🔴 a default-path
               command in the doc fails outright; 🟠 the doc's claim about behavior is
               false but the underlying command doesn't crash; 🟡 a cosmetic/minor gap
               (a missing caveat, a stale example). `auto_fixable` = true only if the fix
               is small and locatable (~1-3 files, no design call).

               ### `cluster_key` — name the CAUSE, so guides you cannot see can merge with you
               You are one of many parallel judges, each walking a different guide and
               blind to the others. The same underlying defect usually breaks several
               guides at once, and it is ONE fix — so a synthesis step merges findings that
               share a `cluster_key`, and the maintainer gets one issue instead of five.
               (Five guides quoting one dead command really did become five issues in a
               single night.)

               So write `cluster_key` as a short kebab-case slug describing **what is
               broken in the product or in every guide**, with **no doc path, no guide
               name, and no step heading in it** — those go in `dedup_key`. Ask: "if
               another judge hit this exact problem in a different guide, would they write
               this same slug?" If the slug mentions your guide, they would not.
               - ✅ `docs:lemonade-server-serve-command-removed`
               - ✅ `docs:missing-extras-in-prerequisites`
               - ✅ `docs:gaia-chat-needs-chat-agent-package`
               - ❌ `docs:quickstart-step-2-fails` (names your guide and step, merges with nothing)
               Prefer the most obvious plain-English name for the cause; two judges
               converge on `lemonade-server-serve-command-removed` far more often than on
               a clever one.

               This file IS the deliverable. You have no Write tool: create it with Bash
               (a `cat > … <<'JSON'` heredoc). An empty `{"findings": []}` is a valid,
               useful result; ending without the file at all is a FAILED run and the job
               hard-fails on it.

            ## Budget
            You have --max-turns 25. Stop judging at ~3 turns remaining and spend them
            writing the findings file -- partial findings written beat complete findings lost.
          claude_args: |
            --max-turns 25
            --model ${{ env.WALKTHROUGH_JUDGE_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      # Same rationale as "Report executor status": continue-on-error hides a
      # judge crash from the job's pass/fail color. Also this is the one place
      # a human scanning the run can see, per doc, how many findings came out
      # and at what severity -- without downloading the artifact.
      - name: Report judge status + findings summary
        if: always()
        shell: powershell
        env:
          EXEC_FILE: ${{ steps.judge.outputs.execution_file }}
        run: |
          # Same whole-text scan as "Report executor status" above -- see the note there
          # for why line-by-line parsing misreads this file.
          $ok = $false
          if ($env:EXEC_FILE -and (Test-Path $env:EXEC_FILE)) {
            $raw = Get-Content -Raw $env:EXEC_FILE
            $hits = [regex]::Matches($raw, '"is_error"\s*:\s*(true|false)')
            if ($hits.Count -gt 0) {
              $ok = $hits[$hits.Count - 1].Groups[1].Value -eq 'false'
            } else {
              Write-Host "::warning::No is_error in $env:EXEC_FILE -- treating as a crash."
            }
          }
          $findingsFile = "findings-walkthrough-${{ matrix.doc.slug }}.json"
          if ($ok) {
            Write-Host "✅ Judge completed."
          } else {
            Write-Host "::warning title=Judge did not complete cleanly (${{ matrix.doc.path }})::log: $env:EXEC_FILE"
          }
          if (Test-Path $findingsFile) {
            $findingsObj = Get-Content $findingsFile -Raw | ConvertFrom-Json
            $total = @($findingsObj.findings).Count
            $bySeverity = @($findingsObj.findings) | Group-Object severity | ForEach-Object { "$($_.Name)=$($_.Count)" }
            $counts = if ($bySeverity) { $bySeverity -join ", " } else { "none" }
            Write-Host "Findings for ${{ matrix.doc.path }}: $total total -- $counts"
            "- **Judge (Opus):** $(if ($ok) { '✅' } else { '❌' }) -- **$total finding(s):** $counts" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "::warning::No findings file at $findingsFile -- judge did not write output (see executor/judge status above)"
            "- **Judge (Opus):** $(if ($ok) { '✅ ran' } else { '❌' }) but wrote no findings file" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Verify clean end state
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:RUN_DIR\lemonade.pid") {
            $procId = Get-Content "$env:RUN_DIR\lemonade.pid"
            Stop-Process -Id $procId -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Recurse -Force $env:RUN_DIR -ErrorAction SilentlyContinue
          if (Test-Path $env:RUN_DIR) {
            Write-Host "::warning::Run dir did not clean up: $env:RUN_DIR"
            "- **Cleanup:** ⚠️ run dir did not clean up" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          } else {
            Write-Host "Clean: run dir removed."
            "- **Cleanup:** ✅ run dir removed" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          # Confirm we never touched the SHARED 13305 instance other workflows
          # use -- this is a read-only health probe, never a cleanup action.
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:13305/api/v1/health" -TimeoutSec 3 -ErrorAction Stop
            Write-Host "Shared Lemonade (13305) still healthy: $($resp.StatusCode)"
          } catch {
            Write-Host "Shared Lemonade (13305) not reachable right now -- not this workflow's concern; confirming only that we did not kill it if it WAS up."
          }
          "- **End:** $(Get-Date -Format o)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: findings-walkthrough-${{ matrix.doc.slug }}
          path: findings-walkthrough-${{ matrix.doc.slug }}.json
          # The judge writes `{"findings": []}` even when a doc is clean, so a missing file
          # means the judge never ran. Fail — a silent skip reads as "walked, all good".
          if-no-files-found: error

  # Collect every matrix job's findings, run the deterministic dedup pass over
  # them, and file ONE issue per surviving defect. Same conventions as
  # claude-nightly-audit.yml's synthesis job (label scheme, cluster/dedup keys,
  # evidence gate, job-summary report) -- see the weekly-audit-patterns skill.
  synthesize:
    needs: [discover, walkthrough]
    if: github.repository == 'amd/gaia' && !cancelled() && needs.discover.outputs.docs != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all findings
        uses: actions/download-artifact@v8
        with:
          path: walkthrough-findings

      # Raw, deterministic tally -- independent of whether the Claude
      # synthesis step below succeeds. If that step crashes, this is still on
      # the record: how many matrix jobs actually reported in, and how many
      # findings they carried in total, per doc. Grep-able in the job log and
      # visible in the run's step summary either way.
      - name: Raw findings tally (pre-synthesis)
        run: |
          set -euo pipefail
          echo "## 📊 Doc walkthrough — raw tally (pre-dedup)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          total_files=0
          total_findings=0
          {
            echo "| Doc | Findings |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in walkthrough-findings/findings-walkthrough-*/findings-walkthrough-*.json; do
            [ -f "$f" ] || continue
            total_files=$((total_files + 1))
            count=$(jq '.findings | length' "$f" 2>/dev/null || echo "unreadable")
            doc_path=$(jq -r '.findings[0].path // "unknown"' "$f" 2>/dev/null || echo "unreadable")
            echo "$f -> path=$doc_path count=$count"
            if [ "$count" != "unreadable" ]; then
              total_findings=$((total_findings + count))
              echo "| \`$doc_path\` | $count |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$f\` | ⚠️ unreadable JSON |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**$total_files findings file(s) reported in, $total_findings raw finding(s) before dedup/verification.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Reported in: $total_files files, $total_findings raw findings before dedup"

      # The static audit has always refused to synthesize off a partial sweep; the
      # walkthrough only tallied and carried on, so a night where every guide's judge died
      # reached synthesis with zero findings and reported "nothing to file" — a crash
      # reading as a pass (#3058). Every discovered doc writes a findings file even when
      # clean, so a short count means guides went unwalked. Fail instead of filing.
      - name: Require every discovered doc to have reported in
        env:
          EXPECTED_DOCS: ${{ needs.discover.outputs.docs }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$EXPECTED_DOCS" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          got=$(find walkthrough-findings -name 'findings-walkthrough-*.json' | wc -l)
          if [ "$got" -lt "$expected" ]; then
            echo "::error title=Doc walkthrough::Only $got/$expected guides produced findings — $((expected - got)) went unverified. Not synthesizing off a partial sweep."
            exit 1
          fi
          echo "All $got/$expected guides reported in."

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `weekly-audit` is a PROVENANCE label shared with claude-nightly-audit.yml, not a
          # cadence one. See that workflow's header for why it keeps the name.
          gh label create weekly-audit --color 5319e7 \
            --description "Filed by a proactive Claude audit (nightly code audit or weekly doc walkthrough)" \
            2>/dev/null && echo "created weekly-audit label" || echo "weekly-audit label already exists"
          gh label create audit-wontfix --color cccccc \
            --description "Accepted debt -- the audits will never re-file this finding" \
            2>/dev/null && echo "created audit-wontfix label" || echo "audit-wontfix label already exists"

      # Same deterministic dedup pass the nightly audit runs — and the ONLY place this
      # workflow gets cross-guide memory. Its per-guide judges are blind to each other, so
      # without this five guides quoting one dead command file five issues in a night.
      # It merges shared cluster keys, flags likely siblings whose keys disagreed, and
      # searches the WHOLE open backlog rather than just this workflow's own label.
      - name: Dedupe findings into a synthesis worklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/audit/prepare_synthesis.py \
            --findings-dir walkthrough-findings \
            --repo "${{ github.repository }}" \
            --out synthesis-input.json \
            --dossier synthesis-dossier.md
          {
            echo "## 🔁 Dedup pass"
            echo ""
            python3 -c "import json; c=json.load(open('synthesis-input.json'))['counts']; print(f\"{c['raw_findings']} raw findings → **{c['clusters']} distinct defects** ({c['new']} new, {c['already_filed']} already filed, {c['suppressed']} suppressed), searched {c['open_issues_searched']} open issues.\")"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # A dry run is only prompt-enforced, and a mode that silently isn't dry is worse
      # than no mode at all. Record the watermark now and check it afterwards.
      - name: Record the issue watermark (dry run)
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --repo "${{ github.repository }}" --state all --limit 1 \n            --json number --jq '.[0].number // 0' > .issue-watermark
          echo "Highest issue before synthesis: $(cat .issue-watermark)"

      - name: Synthesize and file one issue per defect
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10  # v1.0.210
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # See the executor step's note — scheduled runs are actored by a bot.
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            You are the synthesis step of GAIA's weekly DOC WALKTHROUGH (the
            execution-based sibling of the static nightly audit -- see
            docs/plans/weekly-doc-walkthrough-audit.md). A deterministic pass has ALREADY
            merged the per-guide judges' findings into distinct defects and searched the
            whole open backlog for each. Your job is the part a script cannot do: verify
            the evidence, decide new-vs-already-tracked, and write for a human.

            REPO: ${{ github.repository }}
            DRY RUN: ${{ github.event.inputs.dry_run || 'false' }}
            RUN LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## First actions
            1. Read `synthesis-dossier.md` -- your worklist. One section per NEW defect,
               each with its locations, a ranked list of possibly-matching open issues,
               and (where the per-guide judges disagreed on a key) its likely siblings in
               this same run. Defects listed as already-filed or suppressed at the bottom
               are **already handled -- do not act on them at all**.
            2. Read `CLAUDE.md` -> "Issue Response Guidelines" for tone/format.
            3. `synthesis-input.json` has the same data structured, if you need a field
               the dossier elides -- including the full location list when truncated.
            If the dossier reports malformed findings or that the judges barely clustered,
            say so in the run report: that is a judge-prompt bug a human needs to see.
            You do NOT need to list issues or rebuild key sets -- that is done.

            ## Merge across guides BEFORE you file -- this workflow's signature failure
            Each guide was judged by its own Claude job, blind to every other guide. One
            broken thing therefore arrives as several defects worded differently. The
            dossier's ⚠ sibling lines are exactly those: **if one fix would close a group
            of them, they are ONE issue.** File it once, list every guide it breaks, and
            skip the other sections. Five guides quoting one dead Lemonade command became
            five separate issues in a single night -- that is the bug you are preventing.

            ## For each NEW defect, choose exactly one of three outcomes

            ### (a) DROP it -- the evidence gate
            Drop any finding whose `evidence` doesn't substantiate its `title`; spot-check
            by reading the cited transcript excerpt or doc section yourself before filing.
            **🟡 (low) defects are never filed** -- they go in the run report only.

            ### (b) COMMENT on an existing issue -- 🔴/🟠 only, check this BEFORE filing
            The dossier's candidates come from the WHOLE open backlog, not just this
            workflow's label, so a human-filed or long-milestoned issue tracking the same
            defect is visible. Open the top candidates and read them. If one already tracks
            it, comment instead of filing:
            `gh issue comment <n> --repo ${{ github.repository }} --body-file <file>`
            The comment adds only what is NEW (the extra guides this run found, fresh
            transcript evidence) and never restates the issue. End it with
            `<!-- audit-cluster: <cluster_key> -->` so future runs match it by key.
            A candidate matches when the same FIX closes both. Err toward commenting.

            ### (c) FILE ONE issue -- 🔴/🟠 only
            (This workflow finds no security issues -- that lens belongs to
            claude-security-audit.yml.) Write the body to a temp file, then
            `gh issue create --repo ${{ github.repository }} --label weekly-audit --title "<title>" --body-file <file>`
            WITHOUT the `bug` label.

            **One issue per DEFECT, listing every guide it breaks.** The title names the
            defect, never one guide: "The documented Lemonade start command no longer
            exists (5 guides)", not "quickstart.mdx step 2 fails".

            Body -- follow CLAUDE.md → "How You Communicate": the opening line says what
            broke and who it hurts in plain words; mechanical rows go in a collapsed
            `<details>`. The blank line after `</summary>` is REQUIRED or GitHub renders
            the block as literal text. Both markers are REQUIRED -- they drive the next
            run's dedup:
            ```
            <one paragraph: what's wrong + the concrete impact, in plain words>

            <details>
            <summary>🔍 Evidence and locations</summary>

            **Severity:** 🔴 high / 🟠 medium
            **Auto-fixable:** yes — apply `bug` to let auto-fix open the PR  |  no — needs a human

            | Guide · step | Evidence (transcript excerpt) |
            |---|---|
            | `path` · `symbol` | <that location's evidence> |
            </details>

            Not acting on this? Close it with the `audit-wontfix` label and the audit will
            never re-file it. Applying `bug` instead hands it to the existing auto-fix job.

            <!-- audit-cluster: <cluster_key> -->
            <!-- audit-key: <the first location's dedup_key> -->
            ```

            ## Write the run report to `triage-report.md` -- NOT to an issue
            A following step appends this file to the run's job summary. **Do not file a
            "Doc walkthrough — <run-id>" issue; that convention is gone** -- those receipts
            piled up in the tracker with nothing actionable in them. The old parent-chain
            bookkeeping is gone with it: do not cross-link a previous run's issue, and never
            close one. (Commenting on a backlog issue that tracks a real defect — outcome (b)
            above — is a different thing, and is encouraged.)

            Write `triage-report.md`: a one-line tally, then the defects grouped by guide,
            most-severe-first (🔴 → 🟠 → 🟡), each line prefixed with its severity emoji.
            🟡 lines live here and nowhere else.
            ```
            ### Doc walkthrough
            Filed: 2 new (🔴 1 · 🟠 1) · commented on existing: 1 · low (report-only): 3 · dropped on evidence: 4

            - 🔴 The documented Lemonade start command no longer exists — breaks 5 guides — #<n>
            - 🟠 `gaia chat` needs the chat agent package the Prerequisites never install — commented on existing #1077
            - 🟡 `docs/guides/talk.mdx` example output is stale (report-only, no issue)
            ```

            ## If DRY RUN is true
            Run NO `gh issue create` and NO `gh issue comment` -- file and comment nothing.
            Do everything else, and in `triage-report.md` write what you WOULD have done
            (`would file:` / `would comment on #<n>:`).

            ## Rules
            - No Claude attribution anywhere (no "Generated with", no Co-Authored-By).
            - Do not open any PR and do not apply the `bug` label -- humans gate every
              code change.
            - Never close any issue.
            - Lead with the finding; keep each line to one sentence (CLAUDE.md issue style).
          claude_args: |
            --max-turns 32
            --model ${{ env.WALKTHROUGH_JUDGE_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      - name: Prove the dry run filed nothing
        if: always() && github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before=$(cat .issue-watermark)
          created=$(gh issue list --repo "${{ github.repository }}" --state all \n            --limit 100 --json number --jq "[.[] | select(.number > $before) | .number] | join(\", \")")
          if [ -n "$created" ]; then
            echo "::error title=Dry run was not dry::The synthesis step created issue(s) $created despite dry_run=true. Close them, then fix the dry-run instruction in the prompt."
            exit 1
          fi
          echo "✅ Dry run confirmed: no issue created above #$before."

      # The run receipt. Replaces the per-run "Doc walkthrough — <run-id>" ISSUE: a CI
      # run's bookkeeping belongs in the run, not the tracker.
      - name: Publish the triage report to the job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f triage-report.md ]; then
            cat triage-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ No triage report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The synthesis step wrote no \`triage-report.md\`. See the step status below." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the walkthrough filed output
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Don't trust step outcome (continue-on-error masks it; an install
          # crash exits before it's set). Check the real artifact the action
          # writes on completion -- same verification claude-nightly-audit.yml
          # uses for its own synthesis step.
          ok=false
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            is_err=$(jq -s -r '[.. | objects | select(has("is_error")) | .is_error] | .[-1]' "$EXEC_FILE" 2>/dev/null)
            [ "$is_err" = "false" ] && ok=true
          fi
          if [ "$ok" = "true" ]; then
            echo "✅ Weekly doc walkthrough synthesis completed (log: $EXEC_FILE)"
          else
            # Hard-fail for the same reason as claude-nightly-audit.yml: a green run that
            # synthesised nothing is indistinguishable from one that found nothing.
            echo "::error title=Weekly doc walkthrough did not complete::The synthesis step crashed or errored before finishing. Re-run: $RUN_URL"
            exit 1
          fi
