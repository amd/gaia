# SPDX-License-Identifier: MIT
#
# Build the terminal hub and its installers for a final release, then:
#
#   GitHub release  — the terminal installers (.pkg/.deb/.rpm and the one
#                     Windows setup) plus gaia-installers-SHA256SUMS.txt. The
#                     website's download buttons link these; publish.yml
#                     attaches everything else (desktop app, raw binaries).
#   Agent Hub (R2)  — terminal-hub's six raw binaries, and nothing else. The
#                     flagship agent's binaries.lock.json pins them, so its npm
#                     package and `gaia hub install gaia` fetch them from there.
#
# Installers are not uploaded to R2: install.sh / install.ps1 and the website
# take everything from the GitHub release, so an R2 copy would have no reader.
# Versions published before this change stay on R2 untouched.
#
# The R2 publish goes through the Worker's /publish endpoint, which computes
# the SHA-256 server-side and stores each object immutably at
# agents/<id>/<version>/<filename>. Re-running a published version is a no-op
# (409 version_exists is reconciled by byte-comparison, not overwritten).

name: Publish Hub Components (R2)

on:
  push:
    # Not for a release candidate (vX.Y.Z-rcN): the catalog has no pre-release
    # channel and picks latest_version by highest SemVer, so an RC published to
    # these immutable paths would become what install.sh offers everyone.
    tags:
      - 'v*'
      - '!v*-rc*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing to R2 or the GitHub release'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERMINAL_HUB_MANIFEST: hub/components/terminal-hub/gaia-agent.yaml

jobs:
  # ── Resolve each component's own version ───────────────────────────────────
  # Every component publishes under the version in its OWN manifest. They are
  # independent of the core release and of each other, so a terminal-hub rebuild
  # ships without a core release and bumping one never forces the other.
  version:
    name: Resolve & gate version
    runs-on: ubuntu-latest
    outputs:
      tui_version: ${{ steps.v.outputs.tui_version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the flagship gate below compares against its agent tag

      # The Windows setup attached below bundles the flagship the lock pins.
      # Same gate as publish.yml's validate: never ship one older than the release.
      - name: Verify the flagship agent is built from this release
        if: github.event_name != 'workflow_dispatch'
        run: python3 util/check_flagship_release.py --ref "${GITHUB_SHA}"

      # terminal-hub ships as part of the core release and carries its version,
      # deliberately: one number for the whole release is simpler to reason
      # about than two.
      #
      # A TAG therefore requires the manifest to already match it (asserted
      # below). A DISPATCH does not: re-running a publish, or shipping a rebuilt
      # binary between core releases, must not require cutting a core release —
      # that coupling is what made every terminal-hub re-run fail.
      #
      # It still publishes under the version in its own manifest, read by
      # publish_to_r2.py. The assertion keeps it equal to the release; it is
      # not what supplies the path.
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          read_ver() { python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['version'])" "$1"; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CORE="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gaia/version.py').read_text()).group(1))")"
            if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            CORE="${GITHUB_REF_NAME#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          TUI_V="$(read_ver "${TERMINAL_HUB_MANIFEST}")"

          for pair in "terminal-hub:${TUI_V}" "core:${CORE}"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if ! printf '%s' "${val}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::${name} version '${val}' is not a valid x.y.z version."
              exit 1
            fi
          done

          # terminal-hub ships as part of the core release and carries its
          # version, so a TAG must find it already bumped: publishing under a
          # stale version writes to an immutable path that cannot be corrected,
          # and the catalog picks latest_version by highest SemVer, so a stale
          # one is not even reachable as "latest".
          #
          # A DISPATCH is deliberately exempt. That is the whole point of the
          # split: re-running a component publish, or shipping a rebuilt binary
          # between core releases, must not require cutting a core release.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "${TUI_V}" != "${CORE}" ]; then
              echo "::error file=${TERMINAL_HUB_MANIFEST}::version ${TUI_V} does not match the release ${CORE}. Bump it before tagging — R2 paths are immutable, so publishing under a stale version cannot be undone."
              exit 1
            fi
            echo "✓ ${TERMINAL_HUB_MANIFEST} = ${TUI_V}"
          fi

          echo "version=${CORE}"       >> "$GITHUB_OUTPUT"
          echo "tui_version=${TUI_V}"  >> "$GITHUB_OUTPUT"
          echo "core release : ${CORE}  (min_gaia_version gate only)"
          echo "terminal-hub : ${TUI_V} -> agents/terminal-hub/${TUI_V}/ (raw binaries)"

      # A manifest can agree with the tag and STILL be a lie: the terminal hub
      # needs daemon host API v1.1, which released 0.22.0 does not serve.
      # The guard reads what each release shipped from its published PyPI wheel,
      # because this tree is ahead of all of them.
      - name: Assert each component's declared minimum core can serve it
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python util/check_component_core_api.py --release-version "${VERSION}"

  # ── Prove the Worker builds, before anything decides to deploy it ───────────
  # Runs on dry runs too, which is the point: the deploy job below is skipped on
  # a dry run, so without this its code path would first execute during a live
  # release. `deploy:dry-run` bundles and resolves wrangler.toml exactly as a
  # real deploy does, minus the upload.
  worker-check:
    name: Check Agent Hub Worker
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/agent-hub/package-lock.json

      - working-directory: workers/agent-hub
        run: npm ci

      # `npm run typecheck` not `tsc --noEmit`: the script also checks
      # tsconfig.test.json, and the suite below is what actually guards the
      # /publish contract every hub release depends on.
      - name: Type-check
        working-directory: workers/agent-hub
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: workers/agent-hub
        run: npm test

      - name: Bundle (dry-run deploy)
        working-directory: workers/agent-hub
        run: npm run deploy:dry-run

  # ── Bring the Worker up to date before anything is uploaded to it ───────────
  # The Worker validates every manifest it accepts, so a Worker older than the
  # manifests rejects a release that is perfectly valid. That is not theoretical:
  # `go` and `typescript` were added to VALID_LANGUAGES in July, the Worker was
  # never redeployed, and every publish since died on
  #   invalid_manifest: language "go" is not supported. Use one of: cpp, python
  # — an error quoting a list that no longer exists in the source. There is no
  # other deploy path (agent_hub_worker_ci.yml only tests), so the Worker drifts
  # until someone runs `wrangler deploy` by hand.
  #
  # A SECOND environment, not agent-publish, and not no-environment at all.
  #
  # GitHub raises one approval per batch of jobs that pend together. This job
  # must finish before the publishes, so putting it in agent-publish costs a
  # second prompt. Dropping `environment:` entirely would fix that but throw
  # away more than the prompt: agent-publish also carries the deployment ref
  # allowlist (main / v* / agent-pkg-*), and without it anyone with write access
  # could dispatch this workflow from an arbitrary branch with dry_run unchecked
  # and push that branch's Worker straight to production — the Worker being the
  # manifest validator and the holder of the R2 binding.
  #
  # worker-deploy therefore has NO required reviewers (so no second prompt) but
  # the SAME ref allowlist as agent-publish, and holds the Cloudflare secrets so
  # they stay environment-scoped rather than readable by every workflow.
  deploy-worker:
    name: Deploy Agent Hub Worker
    needs: [version, worker-check]
    # Neither ancestor is conditionally skippable today, so this is not a live
    # bug -- but the bare comparison below has no status-check function, which
    # means GitHub Actions implicitly ANDs it with success() (the same pattern
    # that broke redeploy-website, #3929). Making that explicit here means a
    # future change that makes either ancestor conditional can't silently
    # reintroduce the ancestor-skip bug.
    if: |
      !cancelled()
      && needs.version.outputs.dry_run == 'false'
      && needs.version.result == 'success'
      && needs.worker-check.result == 'success'
    runs-on: ubuntu-latest
    environment: worker-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/agent-hub/package-lock.json

      - working-directory: workers/agent-hub
        run: npm ci

      - name: Deploy
        working-directory: workers/agent-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::missing environment secret(s) on worker-deploy:${missing}. The Agent Hub Worker validates the manifests this workflow uploads, so publishing without deploying it first is how a stale validator rejects a valid release. Create a Cloudflare API token from the 'Edit Cloudflare Workers' template (it must also cover R2 for the bucket binding) and add both to the worker-deploy environment (which has no reviewers, so the release still needs only one approval). See workers/agent-hub/README.md."
            exit 1
          fi
          # Stamp the commit so the check below can prove WHICH build went live.
          npx wrangler deploy --var WORKER_BUILD:"${GITHUB_SHA}"
          echo "✓ deployed ${GITHUB_SHA}"

      # Assert the live Worker is the build we just pushed. Curling the same base
      # URL the publish steps use, not the custom domain: CI publishes through
      # workers.dev because the WAF on hub.amd-gaia.ai blocks large multipart
      # uploads (wrangler.toml), so that is the origin whose freshness matters.
      - name: Verify the deployed build is live
        env:
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          # No default. Falling back to the custom domain would verify a
          # DIFFERENT origin than the publish jobs upload to (they go through
          # workers.dev because the WAF fronts hub.amd-gaia.ai), so a silent
          # default here reports freshness for something we are not publishing to.
          base="${GAIA_HUB_PUBLISH_URL:-}"
          if [ -z "${base}" ]; then
            echo "::error::GAIA_HUB_PUBLISH_URL resolved empty for this job. It must be a REPOSITORY variable — an environment-scoped one resolves empty here, and this check would then target the custom domain rather than the origin the publish jobs POST to."
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS --max-time 15 "${base}/health" | python -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "✓ ${base} is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt ${i}: ${base}/health reports build='${live:-<none>}', want '${GITHUB_SHA}'; retrying in 5s"
            sleep 5
          done
          echo "::error::${base} is not serving the build just deployed (wanted ${GITHUB_SHA}). Publishing now would upload against a Worker whose manifest validator is not the one in this ref — the exact failure this job exists to prevent. Check the Cloudflare dashboard before re-running."
          exit 1

  # ── Binaries + native installers ───────────────────────────────────────────
  # The jobs live in a reusable workflow so the PR gate (build_tui.yml) runs the
  # SAME ones. They were inline here, which meant a PR editing an installer
  # script had no CI and the first execution of that code was a live release.
  #
  # !cancelled() rather than a plain needs-success: an installer leg failing must
  # not stop the six raw binaries from publishing, because the flagship agent's
  # lock pins them. The two outputs are what let the jobs below tell those cases
  # apart.
  tui:
    name: TUI
    needs: version
    if: '!cancelled() && needs.version.result == ''success'''
    uses: ./.github/workflows/tui_installers.yml
    with:
      version: ${{ needs.version.outputs.tui_version }}
      sidecar: pinned

  # ── The one Windows setup: desktop app, terminal, or both ───────────────────
  # Its own workflow so a slow or failed desktop app build costs only this
  # setup, never the macOS and Linux packages or the raw binaries. It embeds the
  # desktop app setup build-installers.yml made: on a tag, from publish.yml's run
  # for the same commit (built before that run's approval gate, so no human
  # wait); on a dispatch, from the published v<version> release.
  windows-setup:
    name: Windows setup
    needs: [version, tui]
    if: '!cancelled() && needs.tui.outputs.binaries_ok == ''true'''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows_setup.yml
    with:
      version: ${{ needs.version.outputs.tui_version }}
      sidecar: pinned
      agent_ui_publish_run_sha: ${{ github.event_name == 'push' && github.sha || '' }}
      # A dispatch before that release exists fails here, loudly -- there is no
      # desktop app setup to embed yet.
      agent_ui_release: ${{ github.event_name != 'push' && format('v{0}', needs.version.outputs.tui_version) || '' }}


  # ── terminal-hub: publish the six raw binaries to the Agent Hub ─────────────
  # The flagship agent's binaries.lock.json pins these by hub URL and SHA-256,
  # so its npm package and `gaia hub install gaia` read them from R2. Nothing
  # reads the installers from R2, so they are not uploaded there; they go to
  # the GitHub release (github-release-installers below).
  terminal-hub:
    name: Publish terminal-hub
    needs: [version, worker-check, deploy-worker, tui]
    # deploy-worker is skipped on a dry run; a skipped dependency would skip this
    # job too, so admit 'skipped' explicitly while still refusing 'failure'.
    # !cancelled() rather than always(): always() survives a cancelled run, and
    # an upload that outlives Cancel lands in an immutable path.
    #
    # Only the raw binaries gate this job: one installer packaging tool breaking
    # must not take the hub publish, and redeploy-website with it, down too.
    if: |
      !cancelled()
      && needs.version.result == 'success'
      && needs.worker-check.result == 'success'
      && needs.tui.outputs.binaries_ok == 'true'
      && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    # agent-publish gates on a deployment tag allowlist that lives in repo settings,
    # not here: it must include v* or every release tag is rejected before any step
    # runs (#2935). It also requires a reviewer, so admitted v* runs pause for approval,
    # same as the agent-pkg-* tags the sibling release workflows already use.
    #
    # A dry run publishes nothing and reads no secret, so it takes no environment:
    # it needs no approval and runs from any branch. A dispatch with dry_run off
    # still lands in agent-publish, whose ref allowlist rejects a feature branch.
    environment: ${{ needs.version.outputs.dry_run == 'false' && 'agent-publish' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The exact bytes the tui workflow produced and the installers wrap.
      # Rebuilding here would publish a binary the installers do not contain.
      - uses: actions/download-artifact@v8
        with:
          name: tui-binaries
          path: bin

      # R2 stores bytes, not modes, so the executable bit an artifact download
      # drops does not matter here -- but a missing or truncated file does.
      - name: Show what will be published
        run: ls -l bin

      - name: Require the publish token
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GAIA_HUB_TOKEN:-}" ]; then
            echo "::error::missing environment secret GAIA_HUB_TOKEN on the agent-publish environment (must match the Worker's PUBLISH_TOKENS). See workers/agent-hub/README.md."
            exit 1
          fi

      - name: Require the publish URL
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GAIA_HUB_PUBLISH_URL:-}" ]; then
            echo "::error::missing repository variable GAIA_HUB_PUBLISH_URL — the Worker's workers.dev origin CI POSTs uploads to (the proxied hub.amd-gaia.ai custom domain's managed WAF blocks large uploads). Set it as a repository variable, or as an environment variable on the agent-publish environment. See workers/agent-hub/README.md."
            exit 1
          fi

      # No boto3 and no R2 S3 credentials: each binary is ~20 MB, far under the
      # Worker's 90 MiB body cap, so nothing here takes the direct-to-R2 lane.
      # publish_to_r2.py names the missing credentials if one ever grows past it.
      - name: Install publisher deps
        if: needs.version.outputs.dry_run == 'false'
        run: python -m pip install --upgrade requests pyyaml

      - name: Publish to the Agent Hub (POST /publish)
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          AGENT_HUB_PUBLISH_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          # Explicit =<platform-key> on every artifact: the publisher's
          # inference only special-cases email-agent-* filenames.
          python hub/agents/email/python/packaging/publish_to_r2.py \
            --base-url "${GAIA_HUB_PUBLISH_URL}" \
            --manifest "${TERMINAL_HUB_MANIFEST}" \
            --artifact "bin/gaia-linux-x64=linux-x64" \
            --artifact "bin/gaia-linux-arm64=linux-arm64" \
            --artifact "bin/gaia-darwin-x64=darwin-x64" \
            --artifact "bin/gaia-darwin-arm64=darwin-arm64" \
            --artifact "bin/gaia-win-x64.exe=win-x64" \
            --artifact "bin/gaia-win-arm64.exe=win-arm64" \
            --readme tui/README.md \
            --summary-out published.json
          echo "=== publish summary (binaries) ==="
          cat published.json

  # No environment, so no approval prompt: this only says why the release is
  # missing its Windows setup.
  windows-setup-missing:
    name: Windows setup not attached
    needs: [version, windows-setup]
    if: '!cancelled() && needs.version.result == ''success'' && needs.windows-setup.outputs.ok != ''true'''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::warning::the Windows setup did not build and smoke-test cleanly, so gaia-${{ needs.version.outputs.tui_version }}-win-x64-setup.exe is not attached to the release. Everything else is. Fix the Windows setup run and re-run this workflow to attach it."

  # ── Attach the terminal installers to the GitHub release ─────────────────────
  # The website's download buttons and the release page are where users get
  # these, and each click lands in GitHub's per-asset download_count.
  # publish.yml attaches the raw binaries and the desktop app; these installers
  # are built only here, so this job attaches them.
  #
  # No environment and no R2 credentials: it only touches the GitHub release,
  # which publish.yml creates after its own approval gate. --clobber makes a
  # re-run replace rather than fail. It requests its own website redeploy, so
  # the installers show up however late the release appears or the job re-runs.
  #
  # A dry run stops after writing the checksum file and looking the release up,
  # so the file list and the checksums are proven without touching any release.
  github-release-installers:
    name: Attach installers to the GitHub release
    needs: [version, tui, windows-setup]
    if: |
      !cancelled()
      && needs.version.result == 'success'
      && (needs.tui.outputs.installers_ok == 'true' || needs.windows-setup.outputs.ok == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        if: needs.tui.outputs.installers_ok == 'true'
        with:
          pattern: tui-installers-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        if: needs.windows-setup.outputs.ok == 'true'
        with:
          name: windows-setup
          path: dist

      # The names come from installer/tui/artifacts.py, the one table the build
      # and this attach read, and publish-args fails if a named file is missing
      # -- so this never attaches a partial set without saying so.
      - name: List the installers and write their checksums
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
          INSTALLERS_OK: ${{ needs.tui.outputs.installers_ok }}
          WINDOWS_SETUP_OK: ${{ needs.windows-setup.outputs.ok }}
        run: |
          set -euo pipefail
          scope=()
          if [ "${INSTALLERS_OK}" != "true" ]; then
            scope=(--platform win-x64)
            echo "::warning::the macOS/Linux installers did not build, so only the Windows setup is attached to v${VERSION}."
          elif [ "${WINDOWS_SETUP_OK}" != "true" ]; then
            scope=(--exclude-platform win-x64)
            echo "::warning::the Windows setup did not build, so it is not attached to v${VERSION}."
          fi
          python installer/tui/artifacts.py publish-args \
            --version "${VERSION}" --dir dist "${scope[@]}" > specs.txt
          : > files.txt
          while IFS= read -r spec; do
            [ -n "${spec}" ] && printf '%s\n' "${spec%=*}" >> files.txt
          done < specs.txt
          if [ ! -s files.txt ]; then
            echo "::error::installer/tui/artifacts.py named no installers to attach. Nothing was attached."
            exit 1
          fi
          mapfile -t files < files.txt
          (cd dist && sha256sum "${files[@]#dist/}") > dist/gaia-installers-SHA256SUMS.txt
          cat dist/gaia-installers-SHA256SUMS.txt
          ls -l "${files[@]}"

      # On a tag push publish.yml creates the release behind its own approval,
      # so wait for it, bounded: a release that never appears is a failed
      # publish run, not something to wait out. A dispatch looks once: run
      # before the release exists (publishing terminal-hub ahead of a flagship
      # release, or a dry run), there is nothing to attach to yet.
      - name: Find the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.tui_version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          exists() { gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName >/dev/null 2>&1; }
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            if exists; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "✓ release ${TAG} exists"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "::warning::there is no GitHub release ${TAG} yet, so no installer is attached. publish.yml creates it on the tag; once it exists, re-run this job (it redeploys the website itself)."
            fi
            exit 0
          fi
          deadline=$(( SECONDS + 3 * 3600 ))
          until exists; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::timed out after 3h waiting for the GitHub release ${TAG}. publish.yml creates it; check that run, then re-run this job (it redeploys the website itself). Nothing was attached, so the website offers no terminal installer for ${TAG}."
              exit 1
            fi
            echo "waiting for release ${TAG}"
            sleep 60
          done
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Attach the installers and their checksums
        if: needs.version.outputs.dry_run == 'false' && steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          mapfile -t files < files.txt
          gh release upload "${TAG}" "${files[@]}" dist/gaia-installers-SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber
          echo "✓ attached ${#files[@]} installers to ${TAG}"

      - name: Redeploy the website to show them
        if: needs.version.outputs.dry_run == 'false' && steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy_website.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "✓ requested website redeploy (deploy_website.yml on main)"

  # ── The website builds its download links from the GitHub release at deploy
  # time, so a release only becomes visible after a rebuild. deploy_website.yml
  # auto-triggers on website/** only, and a release touches no such file.
  redeploy-website:
    name: Redeploy website
    # github-release-installers is not waited for: it redeploys the site itself
    # once it has attached.
    needs: [version, terminal-hub]
    # No status-check function in `needs.version.outputs...` means GitHub
    # implicitly ANDs this with success() -- so a 'skipped' terminal-hub (e.g.
    # worker-check failed, or tui's binaries were not ok) would silently skip
    # this too, with no error, even on a real release. The explicit intent:
    # redeploy only on a real (non-dry-run) release where the hub publish
    # actually succeeded, and never leave a cancelled run's ambiguous state
    # silently wired through.
    if: |
      !cancelled()
      && needs.version.outputs.dry_run == 'false'
      && needs.terminal-hub.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --repo: this job has no checkout, so gh cannot infer the repository.
          gh workflow run deploy_website.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "✓ requested website redeploy (deploy_website.yml on main)"
