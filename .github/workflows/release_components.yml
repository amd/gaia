# SPDX-License-Identifier: MIT
#
# Publish the two non-agent Hub packages to the Agent Hub R2 catalog:
#
#   terminal-hub  (type: component, Go)         — the `gaia tui` binary, 6 targets
#   agent-ui      (type: app, TypeScript)       — the Electron desktop installers
#
# Same pattern as release_agent_email.yml / release_agent_chat.yml: CI never
# talks to R2 directly, it POSTs to the Worker's /publish endpoint, which
# computes the SHA-256 server-side and stores each object immutably at
# agents/<id>/<version>/<filename>. Re-running a published version is a no-op
# (409 version_exists is reconciled by byte-comparison, not overwritten).
#
# Why these are Hub packages at all: the hub catalog is what the website builds
# its download surfaces from. Before this, the terminal hub had NO user-facing
# distribution — `docs/reference/cli.mdx` documented `gaia tui` while the only
# way to get the binary was `cd tui && make build`.
#
# Ordering note: terminal-hub builds its own binaries here and has no external
# dependency. agent-ui does NOT rebuild the Electron installers (that is
# build-installers.yml, which runs on the same tag) — it waits for that
# workflow to attach them to the GitHub release, then republishes them to R2.
# The wait is bounded and fails loudly; it never publishes a partial set.

name: Publish Hub Components (R2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing to R2'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERMINAL_HUB_MANIFEST: hub/components/terminal-hub/gaia-agent.yaml
  AGENT_UI_MANIFEST: hub/components/agent-ui/gaia-agent.yaml

jobs:
  # ── Resolve each component's own version ───────────────────────────────────
  # Every component publishes under the version in its OWN manifest. They are
  # independent of the core release and of each other, so a terminal-hub rebuild
  # ships without a core release and bumping one never forces the other.
  version:
    name: Resolve & gate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tui_version: ${{ steps.v.outputs.tui_version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      # Both components ship as part of the core release and carry its version,
      # deliberately: one number for the whole release is simpler to reason
      # about than three, and agent-ui's npm package already tracks
      # src/gaia/version.py through installer/version/bump-ui-version.mjs.
      #
      # A TAG therefore requires both manifests to already match it (asserted
      # below). A DISPATCH does not: re-running a publish, or shipping a rebuilt
      # binary between core releases, must not require cutting a core release —
      # that coupling is what made every terminal-hub re-run fail.
      #
      # Each still publishes under the version in its own manifest, read by
      # publish_to_r2.py. The assertion keeps them equal to the release; it is
      # not what supplies the path.
      - id: v
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          read_ver() { python -c "import yaml,sys; print(yaml.safe_load(open(sys.argv[1]))['version'])" "$1"; }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CORE="$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/gaia/version.py').read_text()).group(1))")"
            if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            CORE="${GITHUB_REF_NAME#v}"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

          TUI_V="$(read_ver "${TERMINAL_HUB_MANIFEST}")"
          UI_V="$(read_ver "${AGENT_UI_MANIFEST}")"

          for pair in "terminal-hub:${TUI_V}" "agent-ui:${UI_V}" "core:${CORE}"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if ! printf '%s' "${val}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::${name} version '${val}' is not a valid x.y.z version."
              exit 1
            fi
          done

          # Both components ship as part of the core release and carry its
          # version, so a TAG must find them already bumped: publishing under a
          # stale version writes to an immutable path that cannot be corrected,
          # and the catalog picks latest_version by highest SemVer, so a stale
          # one is not even reachable as "latest".
          #
          # A DISPATCH is deliberately exempt. That is the whole point of the
          # split: re-running a component publish, or shipping a rebuilt binary
          # between core releases, must not require cutting a core release.
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            fail=0
            for pair in "${TERMINAL_HUB_MANIFEST}:${TUI_V}" "${AGENT_UI_MANIFEST}:${UI_V}"; do
              m="${pair%:*}"; got="${pair##*:}"
              if [ "${got}" != "${CORE}" ]; then
                echo "::error file=${m}::version ${got} does not match the release ${CORE}. Bump it before tagging — R2 paths are immutable, so publishing under a stale version cannot be undone."
                fail=1
              else
                echo "✓ ${m} = ${got}"
              fi
            done
            [ "${fail}" -eq 0 ] || exit 1
          fi

          echo "version=${CORE}"       >> "$GITHUB_OUTPUT"
          echo "tui_version=${TUI_V}"  >> "$GITHUB_OUTPUT"
          echo "core release : ${CORE}  (min_gaia_version gate only)"
          echo "terminal-hub : ${TUI_V} -> agents/terminal-hub/${TUI_V}/"
          # agent-ui publishes under its manifest version, read by
          # publish_to_r2.py itself -- logged here, not passed as an output.
          echo "agent-ui     : ${UI_V} -> agents/agent-ui/${UI_V}/"

      # A manifest can agree with the tag and STILL be a lie: the terminal hub
      # needs daemon host API v1.1, which released 0.22.0 does not serve.
      # --verify-released re-reads what each release shipped from its published
      # wheel, because this tree is ahead of all of them.
      - name: Assert each component's declared minimum core can serve it
        shell: bash
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          python util/check_component_core_api.py \
            --verify-released \
            --release-version "${VERSION}"

  # ── Prove the Worker builds, before anything decides to deploy it ───────────
  # Runs on dry runs too, which is the point: the deploy job below is skipped on
  # a dry run, so without this its code path would first execute during a live
  # release. `deploy:dry-run` bundles and resolves wrangler.toml exactly as a
  # real deploy does, minus the upload.
  worker-check:
    name: Check Agent Hub Worker
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/agent-hub/package-lock.json

      - working-directory: workers/agent-hub
        run: npm ci

      # `npm run typecheck` not `tsc --noEmit`: the script also checks
      # tsconfig.test.json, and the suite below is what actually guards the
      # /publish contract every hub release depends on.
      - name: Type-check
        working-directory: workers/agent-hub
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: workers/agent-hub
        run: npm test

      - name: Bundle (dry-run deploy)
        working-directory: workers/agent-hub
        run: npm run deploy:dry-run

  # ── Bring the Worker up to date before anything is uploaded to it ───────────
  # The Worker validates every manifest it accepts, so a Worker older than the
  # manifests rejects a release that is perfectly valid. That is not theoretical:
  # `go` and `typescript` were added to VALID_LANGUAGES in July, the Worker was
  # never redeployed, and every publish since died on
  #   invalid_manifest: language "go" is not supported. Use one of: cpp, python
  # — an error quoting a list that no longer exists in the source. There is no
  # other deploy path (agent_hub_worker_ci.yml only tests), so the Worker drifts
  # until someone runs `wrangler deploy` by hand.
  #
  # A SECOND environment, not agent-publish, and not no-environment at all.
  #
  # GitHub raises one approval per batch of jobs that pend together. This job
  # must finish before the publishes, so putting it in agent-publish costs a
  # second prompt. Dropping `environment:` entirely would fix that but throw
  # away more than the prompt: agent-publish also carries the deployment ref
  # allowlist (main / v* / agent-pkg-*), and without it anyone with write access
  # could dispatch this workflow from an arbitrary branch with dry_run unchecked
  # and push that branch's Worker straight to production — the Worker being the
  # manifest validator and the holder of the R2 binding.
  #
  # worker-deploy therefore has NO required reviewers (so no second prompt) but
  # the SAME ref allowlist as agent-publish, and holds the Cloudflare secrets so
  # they stay environment-scoped rather than readable by every workflow.
  deploy-worker:
    name: Deploy Agent Hub Worker
    needs: [version, worker-check]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: worker-deploy
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: workers/agent-hub/package-lock.json

      - working-directory: workers/agent-hub
        run: npm ci

      - name: Deploy
        working-directory: workers/agent-hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ]  || missing="${missing} CLOUDFLARE_API_TOKEN"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::missing environment secret(s) on worker-deploy:${missing}. The Agent Hub Worker validates the manifests this workflow uploads, so publishing without deploying it first is how a stale validator rejects a valid release. Create a Cloudflare API token from the 'Edit Cloudflare Workers' template (it must also cover R2 for the bucket binding) and add both to the worker-deploy environment (which has no reviewers, so the release still needs only one approval). See workers/agent-hub/README.md."
            exit 1
          fi
          # Stamp the commit so the check below can prove WHICH build went live.
          npx wrangler deploy --var WORKER_BUILD:"${GITHUB_SHA}"
          echo "✓ deployed ${GITHUB_SHA}"

      # Assert the live Worker is the build we just pushed. Curling the same base
      # URL the publish steps use, not the custom domain: CI publishes through
      # workers.dev because the WAF on hub.amd-gaia.ai blocks large multipart
      # uploads (wrangler.toml), so that is the origin whose freshness matters.
      - name: Verify the deployed build is live
        env:
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          # No default. Falling back to the custom domain would verify a
          # DIFFERENT origin than the publish jobs upload to (they go through
          # workers.dev because the WAF fronts hub.amd-gaia.ai), so a silent
          # default here reports freshness for something we are not publishing to.
          base="${GAIA_HUB_PUBLISH_URL:-}"
          if [ -z "${base}" ]; then
            echo "::error::GAIA_HUB_PUBLISH_URL resolved empty for this job. It must be a REPOSITORY variable — an environment-scoped one resolves empty here, and this check would then target the custom domain rather than the origin the publish jobs POST to."
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            live="$(curl -fsS --max-time 15 "${base}/health" | python -c 'import json,sys; print(json.load(sys.stdin).get("build",""))' 2>/dev/null || true)"
            if [ "${live}" = "${GITHUB_SHA}" ]; then
              echo "✓ ${base} is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "attempt ${i}: ${base}/health reports build='${live:-<none>}', want '${GITHUB_SHA}'; retrying in 5s"
            sleep 5
          done
          echo "::error::${base} is not serving the build just deployed (wanted ${GITHUB_SHA}). Publishing now would upload against a Worker whose manifest validator is not the one in this ref — the exact failure this job exists to prevent. Check the Cloudflare dashboard before re-running."
          exit 1

  # ── Build the 6 TUI targets once, for both the raw publish and the installers ─
  # Split out of the publish job so the installers ship the EXACT bytes the hub
  # serves. Rebuilding them in each installer job would give four binaries that
  # are not the published one -- Go is not byte-reproducible across runners.
  # No `environment:`, so this starts without waiting on the release approval.
  tui-build:
    name: Build TUI binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Go links no Windows resource unless a .syso sits beside the main
      # package, so without this the published gaia-win-*.exe carries the
      # generic console icon and a blank Details tab. goversioninfo is a pinned
      # `tool` dependency in tui/go.mod, so this needs no extra install.
      - name: Generate Windows resources (icon + version)
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: tui/scripts/gen-winres.sh --version "${VERSION}"

      # Cross-compile the same 6 targets build_tui.yml produces, stamped with
      # the release version. CGO_ENABLED=0 keeps each binary static.
      - name: Build all targets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          mkdir -p bin
          PKG=github.com/amd/gaia/tui/internal/cli
          # The COMMIT's timestamp, never `now` — a wall-clock stamp makes every
          # rebuild of the same commit differ, so re-publishing a released
          # version can never reconcile against the bytes already stored.
          DATE="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          cd tui
          while read -r goos goarch platform; do
            EXT=""
            [ "${goos}" = "windows" ] && EXT=".exe"
            # -trimpath keeps the runner's absolute paths out of the binary.
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
              -ldflags="-s -w -X ${PKG}.version=${VERSION} -X ${PKG}.commit=${GITHUB_SHA} -X ${PKG}.date=${DATE}" \
              -o "../bin/gaia-${platform}${EXT}" ./cmd/gaia
            echo "built gaia-${platform}${EXT}"
          done <<'TARGETS'
          linux   amd64 linux-x64
          linux   arm64 linux-arm64
          darwin  amd64 darwin-x64
          darwin  arm64 darwin-arm64
          windows amd64 win-x64
          windows arm64 win-arm64
          TARGETS

      - name: Verify the built binary reports the release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          # `version` is a cobra subcommand — rootCmd sets no Version field, so
          # `--version` is an unknown flag and exits 1.
          # The linux-x64 build is the only one this runner can execute. A
          # stamped-but-wrong version would otherwise only surface to a user.
          got="$(./bin/gaia-linux-x64 version 2>&1 || true)"
          echo "gaia version -> ${got}"
          case "${got}" in
            *"${VERSION}"*) echo "✓ version stamp present" ;;
            *) echo "::error::built binary does not report ${VERSION} (got: ${got})"; exit 1 ;;
          esac

      # Reads the PE resource directory of the LINKED binary. Asserting the
      # .syso exists would prove nothing: the Go linker silently ignores a
      # resource object whose GOARCH suffix does not match the target, so the
      # only claim worth making is about the bytes that ship.
      - name: Verify the Windows binaries carry the icon
        run: |
          set -euo pipefail
          for exe in bin/gaia-win-x64.exe bin/gaia-win-arm64.exe; do
            python util/check_pe_resources.py \
              --expect-version "${{ needs.version.outputs.tui_version }}" "${exe}"
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: tui-binaries
          path: bin/
          retention-days: 7

  # ── Native double-click installers ─────────────────────────────────────────
  # Downloading gaia-win-x64.exe from the website gives a RAW binary that prints
  # "This is a command line tool" when double-clicked. These are the setup files
  # that replace that: they put gaia-tui and the gaia-agent sidecar on disk and
  # on PATH, with a Start Menu / desktop entry.
  #
  # win-arm64 and linux-arm64 get NO installer on purpose -- the flagship agent
  # publishes no build for either, so one would install a front end with nothing
  # behind it. fetch_sidecar.py refuses those platform keys outright.
  tui-installers:
    name: Build installers (${{ matrix.label }})
    needs: [version, tui-build]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's packaging tool breaking must not hide the other two.
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
            platforms: win-x64
          - label: macos
            os: macos-latest
            platforms: darwin-arm64 darwin-x64
          - label: linux
            os: ubuntu-latest
            platforms: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          name: tui-binaries
          path: bin

      # One staging directory per target, each holding exactly what the three
      # build scripts agree to consume: gaia-tui, gaia-agent, LICENSE.md.
      #
      # fetch_sidecar.py verifies the sidecar against the digest COMMITTED in
      # hub/agents/gaia/npm/binaries.lock.json, not one served by the hub it was
      # downloaded from, and refuses the lock's placeholder digest outright. This
      # step therefore stays red until the lock is regenerated -- intended: the
      # same placeholder already blocks `npx @amd-gaia/gaia`.
      - name: Stage payloads
        env:
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          for p in ${PLATFORMS}; do
            EXT=""
            case "${p}" in win-*) EXT=".exe" ;; esac
            mkdir -p "stage/${p}"
            cp "bin/gaia-${p}${EXT}" "stage/${p}/gaia-tui${EXT}"
            cp LICENSE.md "stage/${p}/LICENSE.md"
            chmod +x "stage/${p}/gaia-tui${EXT}"
            python installer/tui/fetch_sidecar.py --platform "${p}" --out "stage/${p}"
            ls -l "stage/${p}"
          done

      # ── Windows ──
      # The MSI is bundled, not downloaded at install time, so the setup works
      # offline. Same pinned source and size guard as build-installers.yml.
      - name: Download the pinned Lemonade MSI
        if: matrix.label == 'windows'
        run: |
          set -euo pipefail
          LEMONADE_VERSION=$(grep -oE 'LEMONADE_VERSION = "[^"]+"' src/gaia/version.py | cut -d'"' -f2)
          if [ -z "$LEMONADE_VERSION" ]; then
            echo "::error::Could not parse LEMONADE_VERSION from src/gaia/version.py" >&2
            exit 1
          fi
          URL="https://github.com/lemonade-sdk/lemonade/releases/download/v${LEMONADE_VERSION}/lemonade-server-minimal.msi"
          echo "Downloading Lemonade MSI v${LEMONADE_VERSION} from ${URL}"
          curl -fsSL --retry 3 --retry-delay 5 "${URL}" -o installer/lemonade-server-minimal.msi
          # The -minimal MSI is a bootstrap installer (~4-6MB) that fetches the
          # Lemonade runtime on first run, so this guards against an obviously
          # truncated download rather than pinning a size that moves between
          # upstream minor releases.
          SIZE=$(wc -c < installer/lemonade-server-minimal.msi)
          echo "Downloaded MSI size: ${SIZE} bytes"
          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::MSI smaller than 1MB; download likely corrupt or a 404 HTML body." >&2
            exit 1
          fi

      - name: Install NSIS
        if: matrix.label == 'windows'
        run: choco install nsis --no-progress -y

      - name: Build the Windows setup
        if: matrix.label == 'windows'
        run: |
          installer/tui/nsis/build-setup.sh \
            --version "${{ needs.version.outputs.tui_version }}" \
            --payload stage/win-x64 \
            --out dist \
            --lemonade-msi installer/lemonade-server-minimal.msi

      # ── macOS ──
      # --allow-unsigned is passed explicitly, and that is the honest state
      # today: these credentials are not configured for this repository, so the
      # .pkg files ship unsigned and users see Gatekeeper's "unidentified
      # developer" prompt. Say so in the release notes. build-pkg.sh refuses a
      # HALF-configured signing setup outright, and without this flag it refuses
      # an unconfigured one too -- so a secret that silently stopped resolving
      # turns the job red instead of quietly shipping an unsigned package.
      - name: Build the macOS packages
        if: matrix.label == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          UNSIGNED=""
          if [ -z "${APPLE_ID:-}${APPLE_TEAM_ID:-}${APPLE_INSTALLER_IDENTITY:-}" ]; then
            echo "::warning::No Apple credentials available to this job - the macOS packages will be UNSIGNED and Gatekeeper will warn users."
            UNSIGNED="--allow-unsigned"
          fi
          for arch in arm64 x64; do
            installer/tui/macos/build-pkg.sh \
              --version "${{ needs.version.outputs.tui_version }}" \
              --arch "${arch}" \
              --payload "stage/darwin-${arch}" \
              --out dist ${UNSIGNED}
          done

      # ── Linux ──
      # rpm supplies rpmbuild, which build-packages.sh refuses to run without --
      # skipping the .rpm would ship a half-empty release that reports green.
      # ruby-dev is fpm's own build dependency, not optional.
      - name: Install fpm
        if: matrix.label == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          fpm --version
          rpmbuild --version

      - name: Build the Linux packages
        if: matrix.label == 'linux'
        run: |
          installer/tui/linux/build-packages.sh \
            --version "${{ needs.version.outputs.tui_version }}" \
            --payload stage/linux-x64 \
            --out dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: tui-installers-${{ matrix.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── Prove each installer installs somewhere it was not built ───────────────
  # A separate job is a fresh VM, and the Linux legs run in clean containers.
  # That is the point: an installer verified only on the box that built it is
  # not verified -- the build host already has every dependency, the PATH entry,
  # and often the payload sitting in the working directory.
  tui-installers-smoke:
    name: Smoke-test installer (${{ matrix.label }})
    needs: [version, tui-installers]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            os: windows-latest
          - label: macos
            os: macos-latest
          - label: linux
            os: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tui-installers-${{ matrix.label }}
          path: dist

      - name: Windows — install, verify, uninstall
        if: matrix.label == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "dist/gaia-$env:VERSION-win-x64-setup.exe"
          $dir   = "$env:LOCALAPPDATA\Programs\GAIA"
          if (Test-Path $dir) { throw "$dir already exists before install - this runner is not clean" }

          $p = Start-Process -FilePath (Resolve-Path $setup) -ArgumentList '/S' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "setup exited $($p.ExitCode)" }

          foreach ($f in 'gaia-tui.exe','gaia-agent.exe','Uninstall.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "$f did not land in $dir" }
          }
          # The registry PATH, not $env:PATH: this process inherited its
          # environment before the install, so it cannot see the change.
          $regPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($regPath -notlike "*$dir*") { throw "install dir was not added to the user PATH" }
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GAIATerminalHub')) {
            throw "no Add/Remove Programs entry was registered"
          }

          $out = & "$dir\gaia-tui.exe" version 2>&1 | Out-String
          Write-Host "gaia-tui version -> $out"
          if ($out -notmatch [regex]::Escape($env:VERSION)) { throw "gaia-tui did not report $env:VERSION" }

          # Data the uninstaller must not touch.
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.gaia" | Out-Null
          Set-Content -Path "$env:USERPROFILE\.gaia\smoke-marker" -Value 'keep me'

          $u = Start-Process -FilePath "$dir\Uninstall.exe" -ArgumentList '/S' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "uninstaller exited $($u.ExitCode)" }
          # The uninstaller re-execs from a temp copy, so the original process is
          # still exiting when Start-Process returns.
          Start-Sleep -Seconds 12

          if (Test-Path $dir) { throw "$dir survived the uninstall: $(Get-ChildItem $dir | Out-String)" }
          $regPath = (Get-ItemProperty -Path 'HKCU:\Environment' -Name Path).Path
          if ($regPath -like "*Programs\GAIA*") { throw "install dir was left on the user PATH" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\GAIATerminalHub') {
            throw "the Add/Remove Programs entry survived the uninstall"
          }
          if (-not (Test-Path "$env:USERPROFILE\.gaia\smoke-marker")) {
            throw "the uninstaller deleted ~/.gaia - it must keep user data unless asked"
          }
          Write-Host "OK - installed, ran, uninstalled cleanly, user data intact"

      - name: macOS — install, verify, uninstall
        if: matrix.label == 'macos'
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          test ! -e /usr/local/bin/gaia-tui || { echo "::error::gaia-tui already present - runner is not clean"; exit 1; }

          # macos-latest is arm64, so only the arm64 package can be exercised
          # end to end. The x64 package is verified by its payload listing --
          # running it would need Rosetta, which the runner may not have.
          sudo installer -pkg "dist/gaia-${VERSION}-darwin-arm64.pkg" -target /
          for b in gaia-tui gaia-agent; do
            test -x "/usr/local/bin/${b}" || { echo "::error::${b} did not land in /usr/local/bin"; exit 1; }
          done
          test -f /usr/local/share/doc/gaia-tui/LICENSE.md \
            || { echo "::error::the package did not install LICENSE.md"; exit 1; }
          command -v gaia-tui >/dev/null || { echo "::error::gaia-tui is not on PATH"; exit 1; }
          got="$(gaia-tui version 2>&1)"
          echo "gaia-tui version -> ${got}"
          case "${got}" in *"${VERSION}"*) ;; *) echo "::error::gaia-tui did not report ${VERSION}"; exit 1 ;; esac
          pkgutil --pkg-info ai.amd.gaia.terminal-hub

          echo "--- x64 package payload ---"
          # --expand-full, not --payload-files: productbuild emits a PRODUCT
          # archive and pkgutil only lists payloads of COMPONENT packages.
          x64_tmp="$(mktemp -d)"
          trap 'rm -rf "${x64_tmp}"' EXIT
          pkgutil --expand-full "dist/gaia-${VERSION}-darwin-x64.pkg" "${x64_tmp}/expanded"
          find "${x64_tmp}/expanded" -path '*/Payload/usr/local/bin/*' -print
          for b in gaia-tui gaia-agent; do
            test -n "$(find "${x64_tmp}/expanded" -path "*/Payload/usr/local/bin/${b}" -print -quit)" \
              || { echo "::error::the x64 package does not carry ${b}"; exit 1; }
          done
          rm -rf "${x64_tmp}"
          trap - EXIT

          # A .pkg ships no uninstaller by macOS convention, so removal is the
          # documented manual one: delete the files and forget the receipt.
          sudo rm -f /usr/local/bin/gaia-tui /usr/local/bin/gaia-agent
          sudo rm -rf /usr/local/share/doc/gaia-tui
          sudo pkgutil --forget ai.amd.gaia.terminal-hub
          test ! -e /usr/local/bin/gaia-tui || { echo "::error::gaia-tui survived removal"; exit 1; }
          echo "OK - installed, ran, removed"

      - name: Linux — install, verify, uninstall in clean containers
        if: matrix.label == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          # One assertion per line, never `test A && test B`: a failing
          # left-hand side of an && list is exempt from errexit, so the list
          # returns 1 and the script sails on. That silently disarms the only
          # check that the package actually removed its binaries.
          echo "===== .deb on debian:bookworm ====="
          docker run --rm -v "${PWD}/dist:/pkg:ro" debian:bookworm bash -euo pipefail -c "
            test ! -e /usr/bin/gaia-tui
            dpkg -i /pkg/gaia_${VERSION}_amd64.deb
            test -x /usr/bin/gaia-tui
            test -x /usr/bin/gaia-agent
            command -v gaia-tui
            gaia-tui version | tee /tmp/v
            grep -q '${VERSION}' /tmp/v
            grep -q '^Terminal=true' /usr/share/applications/gaia-tui.desktop
            mkdir -p /root/.gaia && echo keep > /root/.gaia/smoke-marker
            dpkg -r gaia
            test ! -e /usr/bin/gaia-tui
            test ! -e /usr/bin/gaia-agent
            test -f /root/.gaia/smoke-marker
            echo 'OK - deb installed, ran, removed, user data intact'
          "
          echo "===== .rpm on fedora:latest ====="
          docker run --rm -v "${PWD}/dist:/pkg:ro" fedora:latest bash -euo pipefail -c "
            test ! -e /usr/bin/gaia-tui
            rpm -i /pkg/gaia-${VERSION}.x86_64.rpm
            test -x /usr/bin/gaia-tui
            test -x /usr/bin/gaia-agent
            command -v gaia-tui
            gaia-tui version | tee /tmp/v
            grep -q '${VERSION}' /tmp/v
            grep -q '^Terminal=true' /usr/share/applications/gaia-tui.desktop
            mkdir -p /root/.gaia && echo keep > /root/.gaia/smoke-marker
            rpm -e gaia
            test ! -e /usr/bin/gaia-tui
            test ! -e /usr/bin/gaia-agent
            test -f /root/.gaia/smoke-marker
            echo 'OK - rpm installed, ran, removed, user data intact'
          "

  # ── terminal-hub: publish the binaries and the installers ───────────────────
  terminal-hub:
    name: Publish terminal-hub
    needs: [version, worker-check, deploy-worker, tui-build, tui-installers-smoke]
    # deploy-worker is skipped on a dry run; a skipped dependency would skip this
    # job too, so admit 'skipped' explicitly while still refusing 'failure'.
    # !cancelled() rather than always(): always() survives a cancelled run, and
    # an upload that outlives Cancel lands in an immutable path.
    # tui-build and tui-installers-smoke must have genuinely SUCCEEDED, not
    # merely finished: publishing binaries whose installers never installed
    # would put an immutable, broken release on the hub.
    if: |
      !cancelled()
      && needs.version.result == 'success'
      && needs.worker-check.result == 'success'
      && needs.tui-build.result == 'success'
      && needs.tui-installers-smoke.result == 'success'
      && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    # agent-publish gates on a deployment tag allowlist that lives in repo settings,
    # not here: it must include v* or every release tag is rejected before any step
    # runs (#2935). It also requires a reviewer, so admitted v* runs pause for approval,
    # same as the agent-pkg-* tags the sibling release workflows already use.
    environment: agent-publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # The exact bytes tui-build produced and the installers were built around.
      # Rebuilding here would publish a binary the installers do not contain.
      - uses: actions/download-artifact@v8
        with:
          name: tui-binaries
          path: bin

      - uses: actions/download-artifact@v8
        with:
          pattern: tui-installers-*
          merge-multiple: true
          path: dist

      # R2 stores bytes, not modes, so the executable bit an artifact download
      # drops does not matter here -- but a missing or truncated file does.
      - name: Show what will be published
        run: ls -l bin dist

      - name: Require the publish token
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GAIA_HUB_TOKEN:-}" ]; then
            echo "::error::missing environment secret GAIA_HUB_TOKEN on the agent-publish environment (must match the Worker's PUBLISH_TOKENS). See workers/agent-hub/README.md."
            exit 1
          fi

      - name: Require the publish URL
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GAIA_HUB_PUBLISH_URL:-}" ]; then
            echo "::error::missing repository variable GAIA_HUB_PUBLISH_URL — the Worker's workers.dev origin CI POSTs uploads to (the proxied hub.amd-gaia.ai custom domain's managed WAF blocks large uploads). Set it as a repository variable, or as an environment variable on the agent-publish environment. See workers/agent-hub/README.md."
            exit 1
          fi

      - name: Install publisher deps
        if: needs.version.outputs.dry_run == 'false'
        run: python -m pip install --upgrade requests pyyaml boto3

      - name: Publish to the Agent Hub (POST /publish)
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          AGENT_HUB_PUBLISH_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
          # Artifacts at/over 90 MiB cannot travel through the Worker at all
          # (Cloudflare caps request bodies at 100 MB on Free/Pro), so the
          # publisher PUTs them straight into R2 and publishes them by
          # reference. Only the Agent UI installers hit this today.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Explicit =<platform-key> on every artifact: the publisher's
          # inference only special-cases email-agent-* filenames.
          python hub/agents/email/python/packaging/publish_to_r2.py \
            --base-url "${GAIA_HUB_PUBLISH_URL}" \
            --manifest "${TERMINAL_HUB_MANIFEST}" \
            --artifact "bin/gaia-linux-x64=linux-x64" \
            --artifact "bin/gaia-linux-arm64=linux-arm64" \
            --artifact "bin/gaia-darwin-x64=darwin-x64" \
            --artifact "bin/gaia-darwin-arm64=darwin-arm64" \
            --artifact "bin/gaia-win-x64.exe=win-x64" \
            --artifact "bin/gaia-win-arm64.exe=win-arm64" \
            --readme tui/README.md \
            --summary-out published.json
          echo "=== publish summary (binaries) ==="
          cat published.json

      # Must stay SECOND: the Worker fills a version's singular `artifact` field
      # from the FIRST publish, and that is the field src/gaia/hub/installer.py
      # downloads -- publish a setup.exe first and hub installs fetch an
      # installer where they expect a binary. The platform keys are deliberately
      # not the six standard ones, so the website's one-download-per-artifact
      # build cannot confuse a setup with the raw binary of the same target.
      - name: Publish the installers (POST /publish)
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          AGENT_HUB_PUBLISH_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.version.outputs.tui_version }}
        run: |
          set -euo pipefail
          python hub/agents/email/python/packaging/publish_to_r2.py \
            --base-url "${GAIA_HUB_PUBLISH_URL}" \
            --manifest "${TERMINAL_HUB_MANIFEST}" \
            --artifact "dist/gaia-${VERSION}-win-x64-setup.exe=win-x64-setup" \
            --artifact "dist/gaia-${VERSION}-darwin-arm64.pkg=darwin-arm64-pkg" \
            --artifact "dist/gaia-${VERSION}-darwin-x64.pkg=darwin-x64-pkg" \
            --artifact "dist/gaia_${VERSION}_amd64.deb=linux-x64-deb" \
            --artifact "dist/gaia-${VERSION}.x86_64.rpm=linux-x64-rpm" \
            --summary-out published-installers.json
          echo "=== publish summary (installers) ==="
          cat published-installers.json

  # ── agent-ui: republish the installers build-installers.yml already made ────
  agent-ui:
    name: Publish agent-ui
    needs: [version, worker-check, deploy-worker]
    # deploy-worker is skipped on a dry run; a skipped dependency would skip this
    # job too, so admit 'skipped' explicitly while still refusing 'failure'.
    # !cancelled() rather than always(): always() survives a cancelled run, and
    # an upload that outlives Cancel lands in an immutable path.
    if: |
      !cancelled()
      && needs.version.result == 'success'
      && needs.worker-check.result == 'success'
      && (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    # Same tag-allowlist requirement as terminal-hub above (#2935).
    environment: agent-publish
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # build-installers.yml runs on this same tag, so the assets may not exist
      # yet. Wait for the full set, bounded — and fail loudly on timeout rather
      # than publishing a partial platform set that the catalog would then
      # advertise as complete.
      # Before the wait, not after: this job can sit for up to an hour on the
      # installer assets and then pull ~400 MB, and discovering a missing secret
      # at the end wastes all of it. Covers the R2 credentials too — the
      # installers are large enough to take the direct-to-R2 lane, so those are
      # as load-bearing here as the hub token.
      - name: Require the publish credentials
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${GAIA_HUB_TOKEN:-}" ]        || missing="${missing} GAIA_HUB_TOKEN"
          [ -n "${R2_ACCESS_KEY_ID:-}" ]      || missing="${missing} R2_ACCESS_KEY_ID"
          [ -n "${R2_SECRET_ACCESS_KEY:-}" ]  || missing="${missing} R2_SECRET_ACCESS_KEY"
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing="${missing} CLOUDFLARE_ACCOUNT_ID"
          if [ -n "${missing}" ]; then
            echo "::error::missing secret(s):${missing}. GAIA_HUB_TOKEN must match the Worker's PUBLISH_TOKENS; the R2_* pair are R2 S3 credentials (Cloudflare -> R2 -> Manage API Tokens, Object Read & Write) needed because these installers exceed the Worker request-body cap and go straight to R2. See workers/agent-hub/README.md."
            exit 1
          fi

      - name: Require the publish URL
        if: needs.version.outputs.dry_run == 'false'
        env:
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${GAIA_HUB_PUBLISH_URL:-}" ]; then
            echo "::error::missing repository variable GAIA_HUB_PUBLISH_URL — the Worker's workers.dev origin CI POSTs uploads to (the proxied hub.amd-gaia.ai custom domain's managed WAF blocks large uploads). Set it as a repository variable, or as an environment variable on the agent-publish environment. See workers/agent-hub/README.md."
            exit 1
          fi

      - name: Wait for the installer assets on the release
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          want_exe="gaia-agent-ui-${VERSION}-x64-setup.exe"
          want_dmg="gaia-agent-ui-${VERSION}-arm64.dmg"
          want_app="gaia-agent-ui-${VERSION}-x86_64.AppImage"
          deadline=$(( SECONDS + 3600 ))
          while :; do
            names="$(gh release view "${TAG}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            missing=""
            for w in "${want_exe}" "${want_dmg}" "${want_app}"; do
              grep -qxF "${w}" <<<"${names}" || missing="${missing} ${w}"
            done
            if [ -z "${missing}" ]; then
              echo "✓ all three installers present on ${TAG}"
              break
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::timed out after 60m waiting for installer assets on ${TAG}. Missing:${missing}. build-installers.yml likely failed — check that run, then re-run this workflow. Nothing was published."
              exit 1
            fi
            echo "waiting for:${missing}"
            sleep 60
          done

      - name: Download the installers
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "v${VERSION}" --dir dist \
            --pattern "gaia-agent-ui-${VERSION}-x64-setup.exe" \
            --pattern "gaia-agent-ui-${VERSION}-arm64.dmg" \
            --pattern "gaia-agent-ui-${VERSION}-x86_64.AppImage"
          ls -la dist

      - name: Install publisher deps
        if: needs.version.outputs.dry_run == 'false'
        run: python -m pip install --upgrade requests pyyaml boto3

      - name: Publish to the Agent Hub (POST /publish)
        if: needs.version.outputs.dry_run == 'false'
        shell: bash
        env:
          AGENT_HUB_PUBLISH_TOKEN: ${{ secrets.GAIA_HUB_TOKEN }}
          GAIA_HUB_PUBLISH_URL: ${{ vars.GAIA_HUB_PUBLISH_URL }}
          # Artifacts at/over 90 MiB cannot travel through the Worker at all
          # (Cloudflare caps request bodies at 100 MB on Free/Pro), so the
          # publisher PUTs them straight into R2 and publishes them by
          # reference. Only the Agent UI installers hit this today.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # One artifact per platform key. The .deb stays on the GitHub release
          # for apt users — publishing it as a second linux-x64 object would
          # make the catalog's per-platform download ambiguous.
          python hub/agents/email/python/packaging/publish_to_r2.py \
            --base-url "${GAIA_HUB_PUBLISH_URL}" \
            --manifest "${AGENT_UI_MANIFEST}" \
            --artifact "dist/gaia-agent-ui-${VERSION}-x64-setup.exe=win-x64" \
            --artifact "dist/gaia-agent-ui-${VERSION}-arm64.dmg=darwin-arm64" \
            --artifact "dist/gaia-agent-ui-${VERSION}-x86_64.AppImage=linux-x64" \
            --summary-out published.json
          echo "=== publish summary ==="
          cat published.json

  # ── The website builds its Hub pages from the live index.json at deploy time,
  # so a publish only becomes visible after a rebuild. deploy_website.yml
  # auto-triggers on website/** only, and a hub publish touches no such file.
  redeploy-website:
    name: Redeploy website
    needs: [version, terminal-hub, agent-ui]
    if: needs.version.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --repo: this job has no checkout, so gh cannot infer the repository.
          gh workflow run deploy_website.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "✓ requested website redeploy (deploy_website.yml on main)"
