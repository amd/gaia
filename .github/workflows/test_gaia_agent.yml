# This workflow tests the flagship GAIA agent, which ships as the standalone
# gaia-agent wheel (hub/agents/gaia/python). Until now its 170+ tests ran only
# inside release_agent_gaia.yml — a PR that broke the flagship agent stayed
# green all the way to the release gate. This closes that gap: the same suite
# runs on every PR that touches the agent or the framework surfaces it sits on.

name: Gaia Agent Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'hub/agents/gaia/python/**'
      - 'hub/agents/chat/python/**'
      - 'src/gaia/agents/base/**'
      - 'src/gaia/agents/tools/**'
      - 'src/gaia/skills/**'
      - 'src/gaia/code_index/**'
      - 'setup.py'
      - '.github/workflows/test_gaia_agent.yml'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'hub/agents/gaia/python/**'
      - 'hub/agents/chat/python/**'
      - 'src/gaia/agents/base/**'
      - 'src/gaia/agents/tools/**'
      - 'src/gaia/skills/**'
      - 'src/gaia/code_index/**'
      - 'setup.py'
      - '.github/workflows/test_gaia_agent.yml'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-gaia-agent:
    name: Test Gaia Agent
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          # Same dependency shape release_agent_gaia.yml tests against, so a
          # PR-time pass here predicts the release gate instead of diverging
          # from it.
          uv pip install --system -e ".[dev,api]"
          uv pip install --system -e hub/agents/chat/python -e hub/agents/gaia/python

      - name: Run Gaia Agent Package Tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "================================================================"
          echo "                  GAIA AGENT PACKAGE TESTS"
          echo "================================================================"
          echo "Skill library, lazy skill activation, stdio transport, server..."
          echo ""
          python -m pytest hub/agents/gaia/python/tests/ -v --tb=short

      - name: Run Skill Framework Tests
        env:
          GAIA_MEMORY_DISABLED: "1"
        run: |
          echo "================================================================"
          echo "                  SKILL FRAMEWORK TESTS"
          echo "================================================================"
          # The flagship agent is the primary consumer of the skill loader,
          # the starter-pack honesty guards, and the binary policies — run
          # their framework-side suites in the same environment.
          python -m pytest \
            tests/unit/test_skill_loader.py \
            tests/unit/test_agent_lazy_skill_prompt.py \
            tests/unit/test_starter_skills.py \
            tests/unit/test_skill_sets.py \
            -v --tb=short
