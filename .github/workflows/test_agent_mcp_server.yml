name: Test MCPAgent and AgentMCPServer

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - 'src/gaia/agents/base/mcp_agent.py'
      - 'src/gaia/mcp/**'
      - 'tests/mcp/**'
      - 'setup.py'
      - '.github/workflows/test_agent_mcp_server.yml'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - 'src/gaia/agents/base/mcp_agent.py'
      - 'src/gaia/mcp/**'
      - 'tests/mcp/**'
      - 'setup.py'
      - '.github/workflows/test_agent_mcp_server.yml'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-mcp-agent:
    name: Test MCPAgent (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Skip macOS - Docker not available on macOS GitHub runners
      fail-fast: false  # Continue testing other platforms even if one fails

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30  # Prevent hanging tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/free-disk-space

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install uv (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify Docker is available
        continue-on-error: true
        id: docker-check
        run: |
          docker --version
          docker info

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,mcp]"

      # TODO: Start Lemonade server for integration tests
      # For now, integration tests requiring LLM will be skipped
      # - name: Start Lemonade server
      #   run: |
      #     lemonade-server serve --ctx-size 32768 &
      #     sleep 10

      - name: Run MCPAgent tests (fast tests only)
        run: |
          python -m pytest tests/mcp/test_agent_mcp_server.py -v -m "not slow and not integration"

      - name: Run slow tests (with Docker operations)
        if: (success() || failure()) && steps.docker-check.outcome == 'success'
        # bash on every OS: this step branches on pytest's exit code, and the
        # Windows leg defaults to pwsh, where that syntax is not valid.
        shell: bash
        run: |
          # pytest exits 5 when the marker selects nothing, which fails the job.
          # No slow tests remain -- the Docker-backed suite went with DockerAgent
          # -- so treat an empty selection as nothing to do. The step stays so a
          # future slow test runs without anyone re-adding it, and any real
          # failure still propagates.
          rc=0
          python -m pytest tests/mcp/test_agent_mcp_server.py -v -m "slow and not integration" --tb=short || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No slow tests are defined in this file; nothing to run."
            exit 0
          fi
          exit "$rc"

      # Integration tests require Lemonade server - skip for now
      # - name: Run integration tests (with LLM orchestration)
      #   if: success() || failure()
      #   run: |
      #     pytest tests/mcp/test_agent_mcp_server.py -v -m "integration" --tb=short

      - name: Cleanup Docker resources
        if: always()  # Always cleanup, even if tests fail
        run: |
          docker system prune -af --volumes || true
        shell: bash

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            .pytest_cache/
            **/.coverage
          retention-days: 7

  test-summary:
    name: Test Summary
    needs: test-mcp-agent
    runs-on: ubuntu-latest
    # Run always except when workflow or dependency is cancelled
    if: >-
      ${{ always() && !cancelled() &&
          needs.test-mcp-agent.result != 'cancelled' }}
    permissions: {}

    steps:
      - name: Check test results
        run: |
          echo "MCPAgent tests completed"
          echo "Check individual job results for details"
