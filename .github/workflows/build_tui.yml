# This workflow builds and tests the Go TUI binary in tui/
# Produces cross-compiled binaries for 6 platform targets:
#   linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64

name: TUI Build & Test

# NOTE: GitHub Actions does not support YAML anchors, so the two `paths` lists
# below are duplicated on purpose. Keep them in sync.
#
# `src/gaia/daemon/**` is the Python daemon the TUI drives over loopback
# HTTP/SSE — the actual contract boundary, and narrow on purpose (triggering on
# all of src/gaia/** would be noise). Be aware of what this does and does not
# buy: it makes the suite RUN on a daemon-only change, but the TUI's tests fake
# the daemon with an httptest server (test/fakedaemon_test.go), so wire drift
# still passes. Detecting drift needs a contract test that exercises the real
# daemon; until that exists this trigger is early warning, not detection.
on:
  push:
    branches: [ main ]
    paths:
      - 'tui/**'
      - 'src/gaia/daemon/**'
      # The shared TUI <-> flagship stdio wire fixture both languages test against.
      - 'tests/fixtures/stdio/gaia_stdio_wire.json'
      # Nothing else runs pre-release on these — the PE check this job invokes,
      # and the installers that package the binaries it builds.
      - 'util/check_pe_resources.py'
      # installer/tui/fetch_gaiacpp.py imports it to verify the packaged gaiacpp.
      - 'util/gaiacpp_release_assets.py'
      - 'installer/tui/**'
      - '.github/workflows/build_tui.yml'
      - '.github/workflows/tui_installers.yml'
      - '.github/workflows/windows_setup.yml'
      # The frozen gaia core both installer jobs pack beside gaia-cli.
      - '.github/workflows/build_core.yml'
      - 'installer/core/**'
      # build_core.yml builds the Agent UI into the core.
      - 'src/gaia/apps/webui/**'
      - 'hub/agents/gaia/python/packaging/check_bundle_licenses.py'
      - 'hub/agents/gaia/python/packaging/check_glibc.py'
      # The installer jobs it calls read the flagship's pins and version.
      - 'hub/agents/gaia/npm/binaries.lock.json'
      - 'hub/agents/gaia/python/gaia-agent.yaml'
      - 'hub/agents/gaia/python/gaiapy/__init__.py'
      - 'hub/agents/gaia/python/packaging/gen_binaries_lock.py'
      - 'util/gaiapy_rc_assets.py'
      - 'util/release_tag.py'
      - 'src/gaia/version.py'
      - 'LICENSE.md'
      # The changes job reads this filter with it to decide what a PR runs.
      - 'util/select_tests.py'
  pull_request:
    # NO `branches:` filter on purpose. It used to be `branches: [main]`, which
    # silences every stacked PR — one opened against another feature branch
    # rather than main. That is not a corner case here: #2494 never ran this
    # workflow once, and #2496/#2492 last ran several commits behind their heads,
    # because all three are stacked on sibling claudia/* branches. The newest and
    # most safety-critical TUI work had the least CI as a direct result.
    #
    # Dropping the filter runs the suite on every PR regardless of base; the
    # `paths` filter below is what keeps it scoped, and it still applies.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tui/**'
      - 'src/gaia/daemon/**'
      # The shared TUI <-> flagship stdio wire fixture both languages test against.
      - 'tests/fixtures/stdio/gaia_stdio_wire.json'
      # Nothing else runs pre-release on these — the PE check this job invokes,
      # and the installers that package the binaries it builds.
      - 'util/check_pe_resources.py'
      # installer/tui/fetch_gaiacpp.py imports it to verify the packaged gaiacpp.
      - 'util/gaiacpp_release_assets.py'
      - 'installer/tui/**'
      - '.github/workflows/build_tui.yml'
      - '.github/workflows/tui_installers.yml'
      - '.github/workflows/windows_setup.yml'
      # The frozen gaia core both installer jobs pack beside gaia-cli.
      - '.github/workflows/build_core.yml'
      - 'installer/core/**'
      # build_core.yml builds the Agent UI into the core.
      - 'src/gaia/apps/webui/**'
      - 'hub/agents/gaia/python/packaging/check_bundle_licenses.py'
      - 'hub/agents/gaia/python/packaging/check_glibc.py'
      # The installer jobs it calls read the flagship's pins and version.
      - 'hub/agents/gaia/npm/binaries.lock.json'
      - 'hub/agents/gaia/python/gaia-agent.yaml'
      - 'hub/agents/gaia/python/gaiapy/__init__.py'
      - 'hub/agents/gaia/python/packaging/gen_binaries_lock.py'
      - 'util/gaiapy_rc_assets.py'
      - 'util/release_tag.py'
      - 'src/gaia/version.py'
      - 'LICENSE.md'
      # The changes job reads this filter with it to decide what a PR runs.
      - 'util/select_tests.py'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# What runs where:
#   pull request whose only files in the filter above are under
#   src/gaia/apps/webui/: one job, "Freeze core with the UI" on Linux, the only
#   thing here an Agent UI change can break.
#   Any other pull request, push to main, merge queue and dispatch: the full Go
#   test/lint/coverage, six-target build, installers and Windows setup.
# The ci:full label runs the full set on a PR; it is read when the run starts,
# so add it and then push (or close and reopen the PR).
# "TUI Build & Test Result" is the one check to require: it is green only when
# every job meant to run passed.

jobs:
  changes:
    name: Decide what this change runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.tui_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the merge base with the PR's base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Set up Python
        if: github.event_name == 'pull_request'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The selector reads this workflow's paths filter.
      - name: Install PyYAML
        if: github.event_name == 'pull_request'
        run: python -m pip install 'pyyaml>=6,<7'

      - name: Pick the jobs this change needs
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LABEL_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "tui_full=true" >> "$GITHUB_OUTPUT"
            echo "**Job scope** — full: every $EVENT run builds and tests everything" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          force=()
          if [ "$LABEL_FULL" = true ]; then force=(--force-full "ci:full label"); fi
          # A diff git can't compute fails this job, and so the result check.
          python util/select_tests.py lane-scope --base "origin/$BASE_REF" \
            --workflow .github/workflows/build_tui.yml \
            --narrow-prefix src/gaia/apps/webui/ "${force[@]}" --github-output tui

  # The one job an Agent UI change needs: build_core.yml builds the UI into the
  # frozen core, and refuses to freeze without it.
  core-ui:
    name: Freeze core with the UI
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.full == 'false'
    uses: ./.github/workflows/build_core.yml
    with:
      platforms: 'linux-x64'
      artifact_prefix: tui-ui-

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      # Report all three platforms on every run, so a failure on one OS can't
      # hide a regression on another behind a cancelled job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # bash on all three so one command works everywhere (Windows defaults to pwsh).
        shell: bash
        working-directory: tui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      # -race is the point of this job. The TUI is concurrent throughout — SSE
      # streaming, the loopback control API, daemon polling — so this is where
      # its real bugs are.
      - name: Run tests (race)
        run: go test ./... -v -count=1 -race -timeout=15m

      - name: Vet
        run: go vet ./...

  lint:
    name: Lint
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      # Config and enabled set live in tui/.golangci.yml. The set was chosen by
      # measuring: every linter in it reports zero findings on the tree today, so
      # this lands green and only fires on new code.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: tui

      # Both linters only analyze the host GOOS, so internal/daemon/pid_windows.go
      # is invisible to golangci-lint here. The Windows test leg compiles and
      # vets it natively; this keeps it under the same linter pass as the rest.
      # darwin needs no equivalent: the macos leg vets.
      - name: Vet Windows-only sources
        working-directory: tui
        env:
          GOOS: windows
        run: go vet ./...

  coverage:
    name: Coverage
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    # Genuinely non-blocking, not just labelled that way. `make cover` runs the
    # whole suite to produce a profile, so without this a test failure would
    # paint this job red too — a second, duplicate X for something the `test`
    # job already reports. Nothing `needs:` this job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      # Informational, NOT a gate. A threshold that blocks PRs needs buy-in that
      # a printed number does not, and the naive per-package figure is actively
      # misleading here — code exercised by the test/ integration suite reads
      # as uncovered in its own package. `make cover` uses -coverpkg=./... to
      # attribute coverage back to the package that owns the code.
      #
      # pipefail is set explicitly: a bare `make cover | tee` reports TEE's exit
      # status, so a failing test run would read as a pass. Piping (rather than
      # redirecting) keeps the full run visible in the log for debugging.
      - name: Run coverage
        working-directory: tui
        run: |
          set -o pipefail
          make cover 2>&1 | tee /tmp/cover.txt

      # Runs even when the step above failed, so a partial profile still reports.
      # Every extraction is `|| true`: GitHub runs `run:` under `bash -e`, and a
      # grep that matches nothing exits 1 — which would turn this purely
      # informational step into a second, misleading red X on the PR.
      - name: Publish to job summary
        if: always()
        run: |
          TOTAL=$(grep -E '^total:' /tmp/cover.txt 2>/dev/null | grep -oE '[0-9]+\.[0-9]+%' | tail -1 || true)
          ROWS=$(grep -E '^[0-9]+\.[0-9]+%' /tmp/cover.txt 2>/dev/null \
                   | sed 's|github.com/amd/gaia/tui/||' \
                   | sort -k2 \
                   | sed 's/^/| /; s/\t/ | /; s/$/ |/' || true)
          {
            echo "## TUI coverage"
            echo
            echo "**Total: ${TOTAL:-unavailable}** (statements, \`-coverpkg=./...\`)"
            echo
            if [ -n "$ROWS" ]; then
              echo "| Coverage | Package |"
              echo "| --- | --- |"
              echo "$ROWS"
            else
              echo "_No per-package data — the coverage run did not complete._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      - uses: actions/setup-python@v7
        if: matrix.goos == 'windows'
        with:
          python-version: '3.x'

      # Go links no Windows resource unless a .syso sits beside the main
      # package, so without this every gaia-win-*.exe draws with the generic
      # console icon and reports no version to Explorer. goversioninfo is a
      # pinned `tool` dependency in tui/go.mod, so nothing extra is installed.
      - name: Generate Windows resources (icon + version)
        if: matrix.goos == 'windows'
        working-directory: ${{ github.workspace }}
        run: tui/scripts/gen-winres.sh --version "${{ github.ref_name }}"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          PKG=github.com/amd/gaia/tui/internal/cli
          # The COMMIT's timestamp, never `now` — release_components.yml rebuilds
          # these same targets, and two wall-clock stamps guarantee the release
          # asset and the hub artifact differ for one version. -trimpath keeps
          # the runner's absolute paths out of the binary.
          DATE="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          go build -trimpath -ldflags="-s -w -X ${PKG}.version=${{ github.ref_name }} -X ${PKG}.commit=${{ github.sha }} -X ${PKG}.date=${DATE}" \
            -o ../bin/gaia-cli-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/gaia

      # Reads the PE resource directory of the LINKED binary. Asserting the
      # .syso exists would prove nothing -- the Go linker silently ignores a
      # resource object whose GOARCH suffix does not match the target.
      - name: Verify the icon reached the binary
        if: matrix.goos == 'windows'
        working-directory: ${{ github.workspace }}
        run: |
          python util/check_pe_resources.py \
            bin/gaia-cli-${{ matrix.goos }}-${{ matrix.goarch }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gaia-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/gaia-*
          retention-days: 14

  size-check:
    name: Binary size check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download linux/amd64 artifact
        uses: actions/download-artifact@v8
        with:
          name: gaia-cli-linux-amd64

      - name: Check size
        run: |
          SIZE=$(stat --printf="%s" gaia-cli-linux-amd64)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Binary size: ${SIZE_MB}MB (${SIZE} bytes)"
          if [ "$SIZE" -gt 15728640 ]; then
            echo "::warning::Binary size ${SIZE_MB}MB exceeds 15MB target"
          fi

  # ── The installer gate ─────────────────────────────────────────────────────
  # Until this existed, the installers were built only by release_components.yml,
  # which fires on a `v*` tag — so a PR editing gaia-setup.nsi, build-pkg.sh or
  # build-packages.sh got no CI whatsoever, and the first time that code ran was
  # a live release. That is the same "its code path first executes during a real
  # release" hole worker-check was added to close, left open on the packaging.
  #
  # Same reusable workflows the release calls (tui_installers.yml here,
  # windows_setup.yml below), so the two cannot drift. They differ
  # only in `sidecar: stub` — a real gaia-agent is safe to bundle because its
  # digest is committed, and that digest is a placeholder between releases, so a
  # PR genuinely cannot fetch one. Packaging, install, PATH, shortcuts and
  # uninstall are all still exercised on a clean runner of each OS.
  installer-version:
    name: Resolve installer version
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # The installers stamp a version into their own filenames and build-pkg.sh
      # requires a real x.y.z, so a branch name will not do. The component
      # manifest is the same source release_components.yml publishes under.
      - id: v
        run: |
          set -euo pipefail
          python -m pip install --quiet pyyaml
          V="$(python -c "import yaml; print(yaml.safe_load(open('hub/components/terminal-hub/gaia-agent.yaml'))['version'])")"
          echo "resolved terminal-hub version: ${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

  installers:
    name: Installers
    # `test` first: three OS runners packaging a binary whose unit tests are
    # already red is a slow way to learn nothing.
    needs: [test, installer-version]
    uses: ./.github/workflows/tui_installers.yml
    with:
      version: ${{ needs.installer-version.outputs.version }}
      sidecar: stub
      # A PR builds no gaiacpp; the stand-in keeps its packaging under test.
      gaiacpp: stub

  # The one Windows setup, on a clean runner, the same workflow the release
  # calls. The desktop app it embeds comes from a named, published release --
  # pinned here, never "latest" -- because this PR's own desktop app build is
  # build-installers.yml's to test. Bump it, and its SHA-256, after each release.
  windows-setup:
    name: Windows setup
    needs: [installers, installer-version]
    if: '!cancelled() && needs.installers.outputs.binaries_ok == ''true'''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/windows_setup.yml
    with:
      version: ${{ needs.installer-version.outputs.version }}
      sidecar: stub
      gaiacpp: stub
      agent_ui_release: v0.24.1
      agent_ui_release_sha256: 9aa26f8622a22a0df771e201d754823586d52b6a4dca8b754fb6fc6bb7973428

  # The check to require. A skipped job reads as passing to a required check,
  # so this job runs whatever happened and judges each job against the scope.
  tui-result:
    name: TUI Build & Test Result
    needs: [changes, core-ui, test, lint, build, size-check, installer-version, installers, windows-setup]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check every job passed or was meant to be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<<"$NEEDS")
          if [ "$changes" != success ] || [ -z "$FULL" ]; then
            echo "::error::Decide what this change runs ended $changes, so no job's skip can be trusted."
            exit 1
          fi
          failed=0
          for job in core-ui test lint build size-check installer-version installers windows-setup; do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            if [ "$job" = core-ui ]; then
              must_run=$([ "$FULL" = false ] && echo true || echo false)
            else
              must_run=$FULL
            fi
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$must_run" = false ]; }; then
              echo "$job: $result"
            else
              echo "::error::$job ended $result (expected to run: $must_run)."
              failed=1
            fi
          done
          exit "$failed"
