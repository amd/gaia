# Runs the test suites that ship inside hub agent packages which have no
# dedicated test_*_agent.yml workflow (#1992). Packages with their own
# workflow (chat, email, gaia, mcp-server) are intentionally NOT in this
# matrix; connectors-demo also has its own workflow (test_connectors_demo.yml).
#
# Only the teaching-template scaffolds remain here — every suite is at
# least imported and collected so bit-rot fails loudly.

name: Hub Agent Package Tests

on:
  workflow_call:
  push:
    branches: [ main ]
    paths:
      - 'hub/agents/hello-world/python/**'
      - 'hub/agents/word-count/python/**'
      - 'src/gaia/agents/base/**'
      - 'src/gaia/agents/tools/**'
      - 'setup.py'
      - '.github/workflows/test_hub_agents.yml'
  pull_request:
    # No `branches:` filter: it matches the PR base, so `[ main ]` skipped stacked PRs (#2767).
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'hub/agents/hello-world/python/**'
      - 'hub/agents/word-count/python/**'
      - 'src/gaia/agents/base/**'
      - 'src/gaia/agents/tools/**'
      - 'setup.py'
      - '.github/workflows/test_hub_agents.yml'
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-hub-package:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')
    strategy:
      fail-fast: false
      matrix:
        package:
          - hello-world
          - word-count

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system -e .[dev]
          uv pip install --system -e hub/agents/${{ matrix.package }}/python

      - name: Run ${{ matrix.package }} package tests
        run: |
          python -m pytest hub/agents/${{ matrix.package }}/python/tests/ -v --tb=short
