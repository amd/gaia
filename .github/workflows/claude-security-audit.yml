#
# Proactive Claude SECURITY audit. A dedicated, security-only companion to
# claude-nightly-audit.yml (which now owns correctness/docs/tests/features). It
# exists because the weekly audit's single general "security lens" missed the hub
# tar-slip (CWE-22): it sampled a huge repo in one pass and trusted a
# `# noqa: S202 - hub artifacts are trusted` comment as a settled decision.
#
# This workflow fixes both failure modes:
#   1. DETERMINISTIC layer (semgrep) — maintained security rules over the whole
#      tree, uploaded to code scanning. Catches known sink patterns exhaustively.
#   2. REASONING layer (Claude) — the taint/authz/suppression analysis static
#      tools can't do, over an explicit worklist so nothing is sampled away.
#      Every '# noqa: S*' / '# nosec' is RE-VERIFIED from scratch, never trusted.
#
# A later miss (the shell find -exec whitelist bypass, CWE-184) sharpened the
# lenses further: both sink-taint and suppression-review looked straight at the
# guarded subprocess call and passed it because a guard EXISTED — neither asked
# whether the command allowlist was SOUND (can an allowed command act as a gadget
# for a forbidden action?). The lens prompts now demand that allowlist-soundness
# check explicitly.
#
# PRIVACY: findings never go to a public issue. Both layers upload SARIF to the
# repo's private Security > Code scanning tab; Claude's full detail also goes to
# the (access-controlled) run log. High-severity findings ping @kovtcharov-amd.
#
# SCORING: each Claude finding carries a proposed CVSS 4.0 *vector*; the score is
# computed deterministically by util/cvss4.py (matches the FIRST v4 calculator) —
# never an LLM's guessed number. Scores are PROPOSED and need human confirmation.
#
# READ-ONLY: Claude jobs run --allowedTools Read,Grep,Glob,Bash — no Edit/Write,
# never install or execute repo code (same rule as claude.yml review jobs).

name: Claude Security Audit

run-name: ${{ inputs.rotation_night && format('Claude Security Audit — rotation night {0}', inputs.rotation_night) || 'Claude Security Audit' }}

on:
  # No cron of its own: claude-audit-rotation.yml dispatches this every third night
  # (one proactive audit a night, 10:13 UTC = 03:13 PDT / 02:13 PST). Running every
  # audit every night spent the Claude weekly cap mid-week.
  workflow_dispatch:
    inputs:
      rotation_night:
        # Set only by claude-audit-rotation.yml. Marks this run (via run-name) as a
        # rotation night, the only runs scripts/audit/audit_history.py counts as history.
        description: "Internal: set by claude-audit-rotation.yml. Leave empty."
        default: ""
      target_ref:
        description: "Git ref to audit (for backtesting a known-vuln commit)"
        default: ""

permissions:
  contents: read

concurrency:
  group: claude-security-audit
  cancel-in-progress: false

env:
  AUDIT_MODEL: claude-opus-5-5

jobs:
  # ---------------------------------------------------------------------------
  # Deterministic layer — maintained security rules, native SARIF.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Cost guard. The Claude layer below is 3 lenses x 150
  # turns + synthesis (~$4-6 of subscription-equivalent usage per lens at the
  # ceiling); running that unconditionally every night would burn the shared
  # subscription pool re-reading an unchanged tree. Mirrors the skip-if-empty
  # preflight in claude-nightly-audit.yml.
  #
  # semgrep is deliberately NOT gated on this — it is cheap, deterministic, and
  # its rulesets update independently of this repo, so it still has something to
  # say on a night with zero commits. Only the reasoning layer skips.
  #
  # A hand dispatch NEVER skips: it means someone explicitly wants a run (usually
  # backtesting target_ref against a known-vuln commit). Only rotation turns skip.
  # ---------------------------------------------------------------------------
  preflight:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads this workflow's own run history to find the last successful night.
      actions: read
      # Reads merged PR titles/bodies for the recent-changes context.
      pull-requests: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      lenses: ${{ steps.lenses.outputs.lenses }}
      lens_count: ${{ steps.lenses.outputs.lens_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Single source of truth for the lens list: the audit matrix and the synthesis
      # completeness check both read it, so adding a lens can't leave the check
      # counting the old number and silently re-open the empty-SARIF hole.
      - name: Resolve the lens list
        id: lenses
        run: |
          set -euo pipefail
          lenses='["sink-taint","authz","suppression-review"]'
          {
            echo "lenses=$lenses"
            echo "lens_count=$(printf '%s' "$lenses" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          } >> "$GITHUB_OUTPUT"
          echo "Lenses: $lenses"
      - name: Skip the Claude layer on a night with no commits
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_ROTATION: ${{ github.event.inputs.rotation_night != '' }}
        run: |
          set -euo pipefail
          skip=false
          # The last successful rotation run: its commit opens the recent-changes window,
          # and its date decides skip-if-empty (not a fixed window — a turn lost to the
          # usage limit must not let the next quiet turn skip).
          python3 scripts/audit/audit_history.py window \
            --repo "${{ github.repository }}" --workflow claude-security-audit.yml \
            > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          echo "base_sha=$(sed -n 's/^base_sha=//p' "$RUNNER_TEMP/scope.txt")" >> "$GITHUB_OUTPUT"
          if [ "$IS_ROTATION" = "true" ]; then
            since=$(sed -n 's/^since=//p' "$RUNNER_TEMP/scope.txt")
            if [ -n "$since" ]; then
              count=$(git log --since="$since" --oneline | wc -l | tr -d ' ')
              echo "Commits since $since: $count"
              [ "$count" = "0" ] && skip=true
            fi
          else
            echo "Dispatched by hand — never skipping."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Resolved: skip=$skip"

      # What merged since the last successful run, so the lenses look at new code first.
      # See scripts/audit/recent_changes.py.
      - name: Collect recent changes on main
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: |
          python3 scripts/audit/recent_changes.py --repo "${{ github.repository }}" \
            --base-sha "$BASE_SHA" --fallback-days 3 --max-bytes 30000 \
            --out recent-changes.md --paths-out changed-paths.txt \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the recent-changes context
        if: steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recent-changes
          path: |
            recent-changes.md
            changed-paths.txt
          if-no-files-found: error

      # One cheap probe before any lens: on the usage limit the run stops here, once,
      # with the account and reset time in the summary. See scripts/audit/require_claude.py.
      - name: Show which Claude account this run uses
        if: steps.scope.outputs.skip != 'true'
        run: echo "::notice title=Claude account::${{ vars.CLAUDE_ACCOUNT != 'secondary' && 'This job uses the primary Claude account.' || secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' && 'This job uses the secondary Claude account.' || 'CLAUDE_ACCOUNT is secondary but CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so this job uses the primary Claude account.' }}"
      - name: Probe the Claude account
        id: probe
        if: steps.scope.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          anthropic_api_key: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            Reply with exactly the word: ok
          claude_args: |
            --max-turns 1
            --model ${{ env.AUDIT_MODEL }}
            --allowedTools Read
      - name: Stop here if Claude cannot answer
        if: steps.scope.outputs.skip != 'true'
        env:
          CLAUDE_CONCLUSION: ${{ steps.probe.outputs.conclusion }}
          CLAUDE_LOG: ${{ steps.probe.outputs.execution_file }}
          ACCOUNT: ${{ vars.CLAUDE_ACCOUNT == 'secondary' && 'secondary' || 'primary' }}
        run: |
          python3 scripts/audit/require_claude.py --conclusion "${CLAUDE_CONCLUSION:-}" \
            --log "${CLAUDE_LOG:-}" --account "$ACCOUNT" \
            --what "Tonight's security audit" --summary "$GITHUB_STEP_SUMMARY"

  semgrep:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.target_ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run semgrep (security rulesets) -> SARIF
        run: |
          python -m pip install --quiet semgrep
          # continue-on-error semantics: a rule-parse hiccup must not sink the SARIF
          # upload of everything that did scan.
          # Every shipped language, not just Python: the Go TUI, the TypeScript/Electron
          # Agent UI, the installer scripts, and the workflows themselves (expression
          # injection into `run:` is this repo's most-used untrusted-input path).
          semgrep scan --sarif --output semgrep.sarif \
            --config p/python --config p/security-audit --config p/secrets \
            --config p/typescript --config p/golang --config p/github-actions \
            src hub tui installer scripts util .github/workflows || true
      - name: Upload semgrep SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Reasoning layer — one read-only Claude job per lens. continue-on-error so one
  # lens crashing doesn't sink the others.
  # ---------------------------------------------------------------------------
  audit:
    needs: preflight
    # Explicit status check (#3929): run only after preflight succeeded and chose to
    # audit. The repo gate keeps a fork, where preflight is skipped, from running.
    if: >-
      github.repository == 'amd/gaia' && !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        lens: ${{ fromJSON(needs.preflight.outputs.lenses) }}
    steps:
      - name: Show which Claude account this job uses
        run: echo "::notice title=Claude account::${{ vars.CLAUDE_ACCOUNT != 'secondary' && 'This job uses the primary Claude account.' || secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' && 'This job uses the secondary Claude account.' || 'CLAUDE_ACCOUNT is secondary but CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so this job uses the primary Claude account.' }}"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_ref || github.ref }}

      - name: Download the recent-changes context
        uses: actions/download-artifact@v8
        with:
          name: recent-changes
          path: .

      - name: Build the deterministic worklist
        run: |
          set -euo pipefail
          {
            echo "# Security worklist for lens: ${{ matrix.lens }}"
            echo "## Every security suppression (RE-VERIFY each — do NOT trust the comment)"
            grep -rnE "# *noqa: *S[0-9]|# *nosec" src hub --include=*.py || true
            echo ""
            echo "## Archive extraction / deserialization sinks"
            grep -rnE "extractall|pickle\.load|yaml\.load\(|marshal\.load" src hub --include=*.py || true
            echo ""
            echo "## Shell / eval sinks"
            grep -rnE "shell=True|os\.system|subprocess\.(run|Popen|call)|\beval\(|\bexec\(" src hub --include=*.py || true
            echo ""
            echo "## PathValidator / allowlist / trust gates (check for asymmetric enforcement)"
            grep -rnE "is_path_allowed|validate_write|validate_read|allowed_paths|trust_native|ensure_trust_ack|requires_trust_ack" src hub --include=*.py || true
            echo ""
            echo "## Electron / web UI sinks (renderer trust, IPC, HTML injection, external URLs)"
            grep -rnE "nodeIntegration|contextIsolation|webSecurity|ipcMain\.(handle|on)|shell\.openExternal|dangerouslySetInnerHTML|innerHTML *=|\beval\(" src/gaia/apps src/gaia/electron --include=*.ts --include=*.tsx --include=*.js --include=*.cjs --include=*.mjs || true
            echo ""
            echo "## Go TUI process / file sinks"
            grep -rnE "exec\.Command|os\.(WriteFile|RemoveAll|Rename)" tui --include=*.go --exclude=*_test.go || true
            echo ""
            echo "## Installer scripts that download and run code"
            grep -rnE "Invoke-Expression|\biex\b|Invoke-WebRequest|curl .*\| *(ba)?sh|Start-Process" installer scripts --include=*.ps1 --include=*.sh || true
            echo ""
            echo "## Workflows: untrusted event fields expanded into run:, and privileged triggers"
            grep -rnE "pull_request_target|workflow_run|github\.event\.(issue|comment|pull_request|review)[a-z_.]*\.(title|body|head_ref|label)" .github/workflows || true
          } > security-worklist.txt
          echo "worklist lines: $(wc -l < security-worklist.txt)"

      - name: Run Claude (${{ matrix.lens }} lens)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          anthropic_api_key: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # On `schedule`, github.actor is whoever last touched the default branch — a bot
          # in this repo: github-merge-queue[bot] normally, github-actions[bot] after a
          # release workflow commits. Without this the human-actor gate rejects every
          # scheduled run before Claude starts. Safe: schedule/dispatch only, no fork input.
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            You are one lens of GAIA's proactive SECURITY audit. YOUR LENS: ${{ matrix.lens }}.
            Find real, exploitable security weaknesses.

            REPORT WHAT YOU FIND — do not pre-filter for confidence. Ground every finding
            in code you actually read and opened (never a grep hit alone), then report it,
            including ones you are unsure about; say so in the finding and let the CVSS
            vector carry the severity. The synthesis step scores, dedupes, and routes;
            findings land in the PRIVATE code-scanning tab, not a public issue, so an
            over-reported finding is cheap to dismiss while a missed one ships.
            This audit exists because the previous single security lens MISSED the hub
            tar-slip (CWE-22) — it sampled and trusted a suppression comment. That was a
            recall failure, so a "precision beats recall / be conservative" instruction
            here works directly against the workflow's purpose: Claude Opus 5 follows such
            wording literally and reports less while investigating just as hard. Do not
            reintroduce it.

            REPO: ${{ github.repository }}
            RUN LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## First actions
            1. Read `CLAUDE.md` (esp. "No Silent Fallbacks" and "Issue Response Guidelines" →
               never discuss vulnerability details publicly).
               Scope is every shipped language: Python (`src/`, `hub/`), the Go TUI (`tui/`),
               the TypeScript/Electron Agent UI (`src/gaia/apps/`, `src/gaia/electron/`), the
               installer scripts, and `.github/workflows/` (untrusted event fields expanded
               into `run:`, privileged triggers, over-broad `permissions:`).
            2. Read `security-worklist.txt` — a deterministic list of suppressions, sinks, and
               gate call-sites. Investigate every item relevant to your lens; do not sample.
            3. Read `recent-changes.md` — what merged since this audit last ran. New and
               changed code is where new vulnerabilities are; start there and at the
               callers and siblings of what changed.
            4. Read the "Security" section of `scripts/audit/missed_bug_classes.md` — the
               vulnerability shapes recent fixes had that no audit caught — and its
               "Don't report" list.
            5. Investigate with Grep/Glob/Read/Bash (READ-ONLY — never edit, install, or run repo code).

            ## Your lens
            - **sink-taint**: trace ATTACKER-CONTROLLED input into a dangerous sink (archive
              extraction, deserialization, subprocess/shell, eval). A sink is only a finding if
              untrusted data can reach it. The hub tar-slip (CWE-22) is the archetype: a hub
              archive's member paths reached `tarfile.extractall` with no per-member check.
              When a subprocess/shell sink is "guarded" by a command ALLOWLIST, do NOT stop at
              "a guard exists" — audit the allowlist's SOUNDNESS: can any allowed command perform
              the very actions the policy forbids? Whitelisted commands are routinely gadgets
              (GTFOBins-style) that spawn others or write/delete via a flag — `find -exec`/`-delete`/
              `-fprintf`, `sort -o`, `uniq IN OUT`, `xargs`, `awk 'BEGIN{system()}'`, `git -c
              core.pager=`, `tar --to-command`. A "read-only" allowlist that admits any such gadget
              is incomplete (CWE-184) and IS a finding, even though every input is "validated".
            - **authz**: access-control gaps — a sandbox/allowlist/trust gate that one code path
              enforces and a sibling path skips. The read_file bypass (CWE-284) is the archetype:
              `write_file` called the PathValidator but `read_file` did not. Look for ASYMMETRIC
              enforcement (read vs write, one tool vs another) of `is_path_allowed`,
              `validate_*`, `allowed_paths`, `trust_native`, auth checks.
            - **suppression-review**: for EACH `# noqa: S<n>` / `# nosec` in the worklist, RE-DERIVE
              whether the finding it silences is truly safe. TREAT THE COMMENT AS AN UNPROVEN CLAIM,
              NOT A DECISION — "hub artifacts are trusted" is exactly the assumption that shipped the
              tar-slip. If the suppressed risk is real, report it. A justification of the form
              "command whitelist-validated above" claims the allowlist is SOUND, not merely present:
              verify no allowed command can perform the forbidden action, and check whether the
              comment reasons about the wrong axis (the `find -exec` bypass, CWE-184, hid behind
              `# nosec B602 - Windows-only; command whitelist-validated above` — but the bypass is
              platform-independent and has nothing to do with the shell=True the comment defends).

            ## Published hub agents (`hub/agents/**`) run on integrators' machines — hold to the
            strictest reading and bump any real finding up one severity.

            ## Score every finding with a CVSS 4.0 VECTOR (the number is computed later)
            Propose a vector; do NOT invent a number (an LLM CVSS number is untrustworthy — a real
            triage guessed 7.3 for a vector that scores 8.7). Pick metrics with this GAIA rubric:
            - **AV** Network only if untrusted data crosses a network boundary to reach the sink
              (hub artifact, HTTP request); else Local (a local CLI/file input on the same host).
            - **AT** Present if exploitation needs a precondition outside the attacker's control
              (victim points at a non-default hub, a specific agent is installed); else None.
            - **PR** None unless GAIA privilege/auth is required to trigger it.
            - **UI** Active if the user must click through a warning (a trust gate); Passive if they
              must merely initiate an install/command; None only if fully automatic.
            - **Impact** VC for disclosure/reads, VI for writes/tampering, VA for crash/DoS. Set
              SC/SI/SA (subsequent) only if it escapes into a SEPARATE security scope.
            Full vector form: `CVSS:4.0/AV:_/AC:_/AT:_/PR:_/UI:_/VC:_/VI:_/VA:_/SC:_/SI:_/SA:_`.

            ## Verify before reporting
            Open the cited file, confirm the weakness is present AND not already handled (re-raised,
            validated two lines down, guarded elsewhere). If you cannot quote concrete evidence you
            have not verified it — omit it.

            ## Output — this file IS the deliverable
            Write a JSON file at the repo root named exactly `findings-${{ matrix.lens }}.json`.
            You have no Write tool, so create it with Bash (a `cat > … <<'JSON'` heredoc).
            Write `{"findings": []}` if you find nothing — an empty file is a valid, useful
            result. An investigation that ends without this file is a FAILED run: it is
            indistinguishable from the lens never having started, and the synthesis step
            rejects the whole audit. Write it even if you are mid-investigation and out of
            budget. Each finding:
            ```json
            {"findings": [{
              "path": "src/gaia/....py",
              "line": 382,
              "symbol": "function_or_class",
              "cwe": "CWE-22",
              "title": "one-line problem statement",
              "why": "one sentence: concrete impact / what an attacker gains",
              "evidence": "a direct quote or path:line you READ that proves it",
              "remediation": "the fix in one sentence",
              "confidence": "high" | "medium" | "low",
              "cvss_vector": "CVSS:4.0/AV:N/AC:L/AT:P/PR:N/UI:P/VC:N/VI:H/VA:N/SC:N/SI:N/SA:N",
              "dedup_key": "security:<path>:<symbol>"
            }]}
            ```
            `dedup_key` is `security:<path>:<symbol>` — a stable symbol, NEVER a line number.
            AFTER the file exists, also print each finding's full detail to STDOUT prefixed
            "SECURITY FINDING:" (the run log is access-controlled; this is a secondary detail
            channel). STDOUT is never a substitute for the file — only the file is collected.

            ## Budget
            You have --max-turns 150 and share one rate-limited subscription pool with the
            sibling lenses (run back-to-back), the nightly code audit, and the interactive
            PR-review jobs. The worklist is long and you are told not to sample, so pace
            yourself: STOP investigating at ~5 turns remaining and spend them writing the
            findings file. Reaching the turn ceiling mid-investigation discards everything
            you found. Partial findings written to the file beat perfect findings lost.

            Subagent turns count against that ceiling too, and coordinating them is what
            actually exhausts it — a lens that fans out to check the same gate across many
            call sites burns its budget on orchestration and writes nothing. Delegate only
            for a genuinely wide, parallelizable investigation, never to verify or
            double-check your own findings, and prefer one subagent over several. Spend
            turns reading code, not coordinating.
          claude_args: |
            --max-turns 150
            --model ${{ env.AUDIT_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      # A lens that stops early leaves no reason in the log beyond "is_error:true", and
      # the synthesis error cannot tell a spent subscription from a bad credential from
      # a turn ceiling. Name it here, where the log is.
      - name: Say why Claude stopped
        if: steps.claude.outcome == 'failure'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error title=Claude stopped::No execution log was written, so Claude never started. Look at the 'Run Claude' step above for the install or startup error."
            exit 1
          fi
          # execution_file is ONE pretty-printed JSON array (JSONL is accepted too), so it
          # must be parsed whole — a line-by-line read finds no result and classifies "".
          # Reduce it to the terminal result: subtype on stdout, result text to a file.
          subtype=$(python3 -c 'import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(raw)
              events=data if isinstance(data,list) else [data]
          except ValueError:
              events=[]
              for l in raw.splitlines():
                  try: events.append(json.loads(l))
                  except ValueError: pass
          results=[e for e in events if isinstance(e,dict) and e.get("type")=="result"]
          last=results[-1] if results else {}
          open(sys.argv[2],"w",encoding="utf-8").write(str(last.get("result") or last.get("subtype") or ""))
          print(last.get("subtype") or "")' "$EXECUTION_FILE" "$RUNNER_TEMP/claude-result.txt")
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::error title=Claude stopped::The lens hit its --max-turns ceiling and may not have written its findings. If its file is missing, synthesis uploads no SARIF rather than a partial one that would clear alerts the lens never re-checked."
            exit 1
          fi
          # Classify only the terminal result, never the transcript: the classifier
          # matches words like "unauthorized" and bare 401/403, which a lens that audits
          # auth writes about constantly — its prose would read as a dead credential.
          python3 util/classify_claude_probe.py --exit-code 1 --format text --text-file "$RUNNER_TEMP/claude-result.txt"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.lens }}
          path: findings-${{ matrix.lens }}.json
          # A lens that ran writes `{"findings": []}` even when clean, so a missing file
          # means the lens never ran. Fail the job — a silent skip reads as "audited, clean".
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Score + publish. Converts Claude findings to SARIF (CVSS -> security-severity)
  # and uploads to the private code-scanning tab. Only job with security-events.
  # ---------------------------------------------------------------------------
  synthesize:
    needs: [preflight, audit]
    # !cancelled() lets synthesis still run when a lens crashed (continue-on-error), but
    # it must NOT run when preflight skipped the whole Claude layer — otherwise it would
    # synthesise zero findings every quiet night.
    if: github.repository == 'amd/gaia' && !cancelled() && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CVSS scorer
        run: python -m pip install --quiet "cvss>=3.6,<4.0"
      - name: Download findings
        uses: actions/download-artifact@v8
        with:
          path: audit-findings
      - name: Convert findings to SARIF
        env:
          EXPECTED_LENSES: ${{ needs.preflight.outputs.lens_count }}
        run: |
          set -euo pipefail
          # Flatten the per-lens artifact subdirs into one glob for the converter.
          find audit-findings -name 'findings-*.json' -exec cp {} . \; || true
          # "No lens produced output" and "every lens found nothing" produce the same empty
          # SARIF, and uploading it would mark existing code-scanning alerts as FIXED. So a
          # short count is a hard failure, not a quiet clean bill of health.
          # `find`, not `ls findings-*.json` — under `set -euo pipefail` a no-match glob
          # makes ls exit non-zero and kills the step before it can report why.
          got=$(find . -maxdepth 1 -name 'findings-*.json' | wc -l)
          if [ "$got" -lt "$EXPECTED_LENSES" ]; then
            echo "::error title=Security audit::Only $got/$EXPECTED_LENSES lenses produced findings files — the audit did not run. Refusing to upload an empty SARIF (it would clear existing alerts)."
            exit 1
          fi
          python util/findings_to_sarif.py findings-*.json -o claude-security.sarif
      - name: Upload Claude SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: claude-security.sarif
          category: claude-security
      - name: Ping maintainer on high-severity findings
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # No `|| echo 0`: a findings file that will not parse must fail this step, not
          # report zero high-severity findings.
          high=$(python -c "import json,glob; n=0
          for f in glob.glob('findings-*.json'):
              for x in json.load(open(f)).get('findings',[]):
                  v=x.get('cvss_vector','')
                  n+=1 if ('VI:H' in v or 'VC:H' in v or 'VA:H' in v) else 0
          print(n)")
          if [ "${high:-0}" -gt 0 ]; then
            echo "::warning title=Security audit::$high high-impact finding(s) — review the private code-scanning alerts. cc @kovtcharov-amd ($RUN_URL)"
          fi
