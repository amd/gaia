#
# Consolidated publishing workflow for all GAIA packages.
#
# Trigger: push a version tag (v*) to main.
#
# Flow:
#   validate → build (pypi + npm + desktop installers, parallel)
#            → ci-green (the tagged commit passed CI; parallel with the builds)
#     → approve (single manual gate for a final; none for an RC)
#       → publish (pypi + npm, parallel)
#         → post-publish smoke test (PyPI install verification)
#         → github release (sigstore + desktop installers)
#
# Release candidates: a `vX.Y.Z-rcN` tag runs the same pipeline with these
# differences (a `vX.Y.Z` final is untouched by them):
#   • no human approval: approve-publish runs in the reviewer-less "publish-rc"
#     environment, and stops if a newer tag of the same X.Y.Z exists
#   • version.py must say X.Y.Z; each build stamps X.Y.ZrcN (PyPI) and
#     X.Y.Z-rc.N (npm, Electron) from the tag — util/release_tag.py
#   • npm publishes under the `next` dist-tag, so `latest` does not move
#   • the GitHub Release is a pre-release and never "latest"
#   • release notes are the final's (docs/releases/vX.Y.Z.mdx)
#   • release_components.yml (Agent Hub R2) does not run
#   • so the terminal installers, which a final gets from release_components.yml,
#     are built here instead and attached to the pre-release only: the macOS
#     .pkg and Linux .deb/.rpm (rc-tui, required before anything publishes;
#     attached by rc-github-release-installers) and the combined Windows setup
#     (rc-windows-setup)
#   • the flagship agent (gaia-agent) is frozen from the RC's own commit
#     (rc-flagship) and attached to the pre-release with gaia-agent-release.json,
#     which an RC core installs it from; the hub's flagship is never used by an RC
#
# Environment setup (one-time, in GitHub repo settings):
#   1. Create a "publish" environment with required reviewers.
#      This is the single approval gate for a final release.
#      Create "publish-rc" with NO reviewers and deployments limited to tags
#      matching v*-rc*; approve-publish uses it for a release candidate.
#   2. Keep the "pypi" environment for OIDC trusted publishing,
#      but remove its required reviewers — the "publish" gate handles approval.
#   3. Update the PyPI trusted publisher config (pypi.org → Manage → Publishing)
#      to reference workflow "publish.yml" instead of "pypi.yml".

name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One group per tag, never cancelled: a new tag must not kill a release that may
# be mid-publish. An older RC that a newer tag supersedes stops itself before
# publishing (approve-publish), and a re-run of the same tag waits its turn.
concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ── Stage 1: Validate ──────────────────────────────────────────────

  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.TAG_NAME }}
      tag_version: ${{ steps.tag.outputs.TAG_VERSION }}
      is_rc: ${{ steps.tag.outputs.IS_RC }}
      pep440_version: ${{ steps.tag.outputs.PEP440_VERSION }}
      npm_version: ${{ steps.tag.outputs.NPM_VERSION }}
      notes_tag: ${{ steps.tag.outputs.NOTES_TAG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Extract tag info
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "ERROR: This workflow must be triggered from a tag push."
            echo "  GITHUB_REF_NAME=$GITHUB_REF_NAME (type: $GITHUB_REF_TYPE)"
            echo "  To release: git tag v<version> && git push origin v<version>"
            exit 1
          fi
          TAG_NAME="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG_NAME (version: $TAG_VERSION)"
          # Final (vX.Y.Z) or release candidate (vX.Y.Z-rcN); anything else fails.
          CLASSIFIED="$(python3 util/release_tag.py classify "$TAG_NAME")"
          echo "$CLASSIFIED"
          echo "$CLASSIFIED" >> "$GITHUB_OUTPUT"

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "ERROR: Tag ${{ github.ref_name }} is not on the main branch."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} verified on main"

      # The committed version is the release's X.Y.Z for an RC too: the -rcN
      # suffix is stamped at build time, so the final can reuse the RC's commit.
      - name: Verify all versions match
        env:
          TAG_VERSION: ${{ steps.tag.outputs.BASE_VERSION }}
        run: |
          PY_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/gaia/version.py)
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/gaia/apps/webui/package.json','utf8')).version)")

          echo "=== Version Check ==="
          echo "  Git tag:      v$TAG_VERSION"
          echo "  version.py:   $PY_VERSION"
          echo "  package.json: $PKG_VERSION"

          FAIL=0
          if [ "$PY_VERSION" != "$TAG_VERSION" ]; then
            echo "FAIL: version.py ($PY_VERSION) != tag (v$TAG_VERSION)"
            FAIL=1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "FAIL: package.json ($PKG_VERSION) != tag (v$TAG_VERSION)"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo 'Fix: update version.py and run "node installer/version/bump-ui-version.mjs", commit, and re-tag.'
            exit 1
          fi
          echo "All versions match: v$TAG_VERSION"

      # The flagship agent reaches users from the hub and the committed lock,
      # both filled by a separate release (release_agent_gaia.yml). A final must
      # not ship with one frozen from older code. An RC builds its own instead.
      - name: Verify the flagship agent is built from this release
        if: steps.tag.outputs.IS_RC != 'true'
        run: python3 util/check_flagship_release.py --ref "${GITHUB_SHA}"

      # NOTES_TAG is the tag itself for a final, and the final's vX.Y.Z for an RC.
      - name: Validate release notes exist
        env:
          TAG_NAME: ${{ steps.tag.outputs.NOTES_TAG }}
        run: |
          NOTES_FILE="docs/releases/${TAG_NAME}.mdx"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "ERROR: Release notes missing: $NOTES_FILE"
            echo ""
            echo "Before tagging, create the release notes file."
            echo "See docs/releases/ for examples."
            exit 1
          fi
          echo "Release notes found: $NOTES_FILE"

      - name: Validate docs.json references
        env:
          TAG_NAME: ${{ steps.tag.outputs.NOTES_TAG }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          tag = os.environ["TAG_NAME"]
          errors = []

          with open("docs/docs.json") as f:
              docs = json.load(f)

          release_page = f"releases/{tag}"
          found_page = False
          for tab in docs["navigation"]["tabs"]:
              if tab.get("tab") == "Releases":
                  for group in tab["groups"]:
                      if group.get("group") == "Release Notes":
                          if release_page in group["pages"]:
                              found_page = True
          if found_page:
              print(f"docs.json has release entry for {tag}")
          else:
              errors.append(f"docs/docs.json is missing '{release_page}' in the Releases tab")

          found_navbar = False
          for link in docs.get("navbar", {}).get("links", []):
              if tag in link.get("label", ""):
                  found_navbar = True
          if found_navbar:
              print(f"docs.json navbar references {tag}")
          else:
              errors.append(f"docs/docs.json navbar version label does not reference {tag}")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              print()
              print("Update docs/docs.json before tagging.")
              sys.exit(1)
          PYEOF

      - name: Validate release notes structure
        env:
          TAG_NAME: ${{ steps.tag.outputs.TAG_NAME }}
          NOTES_TAG: ${{ steps.tag.outputs.NOTES_TAG }}
        run: python3 util/validate_release_notes.py "docs/releases/${NOTES_TAG}.mdx" --tag "$TAG_NAME"

  # ── Stage 2: Build (parallel, all must succeed) ─────────────────────

  build-pypi:
    name: Build PyPI Package
    # Depends on build-npm so the wheel ships the *same* React bundle that the
    # npm package publishes. Building twice (once per job) would risk hash
    # drift between vite outputs across runners — see issue #846.
    needs: [validate, build-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Download pre-built frontend
        uses: actions/download-artifact@v8
        with:
          name: npm-package-build
          path: src/gaia/apps/webui/dist/
      - name: Stamp the release-candidate version
        if: needs.validate.outputs.is_rc == 'true'
        run: python util/release_tag.py stamp "${{ needs.validate.outputs.tag_name }}"
      - name: Verify frontend dist/ is non-empty and clean
        run: python util/verify_wheel_dist.py src/gaia/apps/webui/dist
      - name: Build distributions
        run: |
          rm -rf dist/ build/ *.egg-info
          python -m pip install build
          python -m build
      - name: Verify wheel ships frontend assets
        run: |
          WHL=$(ls dist/*.whl | head -1)
          python util/verify_wheel_dist.py --wheel "$WHL"
      - name: Verify with twine
        run: |
          python -m pip install twine
          twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  build-npm:
    name: Build npm Package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Before the build: the bundle's __APP_VERSION__ is read from version.py.
      - name: Stamp the release-candidate version
        if: needs.validate.outputs.is_rc == 'true'
        run: python util/release_tag.py stamp "${{ needs.validate.outputs.tag_name }}"

      - name: Install dependencies
        working-directory: src/gaia/apps/webui
        # No silent fallback: if package-lock.json is broken, we want the
        # build to fail loudly here rather than ship a wheel with an
        # unexpected dependency tree (see CLAUDE.md "No Silent Fallbacks").
        run: npm ci

      - name: Build frontend
        working-directory: src/gaia/apps/webui
        run: npm run build

      - name: Verify build output
        working-directory: src/gaia/apps/webui
        run: |
          if [ ! -f dist/index.html ]; then
            echo "ERROR: dist/index.html not found"
            exit 1
          fi
          echo "Build output verified:"
          ls -la dist/
          JS_SIZE=$(find dist/assets -name "*.js" -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1)
          CSS_SIZE=$(find dist/assets -name "*.css" -exec du -cb {} + 2>/dev/null | tail -1 | cut -f1)
          echo "  JS: $((JS_SIZE / 1024))KB"
          echo "  CSS: $((CSS_SIZE / 1024))KB"

      - name: Verify CLI entry point
        working-directory: src/gaia/apps/webui
        run: |
          # Phase A renamed the CLI entry point from .mjs to .cjs so that
          # both the bin entry and main.cjs can `require()` the shared
          # services/backend-installer.cjs module (ESM/CJS can't mix).
          if [ ! -f bin/gaia-ui.cjs ]; then
            echo "ERROR: bin/gaia-ui.cjs not found"
            exit 1
          fi
          node --check bin/gaia-ui.cjs
          echo "CLI entry point verified"

      - name: Verify built app version
        run: |
          PY_VERSION=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/gaia/version.py)
          ESCAPED=$(echo "$PY_VERSION" | sed 's/\./\\./g')
          # __APP_VERSION__ is injected by Vite's define as a quoted string
          # literal. The minifier's quote char depends on the Vite/esbuild
          # version (Vite 8 emits backticks, Vite 5 emitted double quotes),
          # and the entry chunk is not always named index-*.js, so match any
          # quote char (" ' `) across every emitted chunk.
          if grep -rqE "[\"'\`]${ESCAPED}[\"'\`]" src/gaia/apps/webui/dist/assets/*.js; then
            echo "  version.py: $PY_VERSION"
            echo "Built app version verified ($PY_VERSION)"
          else
            echo "  version.py: $PY_VERSION"
            echo "FAIL: version $PY_VERSION not found as a quoted literal in any src/gaia/apps/webui/dist/assets/*.js"
            echo "Version-like strings present in the bundle:"
            grep -hoE "[0-9]+\.[0-9]+\.[0-9]+" src/gaia/apps/webui/dist/assets/*.js | sort -u | head
            exit 1
          fi

      - name: Run backend tests
        # No silent fallback (CLAUDE.md "No Silent Fallbacks"): this is the only
        # pytest run on the release path -- test_unit.yml triggers on pushes to
        # main, not on a v* tag -- so a swallowed failure here publishes a broken
        # build. The `|| echo` and `2>/dev/null` this replaces made the step green
        # whether the tests passed, failed, or never ran at all.
        #
        # [api] as well as [dev]: gaia.ui imports fastapi, which only the api/ui
        # extras declare, so `pip install -e ".[dev]"` cannot even collect these
        # tests. That is what the old `|| pip install -e .` fallback was papering
        # over -- it dropped pytest itself, and the pytest failure was swallowed
        # in turn.
        run: |
          pip install -e ".[dev,api]"
          python -m pytest tests/unit/chat/ui/ -x --tb=short

      - name: Upload built frontend
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-build
          path: src/gaia/apps/webui/dist/

  # Build the GAIA Agent UI desktop installers (NSIS / DMG / DEB / AppImage)
  # via the reusable build-installers workflow. The reusable workflow uploads
  # each platform's artifacts to a workflow-run artifact named
  # "<platform>-installer". The github-release job below downloads those
  # artifacts and includes them in the published release.
  #
  # We pass publish_to_release=false so build-installers does NOT create its
  # own draft release — publish.yml's github-release job is the single
  # source of truth for what gets published, gated on the approval step.
  build-desktop-installers:
    name: Build Desktop Installers
    needs: validate
    permissions:
      contents: write   # build-installers uploads workflow artifacts
      id-token: write   # for SignPath OIDC (Phase H — opt-in via secret)
    secrets: inherit
    uses: ./.github/workflows/build-installers.yml
    with:
      tag: ${{ needs.validate.outputs.tag_name }}
      publish_to_release: false

  # ── Release candidate: the flagship agent from this commit ──────────
  # The hub's flagship is whatever release_agent_gaia.yml last published, which
  # can be many commits older than the candidate. An RC core installs this
  # build from the pre-release instead (gaia.hub.prerelease), so the pre-release
  # must not ship without it: approve-publish requires it.
  rc-flagship:
    name: Flagship agent (release candidate)
    needs: validate
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.is_rc == 'true'
    uses: ./.github/workflows/build_flagship_sidecar.yml

  # No eval gates this workflow. The same v* tag starts eval_flagship.yml as a
  # separate run that reports (job summary + an issue when it does not pass) and
  # never blocks publishing; regressions are reported, not gated (#5172).

  # ── The tagged commit passed CI ─────────────────────────────────────
  # The test workflows ran when this commit reached main, not on the tag, and
  # most of those runs were cancelled by the next merge. util/check_release_ci.py
  # requires a passing run of each required workflow on this exact commit,
  # dispatches any that has none against the tag, and waits. Parallel with the
  # builds, so it only adds time when CI is slower than they are.
  ci-green:
    name: Tagged commit passed CI
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write   # read the commit's runs; dispatch the missing ones
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check the required workflows passed on this commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          python3 util/check_release_ci.py --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --tag "${TAG_NAME}"

  # ── Stage 3: Approve (single manual gate, finals only) ──────────────
  # All builds and CI must pass before anything publishes. A final waits for a
  # reviewer in the "publish" environment; an RC runs in "publish-rc", which has
  # none. pypi and npm keep their own environments: the trusted publishers are
  # bound to those names.

  approve-publish:
    name: Approve Publishing
    needs: [validate, build-pypi, build-npm, build-desktop-installers, rc-flagship, rc-tui-complete, ci-green]
    if: >-
      !cancelled() &&
      needs.build-pypi.result == 'success' &&
      needs.build-npm.result == 'success' &&
      needs.build-desktop-installers.result == 'success' &&
      needs.ci-green.result == 'success' &&
      (needs.validate.outputs.is_rc != 'true' || needs.rc-flagship.result == 'success') &&
      (needs.validate.outputs.is_rc != 'true' || needs.rc-tui-complete.result == 'success')
    runs-on: ubuntu-latest
    environment: ${{ needs.validate.outputs.is_rc == 'true' && 'publish-rc' || 'publish' }}
    steps:
      - run: |
          echo "=== Build Results ==="
          echo "  PyPI:               ${{ needs.build-pypi.result }}"
          echo "  npm:                ${{ needs.build-npm.result }}"
          echo "  Desktop Installers: ${{ needs.build-desktop-installers.result }}"
          echo "  RC flagship agent:  ${{ needs.rc-flagship.result }}"
          echo "  RC terminal pkgs:   ${{ needs.rc-tui-complete.result }}"
          echo "  CI on this commit:  ${{ needs.ci-green.result }}"
          echo ""
          echo "All builds passed. Publishing approved."

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # After the approval, immediately before the first publish: an RC whose
      # newer sibling was tagged while it built must not overwrite `next`.
      - name: Stop if a newer tag of this release exists
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          NOTES_TAG: ${{ needs.validate.outputs.notes_tag }}
        run: |
          set -euo pipefail
          tags="$(git ls-remote --tags --refs origin "refs/tags/${NOTES_TAG}*" | sed 's#.*refs/tags/##')"
          echo "Tags of ${NOTES_TAG}:"
          echo "${tags}"
          if ! echo "${tags}" | python3 util/release_tag.py superseded "${TAG_NAME}"; then
            echo "::error::${TAG_NAME} is superseded by a newer tag of ${NOTES_TAG}; stopped before publishing anything."
            exit 1
          fi

  # ── Stage 4: Publish (parallel, after single approval) ──────────────

  publish-pypi:
    name: Publish to PyPI
    needs: approve-publish
    # Explicit `if:` on purpose, not the default: GitHub's implicit success()
    # check walks the FULL ancestor chain (including rc-flagship, which a final
    # release skips), not just this job's direct `needs:` — so without
    # this, a clean approve-publish success still gets silently skipped
    # downstream. approve-publish already carries its own explicit override;
    # this one has to carry its own too, independently. `!cancelled()` is
    # REQUIRED, not decorative: a bare `needs.approve-publish.result ==
    # 'success'` with no `!cancelled()`/`always()` guard still gets
    # auto-skipped by the engine's own ancestor-skip propagation before this
    # expression is even evaluated (confirmed empirically on this exact tag —
    # the bare form skipped anyway).
    if: >-
      !cancelled() &&
      needs.approve-publish.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/amd-gaia
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Make re-runs idempotent: if this version is already on PyPI
          # (e.g. a later stage failed and the workflow is re-run), skip the
          # already-uploaded files instead of failing on a duplicate upload.
          skip-existing: true

  publish-npm:
    name: Publish to npm
    needs: [validate, approve-publish]
    # See publish-pypi's comment: explicit if, same reason, and `!cancelled()`
    # is likewise required (a bare comparison skipped anyway, confirmed).
    if: >-
      !cancelled() &&
      needs.approve-publish.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@amd-gaia/agent-ui
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships with npm 11+ which supports OIDC trusted publishing.
          # Node 22 ships with npm 10.x which does NOT — and `npm install -g
          # npm@latest` on Node 22 runners corrupts npm's own dependencies.
          node-version: '24'
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: npm-package-build
          path: src/gaia/apps/webui/dist/
      # The published package.json carries the version, so it is stamped here
      # too, not only in the build job.
      - name: Stamp the release-candidate version
        if: needs.validate.outputs.is_rc == 'true'
        run: python3 util/release_tag.py stamp "${{ needs.validate.outputs.tag_name }}"
      - name: Install production dependencies
        working-directory: src/gaia/apps/webui
        # No silent fallback (see CLAUDE.md "No Silent Fallbacks"). If the
        # lockfile is stale, fail here rather than publish a divergent tree.
        run: npm ci --omit=dev
      # util/npm_publish_once.py, not a bare `npm publish`: a re-run skips a
      # version already on npm with the same bytes and fails on different ones.
      # --ignore-scripts: skip prepublishOnly (which runs tsc && vite build)
      # because the dist/ was already built in the build-npm job and
      # downloaded from the artifact. Dev dependencies are omitted, so
      # tsc would fail with missing @types/react.
      - name: Publish @amd-gaia/agent-ui
        if: needs.validate.outputs.is_rc != 'true'
        working-directory: src/gaia/apps/webui
        run: python3 ../../../../util/npm_publish_once.py --dist-tag latest -- --access public --provenance --ignore-scripts
      # `next`, never `latest`: `npm install @amd-gaia/agent-ui` must keep
      # resolving to the last final.
      - name: Publish @amd-gaia/agent-ui (release candidate, dist-tag next)
        if: needs.validate.outputs.is_rc == 'true'
        working-directory: src/gaia/apps/webui
        run: |
          python3 ../../../../util/npm_publish_once.py --dist-tag next -- --access public --provenance --ignore-scripts
          echo "Install with: npm install -g @amd-gaia/agent-ui@next"
      - name: Verify publication
        if: needs.validate.outputs.is_rc != 'true'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Published @amd-gaia/agent-ui@$TAG_VERSION to npm"
          echo ""
          echo "Install with:"
          echo "  npm install -g @amd-gaia/agent-ui@$TAG_VERSION"

  # ── Post-publish: smoke-test the PyPI package ───────────────────────

  post-publish-smoke:
    name: Post-Publish Smoke Test
    needs: [validate, publish-pypi]
    # Missing !cancelled() cascaded a skip through github-release on the
    # v0.24.0 retag, even though publish-pypi
    # itself succeeded — same bug as #3915/#3916, on the one job the sweep
    # for it missed. See publish-pypi's comment for the full explanation.
    if: >-
      !cancelled() &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # pep440_version is the tag's version for a final, X.Y.ZrcN for an RC.
      - name: Install from PyPI (with retry for propagation delay)
        env:
          TAG_VERSION: ${{ needs.validate.outputs.pep440_version }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: pip install amd-gaia==$TAG_VERSION"
            if pip install --no-cache-dir "amd-gaia==$TAG_VERSION"; then
              echo "Installed amd-gaia==$TAG_VERSION successfully"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "PyPI package not available yet, waiting 30s..."
              sleep 30
            fi
          done
          echo "ERROR: Failed to install amd-gaia==$TAG_VERSION after 5 attempts"
          exit 1

      - name: Verify gaia --version
        env:
          TAG_VERSION: ${{ needs.validate.outputs.pep440_version }}
        run: |
          VERSION_OUTPUT=$(gaia --version)
          echo "gaia --version: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -qF "$TAG_VERSION"; then
            echo "ERROR: version output does not contain $TAG_VERSION"
            exit 1
          fi

      - name: Verify CLI entry points
        run: |
          # Only core-wheel console_scripts belong here. gaia-emr / gaia-code
          # moved to the standalone gaia-agent-emr / gaia-agent-code hub
          # packages and are no longer installed by ``pip install amd-gaia``.
          gaia --help
          gaia-mcp --help

      - name: Verify Python import
        env:
          TAG_VERSION: ${{ needs.validate.outputs.pep440_version }}
        run: |
          IMPORT_VERSION=$(python -c "from importlib.metadata import version; print(version('amd-gaia'))")
          echo "amd-gaia version: $IMPORT_VERSION"
          if [ "$IMPORT_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: installed version ($IMPORT_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

  # ── Stage 5: GitHub Release ─────────────────────────────────────────

  build-tui:
    name: Build TUI binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tui/go.mod
          cache-dependency-path: tui/go.sum

      # Go links no Windows resource unless a .syso sits beside the main
      # package, so without this the .exe has no icon and a blank Details tab.
      # Same script and version as tui_installers.yml, so this copy and the one
      # inside the Windows setup describe themselves the same way.
      - name: Generate Windows resources (icon + version)
        if: matrix.goos == 'windows'
        working-directory: .
        env:
          VERSION: ${{ needs.validate.outputs.npm_version }}
        run: tui/scripts/gen-winres.sh --version "${VERSION}"

      # Stamped with the release version (0.25.1, or 0.25.1-rc.2 for an RC), not
      # the branch name: `gaia version` is the first thing asked for in a bug
      # report, and "main" tells nobody which build they are on. No `v`, to
      # match tui_installers.yml's builds of the same release.
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          PKG=github.com/amd/gaia/tui/internal/cli
          mkdir -p ../release-assets
          # The COMMIT's timestamp, never `now` — this is the third workflow that
          # builds these same targets, and a wall-clock stamp guarantees all
          # three disagree byte-for-byte on one version. -trimpath keeps the
          # runner's absolute paths out of the binary.
          DATE="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          go build -trimpath -ldflags="-s -w \
            -X ${PKG}.version=${VERSION} \
            -X ${PKG}.commit=${{ github.sha }} \
            -X ${PKG}.date=${DATE}" \
            -o ../release-assets/gaia-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/gaia

      # Reads the linked binary's PE resource directory: the linker silently
      # drops a .syso whose GOARCH suffix does not match, so only the shipped
      # bytes prove the icon and version are there.
      - name: Verify the Windows binary carries its icon and version
        if: matrix.goos == 'windows'
        working-directory: .
        env:
          VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          python3 util/check_pe_resources.py --expect-version "${VERSION}" \
            "release-assets/gaia-${{ matrix.goos }}-${{ matrix.goarch }}.exe"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-assets/gaia-*
          if-no-files-found: error

  # ── Release candidate: the terminal installers ─────────────────────
  # A final's come from release_components.yml, which never runs for an RC
  # because the Agent Hub catalog has no pre-release channel. An RC builds them
  # with the same reusable workflows and attaches them to its GitHub
  # pre-release -- never to R2 or the hub.
  #
  # The binaries, the macOS .pkg and the Linux .deb/.rpm, each smoke-tested on a
  # clean runner, wrapping the flagship agent THIS run froze (rc-flagship), never
  # the hub's. The files are named with -rc.N like every other RC asset; inside,
  # the .deb/.rpm carry X.Y.Z~rc.N so the final upgrades over them
  # (installer/tui/linux/README.md). approve-publish requires rc-tui-complete:
  # a candidate whose terminal packages do not install is not one to test.
  rc-tui:
    name: Terminal binaries and installers (release candidate)
    needs: [validate, rc-flagship]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.is_rc == 'true' &&
      needs.rc-flagship.result == 'success'
    uses: ./.github/workflows/tui_installers.yml
    with:
      version: ${{ needs.validate.outputs.npm_version }}
      sidecar: artifact

  # installers_ok means every leg that ran passed its clean-runner install. It
  # does not mean all four packages exist: tui_installers.yml builds no Intel
  # .pkg when the best-effort darwin-x64 agent leg was skipped. This checks the
  # four files by name BEFORE anything publishes, so a candidate is never
  # released short of one.
  rc-tui-complete:
    name: Terminal installers complete (release candidate)
    needs: [validate, rc-tui]
    if: >-
      !cancelled() &&
      needs.validate.outputs.is_rc == 'true' &&
      needs.rc-tui.outputs.installers_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: tui-installers-*
          merge-multiple: true
          path: dist

      - name: Every terminal installer is present
        env:
          VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          set -euo pipefail
          missing=()
          for platform in darwin-arm64 darwin-x64 linux-x64; do
            while IFS= read -r f; do
              if [ -s "dist/${f}" ]; then ls -l "dist/${f}"; else missing+=("${f}"); fi
            done < <(python3 installer/tui/artifacts.py names --version "${VERSION}" --platform "${platform}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the release candidate built no ${missing[*]}, so nothing publishes. A missing darwin-x64 .pkg means the best-effort Intel agent leg in 'Flagship agent (release candidate)' did not build. Fix it and 'Re-run failed jobs'."
            exit 1
          fi

  # Embeds THIS run's desktop app setup and flagship agent (same commit, same
  # tag), never published ones.
  rc-windows-setup:
    name: Windows setup (release candidate)
    needs: [validate, build-desktop-installers, rc-tui, rc-flagship]
    if: >-
      !cancelled() &&
      needs.validate.outputs.is_rc == 'true' &&
      needs.build-desktop-installers.result == 'success' &&
      needs.rc-tui.outputs.binaries_ok == 'true' &&
      needs.rc-flagship.result == 'success'
    permissions:
      contents: read
      actions: read   # this run's windows-installer artifact
    uses: ./.github/workflows/windows_setup.yml
    with:
      version: ${{ needs.validate.outputs.npm_version }}
      sidecar: artifact
      agent_ui_publish_run_sha: ${{ github.sha }}

  # The pre-release still ships without the setup, says so in its notes, and
  # this job turns the run red so it is never mistaken for a complete candidate.
  rc-windows-setup-missing:
    name: Windows setup missing (release candidate)
    needs: [validate, rc-windows-setup]
    if: >-
      !cancelled() &&
      needs.validate.outputs.is_rc == 'true' &&
      needs.rc-windows-setup.outputs.ok != 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          NPM_VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          echo "::error::gaia-${NPM_VERSION}-win-x64-setup.exe did not build and pass its clean-runner smoke test, so the pre-release does not carry it. Fix the 'Windows setup (release candidate)' failure, then 'Re-run failed jobs': that rebuilds the setup and re-runs GitHub Release, which attaches it."
          exit 1

  github-release:
    name: GitHub Release
    # rc-windows-setup is waited for, not required: its own timeouts bound the
    # wait, it is skipped on a final, and a failure is reported by
    # rc-windows-setup-missing rather than by holding back the pre-release.
    # build-tui IS required: install.sh / install.ps1 download these binaries
    # from the latest release, so one missing leg breaks installs on that
    # platform until the next release.
    # rc-tui-complete is required too, though approve-publish already was: a
    # candidate whose terminal packages did not install is not one to release.
    needs: [validate, post-publish-smoke, publish-npm, build-desktop-installers, build-tui, rc-windows-setup, rc-flagship, rc-tui-complete]
    if: >-
      !cancelled() &&
      needs.post-publish-smoke.result == 'success' &&
      needs.publish-npm.result == 'success' &&
      needs.build-desktop-installers.result == 'success' &&
      needs.build-tui.result == 'success' &&
      (needs.validate.outputs.is_rc != 'true' || needs.rc-flagship.result == 'success') &&
      (needs.validate.outputs.is_rc != 'true' || needs.rc-tui-complete.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Extract release notes
        if: needs.validate.outputs.is_rc != 'true'
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          NOTES_FILE="docs/releases/${TAG_NAME}.mdx"
          awk 'BEGIN{fm=0} /^---$/ && fm<2 {fm++; next} fm>=2{print}' "$NOTES_FILE" > RELEASE_BODY.md

          cat >> RELEASE_BODY.md << 'EOF'

          ---

          ## Installation

          ### Desktop installer (recommended for end users)

          Download the installer for your platform from the assets below:

          - **Windows** — the GAIA installer from https://amd-gaia.ai/#install (`gaia-*-win-x64-setup.exe`): choose the desktop app, the terminal, or both. `gaia-agent-ui-*-x64-setup.exe` below is the desktop app on its own (autostart on by default)
          - **macOS** — `gaia-agent-ui-*-arm64.dmg` (drag to Applications, Apple Silicon only)
          - **Linux** — `gaia-agent-ui-*-amd64.deb` (Debian/Ubuntu) or `gaia-agent-ui-*-x86_64.AppImage` (any distro)

          On first launch the app sets up its Python backend automatically (~5–10 minutes for the minimal profile, depends on your internet speed).

          See the [installation guide](https://github.com/amd/gaia/blob/main/docs/guides/install.mdx) for setup details and troubleshooting.

          ### Developer install (Python CLI)

          Install GAIA using pip:
          ```bash
          pip install amd-gaia
          ```

          Or using uv:
          ```bash
          uv pip install amd-gaia
          ```

          Or via npm:
          ```bash
          npm install -g @amd-gaia/agent-ui
          ```
          EOF
          echo "Release body generated: $(wc -l < RELEASE_BODY.md) lines"

      # An RC ships its final's notes, under a banner that says what it is and
      # install lines that reach the RC rather than the last final.
      - name: Extract release notes (release candidate)
        if: needs.validate.outputs.is_rc == 'true'
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          NOTES_TAG: ${{ needs.validate.outputs.notes_tag }}
          PEP440_VERSION: ${{ needs.validate.outputs.pep440_version }}
          NPM_VERSION: ${{ needs.validate.outputs.npm_version }}
          WINDOWS_SETUP_OK: ${{ needs.rc-windows-setup.outputs.ok }}
        run: |
          PKG_VERSION="$(installer/tui/linux/build-packages.sh --version "${NPM_VERSION}" --print-package-version)" || exit 1
          NOTES_FILE="docs/releases/${NOTES_TAG}.mdx"
          cat > RELEASE_BODY.md << 'EOF'
          > [!IMPORTANT]
          > **Release candidate for @NOTES_TAG@.** A pre-release for testing before the final ships. Installers and package managers keep offering the last final release unless you ask for this one.

          EOF
          awk 'BEGIN{fm=0} /^---$/ && fm<2 {fm++; next} fm>=2{print}' "$NOTES_FILE" >> RELEASE_BODY.md

          cat >> RELEASE_BODY.md << 'EOF'

          ---

          ## Installing this release candidate

          ### Desktop app and terminal

          Download the installer for your platform from the assets below:

          EOF
          # Only what is attached: the setup is listed when it passed its smoke
          # test, and its absence is stated rather than left for testers to find.
          if [ "${WINDOWS_SETUP_OK}" = "true" ]; then
            echo '- **Windows** — `gaia-@NPM_VERSION@-win-x64-setup.exe`: one installer for the desktop app, the terminal, or both. `gaia-agent-ui-@NPM_VERSION@-x64-setup.exe` is the desktop app on its own' >> RELEASE_BODY.md
          else
            echo '- **Windows** — `gaia-agent-ui-@NPM_VERSION@-x64-setup.exe` (desktop app). **The one-step Windows setup failed to build for this candidate and is not attached.**' >> RELEASE_BODY.md
          fi

          cat >> RELEASE_BODY.md << 'EOF'
          - **macOS** — `gaia-agent-ui-@NPM_VERSION@-arm64.dmg` (Apple Silicon only)
          - **Linux** — `gaia-agent-ui-@NPM_VERSION@-amd64.deb` (Debian/Ubuntu) or `gaia-agent-ui-@NPM_VERSION@-x86_64.AppImage` (any distro)

          The terminal on its own:

          - **macOS** — `gaia-@NPM_VERSION@-darwin-arm64.pkg` (Apple Silicon) or `gaia-@NPM_VERSION@-darwin-x64.pkg` (Intel)
          - **Linux** — `gaia_@NPM_VERSION@_amd64.deb` (Debian/Ubuntu) or `gaia-@NPM_VERSION@.x86_64.rpm` (Fedora/RHEL/SUSE). They install as version `@PKG_VERSION@`, so the final release upgrades over them

          Installer checksums are in `gaia-installers-SHA256SUMS.txt`. The terminal hub is also attached as standalone binaries (`gaia-<os>-<arch>`, checksums in `gaia-tui-SHA256SUMS.txt`).

          The GAIA agent itself is attached as `gaia-agent-<os>-<arch>`, built from this candidate's commit. This candidate's `gaia init` and `gaia hub install gaia` install it from here rather than from the Agent Hub, and say so if it is missing.

          ### One-line installer

          Installs this candidate's Python CLI, terminal and GAIA agent together:

          ```bash
          curl -fsSL https://amd-gaia.ai/install.sh | GAIA_RELEASE_TAG=@TAG_NAME@ sh
          ```

          ```powershell
          $env:GAIA_RELEASE_TAG = "@TAG_NAME@"; irm https://amd-gaia.ai/install.ps1 | iex
          ```

          ### Python CLI

          ```bash
          pip install --pre amd-gaia            # newest pre-release
          pip install amd-gaia==@PEP440_VERSION@     # exactly this one
          ```

          ### npm

          ```bash
          npm install -g @amd-gaia/agent-ui@next
          ```

          Found a problem? [Open an issue](https://github.com/amd/gaia/issues/new) and mention `@TAG_NAME@`.
          EOF
          sed -i             -e "s/@NOTES_TAG@/${NOTES_TAG}/g"             -e "s/@TAG_NAME@/${TAG_NAME}/g"             -e "s/@PEP440_VERSION@/${PEP440_VERSION}/g"             -e "s/@NPM_VERSION@/${NPM_VERSION}/g"             -e "s/@PKG_VERSION@/${PKG_VERSION}/g"             RELEASE_BODY.md
          echo "Release body generated: $(wc -l < RELEASE_BODY.md) lines"

      # ── Desktop installers ─────────────────────────────────────────
      # The reusable build-installers workflow uploaded each platform's
      # artifacts to "<platform>-installer" workflow-run artifacts. Pull
      # them here and add to release-assets/ so the softprops step
      # below includes them in the published release.
      # The terminal hub. Until these are release assets the binary exists
      # only as a CI artifact that expires in 14 days, so nothing can install it
      # — install.sh has no URL to fetch and the docs describe a command users
      # cannot obtain.
      # build-tui's six artifacts only. An RC run also holds rc-tui's
      # `tui-binaries`, which is the setup's input, not a release asset.
      - name: Download TUI binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tui-{linux,darwin,windows}-*
          merge-multiple: true
          path: release-assets

      # A checksum file is what lets install.sh verify what it downloaded. A
      # binary published without one can only be trusted blindly.
      # Exactly these six, the build-tui matrix: install.sh and install.ps1
      # refuse a binary with no checksum line, so a missing one is a broken
      # install for that platform.
      - name: Checksum TUI binaries
        run: |
          set -euo pipefail
          cd release-assets
          expected=(gaia-linux-amd64 gaia-linux-arm64 gaia-darwin-amd64 gaia-darwin-arm64 gaia-windows-amd64.exe gaia-windows-arm64.exe)
          missing=()
          for f in "${expected[@]}"; do
            [ -s "${f}" ] || missing+=("${f}")
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the release is missing terminal binaries: ${missing[*]}. install.sh / install.ps1 fetch these from the latest release, so it must not ship without them. Re-run the failed 'Build TUI binary' leg, then this job."
            exit 1
          fi
          sha256sum "${expected[@]}" > gaia-tui-SHA256SUMS.txt
          cat gaia-tui-SHA256SUMS.txt

      # After the checksum step, which covers the terminal binaries only.
      - name: Download the combined Windows setup (release candidate)
        if: needs.validate.outputs.is_rc == 'true' && needs.rc-windows-setup.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: windows-setup
          path: release-assets

      - name: Check the combined Windows setup is this candidate's
        if: needs.validate.outputs.is_rc == 'true' && needs.rc-windows-setup.outputs.ok == 'true'
        env:
          NPM_VERSION: ${{ needs.validate.outputs.npm_version }}
        run: |
          set -euo pipefail
          name="$(python3 installer/tui/artifacts.py names --version "${NPM_VERSION}" --platform win-x64)"
          if [ ! -s "release-assets/${name}" ]; then
            echo "::error::the windows-setup artifact has no ${name}; it holds: $(ls release-assets | tr '\n' ' ')"
            exit 1
          fi
          ls -l "release-assets/${name}"

      # The RC core installs its flagship from these (gaia.hub.prerelease), so a
      # pre-release without them would leave every tester with no agent.
      - name: Download the flagship agent builds (release candidate)
        if: needs.validate.outputs.is_rc == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: gaia-agent-*
          path: flagship

      - name: Attach the flagship agent (release candidate)
        if: needs.validate.outputs.is_rc == 'true'
        env:
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
        run: |
          python3 util/flagship_rc_assets.py release \
            --artifacts flagship --tag "${TAG_NAME}" --commit "${GITHUB_SHA}" \
            --out release-assets

      - name: Download Desktop Installer (Windows NSIS)
        uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release-assets
        continue-on-error: true

      - name: Download Desktop Installer (macOS DMG)
        uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: release-assets
        continue-on-error: true

      - name: Download Desktop Installer (Linux DEB + AppImage)
        uses: actions/download-artifact@v8
        with:
          name: linux-installer
          path: release-assets
        continue-on-error: true

      - name: Create GitHub Release
        if: needs.validate.outputs.is_rc != 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            dist/**
          body_path: RELEASE_BODY.md

      - name: Create GitHub pre-release (release candidate)
        if: needs.validate.outputs.is_rc == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            dist/**
          body_path: RELEASE_BODY.md
          prerelease: true
          make_latest: false

  # ── Release candidate: attach the terminal installers ──────────────
  # The same four packages, under the same names, that a final attaches from
  # release_components.yml's github-release-installers, plus the same
  # gaia-installers-SHA256SUMS.txt. The website and test_installers_headless.yml
  # resolve them through installer/tui/artifacts.py.
  #
  # Every package is required: approve-publish already refused to publish
  # unless all four installed cleanly (rc-tui-complete), so a missing file here
  # is a broken run, and this job fails naming it. --clobber makes a re-run
  # replace, not fail.
  rc-github-release-installers:
    name: Attach terminal installers (release candidate)
    needs: [validate, github-release, rc-tui-complete, rc-windows-setup]
    if: >-
      !cancelled() &&
      needs.validate.outputs.is_rc == 'true' &&
      needs.github-release.result == 'success' &&
      needs.rc-tui-complete.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v8
        with:
          pattern: tui-installers-*
          merge-multiple: true
          path: dist

      # Checksummed only: github-release already attached it.
      - uses: actions/download-artifact@v8
        if: needs.rc-windows-setup.outputs.ok == 'true'
        with:
          name: windows-setup
          path: dist

      - name: List the installers and write their checksums
        env:
          VERSION: ${{ needs.validate.outputs.npm_version }}
          WINDOWS_SETUP_OK: ${{ needs.rc-windows-setup.outputs.ok }}
        run: |
          set -euo pipefail
          : > files.txt
          for platform in darwin-arm64 darwin-x64 linux-x64; do
            python3 installer/tui/artifacts.py names --version "${VERSION}" --platform "${platform}" >> files.txt
          done
          cp files.txt summed.txt
          if [ "${WINDOWS_SETUP_OK}" = "true" ]; then
            python3 installer/tui/artifacts.py names --version "${VERSION}" --platform win-x64 >> summed.txt
          fi
          missing=()
          while IFS= read -r f; do
            [ -s "dist/${f}" ] || missing+=("${f}")
          done < summed.txt
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::the release candidate is missing terminal installers: ${missing[*]}. Nothing was attached. Re-run the failed 'Terminal binaries and installers (release candidate)' leg, then this job."
            exit 1
          fi
          mapfile -t summed < summed.txt
          (cd dist && sha256sum "${summed[@]}") > dist/gaia-installers-SHA256SUMS.txt
          cat dist/gaia-installers-SHA256SUMS.txt

      - name: Attach the installers and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < files.txt
          gh release upload "${TAG}" "${files[@]/#/dist/}" dist/gaia-installers-SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" --clobber
          echo "✓ attached ${#files[@]} terminal installers and their checksums to ${TAG}"

  # The website builds its "Try the release candidate" entry from the GitHub
  # releases at deploy time, so a new RC only appears after a rebuild. A final
  # gets its rebuild from release_components.yml, which also hides the RC again.
  redeploy-website-rc:
    name: Redeploy website (release candidate)
    needs: [validate, github-release]
    if: >-
      !cancelled() &&
      needs.github-release.result == 'success' &&
      needs.validate.outputs.is_rc == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo: this job has no checkout, so gh cannot infer the repository.
          gh workflow run deploy_website.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Requested website redeploy (deploy_website.yml on main)"

