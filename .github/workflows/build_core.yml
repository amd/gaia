#
# Freeze the GAIA core (`gaia`) into the one-dir executable the apps ship,
# smoke-test it, and upload it as a `<prefix>gaia-core-<platform>` artifact.
#
# Callers pack it so a user's PC never installs a Python package:
#   build-installers.yml  the desktop app (resources/core)
#   tui_installers.yml    the terminal .pkg / .deb / .rpm (beside gaia-tui)
#   windows_setup.yml     the Windows setup's terminal component
# Each passes its own artifact_prefix and only the platforms it packs, so two
# callers in one run never upload the same artifact name. Dispatch it on its
# own to check that main still freezes.
#
# The Linux build runs in a Rocky Linux 9 container (glibc 2.34), like the
# flagship agent's, so it runs on RHEL 9, Ubuntu 22.04 and Debian 12 too.
# darwin-x64 is best-effort, as the agent's is: a caller that finds no artifact
# for it builds no Intel package.

name: Build GAIA core

on:
  workflow_call:
    inputs:
      platforms:
        description: 'Space-separated platforms to freeze: win32-x64 darwin-arm64 darwin-x64 linux-x64'
        required: false
        type: string
        default: 'win32-x64 darwin-arm64 darwin-x64 linux-x64'
      tag:
        description: 'Release tag; a vX.Y.Z-rcN tag stamps that version, as the installers do'
        required: false
        type: string
        default: ''
      version:
        description: 'Release version (X.Y.Z or X.Y.Z-rc.N), for callers that have no tag; an RC stamps it'
        required: false
        type: string
        default: ''
      ref:
        description: 'Commit to build; empty checks out the tag, or the caller''s ref'
        required: false
        type: string
        default: ''
      artifact_prefix:
        description: 'Prefix for the uploaded artifact names'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Space-separated platforms to freeze'
        required: false
        default: 'win32-x64 darwin-arm64 darwin-x64 linux-x64'

permissions:
  contents: read

jobs:
  freeze:
    name: Freeze core (${{ matrix.key }})
    runs-on: ${{ matrix.os }}
    concurrency:
      group: core-freeze-${{ matrix.key }}-${{ inputs.artifact_prefix }}${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    container: ${{ matrix.container }}
    continue-on-error: ${{ !matrix.required }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            key: win32-x64
            exe: gaia.exe
            required: true
          - os: macos-latest
            key: darwin-arm64
            exe: gaia
            required: true
          - os: macos-26-intel
            key: darwin-x64
            exe: gaia
            required: false
          - os: ubuntu-latest
            key: linux-x64
            exe: gaia
            required: true
            container: rockylinux/rockylinux:9
            glibc_floor: '2.34'
    steps:
      # Job-level `if` can't see the matrix, so each leg checks it was asked for.
      - name: Is this platform wanted
        id: want
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          KEY: ${{ matrix.key }}
        run: |
          case " ${PLATFORMS} " in
            *" ${KEY} "*) echo "build=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "build=false" >> "$GITHUB_OUTPUT"; echo "${KEY} was not asked for" ;;
          esac

      - name: Prepare the glibc-floor container
        if: steps.want.outputs.build == 'true' && matrix.container
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            python3.12 python3.12-devel git binutils gcc gcc-c++ tar gzip findutils
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
          echo "UV_PYTHON_PREFERENCE=only-system" >> "$GITHUB_ENV"
          echo "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7
        if: steps.want.outputs.build == 'true'
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - name: Set up Python
        if: steps.want.outputs.build == 'true' && !matrix.container
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.want.outputs.build == 'true'
        uses: astral-sh/setup-uv@v7

      # The same stamp the installers get, so `gaia --version` matches the app.
      - name: Stamp the release-candidate version
        if: steps.want.outputs.build == 'true' && (contains(inputs.tag, '-rc') || contains(inputs.version, '-rc'))
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # 0.25.4-rc.3 is tagged v0.25.4-rc3.
          [ -n "${TAG}" ] || TAG="v${VERSION/-rc./-rc}"
          python util/release_tag.py stamp "${TAG}"

      # The same packages `pip install amd-gaia[ui]` gives an Agent UI user today.
      - name: Install the core + PyInstaller (frozen-build env)
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv-freeze --python 3.12
          uv pip install --python .venv-freeze -e ".[ui]" pyinstaller

      - name: Freeze
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-freeze/$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)/python
          "$PY" installer/core/freeze.py

      - name: Check the build bundles no copyleft code
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-freeze/$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)/python
          "$PY" hub/agents/gaia/python/packaging/check_bundle_licenses.py \
            "installer/core/dist/gaia/${{ matrix.exe }}"

      - name: Check the build runs on glibc ${{ matrix.glibc_floor }}
        if: steps.want.outputs.build == 'true' && matrix.glibc_floor
        shell: bash
        run: |
          set -euo pipefail
          .venv-freeze/bin/python hub/agents/gaia/python/packaging/check_glibc.py \
            "installer/core/dist/gaia/${{ matrix.exe }}" --max "${{ matrix.glibc_floor }}"

      - name: Smoke-test the frozen core
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PY=.venv-freeze/$([ "$RUNNER_OS" = "Windows" ] && echo Scripts || echo bin)/python
          "$PY" installer/core/smoke_test.py "installer/core/dist/gaia/${{ matrix.exe }}"

      # A tarball keeps the executable bits and the symlinks the macOS build has.
      - name: Pack
        if: steps.want.outputs.build == 'true'
        shell: bash
        run: tar -C installer/core/dist/gaia -czf gaia-core-${{ matrix.key }}.tar.gz .

      - name: Upload
        if: steps.want.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}gaia-core-${{ matrix.key }}
          path: gaia-core-${{ matrix.key }}.tar.gz
          if-no-files-found: error
