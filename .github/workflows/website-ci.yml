#
# PR + main CI for the website (website/, Astro). Catches the website breaking
# BEFORE it ships — previously the only build was Railway's post-merge deploy, so
# a broken page (type error, failed Astro build) reached main and only failed at
# deploy time. This runs on every PR that touches website/.
#
# PR builds read tests/fixtures/github/releases.json instead of the live
# releases API, so a shared hourly GitHub API quota cannot fail validation.
# Main builds leave the fixture unset and fetch live, exactly like the Railway
# production build. See website/src/data/github.ts.

name: Website CI

# Paths outside website/ are in the filter because the gates that catch them
# drifting live here and nowhere else: the Agent UI stylesheet and the TUI theme
# (cross-surface.test.ts reads both to assert the shared hues match — retuning
# one surface alone is exactly how the two ambers drifted apart), and the design
# language spec (tokens.contrast.test.ts recomputes the ratios it quotes).
# The installer table and the two release workflows are read by
# release-assets.test.ts: the download buttons look for the asset names they
# produce, and a rename there would silently drop a button.
#
# Both lists are asserted by cross-surface.test.ts, which scans the suite for
# reads that leave website/ — so a new one fails here rather than going unrun.
on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/gaia/apps/webui/src/styles/index.css'
      - 'tui/internal/ui/theme/theme.go'
      - 'docs/spec/gaia-design-language.mdx'
      - 'installer/tui/artifacts.py'
      - '.github/workflows/build_tui.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/website-ci.yml'
      - 'tests/fixtures/github/releases.json'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/gaia/apps/webui/src/styles/index.css'
      - 'tui/internal/ui/theme/theme.go'
      - 'docs/spec/gaia-design-language.mdx'
      - 'installer/tui/artifacts.py'
      - '.github/workflows/build_tui.yml'
      - '.github/workflows/publish.yml'
      - '.github/workflows/website-ci.yml'
      - 'tests/fixtures/github/releases.json'

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # Optional — the download links and stats row (website/src/data/github.ts)
      # fetch public GitHub data at build time. Unauthenticated works (60
      # req/hr); this raises it to 5,000/hr. Actions provides it for free, so
      # there's no reason to omit it even though it isn't required.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Must match website/package.json `engines.node` — Railway's Nixpacks builder
      # reads that field to pick the production Node, so CI and prod build alike.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        run: npm test

      # PR builds use the checked-in fixture, so they do not touch the live
      # releases API or spend the workflow token's hourly quota. Main builds
      # leave GAIA_GITHUB_FIXTURE empty and fetch live. Retries stay opt-in for
      # live API reads and cannot refill a shared hourly quota; they only ride
      # out a transient 403. Both are step-level so `npm test` keeps the default
      # of no retries.
      - name: Build (astro build)
        env:
          GITHUB_FETCH_RETRIES: ${{ github.event_name != 'pull_request' && '3' || '' }}
          GAIA_GITHUB_FIXTURE: ${{ github.event_name == 'pull_request' && format('{0}/tests/fixtures/github/releases.json', github.workspace) || '' }}
        run: npx astro build

      # Production's start command was previously never exercised by CI, so a
      # missing `serve` dependency or a broken command only surfaced on Railway.
      # Nixpacks puts node_modules/.bin on PATH; Actions does not, so add it here
      # and run the same bare `serve dist` command website/railway.json uses.
      - name: Production start command serves the built site
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          serve dist -l "${PORT:-3000}" &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:${PORT}/" && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/")
          echo "/ -> ${code}"
          [ "${code}" = 200 ] || { echo "::error::/ returned ${code} from the production start command"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/hub")
          echo "/hub -> ${code}"
          [ "${code}" = 200 ] || { echo "::error::/hub returned ${code} from the production start command"; exit 1; }
          # Redirects in public/serve.json: retired /hub/<agent> pages and /roadmap.
          for pair in "/hub/email /hub" "/roadmap /docs/roadmap"; do
            route="${pair% *}"; target="${pair#* }"
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:${PORT}${route}")
            echo "${route} -> ${out}"
            [ "${out%% *}" = 301 ] && [[ "${out#* }" == *"${target}" ]] || { echo "::error::${route} did not redirect to ${target} (${out})"; exit 1; }
          done
