#
# PR + main CI for the marketing/hub website (website/, Astro). Catches the
# website breaking BEFORE it ships — previously the only build was Railway's
# post-merge deploy, so a broken page (type error, failed Astro build, broken
# hub render) reached main and only failed at deploy time. This runs on every PR
# that touches website/.
#
# The build needs a live catalog (website has NO bundled fixture fallback — see
# website/src/data/catalog.ts), so HUB_CATALOG_URL points at the live Agent Hub
# Worker, exactly like the Railway production build.

name: Website CI

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # Same source the Railway production build uses; the live catalog is the
      # real dependency (no fixture fallback). A hub outage fails the build loudly.
      HUB_CATALOG_URL: https://hub.amd-gaia.ai
    steps:
      - uses: actions/checkout@v7

      # Must match website/package.json `engines.node` — Railway's Nixpacks builder
      # reads that field to pick the production Node, so CI and prod build alike.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Agent Hub's "in development" rows ship as a committed snapshot,
      # because `railway up` uploads only website/ and cannot read ../hub at
      # deploy time. This is what stops the snapshot going stale silently.
      - name: Agent snapshot is in sync with hub/agents
        run: npm run check:agents

      - name: Type-check (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (astro build from the live catalog)
        run: npx astro build

      # Production's start command was previously never exercised by CI, so a
      # missing `serve` dependency or a broken command only surfaced on Railway.
      # Nixpacks puts node_modules/.bin on PATH; Actions does not, so add it here
      # and run the same bare `serve dist` command website/railway.json uses.
      - name: Production start command serves the built site
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          serve dist -l "${PORT:-3000}" &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:${PORT}/" && break
            sleep 1
          done
          for route in / /hub /hub/email; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}${route}")
            echo "${route} -> ${code}"
            [ "${code}" = 200 ] || { echo "::error::${route} returned ${code} from the production start command"; exit 1; }
          done
