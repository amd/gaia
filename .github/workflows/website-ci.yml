#
# PR + main CI for the website (website/, Astro). Catches the website breaking
# BEFORE it ships — previously the only build was Railway's post-merge deploy, so
# a broken page (type error, failed Astro build) reached main and only failed at
# deploy time. This runs on every PR that touches website/.
#
# The download links are built from what the download server published (no
# bundled fixture fallback — see website/src/data/catalog.ts), so
# HUB_CATALOG_URL points at it, exactly like the Railway production build.

name: Website CI

# Paths outside website/ are in the filter because the gates that catch them
# drifting live here and nowhere else: the Agent UI stylesheet and the TUI theme
# (cross-surface.test.ts reads both to assert the shared hues match — retuning
# one surface alone is exactly how the two ambers drifted apart), and the design
# language spec (tokens.contrast.test.ts recomputes the ratios it quotes).
#
# Both lists are asserted by cross-surface.test.ts, which scans the suite for
# reads that leave website/ — so a new one fails here rather than going unrun.
on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/gaia/apps/webui/src/styles/index.css'
      - 'tui/internal/ui/theme/theme.go'
      - 'docs/spec/gaia-design-language.mdx'
      - '.github/workflows/website-ci.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/gaia/apps/webui/src/styles/index.css'
      - 'tui/internal/ui/theme/theme.go'
      - 'docs/spec/gaia-design-language.mdx'
      - '.github/workflows/website-ci.yml'

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      # Same source the Railway production build uses for the download links
      # (no fixture fallback). A download-server outage fails the build loudly.
      HUB_CATALOG_URL: https://hub.amd-gaia.ai
      # Optional — the homepage stats row (website/src/data/github.ts) fetches
      # public GitHub data at build time. Unauthenticated works fine (60
      # req/hr); this just raises it to 5,000/hr. Actions provides it for
      # free, so there's no reason to omit it even though it isn't required.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # Must match website/package.json `engines.node` — Railway's Nixpacks builder
      # reads that field to pick the production Node, so CI and prod build alike.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Unit tests (vitest)
        run: npm test

      - name: Build (astro build)
        run: npx astro build

      # Production's start command was previously never exercised by CI, so a
      # missing `serve` dependency or a broken command only surfaced on Railway.
      # Nixpacks puts node_modules/.bin on PATH; Actions does not, so add it here
      # and run the same bare `serve dist` command website/railway.json uses.
      - name: Production start command serves the built site
        env:
          PORT: 4173
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PATH"
          serve dist -l "${PORT:-3000}" &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:${PORT}/" && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${PORT}/")
          echo "/ -> ${code}"
          [ "${code}" = 200 ] || { echo "::error::/ returned ${code} from the production start command"; exit 1; }
          # The retired /hub pages redirect home (public/serve.json) so old links don't 404.
          for route in /hub /hub/email; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:${PORT}${route}")
            echo "${route} -> ${out}"
            [ "${out%% *}" = 301 ] && [[ "${out#* }" == */#install ]] || { echo "::error::${route} did not redirect to /#install (${out})"; exit 1; }
          done
