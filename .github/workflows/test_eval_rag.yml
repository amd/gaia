name: Eval RAG Quality

# FULLY DISABLED pending rebuild -- see #1315.
# This gate has never executed successfully: it targeted a runner label
# that never existed plus several more blocking bugs, and overflows the
# 90-min budget even once fixed. `workflow_dispatch` below is only a
# placeholder so the YAML stays valid -- a manual dispatch runs nothing
# useful, because the job `if:` conditions gate on `github.event.pull_request`
# (null on dispatch) and the job body is still broken. The working
# reference config lives on branch `ci/eval-rag-dryrun`; rebuild and
# re-enable (job conditions + `pull_request` trigger) are tracked in #1315.
#
# ONE of those "several more blocking bugs" is now removed, because its twin
# actually fired: the `lemonade-eval` pool is WINDOWS, so the bash install step
# this file used to carry (`source .venv-eval/bin/activate`) died in
# powershell.EXE the first time a labelled runner picked up the sibling
# workflow test_eval_agent_gemma_consolidation.yml. Setup now goes through
# ./.github/actions/setup-venv (uv, Windows-aware) and the pool label pins
# Windows. Everything else here -- the never-true job `if:`, the `--compare`
# invocation that diffs instead of running an eval, the 90-min budget -- is
# still #1315's to rebuild. Do not read this edit as "the gate works now".
on:
  # TEMPORARY, devlab/dispatch-conversion only: lets the conversion commit run this
  # workflow. Not for merge.
  push:
    branches: [ devlab/dispatch-conversion ]
  workflow_dispatch:

# Both jobs only check out code and run the eval — no writes to the repo,
# issues, or checks are needed.
permissions:
  contents: read

concurrency:
  group: lemonade-eval
  cancel-in-progress: false
  # `queue: single` (the default) keeps only ONE pending run and cancels the
  # previously-queued one — a phantom red X on the PR. `max` queues them FIFO.
  queue: max

jobs:
  skip-warning:
    name: Skip RAG Eval (fork PR or external contributor)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Notify skipped
        run: |
          echo "[SKIP] ANTHROPIC_API_KEY not available in this run (fork PR or missing secret). Skipping RAG eval job."

  run-eval:
    name: Run RAG Quality Eval
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # Converted to the AMD Ryzen Dev Lab pool: a runner is registered for this
    # job alone and destroyed after it. 'devlab-dispatch' is what routes it
    # there; 'strix-halo' narrows to the silicon. The static 'stx' / 'stx-test'
    # / 'lemonade-eval' labels named machines this pool does not carry.
    runs-on: [self-hosted, Windows, devlab-dispatch, strix-halo]
    defaults:
      run:
        shell: powershell
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python Environment
        uses: ./.github/actions/setup-venv
        with:
          python-version: '3.12'
          install-package: '-e .[dev,eval,ui,api] -e hub/agents/chat/python'

      - name: Run eval rag_quality compare
        # This runner must have a running Lemonade Server with the Gemma model loaded
        # and ANTHROPIC_API_KEY set in the job environment so the Anthropic judge can be used.
        # GitHub appends `exit $LASTEXITCODE` to every PowerShell step, so a
        # non-zero exit here already fails the step; no explicit check needed.
        run: |
          gaia eval agent --category rag_quality --compare tests/fixtures/eval_baselines/gemma-4-e4b-d71cd914/scorecard_rag_quality.json
        timeout-minutes: 90
