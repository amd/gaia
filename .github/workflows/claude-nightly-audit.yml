#
# Proactive nightly Claude audit. Every other Claude job in this repo is REACTIVE —
# it fires on a PR, a comment, or an @claude mention (claude.yml). Nothing looks at
# the repo proactively, so debt that ships inside a green PR (a feature with no doc
# page, a code path with no test, a silent `except Exception: pass`, a cli.mdx that
# drifted from the real flags) sits unnoticed until a user hits it. This workflow is
# the missing proactive lens: a scheduled deep review that fans out one Claude job
# per dimension, then files ONE issue per DEFECT.
#
# NAMING: the FILENAME still says nightly (it is referenced from docs, skills and tests);
# the display name is "Claude Code Audit" since it now runs every third night. The
# `weekly-audit` LABEL keeps its name deliberately — it is a PROVENANCE label ("a
# proactive Claude audit filed this"), shared with claude-weekly-doc-walkthrough.yml, so
# it names no cadence. Nothing depends on the label's spelling any more: dedup reads the
# audit-key/audit-cluster markers and searches the whole open backlog, not one label.
#
# HUMAN-GATED — NOT an auto-merge bot. The workflow produces *findings*, never
# commits. To turn an issue into a PR, a maintainer applies the `bug` label and
# the existing auto-fix job (claude.yml) takes over. No new PR-creation code here.
#
# ONE ISSUE PER DEFECT, NOT PER LOCATION. A defect spanning 39 files is ONE fix, so it
# gets ONE issue listing 39 locations. Lenses key findings by ROOT CAUSE (`cluster_key`);
# scripts/audit/prepare_synthesis.py merges every location of a cluster, then searches
# the WHOLE open backlog — not just this workflow's own label — for an issue already
# tracking it. Both halves are load-bearing: file-scoped keys turned one dead command
# into 5 issues in a night, and label-scoped dedup made the 4-month-old #1077 invisible,
# so the audit re-discovered it 14 times in a single run.
#
# NO RUN RECEIPTS. The per-run summary goes to $GITHUB_STEP_SUMMARY, never a new issue.
# Filing a bookkeeping issue per run accumulated 19 of them in the tracker with nothing
# actionable in any of them.
#
# CADENCE: every third night, dispatched by claude-audit-rotation.yml (one proactive
# audit a night). Run by hand any time with `gh workflow run claude-nightly-audit.yml`.
#
# MODES (resolved by scripts/audit/audit_history.py from this workflow's own history):
#   normal — reviews everything merged since the last ROTATION run that SUCCEEDED, so a
#            turn lost to the Claude usage limit is covered by the next one instead of
#            silently skipped. Skips a turn with no commits.
#   deep   — whole-codebase latent-debt sweep whenever the last successful deep sweep is
#            over 8 days old: every third turn (~9 days), and the very next turn after a
#            deep sweep fails. Also used when there is no usable history or the gap
#            exceeds 7 days. Interval-based on purpose: a weekday rule ("Sunday") would
#            land on this audit's night only once in 21 days.
#
# QUOTA GATE: preflight probes Claude once before any lens starts. On the usage limit the
# run stops there with the account and reset time in the job summary (5 of 10 nights in
# October 2026 failed this way, each burning four lens jobs to say so).
#
# SECURITY is NOT a dimension here — it has its own dedicated workflow,
# .github/workflows/claude-security-audit.yml (deterministic semgrep + a Claude
# taint/authz/suppression sweep, CVSS-scored, findings to the private code-scanning
# tab). This audit deliberately leaves security to it, to avoid two half-owners.
#
# DIMENSIONS (one read-only Claude job each, run in parallel):
#   correctness — logic bugs AND the CLAUDE.md "Fail Loudly" rule: `except Exception:
#                 pass`, try/except that returns a placeholder, silent degradation.
#                 (This dimension owns the silent-fallback check.)
#   docs        — new feature with no docs/ page or docs.json entry; cli.mdx drift;
#                 `amd-gaia.ai` links missing the `/docs/` prefix; hub-agent doc drift
#                 (README/SPEC/SKILL/CHANGELOG out of sync).
#   tests       — new/changed code paths with no coverage; assertions that only prove
#                 invocation, not call validity (CLAUDE.md "#1655" boundary rule).
#   features    — half-finished follow-ups, TODO-as-placeholder, gaps a recent feature implies.
#
# A synthesis job collects the four structured outputs, runs them through the
# deterministic dedup pass (scripts/audit/prepare_synthesis.py), and files one issue per
# surviving defect.
#
# MODEL: claude-opus-5-5 (Claude Opus 5.5) — strong static review at under half the token
# price of Fable ($4/$20 vs $10/$50 per MTok). It runs at its default effort (medium, one
# level below Opus 5's high); raise it with `--effort` in claude_args if lenses start
# missing things. A measured deep run on Fable cost ~$45 of API-equivalent subscription usage;
# Opus roughly halves that. Swap AUDIT_MODEL below to claude-fable-5 for maximum depth if
# you accept ~2x the cost.
#
# Model support is gated by the pinned claude-code-action version (the action bundles the
# CLI that resolves model names). Bump the SHA in the same change and prove it first with
# `gh workflow run claude-auth-canary.yml -f model=<new-id>`.
#
# Opus 5 finds real bugs at a higher rate per pass than 4.8 and stays accurate at lower
# effort, so the lenses now REPORT everything and let synthesis filter. Do NOT reintroduce
# "be conservative" / "precision beats recall" wording in a lens prompt: Opus 5 follows it
# literally and silently reports less.
#
# AUTH: same OAuth-preferred / API-key-fallback wiring as every claude.yml job
# (CLAUDE_CODE_OAUTH_TOKEN, covered by the monthly claude-auth-canary.yml). Runs on the
# Claude Max subscription pool, so there is no per-run dollar cost — only shared quota.
#
# COST CEILING: 4 dimension jobs (--max-turns 150) + 1 synthesis job (--max-turns 100) =
# a known per-run ceiling, paid up to 7x/week. Measured October 2026: ~$10 of
# API-equivalent subscription usage on a normal night, ~$30 on a deep Sunday. The
# since-last-success window and skip-if-empty are what keep that affordable. This shares one
# Max subscription pool with claude-security-audit.yml (also nightly) and the interactive
# PR-review / auto-fix jobs — if those start getting rate-limited, the first lever is
# trimming the nightly matrix and leaving all four lenses to the Sunday deep run. The dimension matrix runs `max-parallel: 1` (serialized) so
# the run is a steady drip rather than a 4-job burst — this keeps it under the Max
# subscription's rolling (5-hour) rate limit, at the cost of a longer wall-clock.
# skip-if-empty exits before any Claude call on a quiet night. The concurrency group
# prevents two scheduled runs from overlapping.
#
# NO REPO-CODE EXECUTION: the jobs read and report only (--allowedTools Read,Grep,Glob,Bash
# with no Edit/Write) — they never `pip install` / run GAIA / execute checked-out code,
# same rule as the claude.yml review jobs.

name: Claude Code Audit
run-name: ${{ inputs.rotation_night && format('Claude Code Audit — rotation night {0}', inputs.rotation_night) || 'Claude Code Audit' }}

on:
  # No cron of its own: claude-audit-rotation.yml dispatches this every third night
  # (one proactive audit a night, 10:13 UTC = 03:13 PDT / 02:13 PST). Running every
  # audit every night spent the Claude weekly cap mid-week.
  workflow_dispatch:
    inputs:
      rotation_night:
        # Set only by claude-audit-rotation.yml. Marks this run (via run-name) as a
        # rotation night, the only runs scripts/audit/audit_history.py counts as history.
        description: "Internal: set by claude-audit-rotation.yml. Leave empty."
        default: ""
      mode:
        description: "Audit mode"
        type: choice
        options: [auto, normal, deep]
        default: auto
      window_days:
        description: "Days of history to review in normal mode (empty = since the last successful rotation run)"
        # Empty, not a fixed day count: a fixed window silently skipped every commit
        # merged on a night the run failed.
        default: ""
      dry_run:
        # Files and comments NOTHING; writes what it WOULD have filed to the job summary.
        # This is how you validate a dedup change against the real backlog without adding
        # to it — the failure mode being guarded here is a bad dedup pass filing dozens of
        # duplicates, which is expensive to undo and impossible to test any other way.
        description: "Report what would be filed, without touching the tracker"
        type: boolean
        default: false

# Least-privilege default. Only the synthesis job files issues, via its own
# per-job `issues: write`. The dimension jobs are read-only.
permissions:
  contents: read

# Never let two scheduled runs overlap — they would race-evict each other's model
# slot and double-file issues. Not cancel-in-progress: let an in-flight run finish.
concurrency:
  group: claude-nightly-audit
  cancel-in-progress: false

env:
  # Single source of truth for the model. Opus 5.5 by default — under half the token
  # price of Fable for comparable static-review quality (see the MODEL note in the file header).
  AUDIT_MODEL: claude-opus-5-5

jobs:
  # Resolve mode (auto → deep/normal) and short-circuit a night with no commits.
  preflight:
    if: github.repository == 'amd/gaia'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads this workflow's own run history to find the last successful night.
      actions: read
      # Reads merged PR titles/bodies for the recent-changes context.
      pull-requests: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      mode: ${{ steps.scope.outputs.mode }}
      since: ${{ steps.scope.outputs.since }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      dimensions: ${{ steps.dims.outputs.dimensions }}
      dimension_count: ${{ steps.dims.outputs.dimension_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Single source of truth for the dimension list: the audit matrix and the
      # synthesis completeness check both read it, so adding a dimension can't leave
      # the check counting the old number.
      - name: Resolve the dimension list
        id: dims
        run: |
          set -euo pipefail
          dimensions='["correctness","docs","tests","features"]'
          {
            echo "dimensions=$dimensions"
            echo "dimension_count=$(printf '%s' "$dimensions" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          } >> "$GITHUB_OUTPUT"
          echo "Dimensions: $dimensions"

      - name: Resolve mode, window and skip-if-empty
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || 'auto' }}
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '' }}
        run: |
          set -euo pipefail
          # From this workflow's own history, not the clock: the window opens at the last
          # rotation run that SUCCEEDED, and a whole-codebase sweep runs whenever the last
          # successful one is over 8 days old (every third turn at a 3-night cadence; a
          # failed deep turn is retried on the next). See scripts/audit/audit_history.py.
          python3 scripts/audit/audit_history.py window \
            --repo "${{ github.repository }}" --workflow claude-nightly-audit.yml \
            --mode "$DISPATCH_MODE" --window-days "$WINDOW_DAYS" --deep-every-days 8 \
            > "$RUNNER_TEMP/scope.txt"
          cat "$RUNNER_TEMP/scope.txt"
          mode=$(sed -n 's/^mode=//p' "$RUNNER_TEMP/scope.txt")
          since=$(sed -n 's/^since=//p' "$RUNNER_TEMP/scope.txt")
          reason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/scope.txt")
          base_sha=$(sed -n 's/^base_sha=//p' "$RUNNER_TEMP/scope.txt")
          skip=false
          if [ "$mode" = "normal" ]; then
            count=$(git log --since="$since" --oneline | wc -l | tr -d ' ')
            echo "Commits since $since: $count"
            [ "$count" = "0" ] && skip=true
          fi
          {
            echo "mode=$mode"
            echo "since=$since"
            echo "base_sha=$base_sha"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Code audit scope"
            echo ""
            echo "**Mode:** $mode — $reason"
            if [ "$skip" = "true" ]; then
              echo ""
              echo "No commits in the window, so no lens runs tonight."
            fi
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # What merged since this audit's last successful run, once, deterministically, so
      # no lens spends turns reconstructing it. Bounded (30 KB) so five sessions reading
      # it stay cheap. Exact when the last run's commit is known; otherwise the last 3
      # days, and the summary says so. See scripts/audit/recent_changes.py.
      - name: Collect recent changes on main
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
        run: |
          python3 scripts/audit/recent_changes.py --repo "${{ github.repository }}" \
            --base-sha "$BASE_SHA" --fallback-days 3 --max-bytes 30000 \
            --out recent-changes.md --paths-out changed-paths.txt \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the recent-changes context
        if: steps.scope.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recent-changes
          path: |
            recent-changes.md
            changed-paths.txt
          if-no-files-found: error

      # One cheap probe before any lens. On the usage limit the run stops HERE, once, with
      # the account and reset time in the summary, instead of four lenses each failing in
      # under a second and synthesis blaming a missing artifact. The failure triggers
      # claude-account-switch.yml; the window above carries the night's work forward.
      - name: Show which Claude account this run uses
        if: steps.scope.outputs.skip != 'true'
        run: echo "::notice title=Claude account::${{ vars.CLAUDE_ACCOUNT != 'secondary' && 'This job uses the primary Claude account.' || secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' && 'This job uses the secondary Claude account.' || 'CLAUDE_ACCOUNT is secondary but CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so this job uses the primary Claude account.' }}"
      - name: Probe the Claude account
        id: probe
        if: steps.scope.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          anthropic_api_key: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            Reply with exactly the word: ok
          claude_args: |
            --max-turns 1
            --model ${{ env.AUDIT_MODEL }}
            --allowedTools Read
      - name: Stop here if Claude cannot answer
        if: steps.scope.outputs.skip != 'true'
        env:
          CLAUDE_CONCLUSION: ${{ steps.probe.outputs.conclusion }}
          CLAUDE_LOG: ${{ steps.probe.outputs.execution_file }}
          ACCOUNT: ${{ vars.CLAUDE_ACCOUNT == 'secondary' && 'secondary' || 'primary' }}
        run: |
          python3 scripts/audit/require_claude.py --conclusion "${CLAUDE_CONCLUSION:-}" \
            --log "${CLAUDE_LOG:-}" --account "$ACCOUNT" \
            --what "Tonight's code audit" --summary "$GITHUB_STEP_SUMMARY"

  # One read-only Claude job per dimension. Each writes findings-<dimension>.json and
  # uploads it as an artifact for the synthesis job. continue-on-error so one dimension
  # crashing (e.g. an install-phase flake) doesn't sink the whole audit.
  audit:
    # The mode is in the job name so audit_history.py can tell a past deep sweep
    # from a normal one.
    name: audit (${{ matrix.dimension }}, ${{ needs.preflight.outputs.mode }})
    needs: preflight
    # Explicit status check (#3929): run only after preflight succeeded and chose to
    # audit. The repo gate keeps a fork, where preflight is skipped, from running.
    if: >-
      github.repository == 'amd/gaia' && !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Serialize the dimensions so the run is a steady drip, not a 4-job burst —
      # keeps it under the Max subscription's rolling (5-hour) rate limit. Trades
      # wall-clock (~5 sequential Claude jobs) for a smoother token profile.
      max-parallel: 1
      matrix:
        dimension: ${{ fromJSON(needs.preflight.outputs.dimensions) }}
    steps:
      - name: Show which Claude account this job uses
        run: echo "::notice title=Claude account::${{ vars.CLAUDE_ACCOUNT != 'secondary' && 'This job uses the primary Claude account.' || secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' && 'This job uses the secondary Claude account.' || 'CLAUDE_ACCOUNT is secondary but CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so this job uses the primary Claude account.' }}"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the recent-changes context
        uses: actions/download-artifact@v8
        with:
          name: recent-changes
          path: .

      - name: Build audit scope
        env:
          MODE: ${{ needs.preflight.outputs.mode }}
        run: |
          set -euo pipefail
          {
            echo "# Audit scope"
            echo "mode: $MODE"
            echo ""
          } > audit-scope.txt
          if [ "$MODE" = "normal" ]; then
            echo "Review what recent-changes.md lists, and the code next to it." >> audit-scope.txt
            files=$(grep -E '\.py$' changed-paths.txt | while read -r f; do [ -f "$f" ] && echo "$f"; done || true)
          else
            echo "Deep sweep: review the whole codebase; recent-changes.md says where to start." >> audit-scope.txt
            files=$(git ls-files 'src/*.py' 'hub/*.py')
          fi
          # Deterministic candidates for the "No deadline" class in
          # scripts/audit/missed_bug_classes.md (the class audits missed most). A grep,
          # so a timeout passed on a later line still shows up: the lens confirms each.
          {
            echo ""
            echo "## Calls with no deadline (candidates; first 150, confirm each)"
          } >> audit-scope.txt
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | xargs grep -nE \
              'subprocess\.(run|call|check_call|check_output)\(|\.communicate\(\)|\.wait\(\)|\.join\(\)|requests\.(get|post|put|delete|head|request)\(|httpx\.(get|post|put|delete|stream|request)\(|urlopen\(|\.acquire\(\)' \
              | grep -v timeout | head -150 >> audit-scope.txt || true
          fi
          echo "Scope file lines: $(wc -l < audit-scope.txt)"

      - name: Run Claude (${{ matrix.dimension }} lens)
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          # Prefer subscription OAuth, fall back to API key — see claude.yml "Authentication".
          anthropic_api_key: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # On `schedule`, github.actor is whoever last touched the default branch — a bot
          # in this repo: github-merge-queue[bot] normally, github-actions[bot] after a
          # release workflow commits. Without this the human-actor gate rejects every
          # scheduled run before Claude starts. Safe: schedule/dispatch only, no fork input.
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            You are one lens of GAIA's proactive code audit. YOUR LENS IS: ${{ matrix.dimension }}
            Do ONLY that lens — ignore issues that belong to the other four.

            REPO: ${{ github.repository }}
            RUN LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## First actions
            1. Read `CLAUDE.md` — project conventions and the rules the lenses enforce.
            2. Read `audit-scope.txt` — whether this is a `normal` (recent-diff) or `deep`
               (whole-codebase) run, plus deterministic candidates for the hang class.
            3. Read `recent-changes.md` — what merged since this audit last ran, with PR
               titles and the paths each touched. Look hardest there and at the code next
               to it (regressions), re-check docs those PRs touched or made wrong, and do
               not report anything a PR there already fixed.
            4. Read `scripts/audit/missed_bug_classes.md` — the bug classes audits keep
               missing, with a checklist per lens, and a "Don't report" list. Apply your
               lens's checklist; report nothing on the don't-report list.
            5. Investigate with Grep/Glob/Read/Bash (read-only — do NOT edit, install, or run repo code).

            ## Your lens — the four are mutually exclusive; claim ONLY yours
            The lenses overlap unless you respect these boundaries. The decisive question for a
            broken thing is: **is the code wired but misbehaving (correctness), never written
            (features), or contradicted by its docs (docs)?** SECURITY is out of scope for this
            audit — it has a dedicated workflow (claude-security-audit.yml); if you spot a security
            issue, leave it to that workflow rather than filing it here.
            **Every tree is in scope, not just `src/gaia/` Python:** `hub/agents/**` and
            `hub/skills/**`, `tui/` (Go), `src/gaia/apps/webui/` (TypeScript/React + Electron),
            `installer/` (PowerShell/shell), `scripts/`, `util/`, and `.github/workflows/`.
            - **correctness**: code that IS wired and runs but silently does the wrong thing or
              nothing — a handler that flips a success flag without doing the work (a rollback
              that never rolls back), a poller that always returns a placeholder/null, a mode
              that no-ops, a flag the parser accepts but whose handler raises NotImplementedError.
              PLUS real logic bugs and every CLAUDE.md "No Silent Fallbacks — Fail Loudly"
              violation (`except Exception: pass`, `try/except` returning None/""/a placeholder
              and swallowing the error, retry loops hiding the final failure, config defaulting a
              missing required value). **This lens OWNS wired-but-broken behavior and the
              silent-fallback check — do NOT leave these to `features`.**
            - **features**: a genuinely MISSING or half-shipped capability where nothing is wired
              yet — a `TODO` standing in for code never written, a capability a recent feature
              clearly implies but didn't ship. If the code IS wired but behaves wrongly or does
              nothing, that is **correctness**, not features. Don't claim it here.
            - **docs**: a new/changed feature with no `docs/` page or no `docs.json` nav entry;
              `docs/reference/cli.mdx` drift from the real `gaia` flags; `docs/sdk/**` and the
              rest of `docs/reference/**` drifting from the code they describe (signatures,
              defaults, endpoints, env vars); any `amd-gaia.ai` URL in
              `src/gaia/` missing the `/docs/` prefix (CI rule, issue #1058); a hub agent under
              `hub/agents/<id>/python/` whose README/SPEC/SKILL/CHANGELOG contradict each other.
              A feature **documented as working whose implementation is a stub/NotImplementedError
              is a DOCS finding** (doc-vs-code drift) — claim it here, not under features.
            - **tests**: code paths with no test, or assertions that only prove a mock was called,
              not that the outgoing call is valid (CLAUDE.md "#1655" boundary rule). **In DEEP
              mode, do NOT file a separate finding for every large module that merely lacks tests
              — that floods the tracker.** File separate findings only for untested RISK-BEARING
              logic: auth/token handling, a release or trust gate, flag/precedence dispatch,
              error-to-exit mapping, or the #1655 mock-only pattern. Give every plain
              "module X has no coverage" case the shared `cluster_key`
              `tests:aggregate-untested-modules` so they merge into one issue. In NORMAL
              mode, focus on new/changed code paths from the scope file.

            ## Published hub agents — HOLD TO THE HIGHEST BAR
            Published agents are the project's shop window — an integrator installs them and
            judges GAIA by them, so they must be bulletproof. **In BOTH modes, if your lens
            touches a published hub agent, review it against this bar explicitly and bump any
            gap up one severity level** (a gap here is never 🟡; a user-facing break on the
            default path is 🔴).
            - **Which agents are published:** currently the **email agent** and the **gaia
              flagship agent** — code at `hub/agents/<id>/python/`, npm client at
              `hub/agents/<id>/npm/`. Detect
              any *other* published agent generally: it has a `.github/workflows/release_agent_<id>.yml`
              OR a shipped `hub/agents/**/SCORECARD.md` OR a released `version:` in its
              `hub/agents/**/<id>/gaia-agent.yaml`. Apply this bar to every one you find.
            - **What each lens checks on a published agent** (apply only YOUR lens):
              - **docs**: the canonical README (the npm client README for npm agents, e.g.
                `hub/agents/email/npm/README.md`) is high-quality and integrator-facing;
                `SPEC.md` is a complete technical reference; `SKILL.md` is a real AI-integration
                playbook; `CHANGELOG.md` accurately names each version's change; any shipped
                contract spec (`spec_html.py` / `specification.html` / `openapi.*.json`) matches
                the code; and a `SCORECARD.md` exists and is LINKED from the README. All of these
                must be mutually consistent and genuinely written — flag placeholder/stub prose,
                a missing surface, or one doc contradicting another.
              - **tests**: solid unit + integration coverage of the agent's real request/response
                contract (not mock-only — apply #1655 strictly); the `SCORECARD.md` must come from
                a REAL eval and pass its release gate (`python -m gaia.eval.scorecard_gate`) — flag
                a missing, stale, hand-authored, or gate-failing scorecard.
              - **correctness**: the agent's runtime code is bulletproof — NO stubs, NO silent
                fallbacks, NO half-finished paths, actionable errors at every boundary.

            ## Severity — calibrate consistently (🔴 high · 🟠 medium · 🟡 low)
            - **🔴 high**: a security issue, data loss, or a break that hits users on the default path.
            - **🟠 medium**: broken or incorrect user-facing behavior (a feature that silently does
              nothing or the wrong thing), a doc that tells users something false, or a missing
              test that guards auth / a release-or-trust gate / destructive or precedence logic.
            - **🟡 low**: a missing test on non-risk logic, a cosmetic gap, a minor nit.
            **Broken behavior ALWAYS outranks a missing test** — never rate "module X has no tests"
            above a feature that is actually broken.

            ## Output — write findings to `findings-${{ matrix.dimension }}.json`
            Write a JSON file at the repo root named exactly `findings-${{ matrix.dimension }}.json`
            with this shape (write `{"findings": [], "complete": true}` if you find nothing).

            **Write it early and keep it current.** Before you start investigating, create
            the file as `{"findings": [], "complete": false}`. Each time you confirm a
            finding, rewrite the file with it added — do not hold findings in your head to
            write at the end. When the sweep is finished, set `"complete": true`. If you are
            cut off by the turn ceiling, whatever the file already holds is still collected
            and filed; anything you had not written down is lost.

            ```json
            {"complete": true | false,
             "findings": [
              {
                "severity": "🔴" | "🟠" | "🟡",
                "path": "src/gaia/....py",
                "symbol": "function_name or ClassName or a doc heading — NOT a line number",
                "title": "one-line statement of the problem",
                "why": "one sentence: the concrete impact / what breaks",
                "evidence": "a direct quote or `path:line` you READ that proves the claim — enough for a reviewer to verify without re-deriving. e.g. \"auditStore.ts:88 sets `rolledBack = true` with a `// TODO: call IPC` and no IPC call\"",
                "auto_fixable": true | false,
                "cluster_key": "${{ matrix.dimension }}:<root-cause-slug>",
                "dedup_key": "${{ matrix.dimension }}:<repo-relative-path>:<symbol-or-section>"
              }
            ]}
            ```

            ### `cluster_key` — ONE KEY PER DEFECT. This is the most important field.
            A defect is what a maintainer FIXES, not where they see it. If the same root
            cause shows up in 39 files, that is **one** defect with 39 locations, and every
            one of those 39 findings carries the **identical** `cluster_key`. Everything
            sharing a key is merged into a single issue automatically, so you do not have
            to hold back: emit one finding per LOCATION with the shared key, and let the
            merge do the collapsing.

            The key is a short slug naming the CAUSE, with no path in it:
            - `docs:lemonade-server-serve-command-removed` — one dead command, cited in
              163 places across 106 files. ONE key. (This really happened and became five
              separate issues in one night because keys were file-scoped.)
            - `docs:guide-prerequisites-missing-extras` — 14 guides, one omission. ONE key.
              (This really happened too: 14 issues in one night, for a defect already
              tracked as #1077 since May.)
            - `correctness:silent-except-pass-in-ui-layer` — one banned pattern, many files.
            Two findings get DIFFERENT keys only when they need different fixes. Same
            symptom in one file and a genuinely unrelated cause elsewhere = two keys.

            **Before you write the file, re-read your own findings and ask: how many
            separate PRs would fix all of this?** That number is how many distinct
            `cluster_key`s you should have. If you have 20 findings and one PR fixes 14 of
            them, those 14 share a key — go back and make them share it.

            ### `dedup_key` — the per-location key (unchanged)
            `${{ matrix.dimension }}:<path>:<symbol>` — a stable function/class name or doc
            heading, NEVER a line number (line numbers move and would re-file the same
            finding every week). Line numbers may appear in `title`/`why`, never in a key.
            It identifies the LOCATION; `cluster_key` identifies the DEFECT.

            `auto_fixable` = true only if the fix is locatable and small (~1-3 files, targeted,
            no design decision) so the `bug`→auto-fix path can land it; false if it needs a human
            (writing a test suite, a refactor, a design call).

            ## Ground every finding in something you read — then REPORT IT
            You are the FINDING pass, not the filtering pass. A separate synthesis step
            dedupes these findings, re-checks their evidence, and drops the weak ones
            before anything is filed. So your job here is COVERAGE: surface everything you
            genuinely observed, including findings you are unsure about, and let synthesis
            decide what survives. Do not self-censor to keep the list short — a finding
            that synthesis discards costs nothing, a bug you withheld ships.

            Grounding rules (these are about not inventing things, not about holding back):
            1. **Open the cited file and confirm the problem is actually present** — never
               report from a filename or a grep hit alone.
            2. **Rule out that it's already handled** — the error re-raised two lines down,
               a test in a different directory, the "missing" doc living under another
               path. Already-covered is not a finding.
            3. Fill `evidence` with what you actually read. **No evidence, no finding** —
               this is the one hard filter in this pass, and it is a grounding requirement,
               not a confidence threshold.
            Use `severity` to express doubt rather than dropping the item: if it is real but
            minor or you are unsure of the impact, file it 🟡 with your uncertainty stated
            in `why`. Skip only what CI's `python util/lint.py --all` already enforces
            (black/isort/whitespace).

            NOTE FOR FUTURE EDITORS: this section used to read "precision beats recall …
            skip anything you are not confident is real … never pad". On Claude Opus 5 that
            wording measurably suppresses real findings — the model follows a
            be-conservative instruction literally and reports less while investigating just
            as hard. Filtering belongs in synthesis, which already does it. Do not put
            conservatism back into a lens prompt.

            ## Budget
            You have --max-turns 150 and share one rate-limited subscription pool with the
            sibling lenses (run back-to-back), the nightly security audit, and the
            interactive PR-review jobs. Delegate to a subagent only for a genuinely wide,
            parallelizable investigation — not for work you can finish in a handful of tool
            calls, and never to verify or double-check your own findings. Prefer one
            subagent over several. Spend turns reading code, not coordinating.

            The file is written as you go (see Output), so the turn ceiling can cut the
            sweep short without losing what you already confirmed. Still, prefer finishing
            a smaller area properly over skimming a large one.

            ## Security is out of scope — hand it off, do not file it here
            If you notice a security weakness, do NOT put it in this audit's findings — they
            become public issues, which would disclose it. Security has a dedicated
            private-channel workflow (claude-security-audit.yml). Leave it to that sweep.
          claude_args: |
            --max-turns 150
            --model ${{ env.AUDIT_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      # A lens that stops early leaves no reason in the log beyond "is_error:true", and
      # the synthesis error cannot tell a spent subscription from a bad credential from
      # a turn ceiling. Name it here, where the log is.
      - name: Say why Claude stopped
        if: steps.claude.outcome == 'failure'
        continue-on-error: true
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          if [ -z "$EXECUTION_FILE" ] || [ ! -f "$EXECUTION_FILE" ]; then
            echo "::error title=Claude stopped::No execution log was written, so Claude never started. Look at the 'Run Claude' step above for the install or startup error."
            exit 1
          fi
          # execution_file is ONE pretty-printed JSON array (JSONL is accepted too), so it
          # must be parsed whole — a line-by-line read finds no result and classifies "".
          # Reduce it to the terminal result: subtype on stdout, result text to a file.
          subtype=$(python3 -c 'import json,sys
          raw=open(sys.argv[1],encoding="utf-8",errors="replace").read()
          try:
              data=json.loads(raw)
              events=data if isinstance(data,list) else [data]
          except ValueError:
              events=[]
              for l in raw.splitlines():
                  try: events.append(json.loads(l))
                  except ValueError: pass
          results=[e for e in events if isinstance(e,dict) and e.get("type")=="result"]
          last=results[-1] if results else {}
          open(sys.argv[2],"w",encoding="utf-8").write(str(last.get("result") or last.get("subtype") or ""))
          print(last.get("subtype") or "")' "$EXECUTION_FILE" "$RUNNER_TEMP/claude-result.txt")
          if [ "$subtype" = "error_max_turns" ]; then
            echo "::error title=Claude stopped::The lens hit its --max-turns ceiling before finishing. Whatever it had written to its findings file is still collected."
            exit 1
          fi
          # Classify only the terminal result, never the transcript: the classifier
          # matches words like "unauthorized" and bare 401/403, which a lens that audits
          # auth writes about constantly — its prose would read as a dead credential.
          python3 util/classify_claude_probe.py --exit-code 1 --format text --text-file "$RUNNER_TEMP/claude-result.txt"

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: findings-${{ matrix.dimension }}
          path: findings-${{ matrix.dimension }}.json
          # A dimension that ran writes `{"findings": []}` even when clean, so a missing file
          # means the lens never ran. Fail the job — a silent skip reads as "audited, clean".
          if-no-files-found: error

  # Collect the four dimension outputs, run the DETERMINISTIC dedup pass over them, and
  # file one issue per surviving defect. This is the only job with issues: write.
  synthesize:
    needs: [preflight, audit]
    # Re-assert the repo gate (custom `if` drops the needs-succeeded guard). !cancelled()
    # so synthesis still files whatever the dimension jobs produced even if one crashed.
    if: >-
      github.repository == 'amd/gaia' && !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # Shared with the doc walkthrough's synthesis: both read the backlog, then file. Run
    # concurrently, each misses what the other is about to file and both file the defect.
    concurrency:
      group: claude-audit-issue-filing
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Show which Claude account this job uses
        run: echo "::notice title=Claude account::${{ vars.CLAUDE_ACCOUNT != 'secondary' && 'This job uses the primary Claude account.' || secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY != '' && 'This job uses the secondary Claude account.' || 'CLAUDE_ACCOUNT is secondary but CLAUDE_CODE_OAUTH_TOKEN_SECONDARY is not set, so this job uses the primary Claude account.' }}"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all findings
        uses: actions/download-artifact@v8
        with:
          path: audit-findings

      # "No dimension produced output" and "every dimension found nothing" both leave
      # synthesis with nothing to file, and it reports success either way. Refuse the
      # first case loudly instead of calling an audit that never ran a clean bill of health.
      - name: Require every dimension to have reported in
        env:
          EXPECTED_DIMENSIONS: ${{ needs.preflight.outputs.dimension_count }}
        run: |
          set -euo pipefail
          got=$(find audit-findings -name 'findings-*.json' | wc -l)
          if [ "$got" -lt "$EXPECTED_DIMENSIONS" ]; then
            echo "::error title=Nightly audit::Only $got/$EXPECTED_DIMENSIONS dimensions produced findings files — the audit did not run. Not filing anything off a partial sweep."
            exit 1
          fi
          echo "All $got/$EXPECTED_DIMENSIONS dimensions reported in."
          # A lens cut off by its turn ceiling still hands over what it had confirmed
          # (it writes the file as it goes). File those, but say which sweep was partial.
          incomplete=$(python3 - <<'EOF'
          import json, pathlib
          for f in sorted(pathlib.Path("audit-findings").rglob("findings-*.json")):
              try:
                  done = json.loads(f.read_text(encoding="utf-8")).get("complete") is True
              except (ValueError, AttributeError):
                  done = False  # truncated mid-write; synthesis quarantines it
              if not done:
                  print(f.stem.removeprefix("findings-"))
          EOF
          )
          if [ -n "$incomplete" ]; then
            for d in $incomplete; do
              echo "::warning title=Nightly audit::The '$d' lens did not finish its sweep (turn ceiling or error) — its confirmed findings are filed, but areas it had not reached were not audited tonight."
            done
          fi

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `weekly-audit` is a PROVENANCE label, not a cadence one — it marks "a proactive
          # Claude audit filed this" and is shared with the doc walkthrough.
          gh label create weekly-audit --color 5319e7 \
            --description "Filed by a proactive Claude audit (code audit or doc walkthrough)" \
            2>/dev/null && echo "created weekly-audit label" || echo "weekly-audit label already exists"
          # audit-wontfix permanently suppresses a finding — synthesis skips its key forever.
          gh label create audit-wontfix --color cccccc \
            --description "Accepted debt — the audits will never re-file this finding" \
            2>/dev/null && echo "created audit-wontfix label" || echo "audit-wontfix label already exists"

      # THE dedup pass. Deterministic on purpose: asking a model to eyeball dedup across
      # ~900 open issues is what produced a 2.35x duplication ratio. This step merges every
      # location of a `cluster_key` into one defect and searches the WHOLE open backlog for
      # an issue already tracking it, then hands the model a short worklist whose only open
      # question is the semantic one ("is #1077 really this defect?").
      - name: Dedupe findings into a synthesis worklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/audit/prepare_synthesis.py \
            --findings-dir audit-findings \
            --repo "${{ github.repository }}" \
            --out synthesis-input.json \
            --dossier synthesis-dossier.md
          {
            echo "## 🔁 Dedup pass"
            echo ""
            python3 -c "import json; c=json.load(open('synthesis-input.json'))['counts']; print(f\"{c['raw_findings']} raw findings → **{c['clusters']} distinct defects** ({c['new']} new, {c['already_filed']} already filed, {c['suppressed']} suppressed), searched {c['open_issues_searched']} open issues.\")"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # A dry run is only prompt-enforced, and a mode that silently isn't dry is worse
      # than no mode at all. Record the watermark now and check it afterwards.
      - name: Record the issue watermark (dry run)
        if: github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --repo "${{ github.repository }}" --state all --limit 1 \
            --json number --jq '.[0].number // 0' > .issue-watermark
          echo "Highest issue before synthesis: $(cat .issue-watermark)"

      - name: Synthesize and file one issue per defect
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64  # v1.0.240
        with:
          anthropic_api_key: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) == '' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ (vars.CLAUDE_ACCOUNT == 'secondary' && secrets.CLAUDE_CODE_OAUTH_TOKEN_SECONDARY || secrets.CLAUDE_CODE_OAUTH_TOKEN) }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # See the dimension job's note — scheduled runs are actored by a bot.
          allowed_bots: "github-merge-queue,github-actions"
          prompt: |
            You are the synthesis step of GAIA's proactive code audit. A deterministic
            pass has ALREADY collapsed the four dimension jobs' raw findings into distinct
            defects and searched the whole open backlog for each one. Your job is the part
            a script cannot do: verify the evidence, decide whether a defect is genuinely
            new or already tracked, and write for a human.

            REPO: ${{ github.repository }}
            AUDIT MODE: ${{ needs.preflight.outputs.mode }}
            DRY RUN: ${{ github.event.inputs.dry_run || 'false' }}
            RUN LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## First actions
            1. Read `synthesis-dossier.md` — your worklist. It has one section per NEW
               defect, each with its locations and a ranked list of possibly-matching open
               issues. Defects already filed or suppressed are listed at the bottom and are
               **already handled — do not act on them at all**.
            2. Read `CLAUDE.md` → "How You Communicate" for the tone to write in.
            3. Before filing, check `audit-findings/recent-changes/recent-changes.md`: drop a
               defect a PR listed there already fixed (open the code to confirm), and drop
               anything `scripts/audit/missed_bug_classes.md` lists under "Don't report"
               (for a known umbrella, comment on it instead).
            4. `synthesis-input.json` has the same data structured, if you need a field the
               dossier elides — including the full location list when one is truncated.
            If the dossier reports malformed findings or that the lenses barely clustered,
            say so in the run report: that is a lens-prompt bug a human needs to see.
            You do NOT need to re-list issues or rebuild key sets — that is done. Spend your
            turns reading cited code instead.

            ## For each NEW defect, choose exactly one of three outcomes

            ### (a) DROP it — the evidence gate
            You are the only filter; the lenses deliberately over-report. Drop a defect when
            its `evidence` is missing or does not actually substantiate its title. For every
            🔴/🟠 survivor, open the cited path/symbol and confirm the problem is really
            there before filing — a false 🔴 costs more trust than ten dropped 🟡s. Demote
            rather than delete when a finding is real but overstated. **🟡 (low) defects are
            never filed as issues** — they go in the job summary only.

            ### (b) COMMENT on an existing issue — 🔴/🟠 only, check this BEFORE filing
            The dossier lists candidate open issues per defect, drawn from the WHOLE backlog
            — not just this audit's own label. **Open the top candidates and read them.** If
            one already tracks this defect, comment on it instead of filing:
            `gh issue comment <n> --repo ${{ github.repository }} --body-file <file>`
            The comment adds only what is NEW — the extra locations this run found, or fresh
            evidence — and never restates the issue. Include the marker line so future runs
            match it by key: `<!-- audit-cluster: <cluster_key> -->`.
            A candidate counts as a match when the same FIX would close both. The 4-month-old
            #1077 ("Guide prerequisites missing across ~14 guides") is the canonical case:
            the audit re-filed it 14 times in one night because it only searched its own
            label. Err toward commenting — a comment on the wrong issue is trivially undone;
            a duplicate issue is what created this backlog.

            ### (c) FILE ONE issue — 🔴/🟠 only, non-security
            Write the body to a temp file, then
            `gh issue create --repo ${{ github.repository }} --label weekly-audit --title "<title>" --body-file <file>`
            WITHOUT the `bug` label (humans gate every code change).

            **One issue per DEFECT, listing every location.** A defect the dossier shows at
            39 locations is ONE issue with 39 lines in it, never 39 issues. Its title names
            the defect, never one file: "The documented Lemonade start command no longer
            exists (163 places)", not "quickstart.mdx uses lemonade-server serve".

            Body — follow CLAUDE.md → "How You Communicate": a human triages this, so the
            opening line says what broke and who it hurts in plain words, and the mechanical
            rows go in a collapsed `<details>`. The blank line after `</summary>` is REQUIRED
            or GitHub renders the block as literal text. Both marker lines are REQUIRED —
            they are what the next run dedupes against:
            ```
            <one paragraph: what's wrong + the concrete impact, in plain words>

            <details>
            <summary>🔍 Evidence and locations</summary>

            **Severity:** 🔴 high / 🟠 medium   **Lens:** <dimension(s)>
            **Auto-fixable:** yes — apply `bug` to let auto-fix open the PR  |  no — needs a human

            | Where | Evidence |
            |---|---|
            | `path` · `symbol` | <that location's evidence> |
            </details>

            Not acting on this? Close it with the `audit-wontfix` label and the audit will never
            re-file it. Applying `bug` instead hands it to the existing auto-fix job.

            <!-- audit-cluster: <cluster_key> -->
            <!-- audit-key: <the first location's dedup_key> -->
            ```
            List up to 20 locations in the table; if there are more, add a final row saying
            how many were elided and where to grep. Set Auto-fixable from `auto_fixable`.

            ## Write the run report to `triage-report.md` — NOT to an issue
            A following step appends this file to the run's job summary. **Do not file a
            "Nightly audit — <run-id>" issue; that convention is gone** — 19 such bookkeeping
            issues accumulated in the tracker with nothing actionable in any of them. The
            old parent-chain bookkeeping is gone with it: do not cross-link a previous run's
            issue, and never close one. (Commenting on a backlog issue that tracks a real
            defect — outcome (b) above — is a different thing, and is encouraged.)

            Write `triage-report.md` with a one-line tally then a section per dimension in
            this fixed order — Correctness, Features, Docs, Tests — filing each defect under
            the lens the dossier lists for it (its `lens/doc` line). A merged defect found by
            two lenses goes under the more severe one's section, named once, never twice.
            Order 🔴 → 🟠 → 🟡 within a section. 🟡 lines live here and nowhere else.
            ```
            ### Nightly audit — ${{ needs.preflight.outputs.mode }} mode
            Filed: 3 new (🔴 1 · 🟠 2) · commented on existing: 2 · low (report-only): 4 · dropped on evidence: 6

            #### Correctness
            - 🔴 `rollbackAction` flips rolledBack=true but never calls the IPC — #<n>
            - 🟡 `perf_analysis.py` swallows a KeyError (report-only, no issue)
            #### Docs
            - 🟠 Lemonade start command is dead in 163 places — commented on existing #<n>
            ```

            ## If DRY RUN is true
            Run NO `gh issue create` and NO `gh issue comment` — file and comment nothing.
            Do everything else, and in `triage-report.md` write what you WOULD have done
            (`would file:` / `would comment on #<n>:`) so the dedup pass can be validated
            against the real backlog without adding to it.

            ## Rules
            - No Claude attribution anywhere (no "Generated with", no Co-Authored-By).
            - Do not open any PR and do not apply the `bug` label.
            - Never close any issue.
            - Security is not a dimension here (see claude-security-audit.yml). If a findings
              JSON contains a security issue, omit it rather than disclosing it publicly.
            - Never collapse a security concern or a @kovtcharov-amd tag inside `<details>`.
          claude_args: |
            --max-turns 100
            --model ${{ env.AUDIT_MODEL }}
            --allowedTools Read,Grep,Glob,Bash

      - name: Prove the dry run filed nothing
        if: always() && github.event.inputs.dry_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          before=$(cat .issue-watermark)
          created=$(gh issue list --repo "${{ github.repository }}" --state all \
            --limit 100 --json number --jq "[.[] | select(.number > $before) | .number] | join(\", \")")
          if [ -n "$created" ]; then
            echo "::error title=Dry run was not dry::The synthesis step created issue(s) $created despite dry_run=true. Close them, then fix the dry-run instruction in the prompt."
            exit 1
          fi
          echo "✅ Dry run confirmed: no issue created above #$before."

      # The run receipt. This replaces the per-run "Nightly audit — <run-id>" ISSUE that
      # used to be filed: a CI run's bookkeeping belongs in the run, not the tracker.
      # Deterministic, so the report survives a synthesis step that errored after writing it.
      - name: Publish the triage report to the job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f triage-report.md ]; then
            cat triage-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ⚠️ No triage report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The synthesis step wrote no \`triage-report.md\`. See the step status below." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the audit filed output
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Don't trust step outcome (continue-on-error masks it; an install crash exits
          # before it's set). Check the real artifact the action writes on completion.
          ok=false
          if [ -n "$EXEC_FILE" ] && [ -f "$EXEC_FILE" ]; then
            is_err=$(jq -s -r '[.. | objects | select(has("is_error")) | .is_error] | .[-1]' "$EXEC_FILE" 2>/dev/null)
            [ "$is_err" = "false" ] && ok=true
          fi
          if [ "$ok" = "true" ]; then
            echo "✅ Nightly audit synthesis completed (log: $EXEC_FILE)"
          else
            # Hard-fail, not a warning: a green run that audited nothing is indistinguishable
            # from a green run that found nothing, which is how the actor-gate outage went
            # unnoticed for a month. A flake here costs one re-run; silence costs coverage.
            echo "::error title=Nightly audit did not complete::The synthesis step crashed or errored before finishing (often the upstream install-phase ENOENT flake). Re-run: $RUN_URL"
            exit 1
          fi
