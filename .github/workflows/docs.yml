name: Docs Validation

on:
  push:
    paths:
      - 'docs/**'
      - 'cpp/**/*.md'
      - 'src/gaia/version.py'
      - 'util/check_doc_versions.py'
      - 'util/validate_release_notes.py'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'cpp/**/*.md'
      - 'src/gaia/version.py'
      - 'util/check_doc_versions.py'
      - 'util/validate_release_notes.py'
      - '.github/workflows/docs.yml'

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Mintlify CLI
        run: npm install -g mintlify

      - name: Validate docs with Mintlify
        working-directory: docs
        run: |
          echo "Validating documentation with Mintlify..."
          mintlify validate
          echo "✅ Documentation validated successfully"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: |
          echo "Checking documentation version consistency..."
          python util/check_doc_versions.py
          echo "✅ Version consistency check passed"

      # publish.yml runs this same validator against the tag, where a failure
      # means the release is already half-cut. Run it on the PR instead.
      - name: Validate release notes for the declared version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gaia/version.py)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read __version__ from src/gaia/version.py"
            exit 1
          fi
          echo "src/gaia/version.py declares v${VERSION}"
          python util/validate_release_notes.py "docs/releases/v${VERSION}.mdx" --tag "v${VERSION}"
