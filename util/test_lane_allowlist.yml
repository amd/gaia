#
# Test files that no CI lane runs, on purpose.
#
# Read by util/check_test_lane_coverage.py. A file listed here is exempt from
# the "every test file must be named by a lane" rule; a file that is neither
# listed nor named by a lane fails the check.
#
# The reason is the whole point. "No lane runs this" is a decision someone has
# to be able to review, so say what makes the file unrunnable in CI — hardware
# that no runner has, a live third-party account, a stress run measured in
# hours. "Not ready yet" is not a reason; wire it into a lane instead.
#
# The checker also fails on a stale entry: one naming a file that no longer
# exists, or one a lane has since started running. Both mean the allowlist has
# drifted from reality and is no longer telling you anything.
#
# A file that runs without Lemonade, a live account or AMD hardware belongs in
# test_unit.yml's offline-integration job, not here.

files:
  # A real model on a self-hosted Strix Halo runner (the real_model marker).
  tests/integration/eval/test_sidecar_eval.py: Scores the email sidecar against a real model; real_model marker, self-hosted Strix Halo only.
  tests/integration/eval/test_sidecar_eval_gaia.py: Scores the flagship sidecar against a real model; real_model marker, self-hosted Strix Halo only.

  # A live Lemonade Server with models loaded.
  tests/integration/test_chat_rag_pdf_chat_e2e.py: Chats over an indexed PDF end to end; needs a live Lemonade Server with the chat and embedding models.
  tests/integration/test_chat_rag_pdf_e2e.py: Indexes and queries a PDF end to end; needs a live Lemonade Server with the chat and embedding models.
  tests/integration/test_pptx_rag_e2e.py: Answers questions over an indexed PPTX; needs a live Lemonade Server with the chat and embedding models.
  tests/integration/test_code_index_live.py: Embeds and searches real code; needs a live Lemonade Server serving the embedding model.
  tests/integration/test_check_suspicious_mail_tool_selection_2900.py: Measures which tool a real model picks for mail phrasings; needs a live Lemonade Server with the email model.
  tests/integration/test_email_agent_triage.py: Holds triage accuracy to a baseline; needs a live Lemonade Server with the email model.
  tests/integration/test_email_bench_throughput.py: Benchmarks triage throughput; needs a live Lemonade Server with the email model.
  tests/integration/test_daemon_broker_lemonade.py: Drives concurrent real model loads through the broker; needs a live Lemonade Server with downloaded models.
  tests/integration/test_lemonade_model_residency.py: Checks an LLM and an embedder stay co-resident; needs a live Lemonade Server with both loaded.
  tests/integration/test_lemonade_predownload_checks.py: Proves the real /models, /system-info and /health shapes the unit test mocks; needs a live Lemonade Server.
  tests/integration/test_gateway_lemonade.py: Proves Lemonade accepts the gateway's cloud-provider registration and discovery calls, not just that GAIA sent them; needs a live Lemonade Server 11.8.0+, skips otherwise.
  tests/test_lemonade_health.py: Reads context_size from the real health endpoint; needs a live Lemonade Server.
  tests/mcp/test_email_mcp_stdio_parity.py: Both the REST and MCP-stdio surfaces triage with the local LLM; needs a live Lemonade Server with the email model.

  # A live third-party account.
  tests/integration/test_email_agent_live_gmail.py: Reads a real Gmail inbox; needs GAIA_GMAIL_LIVE_ACCOUNT credentials, never available in CI.

  # Manual runs against running services.
  tests/stress/test_agent_ui_stress.py: A hand-run stress script against a running Agent UI and Lemonade Server; not a pytest suite.
  tests/test_sd_model_sweep.py: A hand-run sweep over every SD model and resolution on a live Lemonade Server, writing an image report; not a pytest suite.

# Test files that skip WHOLESALE in some lane that collects them.
#
# Read by util/check_module_skips.py, which each listed lane runs after its
# install step. A module-scope `pytest.importorskip` makes a file one SKIPPED
# line in a lane without the dependency, while check_test_lane_coverage.py
# still counts the file as covered, so a skip nobody listed here fails the lane
# (#4206).
#
# `runs_in` names the workflow that installs what the file needs. The guard
# fails that lane if the file skips there, and check_test_lane_coverage.py
# fails when the workflow no longer names the path or no longer runs the guard.
# A group with no `runs_in` runs nowhere, and its reason has to say why.
# A path may be a directory; the most specific entry wins.

module_skips:
  - reason: Needs the gaia-agent-email wheel, which only the email lanes install.
    runs_in: test_email_agent_unit.yml
    paths:
      - tests/unit/agents/email
      - tests/unit/email
      - tests/unit/connectors/test_email_scope_drift.py
      - tests/unit/connectors/test_summarize_error_envelope.py
      - tests/unit/test_synthetic_mbox.py

  - reason: Needs the gaia-agent-email wheel, which only the email lanes install.
    runs_in: test_email_agent.yml
    paths:
      - tests/unit/agents/test_email_agent.py
      - tests/unit/agents/test_email_agent_confirmation.py
      - tests/unit/agents/test_email_agent_local_llm_enforcement.py
      - tests/unit/agents/test_email_agent_prompt_injection.py
      - tests/unit/agents/test_email_agent_soft_delete.py
      - tests/unit/agents/test_email_agent_tools.py
      - tests/unit/agents/test_email_llm_triage.py

  - reason: Needs the gaia-agent-chat wheel, which test_unit.yml does not install.
    runs_in: test_chat_agent.yml
    paths:
      - tests/unit/test_chat_agent_integration.py
      - tests/unit/test_chat_dynamic_tools.py
      - tests/unit/test_chat_fix_contracts.py
      - tests/unit/test_chat_inline_web_ssrf.py
      - tests/unit/test_chat_system_prompt_budget.py
      - tests/unit/test_chat_tool_bundles.py
      - tests/unit/test_dynamic_tool_filtering.py
      - tests/unit/test_prompt_size_budget.py
      - tests/unit/test_run_python_tool.py
      - tests/unit/test_tool_loader_disambiguation.py

  - reason: Needs the gaia-agent (flagship) wheel, which test_unit.yml does not install.
    runs_in: test_gaia_agent.yml
    paths:
      - tests/unit/messaging/test_bridge_contract.py
      - tests/unit/test_execute_python_file_cwd.py
      - tests/unit/test_flagship_code_index_scope.py
      - tests/unit/test_stdio_permission_control.py

  - reason: Needs the [mcp] extra, which test_unit.yml does not install.
    runs_in: test_agent_mcp_server.yml
    paths:
      - tests/unit/test_agent_ui_mcp_messages.py
      - tests/unit/test_mcp2_server.py

  - reason: Needs reportlab, which the email unit lane collects tests/unit/eval/ without.
    runs_in: test_unit.yml
    paths:
      - tests/unit/eval/test_pdf_document_generator.py

  - reason: >-
      Broken, and fixing it needs an owner's decision. With the chat wheel
      installed, 11 of its 17 tests fail: the golden tool sets and prompts predate
      tools added since (write_clipboard, read_tool_output, ...). The file says a
      golden update needs sign-off, so it is not updated here. Tracked in #4390.
    paths:
      - tests/unit/test_profilespec_characterization.py

  - reason: >-
      Broken, and fixing it needs an owner's decision. With the chat wheel
      installed, 4 of its 10 tests fail: the doc profile has 38 tools (pinned 37)
      and 6498 native tokens (pinned 5128), and the worst-case loaded set (4257
      tokens) is over its 65% ratio even of the new total, so re-pinning alone
      would not pass. Tracked in #4391.
    paths:
      - tests/unit/test_tool_loader_token_budget.py
