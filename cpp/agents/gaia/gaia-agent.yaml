#
# Packaging manifest for the native (C++) GAIA agent. Built from cpp/agents/gaia/
# and packaged by cpp/packaging/package_agents.py (Hub layout) or
# cpp/packaging/package_lemonade.py (Lemonade agent-host release archives).
id: gaia
name: GAIA Agent (native)
version: 0.1.0
description: "General-purpose local agent: files, documents, data, code, shell and web, with headless, OpenAI-compatible server and interactive modes."
author: AMD
license: MIT

category: productivity
tags: [agent, files, documents, data, coding, openai-compatible, lemonade]
icon: sparkles

language: cpp
min_gaia_version: "0.18.0"
models: [Gemma-4-E4B-it-GGUF, Qwen3.6-35B-A3B-GGUF]

requirements:
  min_memory_gb: 8
  platforms: [win-x64, linux-x64, darwin-arm64]

cpp:
  static_linked: true
  binaries:
    win-x64: gaia-win-x64.exe
    linux-x64: gaia-linux-x64
    darwin-arm64: gaia-darwin-arm64

permissions:
  - filesystem:read
  - filesystem:write
  - process:execute
  - system:read
  - network:read

interfaces:
  tui: true
  cli: true
  pipe: true
  api_server: true
  mcp_server: false
