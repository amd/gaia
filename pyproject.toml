[tool.black]
line-length = 88
target-version = ['py312']
exclude = '''
(
  /(
    | \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | node_modules
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true
skip = [".git", "__pycache__", "venv", ".venv", ".mypy_cache", ".tox", ".eggs", "_build", "buck-out", "node_modules"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^venv/",
    "^.venv/",
    "^node_modules/",
]

[tool.bandit]
exclude_dirs = [".git", "__pycache__", "venv", ".venv", ".mypy_cache", ".tox", ".eggs", "_build", "buck-out", "node_modules"]
skips = ["B101"]  # Skip assert warnings (common in tests)

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (real Docker operations, may take > 5 seconds)",
    "integration: marks tests as integration tests (require external services like Lemonade server)",
    "gmail_live: marks tests that hit the live Gmail API (requires GAIA_GMAIL_LIVE_ACCOUNT env var; never in CI)",
    "real_model: marks tests that require a real Lemonade model server and real model inference (self-hosted runner only; see #1297)",
    "real_slm_build: marks tests that exercise the real SLM classifier-construction path instead of the hermetic stub (no network unless also marked real_model)",
    "distributed_seams: marks the consolidated daemon<->sidecar seam contract suite (V2-19 / #2180); deterministic, runs in normal CI, skips seams not yet merged",
    "network: marks tests that hit a live external endpoint (runs in CI; auto-skips when unreachable or GAIA_SKIP_NETWORK_TESTS=1)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short --strict-markers"
asyncio_mode = "auto"

# A `[tool.uv.pip]` config block (to drop the repeated `--extra-index-url`
# flag) was evaluated and rejected in #2881 — it breaks dependency resolution
# for this project's real extras unless paired with `unsafe-best-match`, which
# disables uv's dependency-confusion protection repo-wide. Keep the flag.
# (The `[[tool.uv.index]]`/`[tool.uv.sources]` block once here was also dead:
# `uv pip install`, which every install path uses, ignores both — regardless
# of the missing `[project]` table.)