<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Canvas color; rewritten per theme and palette by applyTheme() and
         syncTitleBar(). With no saved preference the app follows the OS. -->
    <meta name="theme-color" content="#1A1917" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GAIA" />
    <title>GAIA Agent UI</title>
    <!-- Paints the saved theme before the first frame; must resolve it exactly as
         main.tsx does (a saved light/dark wins, otherwise the OS, dark if unreadable). -->
    <script>
        try {
            var t = localStorage.getItem('gaia-chat-theme');
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.colorScheme = t;
        } catch (e) {
            // main.tsx applies the theme again and reports why it could not read the saved one.
        }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
