[build-system]
# >=70.0 for SPDX `license = "..."` string-expression support (PEP 639) below
# -- the classic `license = { text = "..." }` table form setuptools still
# accepts is hard-deprecated for removal 2027-02.
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-agent-chat"
version = "0.2.0"
description = "Deprecated: re-exports ChatAgent from the flagship gaia-agent-gaia package for one release"
authors = [{ name = "AMD" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# A re-export shim of gaia-agent-gaia, where ChatAgent now lives (#6099); it is
# deleted in #6103. The gaia-agent-gaia floor follows the flagship's in-tree
# version (util/release_versions.py stamps it), so a released shim requires
# the flagship it was built with.
#
# The amd-gaia floor stays for lite_agent, the one module still defined here.
# tests/test_dependency_floor.py guards it. Intentionally bare `amd-gaia` (no
# `[rag]` extras marker) -- see #2358.
#
# No `gaia.agent` entry points: the `chat`, `doc` and `file` ids resolve to the
# flagship through gaia.agents.registry's legacy aliases.
dependencies = [
  "amd-gaia>=0.25.4",
  "gaia-agent-gaia>=0.3.3",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["gaia_agent_chat*"]
