[build-system]
# >=70.0 for SPDX `license = "..."` string-expression support (PEP 639) below
# -- the classic `license = { text = "..." }` table form setuptools still
# accepts is hard-deprecated for removal 2027-02.
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-agent-gaia"
version = "0.3.3"
description = "The flagship GAIA agent — conversation, document Q&A, data analysis, and web research, with persistent memory and add-on skills"
authors = [{ name = "AMD" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# Floors:
# - amd-gaia>=0.25.4: ChatAgent calls RAGSDK.document_scripts on any turn
#   with an indexed document (#6165), and 0.25.4 is the first core to ship it.
#   (0.25.1 added gaia.agents.tools.reasoning_tools; 0.25.0 added
#   gaia.agents.tools.path_access, #4656; 0.24.1 was the first core whose
#   daemon can supervise this sidecar, #2932.) Raise it in step with
#   min_gaia_version, never ahead of a real release.
#
# ChatAgent lives in this package (#6099); it no longer depends on
# gaia-agent-chat, which is now a deprecated re-export shim of this one.
#
# Intentionally bare `amd-gaia` (no `[rag]` marker): a plain pip install must
# not drag faiss/pymupdf in just to import the class. RAG's real dependencies
# come from `gaia init` into the active interpreter (#2358).
dependencies = [
  "amd-gaia>=0.25.4",
]

[project.scripts]
# Two transports, one binary: `--serve` (or a bind flag) runs the HTTP sidecar
# the daemon supervises, anything else runs the newline-delimited JSON wire a
# parent process spawns. gaia_agent.entry is the dispatcher, and it is
# deliberately light -- pointing this at server:main would make the stdio wire
# import FastAPI (an extras-only dependency) just to discover it was not
# selected; pointing it at stdio:main, as it did before, made `--serve`
# unreachable from a pip install.
gaia-agent = "gaia_agent.entry:main"

[project.entry-points."gaia.agent"]
gaia = "gaia_agent:build_gaia"

[project.optional-dependencies]
# setuptools: tests/test_starter_skill_build.py runs the real build hooks.
test = ["pytest", "setuptools>=70.0"]

[tool.setuptools.packages.find]
include = ["gaia_agent*"]

[tool.setuptools.cmdclass]
build_py = "gaia_agent.build.build_py"
sdist = "gaia_agent.build.sdist"

[tool.setuptools.package-data]
# The manifest and bundled skills must land inside the package so they survive
# both the wheel and the frozen sidecar (SKILL_DIRS / SKILL_MANIFEST resolve
# relative to __file__).
gaia_agent = ["gaia-agent.yaml", "skills/**/*"]
