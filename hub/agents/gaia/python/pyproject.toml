[build-system]
# >=70.0 for SPDX `license = "..."` string-expression support (PEP 639) below
# -- the classic `license = { text = "..." }` table form setuptools still
# accepts is hard-deprecated for removal 2027-02.
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-agent-gaia"
version = "0.2.1"
description = "The flagship GAIA agent — conversation, document Q&A, data analysis, and web research, with persistent memory and add-on skills"
authors = [{ name = "AMD" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
# Floors:
# - amd-gaia>=0.25.0: the file tools' allowed-folders check
#   (gaia.agents.tools.path_access) first ships in 0.25.0. Before that, 0.24.1
#   was the floor: 0.23.0's daemon cannot supervise this agent (#2932). Raise
#   it in step with min_gaia_version.
# - gaia-agent-chat>=0.1.1: the first chat release whose file tools all check
#   the allowed-folders rule; this agent inherits them.
# - gaia-agent-chat is a HARD dependency, not an extra: GaiaAgent subclasses
#   ChatAgent to inherit the doc prompt profile, RAG discovery, and session
#   persistence rather than forking them. Importing this package without it is
#   not a degraded mode, it is an ImportError.
#
# Intentionally bare `amd-gaia` (no `[rag]` marker), same reasoning as
# gaia-agent-chat: a plain pip install must not drag faiss/pymupdf in just to
# import the class. RAG's real dependencies come from `gaia init` into the
# active interpreter (#2358).
dependencies = [
  "amd-gaia>=0.25.0",
  "gaia-agent-chat>=0.1.1",
]

[project.scripts]
# Two transports, one binary: `--serve` (or a bind flag) runs the HTTP sidecar
# the daemon supervises, anything else runs the newline-delimited JSON wire a
# parent process spawns. gaia_agent.entry is the dispatcher, and it is
# deliberately light -- pointing this at server:main would make the stdio wire
# import FastAPI (an extras-only dependency) just to discover it was not
# selected; pointing it at stdio:main, as it did before, made `--serve`
# unreachable from a pip install.
gaia-agent = "gaia_agent.entry:main"

[project.entry-points."gaia.agent"]
gaia = "gaia_agent:build_gaia"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["gaia_agent*"]

[tool.setuptools.package-data]
# The manifest and bundled skills must land inside the package so they survive
# both the wheel and the frozen sidecar (SKILL_DIRS / SKILL_MANIFEST resolve
# relative to __file__).
gaia_agent = ["gaia-agent.yaml", "skills/**/*"]
