[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-agent-email"
version = "0.6.0"
description = "GAIA email triage agent — read, triage, organize, and reply to Gmail/Outlook locally"
authors = [{ name = "AMD" }]
license = { text = "MIT" }
requires-python = ">=3.10"
# Depend on the [api] extra (not bare amd-gaia) so a consuming app's
# `pip install gaia-agent-email` pulls the REST-server deps (fastapi/uvicorn)
# AND keyring automatically — the email REST router's import chain needs keyring
# at module load and at request time (connected_mailbox_providers). Closes the
# "consumer forgot [api]" half of #1617.
# Floor: 0.25.1 is the first released core covering the email
# agent module-level imports, including the guided Outlook walkthrough.
# tests/test_dependency_floor.py guards this floor.
#
# specific-ai-tools is pinned exactly, not floored: it supplies the SLM
# classifier the agent loads model weights through, so the version that ships
# is the version the SLM path was validated against.
dependencies = [
    "amd-gaia[api]>=0.25.1",
    "specific-ai-tools==0.1.1",
]

# Console script for the REST sidecar — the fast dev-iteration entry point.
# `gaia-agent-email serve --reload` runs the same app the frozen binary serves,
# from source, with auto-reload; pair it with the npm client's connectSidecar().
[project.scripts]
gaia-agent-email = "gaia_agent_email.server:main"

# Agent registration temporarily disabled: with the entry point commented out,
# `AgentRegistry.discover()` no longer surfaces the in-process email agent (it's
# being superseded by the packaged REST sidecar). The package still ships the
# `/v1/email` REST router + Python API — only the chat-agent registration is off.
# Re-enable by uncommenting (and reinstalling the wheel).
# [project.entry-points."gaia.agent"]
# email = "gaia_agent_email:build_registration"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["gaia_agent_email*"]

# Bundled Agent Skills (#2466) are data, not modules — without this they are
# absent from an installed wheel and SKILL_DIRS points at nothing.
[tool.setuptools.package-data]
gaia_agent_email = ["skills/*/SKILL.md", "skills/*/*.py", "gaia-agent.yaml"]

# gaia-agent.yaml lives at the package ROOT (the hub artifact), but the agent
# reads it at runtime and an installed wheel has no directory above
# gaia_agent_email/ — package-data cannot reach outside its own package. The
# build_py hook copies it in, so every install path ships it from the single
# authored file. See _build_hooks.py.
[tool.setuptools.cmdclass]
build_py = "_build_hooks.build_py"
